<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mhasibu | Sangabuye SIS Portal</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 270px; background: #064e3b; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fde68a; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #a7f3d0; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #ecfdf5; text-align: left; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #059669; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #059669; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 17px; font-weight: bold; color: #064e3b; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #064e3b; }
    .btn { padding: 8px 13px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MHASIBU</h2>
  <p>Sangabuye Sec | Simu: 0615 000 305</p>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari wa Fedha & CRDB</button>
  <button class="menu-btn" onclick="openTab('receipts', this)">💵 2. Mapokezi & Risiti (58/80mm)</button>
  <button class="menu-btn" onclick="openTab('study_camp', this)">⛺ 3. Kambi ya Masomo (Academic Camp)</button>
  <button class="menu-btn" onclick="openTab('fee_struct', this)">🏷️ 4. Viwango vya Ada (Fee Structure)</button>
  <button class="menu-btn" onclick="openTab('store', this)">📦 5. Stoo ya Vyakula & Mali</button>
  <button class="menu-btn" onclick="openTab('statement_pdf', this)">📄 6. Taarifa ya Michango (PDF)</button>
  <button class="menu-btn" onclick="openTab('procurement', this)">🤝 7. Kamati ya Manunuzi</button>
  <button class="menu-btn" onclick="openTab('bank_book', this)">📒 8. Bank Statement & Vocha</button>
  <button class="menu-btn" onclick="openTab('payroll_assets', this)">💼 9. Mishahara, Bajeti & Mali</button>
  <button class="menu-btn" onclick="openTab('clearance', this)">✅ 10. Clearance & Period Locking</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Fedha & CRDB</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
  <datalist id="stList"></datalist>
</div>
<script>
  const user = SGB.requireRole(['accountant', 'super_admin']);
  SGB.startSessionTimer();

  function isPeriodLocked() {
    return localStorage.getItem('sgb_finance_locked') === 'true';
  }

  function updateNames() {
    const names = new Set();
    SGB.select('users_profile').filter(u => u.role === 'student').forEach(u => names.add(u.full_name));
    SGB.select('accounting_receipts').forEach(r => names.add(r.student_name));
    SGB.select('camp_students').forEach(c => names.add(c.student_name));
    document.getElementById('stList').innerHTML = Array.from(names).map(n => `<option value="${n}">`).join('');
  }

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    updateNames();
    const cfg = JSON.parse(localStorage.getItem('sgb_school_config') || '{"year":"2026","term":"Term I","crdb":"0150838972100"}');
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const recs = SGB.select('accounting_receipts');
      const vchs = SGB.select('expense_vouchers');
      const pays = SGB.select('staff_payroll');
      const crdbTotal = recs.filter(r => r.payment_method === 'CRDB_Bank').reduce((s, r) => s + Number(r.amount_paid), 0);
      const cashTotal = recs.filter(r => r.payment_method === 'Cash').reduce((s, r) => s + Number(r.amount_paid), 0);
      const campTotal = recs.filter(r => r.payment_category.toLowerCase().includes('kambi')).reduce((s, r) => s + Number(r.amount_paid), 0);
      const expTotal = vchs.reduce((s, v) => s + Number(v.amount), 0) + pays.reduce((s, p) => s + Number(p.net_pay), 0);

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>CRDB (${cfg.crdb})</h4><div class="val">TZS ${crdbTotal.toLocaleString()}</div></div>
          <div class="card"><h4>Pesa Taslimu (Cash Box)</h4><div class="val">TZS ${cashTotal.toLocaleString()}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Makusanyo ya Kambi</h4><div class="val">TZS ${campTotal.toLocaleString()}</div></div>
          <div class="card" style="border-color:#dc2626;"><h4>Matumizi & Mishahara</h4><div class="val">TZS ${expTotal.toLocaleString()}</div></div>
          <div class="card" style="border-color:#1d4ed8;"><h4>Salio Halisi (${cfg.year})</h4><div class="val">TZS ${(crdbTotal + cashTotal - expTotal).toLocaleString()}</div></div>
        </div>
        <div class="panel">
          <h3>Miamala ya Hivi Karibuni (Recent Receipts) ${isPeriodLocked() ? '<span style="color:#dc2626;">[🔒 MAHESABU YAMEFUNGWA]</span>' : ''}</h3>
          <table><tr><th>Risiti Na.</th><th>Mwanafunzi</th><th>Mchango</th><th>Njia</th><th>Kiasi (TZS)</th><th>Tarehe</th></tr>
          ${recs.slice(0, 12).map(r => `<tr><td><b>${r.receipt_number}</b></td><td>${r.student_name}</td><td>${r.payment_category}</td><td>${r.payment_method}</td><td><b>${Number(r.amount_paid).toLocaleString()}</b></td><td>${r.created_at}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna miamala bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'receipts') {
      if (isPeriodLocked()) {
        area.innerHTML = `<div class="panel" style="border-left:4px solid #dc2626;"><h3>🔒 Mahesabu Yamefungwa (Period Locked)</h3><p>Fungua mahesabu kwanza kwenye sehemu ya <b>10. Clearance & Period Locking</b>.</p></div>`;
        return;
      }
      area.innerHTML = `
        <div class="panel">
          <h3>Pokea Ada / Michango & Toa Risiti ya Thermal Printer (58mm / 80mm)</h3>
          <form onsubmit="createReceipt(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
            <input type="text" id="rName" list="stList" required placeholder="Andika herufi chache za jina la mwanafunzi...">
            <input type="text" id="rReg" required placeholder="Namba ya Usajili (Mfano: S.2026/001)">
            <input type="text" id="rCat" list="catOpts" required placeholder="Aina ya Mchango (Ada, Kambi ya Masomo, Chakula, Ujenzi...)">
            <datalist id="catOpts"><option value="Ada ya Shule"><option value="Kambi ya Masomo (Academic Camp)"><option value="Mchango wa Chakula"><option value="Mchango wa Mitihani"><option value="Ujenzi"></datalist>
            <select id="rMethod">
              <option value="CRDB_Bank">CRDB Bank (${cfg.crdb})</option>
              <option value="Cash">Pesa Taslimu (Cash - Ofisi ya Mhasibu)</option>
            </select>
            <input type="text" id="rRef" placeholder="Namba ya Slip ya CRDB (Au andika CASH)">
            <input type="number" id="rAmount" required placeholder="Kiasi Kilicholipwa (TZS)">
            <input type="number" id="rWaiver" value="0" placeholder="Punguzo / Udhamini (Waiver TZS)">
            <button type="submit" class="btn btn-green" style="grid-column: span 2; padding:12px;">💾 Hifadhi & Zalisha Risiti yenye QR Code</button>
          </form>
          <div id="receiptBox" style="margin-top:20px;"></div>
        </div>`;
    }

    if (tab === 'study_camp') {
      const campList = SGB.select('camp_students');
      const recs = SGB.select('accounting_receipts').filter(r => r.payment_category.toLowerCase().includes('kambi'));
      let totReq = 0, totPaid = 0;

      const rowsHtml = campList.map(c => {
        const paid = recs.filter(r => r.student_name.toLowerCase() === c.student_name.toLowerCase()).reduce((s, r) => s + Number(r.amount_paid), 0);
        const bal = Math.max(0, Number(c.fee_required) - paid);
        totReq += Number(c.fee_required);
        totPaid += paid;
        return `<tr>
          <td><b>${c.student_name}</b></td>
          <td>${c.class_name}</td>
          <td>${c.camp_name}</td>
          <td>${Number(c.fee_required).toLocaleString()}</td>
          <td style="color:#059669;"><b>${paid.toLocaleString()}</b></td>
          <td style="color:${bal > 0 ? '#dc2626' : '#059669'};"><b>${bal.toLocaleString()}</b></td>
          <td>${bal === 0 ? '✅ Amekamilisha' : `<button class="btn btn-green" onclick="quickCampPay('${c.student_name}', ${bal})">💵 Pokea Malipo</button>`}</td>
        </tr>`;
      }).join('');

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Wanafunzi Kwenye Kambi</h4><div class="val">${campList.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Jumla Iliyokusanywa (Kambi)</h4><div class="val">TZS ${totPaid.toLocaleString()}</div></div>
          <div class="card" style="border-color:#dc2626;"><h4>Deni la Kambi Lililobaki</h4><div class="val">TZS ${Math.max(0, totReq - totPaid).toLocaleString()}</div></div>
        </div>
        <div class="panel">
          <h3>1. Sajili Mwanafunzi Kwenye Kambi ya Masomo (Academic Camp)</h3>
          <form onsubmit="addCampStudent(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="cpName" list="stList" required placeholder="Jina la Mwanafunzi">
            <input type="text" id="cpClass" required placeholder="Kidato (Mfano: Form 4A)">
            <input type="text" id="cpTitle" value="Kambi ya Maandalizi ya NECTA 2026" required placeholder="Jina la Kambi">
            <input type="number" id="cpFee" value="150000" required placeholder="Kiwango cha Kambi (TZS)">
            <button type="submit" class="btn btn-green" style="grid-column: span 4;">⛺ Msajili Mwanafunzi Kwenye Kambi</button>
          </form>

          <h3>2. Orodha ya Wanafunzi wa Kambi & Hali ya Malipo</h3>
          <button class="btn btn-blue" onclick="printDiv('campPrintArea')">🖨️ Chapisha Orodha ya Kambi (PDF)</button>
          <div id="campPrintArea">
            <table><tr><th>Mwanafunzi</th><th>Kidato</th><th>Kambi</th><th>Kinachotakiwa</th><th>Amelipa</th><th>Deni</th><th>Hatua</th></tr>
            ${rowsHtml || '<tr><td colspan="7">Hakuna mwanafunzi aliyesajiliwa kwenye kambi bado.</td></tr>'}
            </table>
          </div>
        </div>`;
    }
    if (tab === 'fee_struct') {
      const fees = SGB.select('fee_structures');
      area.innerHTML = `
        <div class="panel">
          <h3>Weka Viwango vya Ada & Michango Kulingana na Kidato / Bweni (Fee Structure)</h3>
          <form onsubmit="addFeeStruct(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="fsCat" required placeholder="Kundi (Mfano: O-Level Day, O-Level Boarding, A-Level)">
            <input type="number" id="fsAmt" required placeholder="Ada & Michango kwa Mwaka (TZS)">
            <button type="submit" class="btn btn-green">💾 Hifadhi Kiwango cha Ada</button>
          </form>
          <table><tr><th>Kundi la Wanafunzi</th><th>Jumla Inayotakiwa kwa Mwaka (TZS)</th><th>Hatua</th></tr>
          ${fees.map(f => `<tr><td><b>${f.category}</b></td><td><b>TZS ${Number(f.amount).toLocaleString()}</b></td><td><button class="btn btn-red" onclick="delFeeStruct(${f.id})">Futa</button></td></tr>`).join('') || '<tr><td colspan="3">Weka viwango vya ada (mfano: O-Level Day = 350,000, Boarding = 750,000).</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'store') {
      const items = SGB.select('store_inventory');
      area.innerHTML = `
        <div class="panel">
          <h3>Mapokezi ya Vyakula & Vifaa (In-Kind Store Receipts + QR)</h3>
          <form onsubmit="addStore(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="sItem" required placeholder="Bidhaa (Mahindi, Maharage, Mchele, Chaki)">
            <input type="number" step="0.1" id="sQty" required placeholder="Kiasi / Kilo / Magunia">
            <input type="text" id="sUnit" required placeholder="Kipimo (Kg / Magunia / Rim)">
            <input type="text" id="sFrom" required placeholder="Aliyeleta (Mzazi / Mzabuni)">
            <input type="number" id="sVal" required placeholder="Thamani ya Bidhaa (TZS)" style="grid-column: span 2;">
            <button type="submit" class="btn btn-green" style="grid-column: span 3;">📦 Hifadhi Stoo & Toa Risiti ya Bidhaa</button>
          </form>
          <h4>Salio la Stoo (Low Stock Alerts):</h4>
          <table><tr><th>Bidhaa</th><th>Salio</th><th>Tahadhari</th><th>Matumizi</th></tr>
          ${items.map(i => `<tr><td><b>${i.item_name}</b></td><td>${i.quantity} ${i.unit}</td><td>${i.quantity <= 10 ? '<span style="color:#dc2626;font-weight:bold;">⚠️ Kinakaribia Kuisha</span>' : '<span style="color:#059669;">● Inatosha</span>'}</td><td><button class="btn btn-amber" onclick="deductStore(${i.id}, ${i.quantity})">- Toa Matumizi</button></td></tr>`).join('') || '<tr><td colspan="4">Stoo haina bidhaa bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'statement_pdf') {
      const fees = SGB.select('fee_structures');
      area.innerHTML = `
        <div class="panel">
          <h3>Taarifa Rasmi ya Michango ya Mwanafunzi (PDF Statement)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="stmtName" list="stList" placeholder="Jina Kamili la Mwanafunzi">
            <input type="text" id="stmtClass" placeholder="Kidato/Mkondo (Mfano: Form 3A)">
            <select id="stmtFeeSel" onchange="document.getElementById('stmtReq').value = this.value">
              <option value="450000">-- Chagua Kiwango cha Ada (Au Andika) --</option>
              ${fees.map(f => `<option value="${f.amount}">${f.category} (TZS ${Number(f.amount).toLocaleString()})</option>`).join('')}
            </select>
            <input type="number" id="stmtReq" value="450000" placeholder="Kiasi Kinachotakiwa kwa Mwaka (TZS)" style="grid-column: span 3;">
            <button class="btn btn-blue" style="grid-column: span 3;" onclick="buildStatement()">📄 Tengeneza Taarifa ya Michango (PDF)</button>
          </div>
          <div id="stmtOutput"></div>
        </div>`;
    }
    if (tab === 'procurement') {
      const procs = SGB.select('procurement_committee');
      area.innerHTML = `
        <div class="panel">
          <h3>Kikao cha Kamati ya Manunuzi (Accept / Reject / Resend Workflow)</h3>
          <form onsubmit="sendProc(event)" style="display:grid; gap:10px; margin-bottom:15px;">
            <input type="text" id="pTitle" required placeholder="Kichwa cha Kikao (Mfano: Kikao cha Manunuzi ya Chakula Muhula wa II)">
            <input type="number" id="pBudget" required placeholder="Makadirio ya Bajeti (TZS)">
            <textarea id="pNotes" rows="3" required placeholder="Orodha ya mahitaji na muhtasari wa kikao..."></textarea>
            <button type="submit" class="btn btn-green">📤 Hifadhi & Tuma Kwa Mkuu wa Shule (0784 755 173)</button>
          </form>
          <table><tr><th>Kikao</th><th>Bajeti (TZS)</th><th>Hali</th><th>Maoni ya Mkuu wa Shule</th><th>Hatua</th></tr>
          ${procs.map(p => `<tr><td><b>${p.meeting_title}</b><br><small>${p.minutes_summary}</small></td><td>${Number(p.estimated_budget).toLocaleString()}</td><td><b>${p.status}</b></td><td>${p.hm_comments || '-'}</td>
          <td>${p.status.includes('Rejected') ? `<button class="btn btn-amber" onclick="resendProc(${p.id})">🔄 Rekebisha & Resend</button>` : '-'}</td></tr>`).join('')}
          </table>
        </div>`;
    }

    if (tab === 'bank_book') {
      const recs = SGB.select('accounting_receipts');
      const vchs = SGB.select('expense_vouchers');
      let rows = [];
      recs.forEach(r => rows.push({ date: r.created_at, desc: `Mapokezi: ${r.student_name} (${r.payment_category})`, ref: r.receipt_number, cr: Number(r.amount_paid), dr: 0 }));
      vchs.forEach(v => rows.push({ date: v.created_at, desc: `Matumizi: ${v.description}`, ref: v.voucher_no, cr: 0, dr: Number(v.amount) }));
      let bal = 0;

      area.innerHTML = `
        <div class="panel">
          <h3>1. Rekodi Vocha ya Matumizi (Expense Voucher)</h3>
          <form onsubmit="addVoucher(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="vDesc" required placeholder="Maelezo ya Matumizi">
            <select id="vAcc"><option value="CRDB_${cfg.crdb}">CRDB (${cfg.crdb})</option><option value="Cash_Box">Cash Box</option></select>
            <input type="number" id="vAmt" required placeholder="Kiasi (TZS)">
            <button type="submit" class="btn btn-amber" style="grid-column: span 3;">💾 Hifadhi Vocha & Tuma Kwa Mkuu wa Shule</button>
          </form>
          <h3>2. Taarifa ya Mapato na Matumizi (Bank-Style Statement)</h3>
          <button class="btn btn-blue" onclick="printDiv('bankPrintArea')">🖨️ Chapisha Statement (A4 PDF)</button>
          <div id="bankPrintArea">
            <table><tr><th>Tarehe</th><th>Maelezo ya Muamala</th><th>Risiti/Voucher</th><th>Credit (+)</th><th>Debit (-)</th><th>Running Balance</th></tr>
            ${rows.reverse().map(x => { bal += (x.cr - x.dr); return `<tr><td>${x.date}</td><td>${x.desc}</td><td>${x.ref}</td><td style="color:#059669;">${x.cr ? x.cr.toLocaleString() : '-'}</td><td style="color:#dc2626;">${x.dr ? x.dr.toLocaleString() : '-'}</td><td><b>${bal.toLocaleString()}</b></td></tr>`; }).join('')}
            </table>
          </div>
        </div>`;
    }

    if (tab === 'payroll_assets') {
      const pays = SGB.select('staff_payroll');
      const assets = SGB.select('fixed_assets');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Mishahara ya Wafanyakazi (Payroll Calculator: Gross, NSSF 10% & PAYE)</h3>
          <form onsubmit="addPayroll(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="pyName" required placeholder="Jina la Mtumishi / Mwalimu">
            <input type="number" id="pyGross" required placeholder="Mshahara Ghafi (Gross Salary TZS)">
            <input type="number" id="pyPaye" value="0" required placeholder="Kodi ya PAYE (TZS)">
            <button type="submit" class="btn btn-green" style="grid-column: span 3;">💵 Kokotoa & Hifadhi Mshahara</button>
          </form>
          <table><tr><th>Mtumishi</th><th>Gross (TZS)</th><th>NSSF (10%)</th><th>PAYE</th><th>Net Pay (Mkononi)</th></tr>
          ${pays.map(p => `<tr><td><b>${p.name}</b></td><td>${Number(p.gross).toLocaleString()}</td><td>${Number(p.nssf).toLocaleString()}</td><td>${Number(p.paye).toLocaleString()}</td><td><b style="color:#059669;">${Number(p.net_pay).toLocaleString()}</b></td></tr>`).join('') || '<tr><td colspan="5">Hakuna rekodi za mishahara bado.</td></tr>'}
          </table>
        </div>
        <div class="panel">
          <h3>2. Rejista ya Mali za Kudumu za Shule (Fixed Assets & Bajeti ya Idara)</h3>
          <form onsubmit="addAsset(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="asName" required placeholder="Mali (Mfano: Kompyuta 10, Jenereta, Gari)">
            <input type="text" id="asDept" required placeholder="Idara / Eneo (Mfano: Maabara / Utawala)">
            <input type="number" id="asVal" required placeholder="Thamani (TZS)">
            <button type="submit" class="btn btn-blue" style="grid-column: span 3;">🏛️ Sajili Mali ya Shule</button>
          </form>
          <table><tr><th>Mali ya Shule</th><th>Idara</th><th>Thamani (TZS)</th><th>Tarehe</th></tr>
          ${assets.map(a => `<tr><td><b>${a.name}</b></td><td>${a.dept}</td><td>${Number(a.val).toLocaleString()}</td><td>${a.created_at}</td></tr>`).join('')}
          </table>
        </div>`;
    }

    if (tab === 'clearance') {
      const locked = isPeriodLocked();
      area.innerHTML = `
        <div class="panel">
          <h3>1. Clearance Checklist (Uhakiki wa Madeni ya Fedha & Vitabu vya Maktaba)</h3>
          <div style="display:flex; gap:10px; max-width:450px;">
            <input type="text" id="clrName" list="stList" placeholder="Andika jina la mwanafunzi...">
            <button class="btn btn-green" onclick="checkClearance()">🔍 Hakiki Sasa</button>
          </div>
          <div id="clrResult" style="margin-top:15px;"></div>
        </div>
        <div class="panel">
          <h3>2. Kufunga Mahesabu ya Mwezi / Mwaka (Accounting Period Locking)</h3>
          <p style="font-size:13px; color:#475569;">Ukifunga mahesabu, hakuna risiti au vocha mpya inayoweza kuongezwa au kubadilishwa kwa kipindi hicho.</p>
          <button class="btn ${locked ? 'btn-green' : 'btn-red'}" onclick="togglePeriodLock()">${locked ? '🔓 Fungua Mahesabu (Unlock Period)' : '🔒 Funga Mahesabu Sasa (Lock Period)'}</button>
        </div>`;
    }
  }
  function createReceipt(e) {
    e.preventDefault();
    const cfg = JSON.parse(localStorage.getItem('sgb_school_config') || '{"crdb":"0150838972100"}');
    const rec = SGB.insert('accounting_receipts', {
      receipt_number: 'SGB-' + Math.floor(100000 + Math.random() * 900000),
      student_name: document.getElementById('rName').value.trim(),
      student_reg_no: document.getElementById('rReg').value.trim(),
      payment_category: document.getElementById('rCat').value.trim(),
      payment_method: document.getElementById('rMethod').value,
      bank_ref_no: document.getElementById('rRef').value.trim() || 'CASH',
      amount_paid: Number(document.getElementById('rAmount').value),
      waiver: Number(document.getElementById('rWaiver').value || 0)
    });
    updateNames();
    const qr = SGB.qrImg(`SANGABUYE-RECEIPT:${rec.receipt_number}|TZS:${rec.amount_paid}`);
    document.getElementById('receiptBox').innerHTML = `
      <div id="printSlip" style="border:2px dashed #064e3b; padding:14px; max-width:290px; background:#fff; font-family:monospace; font-size:12px;">
        <center><b>SANGABUYE SECONDARY SCHOOL</b><br>S.L.P 11898, ILEMELA - MWANZA<br>Mhasibu: 0615 000 305<br>----------------------------<br><b>RISITI HALALI (58/80mm)</b></center><br>
        <b>Risiti:</b> ${rec.receipt_number}<br><b>Tarehe:</b> ${rec.created_at}<br><b>Mwanafunzi:</b> ${rec.student_name} (${rec.student_reg_no})<br><b>Mchango:</b> ${rec.payment_category}<br><b>Njia:</b> ${rec.payment_method} (${rec.bank_ref_no})<br><b>CRDB:</b> SHULE YA SEKONDARI SANGABUYE E.K (${cfg.crdb})<br>----------------------------<br>
        <div style="font-size:14px;"><b>KIASI: TZS ${rec.amount_paid.toLocaleString()}/=</b></div>
        ${rec.waiver ? `<small>Punguzo/Udhamini: TZS ${rec.waiver.toLocaleString()}</small><br>` : ''}
        ----------------------------<br><center><img src="${qr}" alt="QR"><br><small>Scan kuthibitisha uhalali</small></center>
      </div><br><button class="btn btn-blue" onclick="printDiv('printSlip')">🖨️ Chapisha Thermal Receipt</button>`;
  }

  function addCampStudent(e) {
    e.preventDefault();
    SGB.insert('camp_students', {
      student_name: document.getElementById('cpName').value.trim(),
      class_name: document.getElementById('cpClass').value.trim(),
      camp_name: document.getElementById('cpTitle').value.trim(),
      fee_required: Number(document.getElementById('cpFee').value)
    });
    alert('✅ Mwanafunzi amesajiliwa kwenye Kambi ya Masomo!');
    openTab('study_camp');
  }

  function quickCampPay(studentName, balance) {
    const amt = Number(prompt(`Ingiza kiasi anacholipa ${studentName} kwa ajili ya Kambi (Deni ni TZS ${balance.toLocaleString()}):`, balance));
    if (!amt || amt <= 0) return;
    const method = confirm('Je, amelipa kupitia CRDB Bank? (Bofya OK kwa CRDB, au Cancel kwa Cash)') ? 'CRDB_Bank' : 'Cash';
    const rec = SGB.insert('accounting_receipts', {
      receipt_number: 'SGB-' + Math.floor(100000 + Math.random() * 900000),
      student_name: studentName,
      student_reg_no: 'CAMP-2026',
      payment_category: 'Kambi ya Masomo (Academic Camp)',
      payment_method: method,
      bank_ref_no: method === 'CRDB_Bank' ? 'CRDB-CAMP' : 'CASH',
      amount_paid: amt,
      waiver: 0
    });
    alert(`✅ Malipo ya Kambi (TZS ${amt.toLocaleString()}) yamepokewa! Risiti Na: ${rec.receipt_number}`);
    openTab('study_camp');
  }

  function addFeeStruct(e) {
    e.preventDefault();
    SGB.insert('fee_structures', { category: document.getElementById('fsCat').value.trim(), amount: Number(document.getElementById('fsAmt').value) });
    openTab('fee_struct');
  }

  function delFeeStruct(id) {
    const list = SGB.select('fee_structures').filter(x => x.id !== id);
    localStorage.setItem('sgb_fee_structures', JSON.stringify(list));
    openTab('fee_struct');
  }

  function addStore(e) {
    e.preventDefault();
    const item = SGB.insert('store_inventory', {
      item_name: document.getElementById('sItem').value.trim(),
      quantity: Number(document.getElementById('sQty').value),
      unit: document.getElementById('sUnit').value.trim(),
      supplier: document.getElementById('sFrom').value.trim(),
      value_tzs: Number(document.getElementById('sVal').value)
    });
    alert(`✅ Bidhaa ${item.item_name} (${item.quantity} ${item.unit}) imehifadhiwa stoo!`);
    openTab('store');
  }

  function deductStore(id, cur) {
    const used = Number(prompt('Ingiza kiasi kilichotumika:'));
    if (used > 0) { SGB.update('store_inventory', id, { quantity: Math.max(0, cur - used) }); openTab('store'); }
  }
  function buildStatement() {
    const name = document.getElementById('stmtName').value.trim();
    const cls = document.getElementById('stmtClass').value.trim() || '-';
    const req = Number(document.getElementById('stmtReq').value || 0);
    const recs = SGB.select('accounting_receipts').filter(r => r.student_name.toLowerCase() === name.toLowerCase());
    const paid = recs.reduce((s, r) => s + Number(r.amount_paid), 0);
    const bal = Math.max(0, req - paid);
    const qr = SGB.qrImg(`SANGABUYE-STMT:${name}|PAID:${paid}|BAL:${bal}`);

    document.getElementById('stmtOutput').innerHTML = `
      <div id="stmtPrint" style="border:1px solid #0f294a; padding:20px; background:white;">
        <center><h3>SANGABUYE SECONDARY SCHOOL</h3><p>S.L.P 11898, Ilemela - Mwanza | CRDB: SHULE YA SEKONDARI SANGABUYE E.K (0150838972100)</p><h4>TAARIFA RASMI YA MICHANGO YA MWANAFUNZI</h4></center>
        <p><b>Jina la Mwanafunzi:</b> ${name} | <b>Kidato/Mkondo:</b> ${cls}</p>
        <table><tr><th>Aina ya Mchango</th><th>Kinachotakiwa (TZS)</th><th>Alichotoa (TZS)</th><th>Deni Lililobaki (TZS)</th></tr>
        ${recs.map(r => `<tr><td>${r.payment_category} (${r.receipt_number})</td><td>-</td><td>${Number(r.amount_paid).toLocaleString()}</td><td>-</td></tr>`).join('')}
        <tr style="background:#f1f5f9;"><td><b>MUHTASARI (SUMMARY TOTAL)</b></td><td><b>${req.toLocaleString()}</b></td><td><b>${paid.toLocaleString()}</b></td><td><b style="color:#dc2626;">${bal.toLocaleString()}</b></td></tr></table>
        <div style="display:flex; justify-content:space-between; margin-top:25px; align-items:center;">
          <div><b>Aliyeandaa:</b> Mhasibu (Simu: 0615 000 305)<br><br><b>Aliyethibitisha:</b> Mkuu wa Shule (Simu: 0784 755 173)</div>
          <img src="${qr}" alt="QR">
        </div>
      </div><br>
      <button class="btn btn-blue" onclick="printDiv('stmtPrint')">🖨️ Pakua / Chapisha Taarifa (A4 PDF)</button>
      <button class="btn btn-green" onclick="sendStmtToHM('${name}', ${req}, ${paid}, ${bal})">📤 Tuma Kwa Mkuu wa Shule Aidhinishe</button>`;
  }

  function sendStmtToHM(name, req, paid, bal) {
    SGB.insert('contribution_statements', { student_name: name, required: req, paid, balance: bal, status: 'Pending HM Approval' });
    alert('✅ Taarifa ya michango imetumwa kwa Mkuu wa Shule (0784 755 173)!');
  }

  function sendProc(e) {
    e.preventDefault();
    SGB.insert('procurement_committee', { meeting_title: document.getElementById('pTitle').value, estimated_budget: document.getElementById('pBudget').value, minutes_summary: document.getElementById('pNotes').value, status: 'Pending (Inasubiri Mkuu wa Shule)' });
    alert('✅ Muhtasari wa Kamati ya Manunuzi umetumwa kwa Mkuu wa Shule!');
    openTab('procurement');
  }

  function resendProc(id) {
    const newNotes = prompt('Andika marekebisho ya kikao baada ya maoni ya Mkuu wa Shule:');
    if (newNotes) { SGB.update('procurement_committee', id, { minutes_summary: newNotes, status: 'Resent (Imetumwa Upya Kwa Mkuu)' }); openTab('procurement'); }
  }

  function addVoucher(e) {
    e.preventDefault();
    if (isPeriodLocked()) { alert('🔒 Mahesabu yamefungwa!'); return; }
    SGB.insert('expense_vouchers', { voucher_no: 'VCH-' + Math.floor(1000 + Math.random() * 9000), description: document.getElementById('vDesc').value, source_account: document.getElementById('vAcc').value, amount: Number(document.getElementById('vAmt').value) });
    openTab('bank_book');
  }

  function addPayroll(e) {
    e.preventDefault();
    const name = document.getElementById('pyName').value;
    const gross = Number(document.getElementById('pyGross').value);
    const nssf = Math.round(gross * 0.10);
    const paye = Number(document.getElementById('pyPaye').value || 0);
    SGB.insert('staff_payroll', { name, gross, nssf, paye, net_pay: gross - nssf - paye });
    openTab('payroll_assets');
  }

  function addAsset(e) {
    e.preventDefault();
    SGB.insert('fixed_assets', { name: document.getElementById('asName').value, dept: document.getElementById('asDept').value, val: document.getElementById('asVal').value });
    openTab('payroll_assets');
  }

  function checkClearance() {
    const name = document.getElementById('clrName').value.trim();
    const recs = SGB.select('accounting_receipts').filter(r => r.student_name.toLowerCase() === name.toLowerCase());
    const unreturned = SGB.select('library_loans').filter(l => l.student_name.toLowerCase() === name.toLowerCase() && l.status.includes('Ameazima'));
    const paid = recs.reduce((s, r) => s + Number(r.amount_paid), 0);

    document.getElementById('clrResult').innerHTML = `<div class="panel" style="border-left:4px solid ${unreturned.length ? '#dc2626' : '#059669'};">
      <b>Mwanafunzi:</b> ${name}<br>
      <b>Jumla ya Michango Aliyolipa:</b> TZS ${paid.toLocaleString()}<br>
      <b>Hali ya Maktaba:</b> ${unreturned.length ? `<span style="color:#dc2626;font-weight:bold;">❌ Anadaiwa Kitabu: ${unreturned.book}</span>` : '<span style="color:#059669;">✅ Hajaazima kitabu / Amerudisha</span>'}<br>
      ${unreturned.length ? '' : `<button class="btn btn-green" style="margin-top:10px;" onclick="alert('✅ Uhasibu na Maktaba zimemthibitishia ${name} Clearance Kamili!')">✅ Thibitisha Clearance Kamili</button>`}
    </div>`;
  }

  function togglePeriodLock() {
    const next = !isPeriodLocked();
    localStorage.setItem('sgb_finance_locked', String(next));
    SGB.logAction(next ? 'Amefunga mahesabu (Period Locked)' : 'Amefungua mahesabu (Period Unlocked)');
    openTab('clearance');
  }

  function printDiv(id) {
    const html = document.getElementById(id).innerHTML;
    const w = window.open('', '', 'width=750,height=650');
    w.document.write('<html><head><title>Sangabuye Finance Print</title><style>body{font-family:sans-serif;padding:15px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ccc;padding:8px;font-size:12px;}</style></head><body>' + html + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { w.print(); w.close(); }, 300);
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
</body>
</html>
