<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mhasibu (Accountant Office v17.0) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; overflow-x: hidden; }
    .sidebar { width: 265px; flex-shrink: 0; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; transition: all 0.25s ease; }
    .sidebar.collapsed { width: 0; padding: 0; overflow: hidden; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11.8px; margin-bottom: 2px; width: 100%; }
    .menu-btn:hover, .menu-btn.active { background: #059669; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-x: hidden; }
    .topbar { background: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 16px; min-width: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #059669; }
    .card h4 { margin: 0 0 5px; font-size: 10.5px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 17px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; overflow-x: auto; max-width: 100%; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; min-width: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    #acMenuToggle { background: #0f294a; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    @media (max-width: 900px) {
      .sidebar { position: fixed; left: -275px; top: 0; bottom: 0; z-index: 9999; width: 265px; padding: 12px 10px; box-shadow: 4px 0 18px rgba(0,0,0,0.35); }
      .sidebar.open { left: 0; }
      .sidebar.collapsed { left: -275px; width: 265px; padding: 12px 10px; }
      #viewArea form { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
<div class="sidebar" id="acSidebar">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
    <h2 style="flex:1;">ACCOUNTANT OFFICE</h2>
    <button type="button" onclick="toggleAccSidebar()" style="background:transparent;border:none;color:#94a3b8;font-size:16px;cursor:pointer;">✖</button>
  </div>
  <p id="acSideName">Ilemela MC | Sangabuye Sec</p>

  <div class="grp-lbl">A. Mapato & Wanafunzi</div>
  <button type="button" class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari (Fedha & Stoo)</button>
  <button type="button" class="menu-btn" onclick="openTab('receipts_basket', this)">🛒 2. Mapokezi (Kapu la Michango)</button>
  <button type="button" class="menu-btn" onclick="openTab('parent_statements', this)">📄 3. Taarifa Kwa Mzazi & Waliolipa</button>
  <button type="button" class="menu-btn" onclick="openTab('fee_rates', this)">🏷️ 4. Viwango vya Ada, Kambi & Basi</button>

  <div class="grp-lbl">B. Matumizi & Mishahara</div>
  <button type="button" class="menu-btn" onclick="openTab('expenses_ffars', this)">💸 5. Matumizi & FFARS PV</button>
  <button type="button" class="menu-btn" onclick="openTab('procurement', this)">🤝 6. Kamati ya Manunuzi</button>
  <button type="button" class="menu-btn" onclick="openTab('payroll', this)">💼 7. Mishahara (Pre-Audit & Slip)</button>
  <button type="button" class="menu-btn" onclick="openTab('imprest_petty', this)">🧾 8. Masurufu (Imprest) & Petty Cash</button>

  <div class="grp-lbl">C. Benki, Ruzuku & Bajeti</div>
  <button type="button" class="menu-btn" onclick="openTab('bank_recon', this)">🏦 9. Bank Reconciliation (CRDB)</button>
  <button type="button" class="menu-btn" onclick="openTab('capitation', this)">🏛️ 10. Ruzuku (Capitation Grant)</button>
  <button type="button" class="menu-btn" onclick="openTab('budget_vs_act', this)">🎯 11. Bajeti vs Utekelezaji</button>

  <div class="grp-lbl">D. Stoo, Mali & Ukaguzi</div>
  <button type="button" class="menu-btn" onclick="openTab('store_inv', this)">📦 12. Stoo ya Vyakula & Vifaa</button>
  <button type="button" class="menu-btn" onclick="openTab('fixed_assets', this)">🖥️ 13. Daftari la Mali (Fixed Assets)</button>
  <button type="button" class="menu-btn" onclick="openTab('reports_close', this)">🔒 14. Ripoti, Funga Hesabu & Clearance</button>
</div>

<div class="main">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" id="acMenuToggle" onclick="toggleAccSidebar()" title="Fungua/Funga Menyu">☰</button>
      <strong id="tabTitle">📊 1. Muhtasari (Fedha & Stoo)</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex:1; max-width:440px; min-width:200px;">
      <input type="text" id="globalAcSearch" onkeyup="filterAccountantTables(this.value)" placeholder="🔍 Tafuta risiti, mwanafunzi, vocha, bidhaa...">
      <button type="button" class="btn btn-blue" style="white-space:nowrap;" onclick="refreshAccountantNow()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['accountant', 'bursar', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();

  const myAccName = user ? (user.full_name || user.username || 'Mhasibu wa Shule') : 'Mhasibu wa Shule';
  let currentAcTab = 'overview';

  const ACC_CLASSES = [
    'Form 1A', 'Form 1B', 'Form 1C', 'Form 1D', 'Form 1E', 'Form 1F',
    'Form 2A', 'Form 2B', 'Form 2C', 'Form 2D', 'Form 2E', 'Form 2F',
    'Form 3A', 'Form 3B', 'Form 3C', 'Form 3D', 'Form 3E', 'Form 3F',
    'Form 4A', 'Form 4B', 'Form 4C', 'Form 4D', 'Form 4E', 'Form 4F',
    'Form 5 PCM', 'Form 5 PCB', 'Form 5 PGM', 'Form 5 EGM', 'Form 5 HGL', 'Form 5 HKL', 'Form 5 HGE', 'Form 5 ECA', 'Form 5 CBG',
    'Form 6 PCM', 'Form 6 PCB', 'Form 6 PGM', 'Form 6 EGM', 'Form 6 HGL', 'Form 6 HKL', 'Form 6 HGE', 'Form 6 ECA', 'Form 6 CBG'
  ];

  window.toggleAccSidebar = function() {
    const sb = document.getElementById('acSidebar');
    if (!sb) return;
    if (window.innerWidth <= 900) sb.classList.toggle('open');
    else sb.classList.toggle('collapsed');
  };

  async function saveTablePermanent(table, arr) {
    localStorage.setItem('sgb_' + table, JSON.stringify(arr));
    if (SGB.forceReplaceCloud) {
      await SGB.forceReplaceCloud(table, arr);
    } else if (SGB.pushToCloud) {
      await SGB.pushToCloud(table);
    }
  }

  function getUnifiedStudents() {
    const map = {};
    SGB.select('academic_students').forEach(s => {
      const k = (s.full_name || '').trim().toLowerCase();
      if (k) {
        map[k] = {
          full_name: s.full_name.trim(),
          gender: (s.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M',
          class_name: s.class_name || 'Form 1A',
          student_category: s.student_category || s.boarding_status || 'Kutwa (Day)',
          prem_no: s.prem_no || '-',
          parent_phone: s.parent_phone || ''
        };
      }
    });
    SGB.select('users_profile').filter(u => (u.role || '').toLowerCase() === 'student').forEach(u => {
      const k = (u.full_name || '').trim().toLowerCase();
      if (k && !map[k]) {
        map[k] = {
          full_name: u.full_name.trim(),
          gender: (u.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M',
          class_name: u.class_name || u.department || 'Form 1A',
          student_category: u.student_category || u.boarding_status || 'Kutwa (Day)',
          prem_no: u.username || '-',
          parent_phone: u.phone || ''
        };
      }
    });
    return Object.values(map);
  }

  function getStudentLedger(studentName) {
    const nLow = (studentName || '').trim().toLowerCase();
    const bills = SGB.select('student_bills').filter(b => (b.student_name || '').trim().toLowerCase() === nLow);
    const pays = SGB.select('fee_payments').filter(p => (p.student_name || '').trim().toLowerCase() === nLow);
    const totalBilled = bills.reduce((s, b) => s + Number(b.amount || b.total_due || 0), 0);
    const totalPaid = pays.reduce((s, p) => s + Number(p.amount || 0), 0);
    const balance = Math.max(0, totalBilled - totalPaid);
    return { bills, pays, totalBilled, totalPaid, balance, hasBilling: bills.length > 0 || pays.length > 0 };
  }
  window.openTab = function(tab, btn) {
    currentAcTab = tab;
    document.getElementById('acSidebar')?.classList.remove('open');
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const pays = SGB.select('fee_payments');
      const exps = SGB.select('school_expenses');
      const grants = SGB.select('capitation_grants');
      const bills = SGB.select('student_bills');
      const store = SGB.select('store_inventory');

      const totalFees = pays.reduce((s, x) => s + Number(x.amount || 0), 0);
      const totalGrants = grants.reduce((s, x) => s + Number(x.amount || 0), 0);
      const totalIncome = totalFees + totalGrants;
      const totalExp = exps.reduce((s, x) => s + Number(x.amount || 0), 0);
      const netBalance = totalIncome - totalExp;
      const totalBilledAll = bills.reduce((s, x) => s + Number(x.amount || 0), 0);
      const totalArrears = Math.max(0, totalBilledAll - totalFees);
      const lowStock = store.filter(i => Number(i.qty || 0) <= Number(i.reorder_level || 5)).length;

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Mapato Yote (Ada + Ruzuku)</h4><div class="val" style="color:#059669;">${SGB.formatTZS(totalIncome)}</div></div>
          <div class="card" style="border-color:#dc2626;"><h4>Matumizi Yote (FFARS)</h4><div class="val" style="color:#dc2626;">${SGB.formatTZS(totalExp)}</div></div>
          <div class="card" style="border-color:#1d4ed8;"><h4>Salio Halisi (Benki & Mkononi)</h4><div class="val">${SGB.formatTZS(netBalance)}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Madeni ya Wanafunzi (Arrears)</h4><div class="val">${SGB.formatTZS(totalArrears)}</div></div>
          <div class="card" style="border-color:#7c3aed;"><h4>Bidhaa Zinazokaribia Kuisha Stoo</h4><div class="val">${lowStock}</div></div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px;">
          <div class="panel">
            <h3 style="margin-top:0;">💰 Miamala 10 ya Mwisho ya Mapokezi (Risiti)</h3>
            <table><thead><tr><th>Risiti #</th><th>Mwanafunzi</th><th>Kategoria</th><th>Kiasi</th></tr></thead><tbody>
            ${pays.slice(0, 10).map(p => `<tr><td><b>${p.receipt_no || '-'}</b></td><td><b>${p.student_name}</b></td><td>${p.fee_type}</td><td style="color:#059669;"><b>${SGB.formatTZS(p.amount)}</b></td></tr>`).join('') || '<tr><td colspan="4">Hakuna malipo bado.</td></tr>'}
            </tbody></table>
          </div>
          <div class="panel">
            <h3 style="margin-top:0;">💸 Vocha 10 za Mwisho za Matumizi</h3>
            <table><thead><tr><th>PV #</th><th>Maelezo</th><th>Fungu</th><th>Kiasi</th></tr></thead><tbody>
            ${exps.slice(0, 10).map(e => `<tr><td><b>${e.pv_no || '-'}</b></td><td><b>${e.description}</b></td><td>${e.vote_head}</td><td style="color:#dc2626;"><b>${SGB.formatTZS(e.amount)}</b></td></tr>`).join('') || '<tr><td colspan="4">Hakuna matumizi bado.</td></tr>'}
            </tbody></table>
          </div>
        </div>`;
      return;
    }
    if (tab === 'receipts_basket') {
      const students = getUnifiedStudents();
      const pays = SGB.select('fee_payments');
      area.innerHTML = `
        <div class="panel" style="border-left:4px solid #059669;">
          <h3>🛒 2. Mapokezi (Kapu la Michango) & Utoaji wa Risiti za QR</h3>
          <form onsubmit="recordFeeReceipt(event)" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(165px, 1fr)); gap:8px; margin-bottom:12px;">
            <input type="text" id="rcStudent" list="accStDatalist" oninput="autoFillStudentClassAcc(this.value)" required placeholder="Andika jina la mwanafunzi...">
            <input type="text" id="rcClass" required placeholder="Kidato (mf. Form 1A)">
            <select id="rcType">
              <option value="Michango ya Chakula">Michango ya Chakula</option>
              <option value="Michango ya Taaluma / Mitihani">Michango ya Taaluma / Mitihani</option>
              <option value="Kambi ya Taaluma (Form 2/4/6)">Kambi ya Taaluma (Form 2/4/6)</option>
              <option value="Usafiri / Basi la Shule">Usafiri / Basi la Shule</option>
              <option value="Kitambulisho & Tahadhari">Kitambulisho & Tahadhari</option>
              <option value="Ada / Michango Mingine">Ada / Michango Mingine</option>
            </select>
            <input type="number" id="rcAmount" required min="100" placeholder="Kiasi Kilicholipwa (TZS)">
            <select id="rcMethod">
              <option value="CRDB Bank (Control No)">CRDB Bank (Control No)</option>
              <option value="NMB Bank">NMB Bank</option>
              <option value="M-Pesa / TigoPesa / Airtel">M-Pesa / TigoPesa / Airtel</option>
              <option value="Fedha Mkononi (Cash)">Fedha Mkononi (Cash)</option>
            </select>
            <input type="text" id="rcRef" placeholder="Control No / Bank Slip Ref">
            <button type="submit" class="btn btn-green">💾 Hifadhi & Toa Risiti</button>
          </form>
          <datalist id="accStDatalist">${students.map(s => `<option value="${s.full_name}">`).join('')}</datalist>

          <table><thead><tr><th>Tarehe</th><th>Risiti #</th><th>Mwanafunzi</th><th>Kidato</th><th>Mchango</th><th>Kiasi</th><th>Njia / Ref</th><th>Vitendo</th></tr></thead><tbody>
          ${pays.map(p => `<tr>
            <td>${p.created_at}</td><td><b>${p.receipt_no}</b></td><td><b>${p.student_name}</b></td><td>${p.class_name}</td><td>${p.fee_type}</td>
            <td style="color:#059669;"><b>${SGB.formatTZS(p.amount)}</b></td><td>${p.payment_method} (${p.reference_no || '-'})</td>
            <td style="white-space:nowrap;">
              <button type="button" class="btn btn-blue" style="padding:3px 7px;" onclick="printOfficialReceipt('${p.id}')">🖨️ Risiti</button>
              <button type="button" class="btn btn-green" style="padding:3px 7px;" onclick="sendParentFeeSms('${p.student_name}','${p.amount}','${p.receipt_no}','WA')">💬 WA</button>
              <button type="button" class="btn btn-amber" style="padding:3px 7px;" onclick="sendParentFeeSms('${p.student_name}','${p.amount}','${p.receipt_no}','SMS')">📱 SMS</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="8">Hakuna risiti zilizotolewa bado.</td></tr>'}
          </tbody></table>
        </div>`;
      return;
    }
    if (tab === 'parent_statements') {
      const students = getUnifiedStudents();
      const rows = students.map(s => {
        const led = getStudentLedger(s.full_name);
        return { ...s, ...led };
      });
      area.innerHTML = `
        <div class="panel">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
            <h3 style="margin:0;">📄 3. Taarifa za Malipo Kwa Mzazi, Waliolipa & Wadaiwa (Fee Ledger)</h3>
            <button type="button" class="btn btn-blue" onclick="downloadDebtorsCsv()">⬇️ Pakua Orodha ya Wadaiwa (CSV)</button>
          </div>
          <table><thead><tr><th>Mwanafunzi</th><th>Kidato</th><th>Kategoria</th><th>Bili Yote (TZS)</th><th>Aliyolipa (TZS)</th><th>Deni / Salio (TZS)</th><th>Hali</th><th>Taarifa Kwa Mzazi</th></tr></thead><tbody>
          ${rows.map(r => `<tr>
            <td><b>${r.full_name}</b></td><td>${r.class_name}</td><td>${r.student_category}</td>
            <td>${r.hasBilling ? SGB.formatTZS(r.totalBilled) : '-'}</td>
            <td style="color:#059669;"><b>${SGB.formatTZS(r.totalPaid)}</b></td>
            <td style="color:${r.balance > 0 ? '#dc2626' : '#059669'};"><b>${r.hasBilling ? SGB.formatTZS(r.balance) : 'Hajawekewa Bili'}</b></td>
            <td><b>${!r.hasBilling ? '⏳ Bado' : r.balance === 0 ? '✅ Amekamilisha' : '⚠️ Anadaiwa'}</b></td>
            <td style="white-space:nowrap;">
              <button type="button" class="btn btn-green" style="padding:3px 7px;" onclick="sendParentStatementAlert('${r.full_name}',${r.totalBilled},${r.totalPaid},${r.balance},'WA')">💬 WhatsApp</button>
              <button type="button" class="btn btn-blue" style="padding:3px 7px;" onclick="sendParentStatementAlert('${r.full_name}',${r.totalBilled},${r.totalPaid},${r.balance},'SMS')">📱 SMS</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="8">Hakuna wanafunzi waliosajiliwa bado.</td></tr>'}
          </tbody></table>
        </div>`;
      return;
    }
    if (tab === 'fee_rates') {
      const rates = SGB.select('fee_structures');
      area.innerHTML = `
        <div class="panel" style="border-left:4px solid #1d4ed8;">
          <h3>🏷️ 4. Viwango vya Ada, Michango, Kambi & Basi (Kwa Darasa & Kategoria ya Mwanafunzi)</h3>
          <form onsubmit="saveFeeRateAndBill(event)" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px; margin-bottom:12px;">
            <div>
              <label style="font-size:11px;font-weight:bold;">1. Chagua Darasa / Kidato:</label>
              <select id="frScope">
                <option value="ALL">Wanafunzi Wote (Form 1–6)</option>
                <option value="FORM_1">Form 1 Nzima (A–F)</option>
                <option value="FORM_2">Form 2 Nzima (A–F)</option>
                <option value="FORM_3">Form 3 Nzima (A–F)</option>
                <option value="FORM_4">Form 4 Nzima (A–F)</option>
                <option value="FORM_5">Form 5 Nzima</option>
                <option value="FORM_6">Form 6 Nzima</option>
                ${ACC_CLASSES.map(c => `<option value="${c}">${c}</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:bold;">2. Kategoria ya Mwanafunzi:</label>
              <select id="frStudentCat">
                <option value="ALL_CAT">Wote (Kutwa & Bweni)</option>
                <option value="BOARDING">Wanafunzi wa Bweni (Boarding) Pekee</option>
                <option value="DAY">Wanafunzi wa Kutwa (Day) Pekee</option>
                <option value="GIRLS">Wasichana (F) Pekee</option>
                <option value="BOYS">Wavulana (M) Pekee</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:bold;">3. Aina ya Mchango / Ada:</label>
              <select id="frCategory">
                <option value="Michango ya Chakula (Muhula)">Michango ya Chakula (Muhula)</option>
                <option value="Michango ya Taaluma & Mitihani">Michango ya Taaluma & Mitihani</option>
                <option value="Kambi ya Taaluma (Academic Camp)">Kambi ya Taaluma (Academic Camp)</option>
                <option value="Usafiri / Basi la Shule">Usafiri / Basi la Shule</option>
                <option value="Ada / Michango ya Bweni">Ada / Michango ya Bweni</option>
                <option value="Ulinzi, Umeme & Maji">Ulinzi, Umeme & Maji</option>
                <option value="Kitambulisho & Tahadhari">Kitambulisho & Tahadhari</option>
              </select>
            </div>
            <div>
              <label style="font-size:11px;font-weight:bold;">4. Kiasi (TZS):</label>
              <input type="number" id="frAmount" required min="500" placeholder="Kiasi Kwa Mwanafunzi">
            </div>
            <div style="display:flex; align-items:flex-end;">
              <button type="submit" class="btn btn-green">💾 Hifadhi & Weka Bili</button>
            </div>
          </form>
          <table><thead><tr><th>Darasa / Kidato</th><th>Kategoria ya Mwanafunzi</th><th>Aina ya Mchango / Ada</th><th>Kiasi (TZS)</th><th>Kitendo</th></tr></thead><tbody>

  window.saveFeeRateAndBill = function(e) {
    e.preventDefault();
    const scope = document.getElementById('frScope').value;
    const stCatSel = document.getElementById('frStudentCat');
    const stCat = stCatSel.value;
    const stCatLabel = stCatSel.options[stCatSel.selectedIndex].text;
    const category = document.getElementById('frCategory').value;
    const amount = Number(document.getElementById('frAmount').value || 0);

    SGB.insert('fee_structures', {
      target_scope: scope,
      student_category: stCat,
      student_category_label: stCatLabel,
      category: category,
      amount: amount
    });

    const allStudents = getUnifiedStudents();
    const matched = allStudents.filter(s => {
      const cls = (s.class_name || '').toLowerCase();
      let classMatch = false;
      if (scope === 'ALL') classMatch = true;
      else if (scope === 'FORM_1') classMatch = cls.includes('1');
      else if (scope === 'FORM_2') classMatch = cls.includes('2');
      else if (scope === 'FORM_3') classMatch = cls.includes('3');
      else if (scope === 'FORM_4') classMatch = cls.includes('4');
      else if (scope === 'FORM_5') classMatch = cls.includes('5');
      else if (scope === 'FORM_6') classMatch = cls.includes('6');
      else classMatch = (cls === scope.toLowerCase());

      if (!classMatch) return false;

      const catLow = (s.student_category || '').toLowerCase();
      if (stCat === 'ALL_CAT') return true;
      if (stCat === 'BOARDING') return catLow.includes('bweni') || catLow.includes('board');
      if (stCat === 'DAY') return !catLow.includes('bweni') && !catLow.includes('board');
      if (stCat === 'GIRLS') return s.gender === 'F';
      if (stCat === 'BOYS') return s.gender === 'M';
      return true;
    });

    matched.forEach(st => {
      SGB.insert('student_bills', {
        student_name: st.full_name,
        class_name: st.class_name,
        student_category: st.student_category,
        category: category,
        amount: amount
      });
    });

    alert(`✅ Kiwango cha ${SGB.formatTZS(amount)} (${category} — ${stCatLabel}) kimehifadhiwa na bili imewekwa kwa wanafunzi ${matched.length}!`);
    openTab('fee_rates');
  };

  window.saveStoreItem = async function(e) {
    e.preventDefault();
    const name = document.getElementById('stItemName').value.trim();
    const act = document.getElementById('stAction').value;
    const qty = Number(document.getElementById('stQty').value || 0);
    const unit = document.getElementById('stUnit').value.trim();
    const reo = Number(document.getElementById('stReorder').value || 5);

    let store = SGB.select('store_inventory');
    const idx = store.findIndex(x => (x.item_name || '').toLowerCase() === name.toLowerCase());
    if (idx >= 0) {
      const cur = Number(store.at(idx).qty || 0);
      store.at(idx).qty = act === 'IN' ? cur + qty : Math.max(0, cur - qty);
      store.at(idx).reorder_level = reo;
    } else {
      store.unshift({ id: Date.now(), item_name: name, qty: act === 'IN' ? qty : 0, unit: unit, reorder_level: reo });
    }
    await saveTablePermanent('store_inventory', store);
    openTab('store_inv');
  };
