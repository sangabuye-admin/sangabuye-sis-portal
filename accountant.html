<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mhasibu (Enterprise Finance) | Sangabuye SIS</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 275px; background: #064e3b; color: white; display: flex; flex-direction: column; padding: 15px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fde68a; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #a7f3d0; margin: 0 0 12px; }
    .menu-btn { background: transparent; border: none; color: #ecfdf5; text-align: left; padding: 7.5px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; margin-bottom: 3px; }
    .menu-btn:hover, .menu-btn.active { background: #059669; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 13px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #059669; }
    .card h4 { margin: 0 0 5px; font-size: 10.5px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 16px; font-weight: bold; color: #064e3b; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 7px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #064e3b; }
    .btn { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MHASIBU</h2>
  <p>Sangabuye Sec | Simu: 0615 000 305</p>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari wa Fedha & Vyanzo</button>
  <button class="menu-btn" onclick="openTab('receipts', this)">🛒 2. Mapokezi (Kapu la Michango)</button>
  <button class="menu-btn" onclick="openTab('parent_stmt', this)">📄 3. Taarifa Kwa Mzazi & Wadaiwa</button>
  <button class="menu-btn" onclick="openTab('expenses', this)">💸 4. Matumizi (Filters & Vocha)</button>
  <button class="menu-btn" onclick="openTab('procurement', this)">🤝 5. Kamati ya Manunuzi</button>
  <button class="menu-btn" onclick="openTab('payroll', this)">💼 6. Mishahara (Pre-Audit, PV & Slip)</button>
  <button class="menu-btn" onclick="openTab('study_camp', this)">⛺ 7. Kambi ya Masomo & Basi</button>
  <button class="menu-btn" onclick="openTab('fee_struct', this)">🏷️ 8. Viwango vya Ada & Michango</button>
  <button class="menu-btn" onclick="openTab('store', this)">📦 9. Stoo ya Vyakula & Vifaa</button>
  <button class="menu-btn" onclick="openTab('reports', this)">📈 10. Ripoti Zote za Kifedha</button>
  <button class="menu-btn" onclick="openTab('lock_accounts', this)">🔒 11. Funga Hesabu & Clearance</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Fedha & Vyanzo</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
  <datalist id="stList"></datalist>
</div>
<script>
  const user = SGB.requireRole(['accountant', 'super_admin']);
  SGB.startSessionTimer();

  let receiptCart = [];
  let procItemsDraft = [];

  function checkLockedDate(isoDate) {
    const locks = SGB.select('account_locks').filter(l => l.status === 'Locked');
    if (!locks.length) return false;
    const d = isoDate || new Date().toISOString().slice(0, 10);
    return locks.some(l => d >= l.start_date && d <= l.end_date);
  }

  function updateNames() {
    const names = new Set();
    SGB.select('users_profile').filter(u => u.role === 'student').forEach(u => names.add(u.full_name));
    SGB.select('accounting_receipts').forEach(r => names.add(r.student_name));
    SGB.select('camp_students').forEach(c => names.add(c.student_name));
    document.getElementById('stList').innerHTML = Array.from(names).map(n => `<option value="${n}">`).join('');
  }

  function autoFillStudentReg(nameInputId = 'rName', regInputId = 'rReg', phoneInputId = 'rPhone') {
    const typed = (document.getElementById(nameInputId)?.value || '').trim().toLowerCase();
    if (!typed) return;
    const u = SGB.select('users_profile').find(x => (x.full_name || '').toLowerCase() === typed);
    if (u && u.reg_or_staff_no && document.getElementById(regInputId)) {
      document.getElementById(regInputId).value = u.reg_or_staff_no;
      if (u.phone_number && document.getElementById(phoneInputId)) document.getElementById(phoneInputId).value = u.phone_number;
      return;
    }
    const prevRec = SGB.select('accounting_receipts').find(r => (r.student_name || '').toLowerCase() === typed);
    if (prevRec && prevRec.student_reg_no && document.getElementById(regInputId)) {
      document.getElementById(regInputId).value = prevRec.student_reg_no;
    }
  }

  function calcFinanceSummary(startDate = '', endDate = '') {
    const inRange = (dt) => {
      if (!startDate || !endDate) return true;
      const d = (dt || '').slice(0, 10);
      return d >= startDate && d <= endDate;
    };

    const recs = SGB.select('accounting_receipts').filter(r => inRange(r.tx_date || r.created_at));
    const vchs = SGB.select('expense_vouchers').filter(v => v.status === 'Paid' && inRange(v.tx_date || v.created_at));
    const procs = SGB.select('procurement_committee').filter(p => p.status === 'Paid' && inRange(p.meeting_date || p.created_at));
    const pays = SGB.select('staff_payroll').filter(p => p.status === 'Paid' && inRange(p.paid_date || p.created_at));

    const crdbIn = recs.filter(r => r.payment_method === 'CRDB_Bank').reduce((s, r) => s + Number(r.amount_paid), 0);
    const cashIn = recs.filter(r => r.payment_method === 'Cash').reduce((s, r) => s + Number(r.amount_paid), 0);

    const kambiIn = recs.filter(r => (r.source_fund || r.payment_category || '').toLowerCase().includes('kambi')).reduce((s, r) => s + Number(r.amount_paid), 0);
    const hostelIn = recs.filter(r => (r.source_fund || r.payment_category || '').toLowerCase().includes('hostel') || (r.payment_category || '').toLowerCase().includes('bweni')).reduce((s, r) => s + Number(r.amount_paid), 0);
    const kutwaIn = (crdbIn + cashIn) - kambiIn - hostelIn;

    const totalOut = vchs.reduce((s, v) => s + Number(v.amount), 0)
                   + procs.reduce((s, p) => s + Number(p.estimated_budget), 0)
                   + pays.reduce((s, p) => s + Number(p.net_pay), 0);

    return { crdbIn, cashIn, totalIn: crdbIn + cashIn, kambiIn, hostelIn, kutwaIn, totalOut, balance: (crdbIn + cashIn) - totalOut };
  }
  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    updateNames();
    const cfg = SGB.getConfig();
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const sum = calcFinanceSummary();
      const recs = SGB.select('accounting_receipts');
      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>CRDB (${cfg.crdb})</h4><div class="val">TZS ${sum.crdbIn.toLocaleString()}</div></div>
          <div class="card"><h4>Pesa Taslimu (Cash)</h4><div class="val">TZS ${sum.cashIn.toLocaleString()}</div></div>
          <div class="card" style="border-color:#dc2626;"><h4>Matumizi Yaliyolipwa</h4><div class="val">TZS ${sum.totalOut.toLocaleString()}</div></div>
          <div class="card" style="border-color:#1d4ed8;"><h4>Salio Halisi (Net Balance)</h4><div class="val">TZS ${sum.balance.toLocaleString()}</div></div>
        </div>
        <div class="cards">
          <div class="card" style="border-color:#0284c7;"><h4>Pato: Kutwa (Day)</h4><div class="val">TZS ${sum.kutwaIn.toLocaleString()}</div></div>
          <div class="card" style="border-color:#7c3aed;"><h4>Pato: Hostel (Bweni)</h4><div class="val">TZS ${sum.hostelIn.toLocaleString()}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Pato: Kambi ya Masomo</h4><div class="val">TZS ${sum.kambiIn.toLocaleString()}</div></div>
        </div>
        <div class="panel">
          <h3>Miamala ya Mapokezi ya Hivi Karibuni</h3>
          <table><tr><th>Risiti Na.</th><th>Mwanafunzi (Reg No.)</th><th>Michango</th><th>Chanzo</th><th>Njia</th><th>Kiasi (TZS)</th><th>Tarehe</th></tr>
          ${recs.slice(0, 12).map(r => `<tr><td><b>${r.receipt_number}</b></td><td>${r.student_name} <small>(${r.student_reg_no})</small></td><td>${r.payment_category}</td><td>${r.source_fund || 'Kutwa'}</td><td>${r.payment_method}</td><td><b>${Number(r.amount_paid).toLocaleString()}</b></td><td>${r.created_at}</td></tr>`).join('') || '<tr><td colspan="7">Hakuna miamala bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'receipts') {
      const fees = SGB.select('fee_structures');
      area.innerHTML = `
        <div class="panel">
          <h3>Mapokezi ya Ada & Kapu la Michango (Multi-Item Receipt + Auto SMS & WhatsApp)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <div>
              <label style="font-size:11px;font-weight:bold;">Jina la Mwanafunzi (Andika herufi chache):</label>
              <input type="text" id="rName" list="stList" oninput="autoFillStudentReg()" onchange="autoFillStudentReg()" placeholder="Andika jina la mwanafunzi...">
            </div>
            <div>
              <label style="font-size:11px;font-weight:bold;">Namba ya Usajili (Auto-Fill):</label>
              <input type="text" id="rReg" placeholder="Namba ya Usajili (Mfano: S.2026/001)">
            </div>
            <div>
              <label style="font-size:11px;font-weight:bold;">Simu ya Mzazi (Kwa SMS/WhatsApp):</label>
              <input type="text" id="rPhone" placeholder="0755123456">
            </div>
          </div>

          <div style="background:#f8fafc; padding:12px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:12px;">
            <b style="font-size:12px; color:#064e3b;">➕ Ongeza Mchango Kwenye Kapu (Unaweza kuweka zaidi ya mmoja):</b>
            <div style="display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; margin-top:8px;">
              <input type="text" id="itemCat" list="catOpts" placeholder="Chagua/Andika Mchango (Ada, Kambi, Hostel, Chakula...)">
              <datalist id="catOpts">
                <option value="Ada ya Shule (Kutwa)">
                <option value="Ada ya Bweni (Hostel)">
                <option value="Kambi ya Masomo (Academic Camp)">
                <option value="Mchango wa Chakula">
                <option value="Mchango wa Mitihani">
                ${fees.map(f => `<option value="${f.category}">`).join('')}
              </datalist>
              <select id="itemSource">
                <option value="Kutwa">Chanzo: Kutwa</option>
                <option value="Hostel">Chanzo: Hostel</option>
                <option value="Kambi ya Masomo">Chanzo: Kambi ya Masomo</option>
              </select>
              <input type="number" id="itemAmt" placeholder="Kiasi (TZS)">
              <button type="button" class="btn btn-blue" onclick="addToReceiptCart()">➕ Weka Kapuni</button>
            </div>
            <div id="cartTableArea" style="margin-top:10px;"></div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
            <select id="rMethod">
              <option value="CRDB_Bank">CRDB Bank (${cfg.crdb})</option>
              <option value="Cash">Pesa Taslimu (Cash)</option>
            </select>
            <input type="text" id="rRef" placeholder="Namba ya Slip ya CRDB (Au CASH)">
            <input type="date" id="rDate" value="${new Date().toISOString().slice(0, 10)}">
            <button type="button" class="btn btn-green" style="grid-column: span 3; padding:12px;" onclick="finalizeCartReceipt()">💾 Hifadhi Risiti, Chapisha & Tuma SMS/WhatsApp Kwa Mzazi</button>
          </div>
          <div id="receiptBox" style="margin-top:18px;"></div>
        </div>`;
      renderReceiptCart();
    }
    if (tab === 'parent_stmt') {
      const fees = SGB.select('fee_structures');
      const totalAnnualReq = fees.reduce((s, f) => s + Number(f.amount), 0) || 450000;
      const students = SGB.select('users_profile').filter(u => u.role === 'student');
      const allRecs = SGB.select('accounting_receipts');

      area.innerHTML = `
        <div class="panel">
          <h3>1. Taarifa ya Malipo Kwa Mzazi (Mwanafunzi Mmoja Mmoja — A4 PDF, WhatsApp & SMS)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="psName" list="stList" oninput="autoFillStudentReg('psName','psReg','psPhone')" placeholder="Andika jina la mwanafunzi...">
            <input type="text" id="psReg" placeholder="Namba ya Usajili (Auto-Fill)">
            <input type="text" id="psClass" placeholder="Kidato/Mkondo (Mfano: Form 4A)">
            <input type="text" id="psPhone" placeholder="Simu ya Mzazi (07...)">
            <button class="btn btn-green" style="grid-column: span 4; padding:10px;" onclick="buildParentStatement()">📄 Tengeneza Taarifa Rasmi Kwa Mzazi</button>
          </div>
          <div id="parentStmtBox"></div>
        </div>

        <div class="panel">
          <h3>2. Orodha ya Wadaiwa wa Ada & Michango (Fee Defaulters List)</h3>
          <p style="font-size:12px; color:#64748b;">Makadirio ya jumla ya michango ya mwaka kulingana na viwango ulivyoweka: <b>TZS ${totalAnnualReq.toLocaleString()}</b></p>
          <table><tr><th>Mwanafunzi</th><th>Reg No.</th><th>Amelipa (TZS)</th><th>Salio / Deni (TZS)</th><th>Kumbusha Mzazi</th></tr>
          ${students.map(st => {
            const paid = allRecs.filter(r => r.student_name.toLowerCase() === st.full_name.toLowerCase()).reduce((s, r) => s + Number(r.amount_paid), 0);
            const debt = Math.max(0, totalAnnualReq - paid);
            const msg = `SANGABUYE SEC: Mzazi wa ${st.full_name} (${st.reg_or_staff_no||'-'}), mwanao amelipa TZS ${paid.toLocaleString()} na anadaiwa salio la TZS ${debt.toLocaleString()}. Lipa CRDB: 0150838972100.`;
            return `<tr><td><b>${st.full_name}</b></td><td>${st.reg_or_staff_no || '-'}</td><td style="color:#059669;"><b>${paid.toLocaleString()}</b></td><td style="color:${debt>0?'#dc2626':'#059669'};"><b>${debt.toLocaleString()}</b></td>
            <td><button class="btn btn-green" onclick="SGB.sendWhatsApp('${st.phone_number||''}', '${msg}')">💬 WA</button> <button class="btn btn-amber" onclick="SGB.sendSMS('${st.phone_number||''}', '${msg}')">📲 SMS</button></td></tr>`;
          }).join('') || '<tr><td colspan="5">Hakuna wanafunzi waliosajiliwa bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'expenses') {
      area.innerHTML = `
        <div class="panel">
          <h3>1. Andaa Vocha ya Matumizi & Tuma Kwa Mkuu wa Shule Aidhinishe</h3>
          <form onsubmit="submitExpenseVoucher(event)" style="display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="exDesc" required placeholder="Maelezo ya Matumizi (Mfano: Umeme, Posho, Vifaa)">
            <select id="exSource">
              <option value="Kutwa">Chanzo cha Pato: Kutwa</option>
              <option value="Hostel">Chanzo cha Pato: Hostel</option>
              <option value="Kambi ya Masomo">Chanzo cha Pato: Kambi ya Masomo</option>
            </select>
            <select id="exAcc"><option value="CRDB_${cfg.crdb}">CRDB (${cfg.crdb})</option><option value="Cash_Box">Cash Box</option></select>
            <input type="number" id="exAmt" required placeholder="Kiasi (TZS)">
            <input type="date" id="exDate" value="${new Date().toISOString().slice(0, 10)}" required>
            <button type="submit" class="btn btn-amber" style="grid-column: span 3;">📤 Tuma Kwa Mkuu wa Shule Kwa Idhini</button>
          </form>

          <h3>2. Orodha ya Matumizi Yote (Chuja kwa Mwezi, Mwaka, Range au Yote)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-bottom:10px;">
            <select id="expFilterType" onchange="renderExpensesList()">
              <option value="ALL">Matumizi Yote (All)</option>
              <option value="MONTH">Mwezi Huu (This Month)</option>
              <option value="YEAR">Mwaka Huu (This Year)</option>
              <option value="RANGE">Kipindi Maalum (Date Range)</option>
            </select>
            <input type="date" id="expFrom" onchange="renderExpensesList()">
            <input type="date" id="expTo" onchange="renderExpensesList()">
            <button class="btn btn-blue" onclick="printDiv('expPrintArea')">🖨️ Chapisha Matumizi (PDF)</button>
          </div>
          <div id="expPrintArea"></div>
        </div>`;
      renderExpensesList();
    }
    if (tab === 'procurement') {
      const procs = SGB.select('procurement_committee');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Kikao cha Kamati ya Manunuzi (Wajumbe, Mahitaji & Makadirio Kiotomatiki)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px;">
            <input type="text" id="prTitle" placeholder="Kichwa cha Kikao (Mfano: Kikao cha Manunuzi ya Chakula)">
            <input type="date" id="prDate" value="${new Date().toISOString().slice(0, 10)}">
            <select id="prSource">
              <option value="Kutwa">Chanzo cha Pato: Kutwa</option>
              <option value="Hostel">Chanzo cha Pato: Hostel</option>
              <option value="Kambi ya Masomo">Chanzo cha Pato: Kambi ya Masomo</option>
            </select>
          </div>
          <textarea id="prMembers" rows="2" placeholder="Andika Majina ya Wajumbe Waliohudhuria na Nyadhifa zao (Mfano: 1. Juma Ali - Mwenyekiti, 2. Asha Musa - Katibu...)"></textarea>

          <div style="background:#f8fafc; padding:12px; border:1px solid #cbd5e1; border-radius:8px; margin:10px 0;">
            <b style="font-size:12px;">➕ Ongeza Hitaji la Manunuzi (Makadirio ya Bajeti yanajikokotoa yenyewe):</b>
            <div style="display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:8px; margin-top:8px;">
              <input type="text" id="piName" placeholder="Hitaji (Mfano: Maharage, Mchele)">
              <input type="text" id="piUnit" placeholder="Kipimo (Kg / Gunia)">
              <input type="number" id="piQty" placeholder="Idadi / Kiasi">
              <input type="number" id="piPrice" placeholder="Bei ya Kimoja (TZS)">
              <button type="button" class="btn btn-blue" onclick="addProcItemDraft()">➕ Ongeza</button>
            </div>
            <div id="procDraftTable" style="margin-top:8px;"></div>
          </div>
          <button type="button" class="btn btn-green" style="width:100%; padding:11px;" onclick="submitProcurement()">📤 Hifadhi & Tuma Muhtasari Kwa Mkuu wa Shule</button>
        </div>

        <div class="panel">
          <h3>2. Kumbukumbu za Vikao vya Manunuzi (Approve, Reject/Resend & Lipa)</h3>
          <table><tr><th>Kikao & Wajumbe</th><th>Chanzo</th><th>Mahitaji & Hali</th><th>Bajeti (TZS)</th><th>Hali & Hatua</th></tr>
          ${procs.map(p => {
            const itemsHtml = (p.items || []).map(it =>
              `<div style="font-size:11px; border-bottom:1px dashed #cbd5e1; padding:3px 0;">
                • <b>${it.name}</b> (${it.qty} ${it.unit} @ ${Number(it.price).toLocaleString()} = <b>${Number(it.total).toLocaleString()}</b>)
                ${it.approved ? '<span style="color:#059669;font-weight:bold;"> [✅ APPROVED]</span>' : ''}
                ${it.rejected ? `<span style="color:#dc2626;font-weight:bold;"> [❌ Imerejeshwa: ${it.hm_note || 'Rekebisha'}]</span>` : ''}
              </div>`
            ).join('');
            return `<tr>
              <td><b>${p.meeting_title}</b> (${p.meeting_date || p.created_at})<br><small><b>Wajumbe:</b> ${p.members || '-'}</small></td>
              <td><b>${p.source_fund || 'Kutwa'}</b></td>
              <td>${itemsHtml || p.minutes_summary}</td>
              <td><b>${Number(p.estimated_budget).toLocaleString()}</b></td>
              <td>
                <b>${p.status}</b><br><small style="color:#dc2626;">${p.hm_comments || ''}</small><br>
                ${p.status.includes('Rejected') ? `<button class="btn btn-amber" onclick="editAndResendProc(${p.id})">🔄 Rekebisha & Resend</button>` : ''}
                ${p.status === 'Approved' ? `<button class="btn btn-green" onclick="payApprovedProc(${p.id})">💵 Lipa Sasa (Mark Paid)</button>` : ''}
              </td>
            </tr>`;
          }).join('') || '<tr><td colspan="5">Hakuna vikao vya manunuzi bado.</td></tr>'}
          </table>
        </div>`;
      renderProcDraft();
    }

    if (tab === 'payroll') {
      const staff = SGB.select('staff_payroll');
      const approvedCount = staff.filter(s => s.status === 'Pre-Audited & Approved').length;
      area.innerHTML = `
        <div class="panel">

    const qr = SGB.qrImg(`SANGABUYE-PARENT-STMT:${name}|${reg}`);

    const catMap = {};
    fees.forEach(f => {
      catMap[f.category] = { name: f.category, required: Number(f.amount), paid: 0 };
    });
    recs.forEach(r => {
      if (!catMap[r.payment_category]) {
        catMap[r.payment_category] = { name: r.payment_category, required: Number(r.amount_paid), paid: 0 };
      }
      catMap[r.payment_category].paid += Number(r.amount_paid);
    });

    const rows = Object.values(catMap);

      totDebt += debt;
      return `<tr>
        <td>${idx + 1}</td>
        <td><b>${item.name}</b></td>
        <td style="color:#059669;"><b>${item.paid.toLocaleString()}</b></td>
        <td style="color:${debt > 0 ? '#dc2626' : '#059669'};"><b>${debt.toLocaleString()}</b></td>

          <b>TAARIFA ZA MWANAFUNZI:</b><br>

  function addToReceiptCart() {
    const cat = document.getElementById('itemCat').value.trim();
    const src = document.getElementById('itemSource').value;

    if (!cat || !amt || amt <= 0) { alert('⚠️ Weka aina ya mchango na kiasi sahihi.'); return; }

  function renderExpensesList() {

  function editAndResendProc(id) {
    const proc = SGB.select('procurement_committee').find(p => p.id === id);
    if (!proc) return;
    const updatedItems = (proc.items || []).map(it => {
      if (it.rejected) {
        const newPrice = Number(prompt(`Hitaji "${it.name}" lilirejeshwa (${it.hm_note || 'Rekebisha bei'}). Ingiza bei mpya ya kimoja (TZS):`, it.price));
        if (newPrice > 0) return { ...it, price: newPrice, total: it.qty * newPrice, rejected: false, hm_note: '' };
      }
      return it;
    });
    const newTotal = updatedItems.reduce((s, x) => s + x.total, 0);
    SGB.update('procurement_committee', id, { items: updatedItems, estimated_budget: newTotal, status: 'Resent (Imetumwa Upya Kwa Mkuu)' });
    alert('✅ Marekebisho yamehifadhiwa na kutumwa upya kwa Mkuu wa Shule!');
    openTab('procurement');
  }

    document.getElementById('clrResult').innerHTML = `<div class="panel" style="border-left:4px solid ${unreturned.length ? '#dc2626' : '#059669'};">
      <b>Mwanafunzi:</b> ${name} | <b>Jumla Aliyolipa:</b> TZS ${paid.toLocaleString()}<br>
      <b>Maktaba:</b> ${unreturned.length ? `<span style="color:#dc2626;font-weight:bold;">❌ Anadaiwa Kitabu: ${unreturned.map(x => x.book).join(', ')}</span>` : '<span style="color:#059669;">✅ Hana deni la kitabu</span>'}
    </div>`;
  }

  function printDiv(id) {
    const html = document.getElementById(id).innerHTML;
    const w = window.open('', '', 'width=800,height=650');
    w.document.write('<html><head><title>Sangabuye Print</title><style>body{font-family:sans-serif;padding:15px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:7px;font-size:12px;}</style></head><body>' + html + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { w.print(); w.close(); }, 300);
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
</body>
</html>
