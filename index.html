<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sangabuye SIS Portal | Lango Kuu la Kuingia</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: linear-gradient(135deg, #0f294a 0%, #1e3a8a 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 18px; color: #1e293b; }
    .box { background: white; width: 100%; max-width: 440px; border-radius: 16px; padding: 26px; box-shadow: 0 12px 30px rgba(0,0,0,0.28); }
    .header { text-align: center; margin-bottom: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 14px; }
    .header h2 { margin: 0; color: #0f294a; font-size: 18px; }
    .header p { margin: 4px 0 0; font-size: 12px; color: #64748b; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; background: #f1f5f9; color: #475569; }
    .tab-btn.active { background: #1d4ed8; color: white; }
    label { display: block; font-size: 12px; font-weight: bold; margin: 10px 0 4px; color: #334155; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; }
    .submit-btn { width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 16px; }
    .submit-btn:hover { background: #047857; }
    .info-bar { background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px; border-radius: 8px; font-size: 11.5px; color: #1e3a8a; margin-top: 14px; text-align: center; }
    .maint-banner { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
<div class="box">
  <div class="header">
    <h2>SANGABUYE SECONDARY SCHOOL</h2>
    <p>S.L.P 11898, Ilemela - Mwanza | SIS Portal v5.6</p>
  </div>

  <div id="maintNotice"></div>

  <div class="tabs">
    <button class="tab-btn active" id="btnTabLogin" onclick="switchAuthTab('login')">🔐 Ingia (Sign In)</button>
    <button class="tab-btn" id="btnTabReg" onclick="switchAuthTab('register')">📝 Jisajili (Register)</button>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <label>Chagua Nafasi Yako (Select Role):</label>
    <select id="loginRole" required>
      <option value="teacher">Mwalimu (Teacher)</option>
      <option value="student">Mwanafunzi (Student)</option>
      <option value="parent">Mzazi / Mlezi (Parent)</option>
      <option value="accountant">Mhasibu (Accountant - 0615 000 305)</option>
      <option value="academic">Mtaaluma (Academic Master)</option>
      <option value="headmaster">Mkuu wa Shule (Headmaster - 0784 755 173)</option>
      <option value="director">Mkurugenzi (School Director)</option>
      <option value="librarian">Mkutubi (Librarian / Maktaba)</option>
      <option value="matron_patron">Matron / Patron / Zahanati</option>
      <option value="super_admin">IT & Super Admin</option>
    </select>

    <label>Jina Kamili / Namba ya Usajili / Simu:</label>
    <input type="text" id="loginId" required placeholder="Mfano: admin au S.2026/0001">

    <label>Nenosiri (Password):</label>
    <input type="password" id="loginPass" required placeholder="Weka nenosiri lako...">

    <button type="submit" class="submit-btn">🚀 Ingia Kwenye Dashibodi</button>
  </form>

  <form id="regForm" onsubmit="handleRegister(event)" style="display:none;">
    <label>Majina Kamili (Full Name):</label>
    <input type="text" id="regName" required placeholder="Mfano: Asha Juma Kassim">

    <label>Nafasi Unayoomba (Role):</label>
    <select id="regRole" required>
      <option value="student">Mwanafunzi (Student)</option>
      <option value="parent">Mzazi / Mlezi (Parent)</option>
      <option value="teacher">Mwalimu (Teacher)</option>
      <option value="librarian">Mkutubi (Librarian / Maktaba)</option>
      <option value="matron_patron">Matron / Patron / Zahanati</option>
    </select>

    <label>Namba ya Usajili / Namba ya Simu:</label>
    <input type="text" id="regNo" required placeholder="Mfano: S.2026/0045 au 0755123456">

    <label>Tengeneza Nenosiri (Password):</label>
    <input type="password" id="regPass" required placeholder="Weka nenosiri jipya...">

    <button type="submit" class="submit-btn" style="background:#1d4ed8;">📩 Tuma Maombi ya Usajili (OTP)</button>
  </form>

  <div class="info-bar">
    <b>CRDB Bank:</b> SHULE YA SEKONDARI SANGABUYE E.K (<code>0150838972100</code>)<br>
    Msaada wa Haraka: <b>0784 755 173</b> (Mkuu) | <b>0615 000 305</b> (Mhasibu)
  </div>
</div>
<script>
  const roleRedirects = {
    super_admin: 'admin.html',
    director: 'director.html',
    headmaster: 'headmaster.html',
    accountant: 'accountant.html',
    academic: 'academic.html',
    teacher: 'teacher.html',
    parent: 'parent.html',
    student: 'student.html',
    librarian: 'library.html',
    matron_patron: 'matron_patron.html'
  };

  if (localStorage.getItem('sgb_maintenance') === 'true') {
    document.getElementById('maintNotice').innerHTML = `<div class="maint-banner">⚙️ MFUMO UKO KWENYE MATENGENEZO (MAINTENANCE MODE) — Super Admin Pekee Ndiye Anayeweza Kuingia.</div>`;
  }

  function switchAuthTab(mode) {
    document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('regForm').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('btnTabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('btnTabReg').classList.toggle('active', mode === 'register');
  }

  function handleLogin(e) {
    e.preventDefault();
    const lockUntil = Number(localStorage.getItem('sgb_lock_until') || 0);
    if (Date.now() < lockUntil) {
      alert('🔒 Akaunti imefungwa kwa muda kutokana na majaribio mengi yasiyo sahihi. Jaribu tena baada ya dakika chache.');
      return;
    }

    const role = document.getElementById('loginRole').value;
    const idVal = document.getElementById('loginId').value.trim().toLowerCase();
    const pass = document.getElementById('loginPass').value.trim();

    if (localStorage.getItem('sgb_maintenance') === 'true' && role !== 'super_admin') {
      alert('⚙️ Mfumo uko kwenye matengenezo (Maintenance Mode). Tafadhali subiri.');
      return;
    }

    // Akaunti Chaguo-msingi za Uongozi & IT (Default Master Accounts)
    const defaults = [
      { id: 'admin', pass: 'admin123', role: 'super_admin', name: 'IT & Super Admin' },
      { id: 'director', pass: 'director123', role: 'director', name: 'Mkurugenzi wa Shule' },
      { id: '0784755173', pass: 'head123', role: 'headmaster', name: 'Mkuu wa Shule (0784 755 173)' },
      { id: '0615000305', pass: 'acc123', role: 'accountant', name: 'Mhasibu (0615 000 305)' },
      { id: 'academic', pass: 'acad123', role: 'academic', name: 'Mtaaluma (Academic Master)' },
      { id: 'library', pass: 'lib123', role: 'librarian', name: 'Mkutubi (Librarian)' },
      { id: 'matron', pass: 'matron123', role: 'matron_patron', name: 'Matron / Patron & Zahanati' }
    ];

    const defMatch = defaults.find(d => d.role === role && (d.id === idVal || d.name.toLowerCase().includes(idVal)) && d.pass === pass);
    if (defMatch) {
      localStorage.removeItem('sgb_login_fails');
      sessionStorage.setItem('sgb_active_user', JSON.stringify({ full_name: defMatch.name, role: defMatch.role }));
      SGB.logAction(`Ameingia kwenye mfumo (${defMatch.role})`);
      window.location.href = roleRedirects[defMatch.role];
      return;
    }

    // Akaunti Zilizosajiliwa Kwenye Database (users_profile)
    const users = SGB.select('users_profile');
    const found = users.find(u =>
      u.role === role &&
      ((u.full_name || '').toLowerCase() === idVal || (u.reg_or_staff_no || '').toLowerCase() === idVal || (u.phone_number || '').toLowerCase() === idVal) &&
      u.password_hash === pass
    );

    if (found) {
      if (found.status !== 'approved') {
        alert('⏳ Akaunti yako bado inasubiri idhini ya IT & Super Admin.');
        return;
      }
      localStorage.removeItem('sgb_login_fails');
      sessionStorage.setItem('sgb_active_user', JSON.stringify({ full_name: found.full_name, role: found.role }));
      SGB.logAction(`Ameingia kwenye mfumo (${found.role})`);
      window.location.href = roleRedirects[found.role];
      return;
    }

    const fails = Number(localStorage.getItem('sgb_login_fails') || 0) + 1;
    localStorage.setItem('sgb_login_fails', String(fails));
    if (fails >= 5) {
      localStorage.setItem('sgb_lock_until', String(Date.now() + 5 * 60000));
      alert('🔒 Umeingiza taarifa zisizo sahihi mara 5. Mfumo umefungwa kwa dakika 5.');
    } else {
      alert(`❌ Taarifa za kuingia si sahihi (Jaribio ${fails}/5). Hakikisha umechagua Nafasi (Role) sahihi.`);
    }
  }

  function handleRegister(e) {
    e.preventDefault();
    const otp = Math.floor(1000 + Math.random() * 9000);
    const entered = prompt(`Namba yako ya uthibitisho (OTP) ni: ${otp}\nIngiza namba hiyo hapo chini kukamilisha usajili:`);
    if (String(entered).trim() !== String(otp)) {
      alert('❌ Namba ya OTP si sahihi. Usajili umesitishwa.');
      return;
    }
    SGB.insert('users_profile', {
      full_name: document.getElementById('regName').value.trim(),
      role: document.getElementById('regRole').value,
      reg_or_staff_no: document.getElementById('regNo').value.trim(),
      phone_number: document.getElementById('regNo').value.trim(),
      password_hash: document.getElementById('regPass').value.trim(),
      status: 'pending'
    });
    alert('✅ Maombi yako ya usajili yametumwa! IT & Super Admin ataidhinisha akaunti yako hivi punde.');
    switchAuthTab('login');
  }
</script>
</body>
</html>
