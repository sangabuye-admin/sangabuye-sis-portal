<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi | Sangabuye SIS Portal</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 255px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fbbf24; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #cbd5e1; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #e2e8f0; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 17px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { padding: 9px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-green { background: #16a34a; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>SANGABUYE SIS PORTAL</h2>
  <p>S.L.P 11898, Ilemela - Mwanza</p>
  <button class="menu-btn active" onclick="loadModule('admin', this)">🛡️ 1. Super Admin & IT</button>
  <button class="menu-btn" onclick="loadModule('director', this)">📊 2. Mkurugenzi (Director)</button>
  <button class="menu-btn" onclick="loadModule('headmaster', this)">🏫 3. Mkuu wa Shule (0784 755 173)</button>
  <button class="menu-btn" onclick="loadModule('accountant', this)">💰 4. Mhasibu & CRDB (0615 000 305)</button>
  <button class="menu-btn" onclick="loadModule('academic', this)">🎓 5. Mtaaluma & NECTA (ISAL/CAL)</button>
  <button class="menu-btn" onclick="loadModule('teacher', this)">📚 6. Walimu (Alama & Kazi)</button>
  <button class="menu-btn" onclick="loadModule('parent', this)">👨‍👩‍👧 7. Tovuti ya Mzazi</button>
  <button class="menu-btn" onclick="loadModule('student', this)">🎒 8. Tovuti ya Mwanafunzi</button>
  <button class="logout-btn" onclick="window.location.href='index.html'">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="pageTitle">🛡️ 1. Super Admin & IT</strong> <span style="font-size:12px; color:#16a34a;">● Direct Cloud API</span></div>
    <button class="btn btn-blue" onclick="location.reload()">🔄 Refresh</button>
  </div>
  <div class="content" id="mainContent"></div>
</div>
<script>
  const SB_KEY = 'sb_publishable_I5QzeQGfG15VGaYBr7Nj7A_3MDlh7U5';
  const HEADERS = { 'Content-Type': 'application/json' };

  async function sbInsert(table, payload) {
    const res = await fetch(`/api/db?table=${table}`, { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
    const text = await res.text();
    if (!res.ok) throw new Error(text);
    return JSON.parse(text);
  }

  async function sbSelect(table, query = 'select=*&order=id.desc') {
    const res = await fetch(`/api/db?table=${table}&query=${encodeURIComponent(query)}`);
    const text = await res.text();
    if (!res.ok) throw new Error(text);
    return JSON.parse(text);
  }

  async function sbUpdate(table, id, payload) {
    const res = await fetch(`/api/db?table=${table}&query=${encodeURIComponent('id=eq.' + id)}`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify(payload) });
    const text = await res.text();
    if (!res.ok) throw new Error(text);
  }
  async function sbSelect(table, query = 'select=*&order=id.desc') {
    const res = await fetch(`${SB_URL}/${table}?${query}`, { headers: HEADERS });
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || res.statusText); }
    return await res.json();
  }

  async function sbUpdate(table, id, payload) {
    const res = await fetch(`${SB_URL}/${table}?id=eq.${id}`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify(payload) });
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || res.statusText); }
  }

  const modules = {
    admin: `
      <div class="cards">
        <div class="card"><h4>Database</h4><div class="val" style="color:#16a34a;">● Direct Cloud Live</div></div>
        <div class="card"><h4>CRDB Bank</h4><div class="val">0150838972100</div></div>
      </div>
      <div class="panel">
        <h3>Watumiaji Waliojisajili (Approval Queue)</h3>
        <button class="btn btn-blue" onclick="loadUsers()">🔄 Pakia Watumiaji</button>
        <div id="usersTableArea" style="margin-top:12px;">Bofya kitufe hapo juu...</div>
      </div>`,
    director: `
      <div class="cards">
        <div class="card" style="border-color:#16a34a;"><h4>CRDB: SHULE YA SEKONDARI SANGABUYE E.K</h4><div class="val">0150838972100</div></div>
        <div class="card"><h4>Ngazi za Elimu</h4><div class="val">O-Level & A-Level</div></div>
      </div>
      <div class="panel"><h3>Muhtasari wa Mkurugenzi</h3><p>Ufuatiliaji wa mapato ya benki ya CRDB, pesa taslimu (Cash), na matokeo ya mitihani.</p></div>`,
    headmaster: `
      <div class="panel">
        <h3>Ofisi ya Mkuu wa Shule (0784 755 173) — Kamati ya Manunuzi</h3>
        <form onsubmit="saveProcurement(event)" style="display:grid; gap:10px; margin-bottom:15px;">
          <input type="text" id="procTitle" required placeholder="Kichwa cha Kikao / Manunuzi">
          <input type="number" id="procBudget" required placeholder="Makadirio ya Bajeti (TZS)">
          <textarea id="procSummary" rows="2" required placeholder="Muhtasari wa maamuzi ya kamati..."></textarea>
          <button type="submit" class="btn btn-blue">📤 Wasilisha Kwa Mkuu wa Shule</button>
        </form>
        <button class="btn btn-green" onclick="loadProcurements()">🔄 Pakia Maombi ya Manunuzi</button>
        <div id="procListArea" style="margin-top:12px;"></div>
      </div>`,
    accountant: `
      <div class="panel">
        <h3>Rekodi Malipo: SHULE YA SEKONDARI SANGABUYE E.K (CRDB: 0150838972100) & Cash</h3>
        <form onsubmit="saveReceipt(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
          <input type="text" id="stName" required placeholder="Majina Kamili ya Mwanafunzi">
          <input type="text" id="stReg" required placeholder="Namba ya Usajili (Mfano: S.2026/001)">
          <div style="grid-column: span 2;">
            <input type="text" id="payCat" list="mchangoList" required placeholder="Andika Aina ya Mchango (Mfano: Ada, Chakula, Mahafali, Sare...)">
            <datalist id="mchangoList"><option value="Ada ya Shule"><option value="Mchango wa Chakula"><option value="Mchango wa Mitihani"><option value="Ujenzi"></datalist>
          </div>
          <select id="payMethod" required>
            <option value="CRDB_Bank">CRDB Bank (0150838972100)</option>
            <option value="Cash">Pesa Taslimu (Cash - Ofisi ya Mhasibu)</option>
            <option value="In_Kind_Store">Vyakula / Vifaa (Stoo)</option>
          </select>
          <input type="text" id="bankRef" placeholder="Namba ya Slip ya CRDB (Au andika CASH)">
          <input type="number" id="payAmount" required placeholder="Kiasi Kilicholipwa (TZS)" style="grid-column: span 2;">
          <button type="submit" class="btn btn-green" style="grid-column: span 2; padding:12px;">💾 Hifadhi Malipo & Tengeneza Risiti</button>
        </form>
        <div id="receiptPreview" style="margin-top:20px;"></div>
      </div>`,
    academic: `
      <div class="panel">
        <h3>1. Matokeo Yaliyotumwa na Walimu (NECTA Grading)</h3>
        <button class="btn btn-blue" onclick="loadResults()">🔄 Pakia Alama Zote za Wanafunzi</button>
        <button class="btn btn-green" onclick="window.print()">🖨️ Chapisha Master Sheet (PDF)</button>
        <div id="resultsTableArea" style="margin-top:12px;">Bofya kitufe kupakia matokeo...</div>
      </div>
      <div class="panel">
        <h3>2. Upangaji wa Vyumba vya Mitihani (Viti 40) & ISAL/CAL</h3>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <input type="text" id="roomName" placeholder="Jina la Chumba (Mfano: Form 4 Room A)" style="max-width:260px;">
          <button class="btn btn-amber" onclick="generateSeating()">🪑 Zalisha Viti 40 (ISAL/CAL)</button>
        </div>
        <div id="seatingArea"></div>
      </div>`,
    teacher: `
      <div class="panel">
        <h3>Ingiza Alama za Somo (CA 30% + Final 70%)</h3>
        <p style="font-size:12px; color:#475569;">Weka <b>-1</b> kwenye Final kwa mwanafunzi mgonjwa ili apate alama <b>X</b>.</p>
        <form onsubmit="saveMarks(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
          <input type="text" id="mkStudent" required placeholder="Majina Kamili ya Mwanafunzi">
          <input type="text" id="mkSubject" required placeholder="Somo (Mfano: Mathematics, Kiswahili)">
          <input type="number" step="0.1" max="30" id="mkCA" required placeholder="Alama za CA (Kati ya 30)">
          <input type="number" step="0.1" min="-1" max="70" id="mkFinal" required placeholder="Alama za Final (Kati ya 70 au -1)">
          <button type="submit" class="btn btn-green" style="grid-column: span 2; padding:12px;">💾 Hifadhi Alama & Tuma Kwa Mtaaluma</button>
        </form>
        <div id="marksMsg" style="margin-top:12px;"></div>
      </div>`,
    parent: `
      <div class="panel">
        <h3>Tovuti ya Mzazi — Angalia Risiti za Malipo & Matokeo ya Mtoto</h3>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <input type="text" id="searchChildName" placeholder="Andika Jina Kamili la Mwanafunzi..." style="max-width:300px;">
          <button class="btn btn-blue" onclick="searchChildData()">🔍 Tafuta Taarifa</button>
        </div>
        <div id="parentDataArea"></div>
      </div>`,
    student: `<div class="panel"><h3>Tovuti ya Mwanafunzi</h3><p>Karibu Sangabuye SIS Portal! Wasiliana na mwalimu wa somo kupata kazi za nyumbani na mitihani ya majaribio (CBT).</p></div>`
  };
  function calcGrade(total, isAbsent) {
    if (isAbsent) return { grade: 'X', points: 0 };
    if (total >= 75) return { grade: 'A', points: 1 };
    if (total >= 65) return { grade: 'B', points: 2 };
    if (total >= 45) return { grade: 'C', points: 3 };
    if (total >= 30) return { grade: 'D', points: 4 };
    return { grade: 'F', points: 5 };
  }

  async function saveMarks(e) {
    e.preventDefault();
    const msgBox = document.getElementById('marksMsg');
    msgBox.innerHTML = '⏳ Inahifadhi kwenye Supabase Cloud...';
    const student_name = document.getElementById('mkStudent').value.trim();
    const subject_name = document.getElementById('mkSubject').value.trim();
    const ca_score = parseFloat(document.getElementById('mkCA').value);
    const final_raw = parseFloat(document.getElementById('mkFinal').value);
    const isAbsent = final_raw < 0;
    const final_score = isAbsent ? 0 : final_raw;
    const total_score = isAbsent ? 0 : (ca_score + final_score);
    const { grade, points } = calcGrade(total_score, isAbsent);

    try {
      await sbInsert('exam_results', { student_name, subject_name, ca_score, final_score, total_score, grade, points });
      msgBox.innerHTML = `<div style="padding:10px; background:#dcfce7; color:#166534; border-radius:6px;">✅ Alama za <b>${student_name}</b> (${subject_name}) zimehifadhiwa Supabase & kutumwa kwa Mtaaluma! Jumla: <b>${total_score}%</b> | Daraja: <b>${grade}</b></div>`;
      e.target.reset();
    } catch (err) {
      msgBox.innerHTML = `<div style="padding:10px; background:#fee2e2; color:#991b1b; border-radius:6px;">❌ Kosa: ${err.message}</div>`;
    }
  }

  async function loadResults() {
    const area = document.getElementById('resultsTableArea');
    area.innerHTML = '⏳ Inapakia...';
    try {
      const data = await sbSelect('exam_results');
      if (!data.length) { area.innerHTML = 'Hakuna alama zilizoingizwa bado.'; return; }
      let html = '<table><tr><th>Mwanafunzi</th><th>Somo</th><th>CA (30%)</th><th>Final (70%)</th><th>Jumla</th><th>Daraja</th><th>Pointi</th></tr>';
      data.forEach(r => {
        html += `<tr><td><b>${r.student_name || '-'}</b></td><td>${r.subject_name || '-'}</td><td>${r.ca_score}</td><td>${r.final_score}</td><td><b>${r.total_score}%</b></td><td><b>${r.grade}</b></td><td>${r.points}</td></tr>`;
      });
      area.innerHTML = html + '</table>';
    } catch (err) {
      area.innerHTML = '❌ Kosa: ' + err.message;
    }
  }

  function generateSeating() {
    const room = document.getElementById('roomName').value || 'Chumba 01';
    let grid = `<h4>Ramani ya Viti 40 (Safu 5 x 8) & ISAL/CAL — ${room}</h4><div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:6px;">`;
    for (let i = 1; i <= 40; i++) {
      grid += `<div style="border:1px solid #0f294a; padding:6px; border-radius:5px; text-align:center; font-size:11px; background:#f8fafc;"><b>Kiti #${i}</b><br>S.2026/${String(i).padStart(4,'0')}<br>[ISAL]</div>`;
    }
    document.getElementById('seatingArea').innerHTML = grid + '</div>';
  }

  async function saveProcurement(e) {
    e.preventDefault();
    try {
      await sbInsert('procurement_committee', {
        meeting_title: document.getElementById('procTitle').value,
        estimated_budget: document.getElementById('procBudget').value,
        minutes_summary: document.getElementById('procSummary').value,
        status: 'pending'
      });
      alert('✅ Muhtasari umetumwa kwa Mkuu wa Shule!');
      e.target.reset(); loadProcurements();
    } catch (err) { alert('Kosa: ' + err.message); }
  }

  async function loadProcurements() {
    try {
      const data = await sbSelect('procurement_committee');
      let html = '<table><tr><th>Kikao</th><th>Bajeti (TZS)</th><th>Hali</th><th>Maamuzi</th></tr>';
      data.forEach(p => {
        html += `<tr><td><b>${p.meeting_title}</b><br><small>${p.minutes_summary}</small></td><td>${Number(p.estimated_budget).toLocaleString()}</td><td><b>${p.status}</b></td>
        <td><button class="btn btn-green" onclick="decideProc(${p.id}, 'accepted')">Accept</button> <button class="btn btn-red" onclick="decideProc(${p.id}, 'rejected')">Reject</button></td></tr>`;
      });
      document.getElementById('procListArea').innerHTML = html + '</table>';
    } catch (err) { alert(err.message); }
  }

  async function decideProc(id, status) {
    await sbUpdate('procurement_committee', id, { status });
    loadProcurements();
  }

  async function searchChildData() {
    const name = document.getElementById('searchChildName').value.trim();
    const area = document.getElementById('parentDataArea');
    if (!name) return;
    area.innerHTML = '⏳ Inatafuta...';
    try {
      const receipts = await sbSelect('accounting_receipts', `select=*&student_name=ilike.*${encodeURIComponent(name)}*`);
      const marks = await sbSelect('exam_results', `select=*&student_name=ilike.*${encodeURIComponent(name)}*`);
      let html = '<h4>Risiti za Malipo (CRDB 0150838972100 & Cash)</h4>';
      if (receipts.length) {
        html += '<table><tr><th>Risiti Na.</th><th>Mchango</th><th>Njia</th><th>Kiasi (TZS)</th></tr>';
        receipts.forEach(r => html += `<tr><td>${r.receipt_number}</td><td>${r.payment_category}</td><td>${r.payment_method}</td><td><b>${Number(r.amount_paid).toLocaleString()}</b></td></tr>`);
        html += '</table>';
      } else { html += '<p>Hakuna risiti zilizopatikana.</p>'; }
      html += '<h4>Matokeo ya Mitihani</h4>';
      if (marks.length) {
        html += '<table><tr><th>Somo</th><th>Jumla</th><th>Daraja</th></tr>';
        marks.forEach(m => html += `<tr><td>${m.subject_name}</td><td>${m.total_score}%</td><td><b>${m.grade}</b></td></tr>`);
        html += '</table>';
      } else { html += '<p>Hakuna matokeo yaliyopatikana.</p>'; }
      area.innerHTML = html;
    } catch (err) { area.innerHTML = '❌ Kosa: ' + err.message; }
  }

  async function loadUsers() {
    try {
      const data = await sbSelect('users_profile', 'select=*&order=created_at.desc');
      let html = '<table><tr><th>Jina</th><th>Nafasi</th><th>Namba</th><th>Hali</th><th>Hatua</th></tr>';
      data.forEach(u => {
        html += `<tr><td>${u.full_name}</td><td>${u.role}</td><td>${u.reg_or_staff_no || '-'}</td><td><b>${u.status}</b></td>
        <td><button class="btn btn-green" onclick="approveUser('${u.id}')">Approve</button></td></tr>`;
      });
      document.getElementById('usersTableArea').innerHTML = html + '</table>';
    } catch (err) { alert(err.message); }
  }

  async function approveUser(id) {
    await sbUpdate('users_profile', id, { status: 'approved' });
    alert('✅ Akaunti imeidhinishwa!'); loadUsers();
  }

  async function saveReceipt(e) {
    e.preventDefault();
    const receipt_number = 'SGB-' + Math.floor(100000 + Math.random() * 900000);
    const student_name = document.getElementById('stName').value;
    const student_reg_no = document.getElementById('stReg').value;
    const payment_category = document.getElementById('payCat').value;
    const payment_method = document.getElementById('payMethod').value;
    const bank_ref_no = document.getElementById('bankRef').value || 'CASH';
    const amount_paid = document.getElementById('payAmount').value;
    const qr_verification_hash = 'QR-' + Date.now();
    const tarehe = new Date().toLocaleString('sw-TZ');

    try {
      await sbInsert('accounting_receipts', {
        receipt_number, student_name, student_reg_no, payment_category, payment_method, bank_ref_no, amount_paid, qr_verification_hash
      });
      document.getElementById('receiptPreview').innerHTML = `
        <div id="printableReceipt" style="border:2px dashed #0f294a; padding:15px; max-width:300px; background:#fff; font-family:monospace; font-size:12px;">
          <div style="text-align:center;"><b>SANGABUYE SECONDARY SCHOOL</b><br>S.L.P 11898, ILEMELA - MWANZA<br>Simu: 0784 755 173 / 0615 000 305<br>--------------------------------<br><b>RISITI HALALI YA MALIPO</b></div><br>
          <b>Risiti Na:</b> ${receipt_number}<br><b>Tarehe:</b> ${tarehe}<br><b>Mwanafunzi:</b> ${student_name}<br><b>Namba:</b> ${student_reg_no}<br><b>Mchango:</b> ${payment_category}<br><b>Njia:</b> ${payment_method}<br><b>Ref/Slip:</b> ${bank_ref_no}<br><b>Akaunti:</b> SHULE YA SEKONDARI SANGABUYE E.K (0150838972100)<br>--------------------------------<br>
          <div style="font-size:14px;"><b>KIASI: TZS ${Number(amount_paid).toLocaleString()}/=</b></div>--------------------------------<br>
          <div style="text-align:center; font-size:10px;">Uthibitisho: ${qr_verification_hash}<br>Asante kwa kushirikiana nasi!</div>
        </div><br>
        <button class="btn btn-blue" onclick="printThermalReceipt()">🖨️ Chapisha Risiti Sasa (Print / Save PDF)</button>`;
    } catch (err) { alert('Kosa: ' + err.message); }
  }

  function printThermalReceipt() {
    const content = document.getElementById('printableReceipt').innerHTML;
    const w = window.open('', '', 'width=350,height=600');
    w.document.write('<html><head><title>Risiti - Sangabuye SIS</title><style>body{font-family:monospace; font-size:12px; width:280px; margin:10px auto;}</style></head><body>' + content + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { w.print(); w.close(); }, 300);
  }

  function loadModule(key, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pageTitle').innerText = btn.innerText;
    document.getElementById('mainContent').innerHTML = modules[key];
  }
  loadModule('admin', document.querySelector('.menu-btn'));
</script>
</body>
</html>
