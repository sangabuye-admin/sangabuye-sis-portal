<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi | Sangabuye SIS Portal</title>
  <script src="https://jsdelivr.net"></script>
  <script src="supabase-config.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 260px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 20px 15px; }
    .sidebar h2 { font-size: 16px; margin: 0 0 5px; color: #fbbf24; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #cbd5e1; margin: 0 0 20px; }
    .menu-btn { background: transparent; border: none; color: #e2e8f0; text-align: left; padding: 11px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 5px; transition: 0.2s; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 25px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 6px; font-size: 12px; color: #64748b; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-green { background: #16a34a; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>SANGABUYE SIS PORTAL</h2>
  <p>S.L.P 11898, Ilemela - Mwanza</p>
  <button class="menu-btn active" onclick="loadModule('admin', this)">🛡️ 1. Super Admin & IT</button>
  <button class="menu-btn" onclick="loadModule('director', this)">📊 2. Mkurugenzi (Director)</button>
  <button class="menu-btn" onclick="loadModule('headmaster', this)">🏫 3. Mkuu wa Shule (0784 755 173)</button>
  <button class="menu-btn" onclick="loadModule('accountant', this)">💰 4. Mhasibu & CRDB (0615 000 305)</button>
  <button class="menu-btn" onclick="loadModule('academic', this)">🎓 5. Mtaaluma & NECTA (ISAL/CAL)</button>
  <button class="menu-btn" onclick="loadModule('teacher', this)">📚 6. Walimu (Alama & Kazi)</button>
  <button class="menu-btn" onclick="loadModule('parent', this)">👨‍👩‍👧 7. Tovuti ya Mzazi</button>
  <button class="menu-btn" onclick="loadModule('student', this)">🎒 8. Tovuti ya Mwanafunzi</button>
  <button class="logout-btn" onclick="logout()">🚪 Toka Kwenye Mfumo (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="pageTitle">🛡️ 1. Super Admin & IT</strong> <span style="font-size:12px; color:#16a34a;">● Online</span></div>
    <button class="btn btn-blue" onclick="location.reload()">🔄 Refresh</button>
  </div>
  <div class="content" id="mainContent"></div>
</div>
<script>
  const modules = {
    admin: `
      <div class="cards">
        <div class="card"><h4>Hali ya Database</h4><div class="val" style="color:#16a34a;">● Supabase Imeunganishwa</div></div>
        <div class="card"><h4>Akaunti ya CRDB</h4><div class="val">0150838972100</div></div>
      </div>
      <div class="panel">
        <h3>Watumiaji Waliojisajili (Approval Queue)</h3>
        <button class="btn btn-blue" onclick="loadUsers()">🔄 Pakia Watumiaji Kutoka Database</button>
        <div id="usersTableArea" style="margin-top:12px;">Bofya kitufe hapo juu kuona waliojisajili...</div>
      </div>`,
    director: `
      <div class="cards">
        <div class="card" style="border-color:#16a34a;"><h4>CRDB: SHULE YA SEKONDARI SANGABUYE E.K</h4><div class="val">0150838972100</div></div>
        <div class="card"><h4>Hali ya Uendeshaji</h4><div class="val">O-Level & A-Level</div></div>
      </div>
      <div class="panel"><h3>Ripoti Kuu ya Mkurugenzi</h3><p>Muhtasari wa makusanyo ya benki ya CRDB, pesa taslimu (Cash), na maendeleo ya taaluma.</p></div>`,
    headmaster: `
      <div class="panel">
        <h3>Ofisi ya Mkuu wa Shule (0784 755 173)</h3>
        <p>Idhini ya Kikao cha Kamati ya Manunuzi, Vocha za Matumizi, Taarifa za Michango ya Wanafunzi, na Gate Pass.</p>
      </div>`,
    accountant: `
      <div class="panel">
        <h3>Rekodi Malipo: SHULE YA SEKONDARI SANGABUYE E.K (CRDB: 0150838972100) & Cash</h3>
        <form onsubmit="saveReceipt(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
          <input type="text" id="stName" required placeholder="Majina Kamili ya Mwanafunzi">
          <input type="text" id="stReg" required placeholder="Namba ya Usajili (Mfano: S.2026/001)">
          <div style="grid-column: span 2;">
            <input type="text" id="payCat" list="mchangoList" required placeholder="Andika Aina ya Mchango (Mfano: Ada, Chakula, Mahafali, Sare...)">
            <datalist id="mchangoList">
              <option value="Ada ya Shule (School Fees)"><option value="Mchango wa Chakula"><option value="Mchango wa Mitihani"><option value="Ujenzi na Maendeleo">
            </datalist>
          </div>
          <select id="payMethod" required>
            <option value="CRDB_Bank">CRDB Bank (0150838972100)</option>
            <option value="Cash">Pesa Taslimu (Cash - Ofisi ya Mhasibu)</option>
            <option value="In_Kind_Store">Vyakula / Vifaa (Stoo)</option>
          </select>
          <input type="text" id="bankRef" placeholder="Namba ya Slip ya CRDB (Au andika CASH)">
          <input type="number" id="payAmount" required placeholder="Kiasi Kilicholipwa (TZS)" style="grid-column: span 2;">
          <button type="submit" class="btn btn-green" style="grid-column: span 2; padding:12px;">💾 Hifadhi Malipo & Tengeneza Risiti</button>
        </form>
        <div id="receiptPreview" style="margin-top:20px;"></div>
      </div>`,
    academic: `
      <div class="cards">
        <div class="card"><h4>Mfumo wa Alama (Dynamic)</h4><div class="val">CA 30% + Final 70%</div></div>
        <div class="card"><h4>Vyumba vya Mitihani</h4><div class="val">Viti 40 (Safu 5 x 8)</div></div>
        <div class="card"><h4>Fomu za NECTA</h4><div class="val">ISAL & CAL</div></div>
      </div>
      <div class="panel">
        <h3>1. Uchambuzi wa Matokeo & NECTA Division (Kutoka Database)</h3>
        <button class="btn btn-blue" onclick="loadResults()">🔄 Pakia Alama Zote za Wanafunzi</button>
        <button class="btn btn-green" onclick="window.print()">🖨️ Chapisha Master Sheet (PDF)</button>
        <div id="resultsTableArea" style="margin-top:12px;">Bofya kitufe kupakia matokeo...</div>
      </div>
      <div class="panel">
        <h3>2. Upangaji wa Vyumba vya Mitihani (Viti 40) & Fomu za ISAL / CAL</h3>
        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <input type="text" id="roomName" placeholder="Jina la Chumba (Mfano: Form 4 Room A)" style="max-width:280px;">
          <button class="btn btn-amber" onclick="generateSeating()">🪑 Zalisha Mpangilio wa Viti 40 (ISAL/CAL)</button>
        </div>
        <div id="seatingArea"></div>
      </div>`,
    teacher: `
      <div class="panel">
        <h3>Ingiza Alama za Somo (CA 30% + Final 70%)</h3>
        <p style="font-size:12px; color:#475569;">Kumbuka: Kama mwanafunzi alikuwa mgonjwa hakufanya mtihani, weka alama <b>-1</b> ili mfumo umpe alama <b>X</b>.</p>
        <form onsubmit="saveMarks(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
          <input type="text" id="mkStudent" required placeholder="Majina Kamili ya Mwanafunzi">
          <input type="text" id="mkSubject" required placeholder="Somo (Mfano: Mathematics, Kiswahili, Physics)">
          <input type="number" step="0.1" max="30" id="mkCA" required placeholder="Alama za CA (Kati ya 30)">
          <input type="number" step="0.1" min="-1" max="70" id="mkFinal" required placeholder="Alama za Mtihani wa Mwisho (Kati ya 70 au -1 kwa Mgonjwa)">
          <button type="submit" class="btn btn-green" style="grid-column: span 2; padding:12px;">💾 Hifadhi Alama & Tuma Kwa Mtaaluma</button>
        </form>
        <div id="marksMsg" style="margin-top:12px;"></div>
      </div>`,
    parent: `<div class="panel"><h3>Tovuti ya Mzazi</h3><p>Lipa michango kupitia <b>CRDB Bank: SHULE YA SEKONDARI SANGABUYE E.K (0150838972100)</b> au Cash kwa Mhasibu (0615 000 305).</p></div>`,
    student: `<div class="panel"><h3>Tovuti ya Mwanafunzi</h3><p>Pakua kazi za nyumbani, fanya mitihani ya majaribio (CBT), na angalia ratiba yako.</p></div>`
  };
  function calcGrade(total, isAbsent) {
    if (isAbsent) return { grade: 'X', points: 0 };
    if (total >= 75) return { grade: 'A', points: 1 };
    if (total >= 65) return { grade: 'B', points: 2 };
    if (total >= 45) return { grade: 'C', points: 3 };
    if (total >= 30) return { grade: 'D', points: 4 };
    return { grade: 'F', points: 5 };
  }

  async function saveMarks(e) {
    e.preventDefault();
    const student_name = document.getElementById('mkStudent').value;
    const subject_name = document.getElementById('mkSubject').value;
    const ca_score = parseFloat(document.getElementById('mkCA').value);
    const final_raw = parseFloat(document.getElementById('mkFinal').value);
    const isAbsent = final_raw < 0;
    const final_score = isAbsent ? 0 : final_raw;
    const total_score = isAbsent ? 0 : (ca_score + final_score);
    const { grade, points } = calcGrade(total_score, isAbsent);

    const { error } = await db.from('exam_results').insert([{
      student_name, subject_name, ca_score, final_score, total_score, grade, points
    }]);

    if (error) { alert('Hitilafu: ' + error.message); return; }
    document.getElementById('marksMsg').innerHTML = `<div style="padding:10px; background:#dcfce7; color:#166534; border-radius:6px;">✅ Alama za <b>${student_name}</b> (${subject_name}) zimehifadhiwa! Jumla: <b>${total_score}%</b> | Daraja: <b>${grade}</b> (Pointi: ${points})</div>`;
    e.target.reset();
  }

  async function loadResults() {
    const { data, error } = await db.from('exam_results').select('*').order('id', { ascending: false });
    if (error) { alert(error.message); return; }
    let html = '<table><tr><th>Mwanafunzi</th><th>Somo</th><th>CA (30%)</th><th>Final (70%)</th><th>Jumla</th><th>Daraja</th><th>Pointi</th></tr>';
    data.forEach(r => {
      html += `<tr><td><b>${r.student_name || '-'}</b></td><td>${r.subject_name || '-'}</td><td>${r.ca_score}</td><td>${r.final_score}</td><td><b>${r.total_score}%</b></td><td><b>${r.grade}</b></td><td>${r.points}</td></tr>`;
    });
    document.getElementById('resultsTableArea').innerHTML = html + '</table>';
  }

  function generateSeating() {
    const room = document.getElementById('roomName').value || 'Chumba Cha Mtihani 01';
    let grid = `<h4>Ramani ya Viti 40 (Safu 5 x 8) & Fomu ya ISAL/CAL — ${room}</h4><div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:8px;">`;
    for (let i = 1; i <= 40; i++) {
      grid += `<div style="border:1px solid #0f294a; padding:8px; border-radius:6px; text-align:center; font-size:11px; background:#f8fafc;"><b>Kiti #${i}</b><br>S.2026/${String(i).padStart(4,'0')}<br>[Saini ISAL]</div>`;
    }
    document.getElementById('seatingArea').innerHTML = grid + '</div>';
  }

  async function loadUsers() {
    const { data, error } = await db.from('users_profile').select('*').order('created_at', { ascending: false });
    if (error) { alert(error.message); return; }
    let html = '<table><tr><th>Jina</th><th>Nafasi</th><th>Namba</th><th>Hali</th><th>Hatua</th></tr>';
    data.forEach(u => {
      html += `<tr><td>${u.full_name}</td><td>${u.role}</td><td>${u.reg_or_staff_no || '-'}</td><td><b>${u.status}</b></td>
      <td><button class="btn btn-green" onclick="approveUser('${u.id}')">Approve</button></td></tr>`;
    });
    document.getElementById('usersTableArea').innerHTML = html + '</table>';
  }

  async function approveUser(id) {
    await db.from('users_profile').update({ status: 'approved' }).eq('id', id);
    alert('Akaunti imeidhinishwa!'); loadUsers();
  }

  async function saveReceipt(e) {
    e.preventDefault();
    const receipt_number = 'SGB-' + Math.floor(100000 + Math.random() * 900000);
    const student_name = document.getElementById('stName').value;
    const student_reg_no = document.getElementById('stReg').value;
    const payment_category = document.getElementById('payCat').value;
    const payment_method = document.getElementById('payMethod').value;
    const bank_ref_no = document.getElementById('bankRef').value || 'CASH';
    const amount_paid = document.getElementById('payAmount').value;
    const qr_verification_hash = 'QR-' + Date.now();
    const tarehe = new Date().toLocaleString('sw-TZ');

    const { error } = await db.from('accounting_receipts').insert([{
      receipt_number, student_name, student_reg_no, payment_category, payment_method, bank_ref_no, amount_paid, qr_verification_hash
    }]);
    if (error) { alert('Hitilafu: ' + error.message); return; }

    document.getElementById('receiptPreview').innerHTML = `
      <div id="printableReceipt" style="border:2px dashed #0f294a; padding:15px; max-width:300px; background:#fff; font-family:monospace; font-size:12px;">
        <div style="text-align:center;"><b>SANGABUYE SECONDARY SCHOOL</b><br>S.L.P 11898, ILEMELA - MWANZA<br>Simu: 0784 755 173 / 0615 000 305<br>--------------------------------<br><b>RISITI HALALI YA MALIPO</b></div><br>
        <b>Risiti Na:</b> ${receipt_number}<br><b>Tarehe:</b> ${tarehe}<br><b>Mwanafunzi:</b> ${student_name}<br><b>Namba:</b> ${student_reg_no}<br><b>Mchango:</b> ${payment_category}<br><b>Njia:</b> ${payment_method}<br><b>Ref/Slip:</b> ${bank_ref_no}<br><b>Akaunti:</b> SHULE YA SEKONDARI SANGABUYE E.K (0150838972100)<br>--------------------------------<br>
        <div style="font-size:14px;"><b>KIASI: TZS ${Number(amount_paid).toLocaleString()}/=</b></div>--------------------------------<br>
        <div style="text-align:center; font-size:10px;">Uthibitisho: ${qr_verification_hash}<br>Asante kwa kushirikiana nasi!</div>
      </div><br>
      <button class="btn btn-blue" onclick="printThermalReceipt()">🖨️ Chapisha Risiti Sasa (Print / Save PDF)</button>`;
  }

  function printThermalReceipt() {
    const content = document.getElementById('printableReceipt').innerHTML;
    const w = window.open('', '', 'width=350,height=600');
    w.document.write('<html><head><title>Risiti - Sangabuye SIS</title><style>body{font-family:monospace; font-size:12px; width:280px; margin:10px auto;}</style></head><body>' + content + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { w.print(); w.close(); }, 300);
  }

  function loadModule(key, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('pageTitle').innerText = btn.innerText;
    document.getElementById('mainContent').innerHTML = modules[key];
  }
  function logout() { window.location.href = 'index.html'; }
  loadModule('admin', document.querySelector('.menu-btn'));
</script>
</body>
</html>
