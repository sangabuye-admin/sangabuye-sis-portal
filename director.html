<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi ya Mkurugenzi | Sangabuye SIS Portal</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 270px; background: #1e293b; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fbbf24; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #cbd5e1; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #e2e8f0; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #0284c7; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #0284c7; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f172a; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f172a; }
    .btn { padding: 7px 13px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; background: #0284c7; color: white; }
    .btn-green { background: #059669; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>MKURUGENZI (DIRECTOR)</h2>
  <p>Executive Overview | Sangabuye</p>
  <button class="menu-btn active" onclick="openTab('exec', this)">📊 1. Afya ya Fedha, Collection % & Idhini</button>
  <button class="menu-btn" onclick="openTab('acad_hr', this)">🎓 2. NECTA Division, Kambi & Top 5</button>
  <button class="menu-btn" onclick="openTab('board', this)">📁 3. Kumbukumbu za Bodi ya Shule</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>
<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Afya ya Fedha, Collection % & Idhini</strong> <span id="syncTime" style="font-size:11px; color:#0284c7;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['director', 'super_admin']);
  SGB.startSessionTimer();

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'exec') {
      const recs = SGB.select('accounting_receipts');
      const vchs = SGB.select('expense_vouchers');
      const pays = SGB.select('staff_payroll');
      const procs = SGB.select('procurement_committee');
      const stmts = SGB.select('contribution_statements');

      const crdb = recs.filter(r => r.payment_method === 'CRDB_Bank').reduce((s, r) => s + Number(r.amount_paid), 0);
      const cash = recs.filter(r => r.payment_method === 'Cash').reduce((s, r) => s + Number(r.amount_paid), 0);
      const campTotal = recs.filter(r => r.payment_category.toLowerCase().includes('kambi')).reduce((s, r) => s + Number(r.amount_paid), 0);
      const totalIn = crdb + cash;
      const expense = vchs.reduce((s, v) => s + Number(v.amount), 0) + pays.reduce((s, p) => s + Number(p.net_pay), 0);
      const pendingFees = stmts.reduce((s, x) => s + Number(x.balance || 0), 0);
      const expectedTotal = totalIn + pendingFees;
      const collRate = expectedTotal > 0 ? Math.round((totalIn / expectedTotal) * 100) : 100;
      const maxBar = Math.max(totalIn, expense, 1);

      area.innerHTML = `
        <div class="cards">
          <div class="card" style="border-color:#059669;"><h4>Mapato CRDB & Cash</h4><div class="val">TZS ${totalIn.toLocaleString()}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Makusanyo ya Kambi</h4><div class="val">TZS ${campTotal.toLocaleString()}</div></div>
          <div class="card" style="border-color:#dc2626;"><h4>Matumizi & Mishahara</h4><div class="val">TZS ${expense.toLocaleString()}</div></div>
          <div class="card"><h4>Ufanisi wa Makusanyo</h4><div class="val">${collRate}% Collected</div></div>
        </div>
        <div class="panel">
          <h3>Mlinganisho wa Mapato dhidi ya Matumizi (Cashflow Visual)</h3>
          <p style="font-size:12px; margin-bottom:4px;"><b>Mapato (CRDB: ${crdb.toLocaleString()} | Cash: ${cash.toLocaleString()}):</b> TZS ${totalIn.toLocaleString()}</p>
          <div style="background:#e2e8f0; border-radius:6px; height:18px; margin-bottom:10px;"><div style="background:#059669; height:18px; border-radius:6px; width:${Math.round((totalIn/maxBar)*100)}%;"></div></div>
          <p style="font-size:12px; margin-bottom:4px;"><b>Matumizi & Mishahara:</b> TZS ${expense.toLocaleString()}</p>
          <div style="background:#e2e8f0; border-radius:6px; height:18px;"><div style="background:#dc2626; height:18px; border-radius:6px; width:${Math.round((expense/maxBar)*100)}%;"></div></div>
        </div>
        <div class="panel">
          <h3>Kamati ya Manunuzi & Baraka ya Mkurugenzi (Executive Counter-Sign)</h3>
          <table><tr><th>Kikao / Manunuzi</th><th>Bajeti (TZS)</th><th>Hali ya Mkuu wa Shule</th><th>Baraka ya Mkurugenzi</th></tr>
          ${procs.map(p => `<tr><td><b>${p.meeting_title}</b></td><td>${Number(p.estimated_budget).toLocaleString()}</td><td><b>${p.status}</b></td>
          <td>${p.director_sign || `<button class="btn btn-green" onclick="SGB.update('procurement_committee', ${p.id}, {director_sign:'✅ Counter-Signed by Director'}); openTab('exec')">✍️ Counter-Sign</button>`}</td></tr>`).join('') || '<tr><td colspan="4">Hakuna kumbukumbu za manunuzi bado.</td></tr>'}
          </table>
        </div>`;
    }
    if (tab === 'acad_hr') {
      const users = SGB.select('users_profile');
      const maps = SGB.select('student_subjects');
      const marks = SGB.select('exam_results');
      const assets = SGB.select('fixed_assets');
      const stCount = users.filter(u => u.role === 'student').length;
      const trCount = users.filter(u => u.role === 'teacher').length;
      const ratio = trCount > 0 ? `1 : ${Math.round(stCount / trCount)}` : `Wanafunzi ${stCount} / Walimu ${trCount}`;
      const boys = maps.filter(m => m.sex === 'M').length;
      const girls = maps.filter(m => m.sex === 'F').length;

      const bySt = {};
      marks.forEach(m => { if (!bySt[m.student_name]) bySt[m.student_name] = []; if (m.points > 0) bySt[m.student_name].push(Number(m.points)); });
      const divs = { I:0, II:0, III:0, IV:0, O:0 };
      Object.values(bySt).forEach(pts => {
        if (pts.length < 7) return;
        const agg = pts.sort((a,b)=>a-b).slice(0,7).reduce((a,b)=>a+b,0);
        if (agg <= 17) divs.I++; else if (agg <= 21) divs.II++; else if (agg <= 25) divs.III++; else if (agg <= 33) divs.IV++; else divs.O++;
      });

      const top5 = Object.entries(marks.reduce((acc, m) => {
        if (m.grade === 'X') return acc;
        if (!acc[m.student_name]) acc[m.student_name] = [];
        acc[m.student_name].push(Number(m.total_score));
        return acc;
      }, {})).map(([name, arr]) => ({ name, avg: (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) }))
        .sort((a,b) => b.avg - a.avg).slice(0, 5);

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Wanafunzi (O & A-Level)</h4><div class="val">${stCount} (M:${boys} | F:${girls})</div></div>
          <div class="card"><h4>Uwiano Walimu:Wanafunzi</h4><div class="val">${ratio}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Wanafunzi Kwenye Kambi</h4><div class="val">${SGB.select('camp_students').length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Thamani ya Mali (Assets)</h4><div class="val">TZS ${assets.reduce((s,a)=>s+Number(a.val),0).toLocaleString()}</div></div>
        </div>
        <div class="panel">
          <h3>Mwenendo wa Ufaulu wa Shule (NECTA Division I–IV Summary)</h3>
          <table><tr><th>Division I</th><th>Division II</th><th>Division III</th><th>Division IV</th><th>Division 0</th></tr>
          <tr><td><b style="color:#059669;">${divs.I}</b></td><td><b>${divs.II}</b></td><td><b>${divs.III}</b></td><td>${divs.IV}</td><td style="color:#dc2626;">${divs.O}</td></tr>
          </table>
        </div>
        <div class="panel">
          <h3>🏆 Wanafunzi 5 Bora wa Shule (Top 5 Overall Students)</h3>
          <table><tr><th>Nafasi</th><th>Mwanafunzi</th><th>Wastani (%)</th></tr>
          ${top5.map((s, i) => `<tr><td><b>#${i+1}</b></td><td><b>${s.name}</b></td><td><b style="color:#059669;">${s.avg}%</b></td></tr>`).join('') || '<tr><td colspan="3">Hakuna matokeo bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'board') {
      const notes = SGB.select('board_minutes');
      area.innerHTML = `
        <div class="panel">
          <h3>Hifadhi Nyaraka & Muhtasari wa Vikao vya Bodi ya Shule</h3>
          <form onsubmit="addBoard(event)" style="display:grid; gap:10px; margin-bottom:15px;">
            <input type="text" id="bTitle" required placeholder="Kichwa cha Kikao cha Bodi">
            <textarea id="bText" rows="3" required placeholder="Maazimio ya Bodi ya Shule..."></textarea>
            <button type="submit" class="btn">💾 Hifadhi Kumbukumbu za Bodi</button>
          </form>
          <table><tr><th>Kikao</th><th>Maazimio</th><th>Tarehe</th></tr>
          ${notes.map(n => `<tr><td><b>${n.title}</b></td><td>${n.text}</td><td>${n.created_at}</td></tr>`).join('')}
          </table>
        </div>`;
    }
  }

  function addBoard(e) {
    e.preventDefault();
    SGB.insert('board_minutes', { title: document.getElementById('bTitle').value, text: document.getElementById('bText').value });
    openTab('board');
  }

  openTab('exec', document.querySelector('.menu-btn'));
</script>
</body>
</html>
