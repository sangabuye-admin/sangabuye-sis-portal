<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi ya Mwalimu | Sangabuye SIS Portal</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 265px; background: #1e3a8a; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fde68a; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #bfdbfe; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #dbeafe; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #2563eb; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #1e3a8a; }
    .btn { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #059669; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>DASHIBODI YA MWALIMU</h2>
  <p id="teacherBadge">Sangabuye Sec | Staff Portal</p>
  <button class="menu-btn active" onclick="openTab('my_alloc', this)">📋 1. Masomo & Madarasa Yangu</button>
  <button class="menu-btn" onclick="openTab('marks', this)">📝 2. Jedwali la Alama (Darasa Zima)</button>
  <button class="menu-btn" onclick="openTab('private_tests', this)">🗂️ 3. Mitihani Binafsi ya Somo</button>
  <button class="menu-btn" onclick="openTab('assignments', this)">💻 4. Assignments, CBT & Sahihisha</button>
  <button class="menu-btn" onclick="openTab('rollcall', this)">✅ 5. Mahudhurio & Benki ya Maswali</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📋 1. Masomo & Madarasa Yangu</strong> <span id="syncTime" style="font-size:11px; color:#2563eb;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['teacher', 'super_admin']);
  SGB.startSessionTimer();
  const teacherName = user.full_name.replace(' [Via Admin]', '').trim();
  document.getElementById('teacherBadge').innerText = `Mwalimu: ${teacherName}`;

  function getMyAllocations() {
    const all = SGB.select('teacher_allocations');
    if (user.role === 'super_admin') return all;
    return all.filter(a => a.teacher_name.toLowerCase() === teacherName.toLowerCase());
  }

  function calcNecta(ca, finRaw) {
    const isAbsent = finRaw < 0;
    const fin = isAbsent ? 0 : finRaw;
    const tot = isAbsent ? 0 : (ca + fin);
    let grade = 'F', points = 5;
    if (isAbsent) { grade = 'X'; points = 0; }
    else if (tot >= 75) { grade = 'A'; points = 1; }
    else if (tot >= 65) { grade = 'B'; points = 2; }
    else if (tot >= 45) { grade = 'C'; points = 3; }
    else if (tot >= 30) { grade = 'D'; points = 4; }
    return { fin, tot, grade, points };
  }

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');
    const myAllocs = getMyAllocations();

    if (tab === 'my_alloc') {
      area.innerHTML = `
        <div class="panel">
          <h3>Masomo na Madarasa Uliyopangiwa na Ofisi ya Taaluma</h3>
          <table><tr><th>Darasa</th><th>Somo</th><th>Wajibu (Class Teacher?)</th></tr>
          ${myAllocs.map(a => `<tr><td><b>${a.class_name}</b></td><td><b>${a.subject_name}</b></td><td>${a.is_class_teacher}</td></tr>`).join('') || '<tr><td colspan="3">Bado hujapangiwa somo/darasa na Mtaaluma.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'marks') {
      const exams = SGB.select('exams_list');
      const isLocked = exams.some(e => e.status && e.status.includes('Locked'));
      if (isLocked) {
        area.innerHTML = `<div class="panel" style="border-left:4px solid #dc2626;"><h3>🔒 Alama Zimefungwa na Ofisi ya Taaluma (Marks Locked)</h3><p>Huwezi kuingiza au kubadilisha alama kwa sasa.</p></div>`;
        return;
      }
      if (myAllocs.length === 0) {
        area.innerHTML = `<div class="panel">⚠️ Hujapangiwa darasa wala somo lolote na Mtaaluma.</div>`;
        return;
      }
      const savedMarks = SGB.select('exam_results').filter(m => m.teacher === teacherName);
      area.innerHTML = `
        <div class="panel">
          <h3>1. Jedwali la Kuingiza Alama za Darasa Zima (CA 30% + Final 70%)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
            <select id="allocSelect" onchange="buildClassMarksGrid()">
              ${myAllocs.map((a, idx) => `<option value="${idx}">${a.class_name} — ${a.subject_name}</option>`).join('')}
            </select>
            <button class="btn btn-blue" onclick="addExtraStudentRow()">➕ Ongeza Mwanafunzi Kwenye Jedwali</button>
          </div>
          <div id="gridContainer"></div>
        </div>
        <div class="panel">
          <h3>2. Alama Ulizotuma Taaluma (${savedMarks.length})</h3>
          <table><tr><th>Darasa</th><th>Mwanafunzi</th><th>Somo</th><th>CA</th><th>Final</th><th>Jumla</th><th>Daraja</th></tr>
          ${savedMarks.slice(0, 15).map(m => `<tr><td>${m.class_name || '-'}</td><td><b>${m.student_name}</b></td><td>${m.subject_name}</td><td>${m.ca_score}</td><td>${m.final_score}</td><td><b>${m.total_score}%</b></td><td><b>${m.grade}</b></td></tr>`).join('')}
          </table>
        </div>`;
      buildClassMarksGrid();
    }

    if (tab === 'private_tests') {
      const pTests = SGB.select('teacher_private_tests').filter(t => t.teacher === teacherName);
      area.innerHTML = `
        <div class="panel">
          <h3>Majaribio Binafsi ya Somo (Private Subject Tests — Ya Mwalimu Pekee)</h3>
          <form onsubmit="savePrivateTest(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="ptTitle" required placeholder="Jina la Jaribio (Mfano: Weekly Test 01)">
            <input type="text" id="ptSubj" required placeholder="Somo & Darasa">
            <input type="text" id="ptSt" required placeholder="Jina la Mwanafunzi">
            <input type="number" id="ptScore" min="0" max="100" required placeholder="Alama (%)">
            <button type="submit" class="btn btn-green" style="grid-column: span 4;">💾 Hifadhi Kwenye Daftari Langu Binafsi</button>
          </form>
          <table><tr><th>Jaribio</th><th>Somo/Darasa</th><th>Mwanafunzi</th><th>Alama (%)</th><th>Tarehe</th></tr>
          ${pTests.map(t => `<tr><td><b>${t.title}</b></td><td>${t.subject}</td><td>${t.student_name}</td><td><b>${t.score}%</b></td><td>${t.created_at}</td></tr>`).join('')}
          </table>
        </div>`;
    }
    if (tab === 'assignments') {
      const subs = SGB.select('assignment_submissions').filter(s => (s.teacher || '').toLowerCase() === teacherName.toLowerCase());
      area.innerHTML = `
        <div class="panel">
          <h3>1. Tunga Kazi ya Nyumbani au Jaribio la Mtandaoni (Online CBT yenye Saa)</h3>
          <form onsubmit="saveCBT(event)" style="display:grid; gap:10px;">
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
              <select id="cbtType"><option value="WRITTEN">Kazi ya Kuandika (Written Assignment)</option><option value="MCQ">Jaribio la Kuchagua (Online CBT - A, B, C, D)</option></select>
              <input type="text" id="cbtSub" required placeholder="Somo & Darasa (Mfano: Biology Form 2A)">
              <input type="number" id="cbtMins" value="15" required placeholder="Muda wa Mtihani (Dakika)">
            </div>
            <input type="text" id="cbtTitle" required placeholder="Kichwa cha Kazi / Jaribio">
            <textarea id="cbtQ" rows="3" required placeholder="Andika swali au maelekezo ya kazi hapa..."></textarea>
            <input type="text" id="cbtOpt" placeholder="Kwa CBT pekee: A) ... B) ... C) ... D) ...">
            <input type="text" id="cbtAns" placeholder="Kwa CBT pekee: Herufi ya Jibu Sahihi (A, B, C au D)">
            <button type="submit" class="btn btn-green">📤 Tuma Kazi / Jaribio Kwa Wanafunzi</button>
          </form>
        </div>
        <div class="panel">
          <h3>2. Majibu ya Wanafunzi (Sahihisha Written & Tazama CBT Auto-Graded)</h3>
          <table><tr><th>Mwanafunzi</th><th>Kazi</th><th>Jibu la Mwanafunzi</th><th>Alama</th><th>Hatua</th></tr>
          ${subs.map(s => `<tr><td><b>${s.student_name}</b></td><td>${s.title}</td><td>${s.answer_text}</td><td><b>${s.score}</b></td>
          <td><button class="btn btn-amber" onclick="gradeSub(${s.id})">✅ Weka / Badili Alama</button></td></tr>`).join('') || '<tr><td colspan="5">Hakuna kazi zilizowasilishwa bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'rollcall') {
      const logs = SGB.select('rollcall_logs').filter(r => r.teacher === teacherName);
      area.innerHTML = `
        <div class="panel">
          <h3>Mahudhurio Darasani (Digital Roll Call + WhatsApp Alert)</h3>
          <form onsubmit="saveRoll(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="rlName" required placeholder="Jina la Mwanafunzi">
            <select id="rlStat"><option value="Yupo (Present)">Yupo (Present)</option><option value="Hayupo (Absent)">Hayupo (Absent)</option><option value="Amechelewa (Late)">Amechelewa (Late)</option></select>
            <button type="submit" class="btn btn-blue">✅ Hifadhi Mahudhurio</button>
          </form>
          <table><tr><th>Mwanafunzi</th><th>Hali</th><th>Muda</th></tr>
          ${logs.map(l => `<tr><td><b>${l.student_name}</b></td><td>${l.status}</td><td>${l.created_at}</td></tr>`).join('')}
          </table>
        </div>`;
    }
  }
  function buildClassMarksGrid() {
    const myAllocs = getMyAllocations();
    const idx = document.getElementById('allocSelect').value;
    const chosen = myAllocs[idx];
    const students = SGB.select('users_profile').filter(u => u.role === 'student');
    const rows = students.length > 0 ? students.map(s => s.full_name) : ['Amina Hassan Mwita', 'Baraka John Maganga'];

    document.getElementById('gridContainer').innerHTML = `
      <form onsubmit="submitBulkGrid(event, '${chosen.class_name}', '${chosen.subject_name}')">
        <table id="marksGridTable">
          <tr><th>#</th><th>Jina la Mwanafunzi</th><th>CA (0–30)</th><th>Final (0–70 au -1=ABS)</th></tr>
          ${rows.map((st, i) => `<tr>
            <td>${i + 1}</td>
            <td><input type="text" class="g-name" value="${st}" required></td>
            <td><input type="number" class="g-ca" min="0" max="30" placeholder="0-30"></td>
            <td><input type="number" class="g-fin" min="-1" max="70" placeholder="0-70 (-1=ABS)"></td>
          </tr>`).join('')}
        </table><br>
        <button type="submit" class="btn btn-green" style="padding:11px 18px;">💾 Hifadhi & Tuma Alama za Darasa Zima Taaluma</button>
      </form>`;
  }

  function addExtraStudentRow() {
    const tbody = document.querySelector('#marksGridTable tbody');
    const count = tbody.rows.length;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${count}</td><td><input type="text" class="g-name" placeholder="Jina la Mwanafunzi" required></td><td><input type="number" class="g-ca" min="0" max="30"></td><td><input type="number" class="g-fin" min="-1" max="70"></td>`;
    tbody.appendChild(tr);
  }

  function submitBulkGrid(e, cls, subj) {
    e.preventDefault();
    const names = document.querySelectorAll('.g-name');
    const cas = document.querySelectorAll('.g-ca');
    const fins = document.querySelectorAll('.g-fin');
    let saved = 0;

    names.forEach((inp, i) => {
      const st = inp.value.trim();
      const caVal = cas[i].value;
      const finVal = fins[i].value;
      if (st && (caVal !== '' || finVal !== '')) {
        const res = calcNecta(Number(caVal || 0), Number(finVal || 0));
        SGB.insert('exam_results', { teacher: teacherName, class_name: cls, subject_name: subj, student_name: st, ca_score: Number(caVal || 0), final_score: res.fin, total_score: res.tot, grade: res.grade, points: res.points });
        saved++;
      }
    });
    alert(`✅ Alama za wanafunzi ${saved} (${cls} - ${subj}) zimetumwa Ofisi ya Taaluma!`);
    openTab('marks');
  }

  function savePrivateTest(e) {
    e.preventDefault();
    SGB.insert('teacher_private_tests', { teacher: teacherName, title: document.getElementById('ptTitle').value, subject: document.getElementById('ptSubj').value, student_name: document.getElementById('ptSt').value, score: document.getElementById('ptScore').value });
    openTab('private_tests');
  }

  function saveCBT(e) {
    e.preventDefault();
    const type = document.getElementById('cbtType').value;
    const mins = Number(document.getElementById('cbtMins').value || 15);
    const ans = document.getElementById('cbtAns').value.trim().toUpperCase();
    if (type === 'MCQ' && !['A', 'B', 'C', 'D'].includes(ans)) {
      alert('⚠️ Kwa Jaribio la Kuchagua (MCQ), weka herufi A, B, C au D.'); return;
    }
    SGB.insert('assignments_cbt', { teacher: teacherName, type, duration_mins: mins, sub: document.getElementById('cbtSub').value, title: document.getElementById('cbtTitle').value, question: document.getElementById('cbtQ').value, options: document.getElementById('cbtOpt').value, answer: ans });
    alert(`✅ Kazi / Jaribio (Muda: Dakika ${mins}) limetumwa kwa wanafunzi!`);
    openTab('assignments');
  }

  function gradeSub(id) {
    const sc = prompt('Weka alama na maoni kwa mwanafunzi (Mfano: 85% - Vizuri sana):');
    if (sc) { SGB.update('assignment_submissions', id, { score: sc }); openTab('assignments'); }
  }

  function saveRoll(e) {
    e.preventDefault();
    const st = document.getElementById('rlName').value;
    const stat = document.getElementById('rlStat').value;
    SGB.insert('rollcall_logs', { teacher: teacherName, student_name: st, status: stat });
    if (stat.includes('Absent')) {
      const msg = `SANGABUYE SEC: Mzazi wa ${st}, mwanao hajahudhuria kipindi cha ${teacherName} leo (${new Date().toLocaleDateString('sw-TZ')}). Tafadhali wasiliana na shule.`;
      if (confirm(`⚠️ ${st} hayupo darasani! Je, ungependa kumtumia mzazi taarifa kupitia WhatsApp sasa hivi?`)) {
        SGB.sendWhatsApp('', msg);
      }
    }
    openTab('rollcall');
  }

  openTab('my_alloc', document.querySelector('.menu-btn'));
</script>
</body>
</html>
