<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi ya Mwalimu (Teacher Portal v13.0 — Form 1-6) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <script src="https://sheetjs.com"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; overflow-x: hidden; }
    .sidebar { width: 255px; flex-shrink: 0; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; transition: all 0.25s ease; }
    .sidebar.collapsed { width: 0; padding: 0; overflow: hidden; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6.5px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; margin-bottom: 2px; }
    .menu-btn:hover, .menu-btn.active { background: #0284c7; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-x: hidden; }
    .topbar { background: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 16px; min-width: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #0284c7; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; overflow-x: auto; max-width: 100%; }
    .form-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .form-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; min-width: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    #tcMenuToggle { background: #0f294a; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .marquee-wrap { overflow: hidden; white-space: nowrap; padding: 8px 14px; font-size: 12.5px; font-weight: 600; border-bottom: 2px solid #bae6fd; }
    .marquee-text { display: inline-block; padding-left: 100%; animation: scrollBanner 22s linear infinite; }
    @keyframes scrollBanner { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    @media (max-width: 900px) {
      .sidebar { position: fixed; left: -270px; top: 0; bottom: 0; z-index: 9999; width: 255px; padding: 12px 10px; box-shadow: 4px 0 18px rgba(0,0,0,0.35); }
      .sidebar.open { left: 0; }
      .sidebar.collapsed { left: -270px; width: 255px; padding: 12px 10px; }
      #viewArea form { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
<div class="sidebar" id="tcSidebar">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
    <h2 style="flex:1;">DASHIBODI YA MWALIMU</h2>
    <button type="button" onclick="toggleTeacherSidebar()" style="background:transparent;border:none;color:#94a3b8;font-size:16px;cursor:pointer;">✖</button>
  </div>
  <p id="tcSideName">Teacher Portal | Form 1–6</p>

  <div class="grp-lbl">A. Taaluma & Alama</div>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari & Graphs</button>
  <button class="menu-btn" onclick="openTab('score_entry', this)">✍️ 2. Jaza, Excel (.xlsx) & Score Sheet</button>
  <button class="menu-btn" onclick="openTab('subj_analytics', this)">📈 3. Uchambuzi wa Somo (A–F)</button>
  <button class="menu-btn" onclick="openTab('remedial', this)">🆘 4. Wanafunzi wa Remedial (D/F)</button>

  <div class="grp-lbl">B. Darasa, Mahudhurio & Zamu</div>
  <button class="menu-btn" onclick="openTab('attendance', this)">📋 5. Mahudhurio (Roll Call)</button>
  <button class="menu-btn" onclick="openTab('homework', this)">📝 6. Mazoezi (PDF) & Sahihisha</button>
  <button class="menu-btn" onclick="openTab('discipline', this)">⚖️ 7. Nidhamu & Maoni ya Darasa</button>
  <button class="menu-btn" onclick="openTab('tod_duty', this)">🛡️ 8. Ripoti ya Mwalimu wa Zamu</button>

  <div class="grp-lbl">C. Maandalio, Ratiba & Fedha</div>
  <button class="menu-btn" onclick="openTab('schemes', this)">📑 9. Schemes, Lesson Plans & Silabasi</button>
  <button class="menu-btn" onclick="openTab('timetable_lib', this)">📅 10. Ratiba Yangu & Maktaba</button>
  <button class="menu-btn" onclick="openTab('leave_swap', this)">🏖️ 11. Omba Ruhusa / Badili Kipindi</button>
  <button class="menu-btn" onclick="openTab('payroll_imprest', this)">💼 12. Salary Slip & Masurufu</button>
  <button class="menu-btn" onclick="openTab('ca_tracker', this)">🧪 13. Mazoezi Endelevu (CA / Tests)</button>
  <button class="menu-btn" onclick="openTab('tc_messages', this)">💬 14. Ujumbe (Mkuu/Mtaaluma/Mhasibu)</button>
</div>

<div class="main">
  <div id="deadlineBannerBox"></div>
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" id="tcMenuToggle" onclick="toggleTeacherSidebar()" title="Fungua/Funga Menyu">☰</button>
      <strong id="tabTitle">📊 1. Muhtasari & Graphs</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex:1; max-width:440px; min-width:200px;">
      <input type="text" id="globalTcSearch" onkeyup="filterTeacherTables(this.value)" placeholder="🔍 Tafuta jina, kidato, somo...">
      <button type="button" class="btn btn-blue" style="white-space:nowrap;" onclick="refreshTeacherNow()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['teacher', 'academic', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();

  const myTeacherName = user ? (user.full_name || user.username || 'Mwalimu') : 'Mwalimu';
  if (document.getElementById('tcSideName')) document.getElementById('tcSideName').innerText = myTeacherName;
  let currentTcTab = 'overview';

  function toggleTeacherSidebar() {
    const sb = document.getElementById('tcSidebar');
    if (!sb) return;
    if (window.innerWidth <= 900) sb.classList.toggle('open');
    else sb.classList.toggle('collapsed');
  }

  function saveTableClean(table, arr) {
    if (SGB.forceReplaceCloud) SGB.forceReplaceCloud(table, arr);
    else { localStorage.setItem('sgb_' + table, JSON.stringify(arr)); SGB.pushToCloud(table); }
  }

  function isWindowOpenForMe() {
    const cfg = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"unlocked_teachers":[]}');
    if (cfg.open) return true;
    const unlocked = Array.isArray(cfg.unlocked_teachers) ? cfg.unlocked_teachers : new Array();
    const myLow = myTeacherName.trim().toLowerCase();
    return unlocked.some(t => String(t || '').trim().toLowerCase() === myLow);
  }

  function renderTeacherDeadlineBanner() {
    const box = document.getElementById('deadlineBannerBox');
    if (!box) return;
    const cfg = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"active_exam":"Terminal","deadline":"","unlocked_teachers":[]}');
    const examName = cfg.active_exam || 'Terminal';
    const dlText = cfg.deadline ? ` | Mwisho wa Kutuma Score Sheet: ${cfg.deadline.replace('T', ' ')}` : '';
    const openForMe = isWindowOpenForMe();

    if (openForMe) {
      const specialNote = !cfg.open ? ' (🔓 UMEFUNGULIWA KWA IDHINI MAALUM YA MTAALUMA)' : '';
      box.innerHTML = `<div class="marquee-wrap" style="background:#e0f2fe; color:#0f294a; border-bottom:2px solid #0284c7;">
        <div class="marquee-text">📢 TANGAZO LA OFISI YA MTAALUMA: Dirisha la kuingiza alama za mtihani wa <span style="color:#0369a1; font-weight:bold;">"${examName.toUpperCase()}"</span> LIKO WAZI${dlText}${specialNote}.</div>
      </div>`;
    } else {
      box.innerHTML = `<div class="marquee-wrap" style="background:#fee2e2; color:#7f1d1d; border-bottom:2px solid #ef4444;">
        <div class="marquee-text">🔒 TANGAZO LA OFISI YA MTAALUMA: Dirisha la kuingiza alama za "${examName.toUpperCase()}" LIMEFUNGWA. Unaweza kuomba Mtaaluma akufungulie wewe peke yako kwenye Kichupo cha 2!</div>
      </div>`;
    }
  }
  function getAcadContactPhone() {
    return localStorage.getItem('sgb_academic_master_phone') || '0763061124';
  }

  function getExamTypesList() {
    const saved = JSON.parse(localStorage.getItem('sgb_exam_types') || 'null');
    if (saved && saved.length) return saved;
    return ['Midterm March', 'Terminal', 'Midterm September', 'Annual', 'Mock / Pre-NECTA'];
  }

  function examOptionsHtml(selected = '') {
    return getExamTypesList().map(ex => `<option value="${ex}" ${ex === selected ? 'selected' : ''}>${ex}</option>`).join('');
  }

  function normClass(str) {
    return String(str || '').toLowerCase()
      .replace(/kidato cha kwanza|kwanza/g, '1')
      .replace(/kidato cha pili|pili/g, '2')
      .replace(/kidato cha tatu|tatu/g, '3')
      .replace(/kidato cha nne|nne/g, '4')
      .replace(/kidato cha tano|tano/g, '5')
      .replace(/kidato cha sita|sita/g, '6')
      .replace(/form|kidato|cha|stream|mkondo/g, '')
      .replace(/\bvi\b/g, '6').replace(/\bv\b/g, '5').replace(/\biv\b/g, '4')
      .replace(/\biii\b/g, '3').replace(/\bii\b/g, '2').replace(/\bi\b/g, '1')
      .replace(/[^a-z0-9]/g, '');
  }

  function isALevelClass(cls) {
    const n = normClass(cls);
    return n.startsWith('5') || n.startsWith('6');
  }

  function gradeFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 'A'; if (s >= 70) return 'B'; if (s >= 60) return 'C';
      if (s >= 50) return 'D'; if (s >= 40) return 'E'; if (s >= 35) return 'S';
      return 'F';
    }
    if (s >= 75) return 'A'; if (s >= 65) return 'B'; if (s >= 45) return 'C';
    if (s >= 30) return 'D'; return 'F';
  }
  function getMyAllocations() {
    const tName = myTeacherName.toLowerCase().trim();
    const uName = (user?.username || '').toLowerCase().trim();
    return SGB.select('subject_allocations').filter(a => {
      const allocT = (a.teacher_name || '').toLowerCase().trim();
      return allocT && (allocT === tName || allocT === uName || allocT.includes(tName) || tName.includes(allocT));
    });
  }

  function getMyResults() {
    const myAllocs = getMyAllocations();
    const all = SGB.select('exam_results');
    const tName = myTeacherName.toLowerCase().trim();
    return all.filter(r => {
      const byMe = (r.teacher_name || '').toLowerCase().trim() === tName;
      const inMyAlloc = myAllocs.some(a =>
        normClass(a.class_name) === normClass(r.class_name) &&
        (a.subject || '').toLowerCase() === (r.subject || '').toLowerCase()
      );
      return byMe || inMyAlloc;
    });
  }

  function getAllUnifiedStudents() {
    const map = {};
    SGB.select('academic_students').forEach(s => {
      const k = (s.full_name || '').trim().toLowerCase();
      if (k) map[k] = { full_name: s.full_name.trim(), gender: (s.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: s.class_name || '', prem_no: s.prem_no || '-', parent_phone: s.parent_phone || '' };
    });
    SGB.select('users_profile').filter(u => (u.role || '').toLowerCase() === 'student').forEach(u => {
      const k = (u.full_name || '').trim().toLowerCase();
      if (k && !map[k]) {
        map[k] = { full_name: u.full_name.trim(), gender: (u.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: u.class_name || u.department || '', prem_no: u.username || '-', parent_phone: u.phone || '' };
      }
    });
    return Object.values(map);
  }

  function getMyAssignedStudents() {
    const myNormClasses = Array.from(new Set(getMyAllocations().map(a => normClass(a.class_name)).filter(Boolean)));
    if (!myNormClasses.length) return new Array();
    return getAllUnifiedStudents().filter(s => myNormClasses.includes(normClass(s.class_name)));
  }

  function formToolsHtml(placeholder = '🔍 Tafuta kwenye fomu hii...') {
    return `<div class="form-tools">
      <input type="text" onkeyup="filterTeacherTables(this.value)" placeholder="${placeholder}" style="width:200px;">
      <button type="button" class="btn btn-blue" onclick="refreshTeacherNow()">🔄 Refresh</button>
    </div>`;
  }
  function openTab(tab, btn) {
    currentTcTab = tab;
    document.getElementById('tcSidebar')?.classList.remove('open');
    renderTeacherDeadlineBanner();
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const displayAllocs = getMyAllocations();
      const examWin = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"active_exam":"Terminal"}');
      const openForMe = isWindowOpenForMe();
      const myRes = getMyResults();
      const returnedCount = myRes.filter(r => r.verified_status === 'Returned').length;
      const editedByAcad = myRes.filter(r => r.edited_by_academic).length;
      const myAvg = myRes.length ? (myRes.reduce((s, r) => s + Number(r.score || 0), 0) / myRes.length).toFixed(1) : '0.0';

      const grades = { A: 0, B: 0, C: 0, D: 0, E: 0, S: 0, F: 0 };
      myRes.forEach(r => {
        const g = r.grade || gradeFromScore(r.score, isALevelClass(r.class_name));
        if (grades[g] !== undefined) grades[g]++;
      });
      const maxG = Math.max(1, ...Object.values(grades));

      const byGroup = {};
      myRes.forEach(r => {
        const k = `${r.class_name || '-'} (${r.subject || '-'})`;
        if (!byGroup[k]) byGroup[k] = { label: k, sum: 0, count: 0 };
        byGroup[k].sum += Number(r.score || 0); byGroup[k].count++;
      });
      const groupBars = Object.values(byGroup).map(x => ({ label: x.label, avg: Number((x.sum / x.count).toFixed(1)) }));

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Masomo & Madarasa Yangu</h4><div class="val">${displayAllocs.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Wastani wa Masomo Yangu</h4><div class="val">${myAvg}%</div></div>
          <div class="card" style="border-color:${openForMe ? '#059669' : '#dc2626'};"><h4>Dirisha (${examWin.active_exam})</h4><div class="val">${openForMe ? '🟢 Wazi' : '🔒 Limefungwa'}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Marekebisho / Zilizorudishwa</h4><div class="val">${editedByAcad} / ${returnedCount}</div></div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:14px; margin-bottom:16px;">
          <div class="panel" style="margin-bottom:0;">
            <h3 style="margin-top:0;">📊 Grafu ya Mgawanyo wa Madaraja (A–F)</h3>
            ${Object.entries(grades).map(([g, cnt]) => {
              const pct = Math.round((cnt / maxG) * 100);
              const col = g === 'A' ? '#059669' : g === 'B' ? '#0284c7' : g === 'C' ? '#2563eb' : g === 'D' ? '#d97706' : '#dc2626';
              return `<div style="margin-bottom:7px;">
                <div style="display:flex; justify-content:space-between; font-size:12px;"><b>Daraja ${g}</b><span>${cnt} wanafunzi</span></div>
                <div style="background:#e2e8f0; height:12px; border-radius:6px; overflow:hidden;"><div style="width:${pct}%; background:${col}; height:100%;"></div></div>
              </div>`;
            }).join('')}
          </div>

          <div class="panel" style="margin-bottom:0;">
            <h3 style="margin-top:0;">📈 Ulinganisho wa Wastani Kwa Kidato & Somo</h3>
            ${groupBars.length ? groupBars.map(b => `<div style="margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between; font-size:12px;"><b>${b.label}</b><span><b>${b.avg}%</b></span></div>
              <div style="background:#e2e8f0; height:14px; border-radius:6px; overflow:hidden;"><div style="width:${Math.min(100, b.avg)}%; background:#1d4ed8; height:100%;"></div></div>
            </div>`).join('') : '<p style="color:#64748b; font-size:12px;">Ingiza alama za wanafunzi ili grafu ya madarasa ichoreke.</p>'}
          </div>
        </div>

        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">📚 Masomo na Madarasa Niliyopangiwa na Mtaaluma</h3>
            ${formToolsHtml('🔍 Tafuta somo au kidato...')}
          </div>
          <table><thead><tr><th>Kidato / Mkondo</th><th>Somo</th><th>Vipindi/Wiki</th><th>Hatua ya Haraka</th></tr></thead><tbody>
          ${displayAllocs.map(a => `<tr><td><b>${a.class_name}</b></td><td><b>${a.subject}</b></td><td>${a.periods_per_week}</td><td><button type="button" class="btn btn-green" onclick="openTab('score_entry')">✍️ Jaza / Pakua Excel (.xlsx)</button></td></tr>`).join('') || '<tr><td colspan="4">Mtaaluma bado hajakupangia somo/darasa lolote.</td></tr>'}
          </tbody></table>
        </div>`;
      applyTcSearch();
      return;
    }
    if (tab === 'score_entry') {
      const myAllocs = getMyAllocations();
      const examWin = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"active_exam":"Terminal"}');
      const autoTrigger = myAllocs.length === 1;

      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">✍️ Jaza Alama, Pakua/Pakia Excel (.xlsx) & Tuma Score Sheet</h3>
            ${formToolsHtml('🔍 Tafuta mwanafunzi kwenye grid...')}
          </div>
          ${myAllocs.length === 0 ? '<p style="color:#d97706; font-weight:bold;">⚠️ Mtaaluma bado hajakupangia somo/darasa lolote. Wasiliana na Ofisi ya Mtaaluma akupangie.</p>' : `
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px; margin-bottom:12px;">
            <select id="tcAllocPick" onchange="loadTeacherScoreGrid()">
              ${myAllocs.length > 1 ? '<option value="">-- Chagua Kidato & Somo Lako --</option>' : ''}
              ${myAllocs.map(a => `<option value="${a.class_name}|${a.subject}">${a.class_name} — ${a.subject}</option>`).join('')}
            </select>
            <select id="tcExamType" onchange="loadTeacherScoreGrid()">${examOptionsHtml(examWin.active_exam || 'Terminal')}</select>
            <button type="button" class="btn btn-blue" onclick="loadTeacherScoreGrid()">📋 Fungua Orodha</button>
          </div>
          <div id="tcGridArea"></div>`}
        </div>`;
      if (autoTrigger) setTimeout(loadTeacherScoreGrid, 50);
      return;
    }
    if (tab === 'subj_analytics') {
      const myRes = getMyResults();
      const bySubjClass = {};
      myRes.forEach(r => {
        const key = `${r.class_name}|${r.subject}`;
        if (!bySubjClass[key]) bySubjClass[key] = { cls: r.class_name, subj: r.subject, count: 0, sum: 0, A: 0, B: 0, C: 0, D: 0, E: 0, S: 0, F: 0 };
        const sc = Number(r.score || 0);
        const g = r.grade || gradeFromScore(sc, isALevelClass(r.class_name));
        bySubjClass[key].count++; bySubjClass[key].sum += sc;
        if (bySubjClass[key][g] !== undefined) bySubjClass[key][g]++;
      });
      const stats = Object.values(bySubjClass);

      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">📈 Uchambuzi wa Ufaulu wa Somo Langu (O-Level & A-Level)</h3>
            ${formToolsHtml('🔍 Tafuta kidato au somo...')}
          </div>
          <table><thead><tr><th>Kidato</th><th>Somo</th><th>Watahiniwa</th><th>Wastani (%)</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>S</th><th>F</th></tr></thead><tbody>
          ${stats.map(x => `<tr><td><b>${x.cls}</b></td><td><b>${x.subj}</b></td><td>${x.count}</td><td><b>${(x.sum / x.count).toFixed(1)}%</b></td><td>${x.A}</td><td>${x.B}</td><td>${x.C}</td><td>${x.D}</td><td>${x.E}</td><td>${x.S}</td><td style="color:#dc2626;"><b>${x.F}</b></td></tr>`).join('') || '<tr><td colspan="11">Hakuna alama zilizochambuliwa bado.</td></tr>'}
          </tbody></table>
        </div>`;
      applyTcSearch();
      return;
    }

    if (tab === 'remedial') {
      const weak = getMyResults().filter(r => Number(r.score || 0) < 45);
      area.innerHTML = `

  function filterTeacherTables(query) {
    const q = (query || '').trim().toLowerCase();
    document.querySelectorAll('#viewArea table tbody tr').forEach(tr => {
      tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  }

  function applyTcSearch() {
    const q = document.getElementById('globalTcSearch')?.value || '';
    if (q.trim()) filterTeacherTables(q);
  }

      <div style="border:2px solid #0f294a; padding:18px; background:#fff; max-width:650px; margin-top:10px; line-height:1.6;">

  function loadTeacherScoreGrid() {
    const val = document.getElementById('tcAllocPick')?.value;
    const exam = document.getElementById('tcExamType')?.value;
    if (!val) { alert('⚠️ Chagua Kidato & Somo lako kwanza.'); return; }
    const [cls, subj] = val.split('|');
    const targetNorm = normClass(cls);
    const list = getAllUnifiedStudents().filter(s => normClass(s.class_name) === targetNorm);
    const openForMe = isWindowOpenForMe();

    const existingRows = SGB.select('exam_results').filter(r =>
      normClass(r.class_name) === targetNorm &&
      (r.subject || '').toLowerCase() === subj.toLowerCase() &&
      (r.exam_type || '').toLowerCase() === exam.toLowerCase()
    );
    const isApprovedLocked = existingRows.some(r => r.verified_status === 'Approved');
    const isReadOnly = !openForMe || isApprovedLocked;

    document.getElementById('tcGridArea').innerHTML = `
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:#f8fafc; border:1px solid #cbd5e1; padding:9px; border-radius:8px; margin-bottom:10px;">
        <button type="button" class="btn btn-blue" onclick="downloadTeacherScoreExcel('${cls}', '${subj}', '${exam}')">⬇️ Pakua Excel (.xlsx)</button>
        ${!isReadOnly ? `<input type="file" id="tcExcelUploadInp" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style="max-width:230px;">
        <button type="button" class="btn btn-green" onclick="uploadTeacherScoreExcel('${cls}', '${subj}', '${exam}')">📤 Pakia Excel (.xlsx)</button>` : ''}
        ${!openForMe && !isApprovedLocked ? `<button type="button" class="btn btn-amber" onclick="requestTeacherWindowUnlock()">🔓 Omba Mtaaluma Akufungulie Wewe Pekee</button>` : ''}
      </div>

      ${isApprovedLocked ? '<p style="background:#ecfdf5; border:1px solid #059669; color:#065f46; padding:8px 12px; border-radius:6px; font-weight:bold;">🔒 Score Sheet hii imeshathibitishwa na kufungwa na Mtaaluma (Approved). Unaweza kuona alama za mwisho hapa chini.</p>' : ''}
      ${!openForMe && !isApprovedLocked ? '<p style="background:#fef2f2; border:1px solid #dc2626; color:#991b1b; padding:8px 12px; border-radius:6px; font-weight:bold;">🔒 Dirisha la kuingiza alama limefungwa na Mtaaluma. Bofya kitufe cha njano hapo juu kuomba akufungulie wewe peke yako.</p>' : ''}

      <form onsubmit="submitTeacherScoreSheet(event, '${cls}', '${subj}', '${exam}')">
        <table><thead><tr><th>Mwanafunzi</th><th>Jinsia</th><th>Kidato</th><th>PREM</th><th>Alama (0-100)</th><th>Hali / Marekebisho</th></tr></thead>
        <tbody>
        ${list.map(s => {
          const rec = existingRows.find(r => (r.student_name || '').toLowerCase() === s.full_name.toLowerCase());
          const valScore = rec ? rec.score : '';
          const noteBadge = rec
            ? (rec.edited_by_academic ? '<span style="color:#1d4ed8; font-weight:bold;">✏️ Imehaririwa na Mtaaluma</span>' : (rec.verified_status === 'Approved' ? '✅ Imethibitishwa' : (rec.verified_status === 'Returned' ? '↩️ Imerudishwa' : '⏳ Inasubiri')))
            : '-';
          return `<tr>
            <td><b>${s.full_name}</b></td><td>${s.gender}</td><td>${s.class_name}</td><td>${s.prem_no}</td>
            <td>${isReadOnly ? `<b>${valScore !== '' ? valScore + '%' : '-'}</b>` : `<input type="number" class="tc-sc-inp" data-name="${s.full_name}" value="${valScore}" min="0" max="100" placeholder="Alama">`}</td>
            <td>${noteBadge}</td>
          </tr>`;
        }).join('') || `<tr><td colspan="6">Hakuna wanafunzi waliosajiliwa kwenye kidato cha <b>${cls}</b> bado.</td></tr>`}
        </tbody></table>
        ${list.length && !isReadOnly ? `<button type="submit" class="btn btn-green" style="margin-top:10px;">📤 Wasilisha Score Sheet (${cls} — ${subj} — ${exam}) Kwa Mtaaluma</button>` : ''}
      </form>`;
  }
  function downloadTeacherScoreExcel(cls, subj, exam) {
    if (typeof XLSX === 'undefined') { alert('⚠️ Maktaba ya Excel inapakia, subiri sekunde 2 jaribu tena.'); return; }
    const list = getAllUnifiedStudents().filter(s => normClass(s.class_name) === normClass(cls));
    if (!list.length) { alert(`⚠️ Hakuna wanafunzi kwenye ${cls}.`); return; }
    const rows = [['Jina la Mwanafunzi', 'PREM No', 'Kidato', 'Somo', 'Mtihani', 'Alama (0-100)']];
    list.forEach(s => rows.push([s.full_name, s.prem_no || '-', s.class_name, subj, exam, '']));
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const safeSheet = subj.replace(/[\\/?*[\]:]/g, '').trim().slice(0, 28) || 'ScoreSheet';
    XLSX.utils.book_append_sheet(wb, ws, safeSheet);
    XLSX.writeFile(wb, `${cls}_${subj}_${exam}.xlsx`.replace(/\s+/g, '_'));
  }

  function uploadTeacherScoreExcel(cls, subj, exam) {
    if (typeof XLSX === 'undefined') { alert('⚠️ Maktaba ya Excel haijapakia bado.'); return; }
    const file = document.getElementById('tcExcelUploadInp')?.files?.item(0);
    if (!file) { alert('⚠️ Chagua faili la Excel (.xlsx) lililojazwa alama kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames.at(0)], { header: 1 });
      const scoreMap = {};
      rows.slice(1).forEach(r => {
        if (r.at(0) && r.at(5) !== undefined && r.at(5) !== null && String(r.at(5)).trim() !== '') {
          scoreMap[String(r.at(0)).trim().toLowerCase()] = Number(r.at(5));
        }
      });
      let filled = 0;
      document.querySelectorAll('.tc-sc-inp').forEach(inp => {
        const val = scoreMap[(inp.dataset.name || '').trim().toLowerCase()];
        if (val !== undefined && !isNaN(val)) { inp.value = val; filled++; }
      });
      alert(`✅ Alama ${filled} kutoka Excel zimejazwa kwenye jedwali! Bofya "Wasilisha Score Sheet" kuzituma kwa Mtaaluma.`);
    };
    reader.readAsArrayBuffer(file);
  }

  function requestTeacherWindowUnlock() {
    const reason = prompt(`Andika sababu ya kuomba Mtaaluma akufungulie dirisha wewe peke yako (${myTeacherName}):`);
    if (!reason || !reason.trim()) return;
    const reqs = JSON.parse(localStorage.getItem('sgb_unlock_requests') || '[]');
    reqs.unshift({ teacher: myTeacherName, reason: reason.trim(), time: new Date().toLocaleString('sw-TZ'), status: 'Pending' });
    localStorage.setItem('sgb_unlock_requests', JSON.stringify(reqs));
    SGB.pushToCloud('unlock_requests');
    alert('✅ Ombi lako limetumwa kwa Mtaaluma! Akikubali, dirisha litafunguka kwako peke yako.');
  }
  function submitTeacherScoreSheet(e, cls, subj, exam) {
    e.preventDefault();
    const aLevel = isALevelClass(cls);
    const targetNorm = normClass(cls);
    let count = 0;

    let allResults = SGB.select('exam_results').filter(r =>
      !(normClass(r.class_name) === targetNorm &&
        (r.subject || '').toLowerCase() === subj.toLowerCase() &&
        (r.exam_type || '').toLowerCase() === exam.toLowerCase())
    );

    document.querySelectorAll('.tc-sc-inp').forEach(inp => {
      if (inp.value !== '') {
        const sc = Number(inp.value);
        allResults.unshift({
          id: Date.now() + Math.floor(Math.random() * 10000),
          created_at: new Date().toLocaleString('sw-TZ'),
          student_name: inp.dataset.name,
          class_name: cls,
          subject: subj,
          exam_type: exam,
          score: sc,
          grade: gradeFromScore(sc, aLevel),
          teacher_name: myTeacherName,
          verified_status: 'Pending'
        });
        count++;
      }
    });

    saveTableClean('exam_results', allResults);
    alert(`✅ Score Sheet yenye alama ${count} (${exam}) imetumwa kwa Mtaaluma kwa uhakiki!`);
    openTab('subj_analytics');
  }
  function postHomeworkWithPdf(e) {
    e.preventDefault();
    const val = document.getElementById('hwAllocPick')?.value;
    if (!val) return;
    const [cls, subj] = val.split('|');
    const due = document.getElementById('hwDue').value;
    const desc = document.getElementById('hwDesc').value.trim();
    const fileInp = document.getElementById('hwPdfFile');
    const file = fileInp && fileInp.files ? fileInp.files.item(0) : null;

    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        SGB.insert('student_assignments', { class_name: cls, subject: subj, due_date: due, description: desc, file_name: file.name, file_data: ev.target.result, teacher_name: myTeacherName });
        openTab('homework');
      };
      reader.readAsDataURL(file);
    } else {
      SGB.insert('student_assignments', { class_name: cls, subject: subj, due_date: due, description: desc, teacher_name: myTeacherName });
      openTab('homework');
    }
  }

    const score = document.getElementById(`grd_${subId}`)?.value;

  function autoFillCaStudentDetails(typedName) {
    const st = getMyAssignedStudents().find(s => (s.full_name || '').toLowerCase() === typedName.trim().toLowerCase());
    if (st) {
      const clsInp = document.getElementById('caClass');
      if (clsInp) clsInp.value = st.class_name;
      const myAllocs = getMyAllocations().filter(a => normClass(a.class_name) === normClass(st.class_name));
      const subjSel = document.getElementById('caSubj');
      if (subjSel && myAllocs.length) {
        subjSel.innerHTML = myAllocs.map(a => `<option value="${a.subject}">${a.subject}</option>`).join('');
      }
    }
  }

  function alertParentAttendance(stName, status, dt, channel) {
    const reg = getAllUnifiedStudents().find(s => (s.full_name || '').toLowerCase() === stName.toLowerCase());
    let phone = reg?.parent_phone || prompt(`Ingiza namba ya simu ya mzazi wa ${stName}:`);
    if (!phone || !phone.trim()) return;
    const acadPhone = getAcadContactPhone();
    const msg = `SHULE YA SEKONDARI SANGABUYE\nTaarifa ya Mahudhurio ya ${stName.toUpperCase()} tarehe ${dt}: ${status}.\nOfisi ya Taaluma: ${acadPhone}`;
    let intl = phone.replace(/\D/g, '');
    if (intl.startsWith('0')) intl = '255' + intl.slice(1);
    SGB.insert('sms_outbox', { recipient_name: `Mzazi wa ${stName}`, phone: phone.trim(), sender_gateway: `${acadPhone} (${channel})`, message: msg, status: 'Imetumwa' });
    if (channel === 'WA') window.open(`https://wa.me{intl}?text=${encodeURIComponent(msg)}`, '_blank');
    else window.open(`sms:${phone.trim()}?body=${encodeURIComponent(msg)}`, '_self');
  }
