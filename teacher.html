<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi ya Mwalimu | Sangabuye SIS Portal</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 265px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fbbf24; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #cbd5e1; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #e2e8f0; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 16px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; background: #1d4ed8; color: white; }
    .btn-green { background: #059669; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>DASHIBODI YA MWALIMU</h2>
  <p id="teacherBadge">Sangabuye Secondary School</p>
  <button class="menu-btn active" onclick="openTab('my_classes', this)">🏫 1. Masomo & Madarasa Yangu</button>
  <button class="menu-btn" onclick="openTab('bulk_marks', this)">📝 2. Jedwali la Alama (Darasa Zima)</button>
  <button class="menu-btn" onclick="openTab('subject_tests', this)">📊 3. Mitihani Binafsi ya Somo</button>
  <button class="menu-btn" onclick="openTab('cbt_assign', this)">💻 4. Assignments, CBT & Sahihisha</button>
  <button class="menu-btn" onclick="openTab('rollcall_qbank', this)">📋 5. Mahudhurio & Benki ya Maswali</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">🏫 1. Masomo & Madarasa Yangu</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div style="display:flex; gap:8px;">
      <button class="btn" onclick="document.querySelector('.menu-btn.active').click()">🔄 Live Refresh</button>
      <button class="btn btn-amber" onclick="alert('Lugha imebadilishwa (SW / EN).')">SW | EN</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
  <datalist id="stList"></datalist>
</div>
<script>
  const user = SGB.requireRole(['teacher', 'super_admin']);
  SGB.startSessionTimer();
  const cleanTeacherName = user.full_name.replace(' [Via Admin]', '').trim();
  document.getElementById('teacherBadge').innerText = cleanTeacherName;

  function getMyAllocations() {
    return SGB.select('teacher_allocations').filter(a => a.teacher_name.toLowerCase() === cleanTeacherName.toLowerCase());
  }

  function buildClassOptions() {
    return [...new Set(getMyAllocations().map(a => a.class_name))].map(c => `<option value="${c}">${c}</option>`).join('');
  }

  function buildSubjectOptions() {
    return [...new Set(getMyAllocations().map(a => a.subject_name))].map(s => `<option value="${s}">${s}</option>`).join('');
  }

  function calcGrade(t, abs) {
    if (abs) return { grade: 'X', points: 0 };
    if (t >= 75) return { grade: 'A', points: 1 };
    if (t >= 65) return { grade: 'B', points: 2 };
    if (t >= 45) return { grade: 'C', points: 3 };
    if (t >= 30) return { grade: 'D', points: 4 };
    return { grade: 'F', points: 5 };
  }

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    document.getElementById('syncTime').innerText = ' • Last synced: ' + new Date().toLocaleTimeString();

    const names = new Set();
    SGB.select('users_profile').filter(u => u.role === 'student').forEach(u => names.add(u.full_name));
    document.getElementById('stList').innerHTML = Array.from(names).map(n => `<option value="${n}">`).join('');

    const allocs = getMyAllocations();
    const area = document.getElementById('viewArea');

    if (tab === 'my_classes') {
      const myClassTeacher = allocs.filter(a => a.is_class_teacher === 'Ndiyo');
      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Mwalimu</h4><div class="val">${cleanTeacherName}</div></div>
          <div class="card"><h4>Masomo Uliyopangiwa</h4><div class="val">${allocs.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Class Teacher</h4><div class="val">${myClassTeacher.map(c => c.class_name).join(', ') || 'Hapana'}</div></div>
        </div>
        <div class="panel">
          <h3>Masomo na Madarasa Uliyopangiwa na Mtaaluma</h3>
          ${allocs.length === 0 ? `<div style="padding:12px; background:#fef3c7; color:#92400e; border-radius:6px;">⚠️ Bado hujapangiwa somo au darasa na <b>Mtaaluma</b>.</div>` : `
          <table><tr><th>Darasa</th><th>Somo</th><th>Jukumu</th></tr>
          ${allocs.map(a => `<tr><td><b>${a.class_name}</b></td><td><b>${a.subject_name}</b></td><td>${a.is_class_teacher === 'Ndiyo' ? '⭐ Class Teacher' : 'Subject Teacher'}</td></tr>`).join('')}
          </table>`}
        </div>`;
    }
    if (tab === 'bulk_marks') {
      if (allocs.length === 0) { area.innerHTML = `<div class="panel">⚠️ Bado hujapangiwa somo na Mtaaluma.</div>`; return; }
      const exams = SGB.select('exams_list');
      const lockedExam = exams.find(e => e.status && e.status.startsWith('Locked'));
      if (lockedExam) {
        area.innerHTML = `<div class="panel" style="border-left:5px solid #dc2626; background:#fef2f2;"><h3>🔒 Uingizaji wa Alama Umefungwa na Mtaaluma</h3><p>Mtihani <b>${lockedExam.title}</b> umefungwa (Locked) kwa ajili ya uchakataji wa matokeo ya NECTA. Wasiliana na Mtaaluma ikihitajika marekebisho.</p></div>`;
        return;
      }

      area.innerHTML = `
        <div class="panel">
          <h3>Jedwali la Darasa Zima (Bulk Class Marks Entry — CA 30% + Final 70%)</h3>
          <p style="font-size:12px; color:#475569;">Chagua Darasa na Somo kupakia wanafunzi wote kwa mpigo (weka <b>-1</b> kwa mgonjwa apate <b>'X'</b>).</p>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <select id="bmClass">${buildClassOptions()}</select>
            <select id="bmSub">${buildSubjectOptions()}</select>
            <button class="btn" onclick="loadClassGrid()">📋 Pakia Orodha ya Darasa</button>
          </div>
          <div id="classGridArea"></div>
        </div>`;
    }

    if (tab === 'subject_tests') {
      if (allocs.length === 0) { area.innerHTML = `<div class="panel">⚠️ Bado hujapangiwa somo na Mtaaluma.</div>`; return; }
      const tests = SGB.select('subject_private_tests').filter(t => t.teacher === cleanTeacherName);
      area.innerHTML = `
        <div class="panel">
          <h3>Mitihani Binafsi ya Somo (Weekly / Monthly Subject Tests)</h3>
          <form onsubmit="savePrivateTest(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="ptTitle" required placeholder="Jina la Jaribio">
            <select id="ptClass">${buildClassOptions()}</select>
            <select id="ptSub">${buildSubjectOptions()}</select>
            <input type="text" id="ptStudent" list="stList" required placeholder="Jina la Mwanafunzi">
            <input type="number" max="100" id="ptScore" required placeholder="Alama (0 - 100)">
            <button type="submit" class="btn">💾 Hifadhi</button>
          </form>
          <table><tr><th>Jaribio</th><th>Darasa</th><th>Somo</th><th>Mwanafunzi</th><th>Alama</th><th>Daraja</th></tr>
          ${tests.map(t => `<tr><td>${t.title}</td><td>${t.cls}</td><td>${t.sub}</td><td><b>${t.student}</b></td><td><b>${t.score}%</b></td><td><b>${t.grade}</b></td></tr>`).join('')}
          </table>
        </div>`;
    }
    if (tab === 'cbt_assign') {
      if (allocs.length === 0) { area.innerHTML = `<div class="panel">⚠️ Bado hujapangiwa somo na Mtaaluma.</div>`; return; }
      const subs = SGB.select('assignment_submissions').filter(s => s.teacher === cleanTeacherName);
      area.innerHTML = `
        <div class="panel">
          <h3>1. Toa Kazi ya Nyumbani (Written Assignment) au Online CBT</h3>
          <form onsubmit="saveCBT(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
            <select id="cType"><option value="WRITTEN">Kazi ya Kuandika (Written Assignment)</option><option value="CBT">Mtihani wa Kuchagua (Online CBT)</option></select>
            <select id="cClass">${buildClassOptions()}</select>
            <select id="cSub">${buildSubjectOptions()}</select>
            <input type="text" id="cTitle" required placeholder="Kichwa cha Kazi / Jaribio">
            <textarea id="cQuestion" rows="2" required placeholder="Andika maswali au maelekezo..." style="grid-column: span 2;"></textarea>
            <input type="text" id="cOptions" placeholder="Kama ni CBT weka chaguo 4 (A..., B..., C..., D...)">
            <input type="text" id="cAns" placeholder="Kama ni CBT weka herufi ya jibu (A, B, C au D)">
            <button type="submit" class="btn" style="grid-column: span 2;">📤 Chapisha Kwa Wanafunzi</button>
          </form>
        </div>
        <div class="panel">
          <h3>2. Majibu ya Kazi Zilizowasilishwa na Wanafunzi (Sahihisha & Toa Alama)</h3>
          <table><tr><th>Mwanafunzi</th><th>Kazi</th><th>Jibu Aliloandika</th><th>Alama / Maoni</th><th>Hatua</th></tr>
          ${subs.map(s => `<tr><td><b>${s.student_name}</b></td><td>${s.title}</td><td>${s.answer_text}</td><td><b>${s.score || 'Bado'}</b></td><td><button class="btn btn-green" onclick="gradeSub(${s.id})">✅ Sahihisha</button></td></tr>`).join('') || '<tr><td colspan="5">Hakuna majibu yaliyowasilishwa bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'rollcall_qbank') {
      if (allocs.length === 0) { area.innerHTML = `<div class="panel">⚠️ Bado hujapangiwa somo na Mtaaluma.</div>`; return; }
      const rc = SGB.select('rollcall_logs').filter(r => r.teacher === cleanTeacherName);
      area.innerHTML = `
        <div class="panel">
          <h3>Mahudhurio ya Kipindi (Digital Roll Call)</h3>
          <form onsubmit="saveRoll(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <select id="rcClass">${buildClassOptions()}</select>
            <input type="text" id="rcSt" list="stList" required placeholder="Jina la Mwanafunzi">
            <select id="rcStat"><option value="Present (Yupo)">Present (Yupo)</option><option value="Absent (Hayupo)">Absent (Hayupo)</option></select>
            <button type="submit" class="btn btn-green" style="grid-column: span 3;">✅ Hifadhi Mahudhurio</button>
          </form>
          <table><tr><th>Darasa</th><th>Mwanafunzi</th><th>Hali</th><th>Muda</th></tr>
          ${rc.map(r => `<tr><td>${r.cls}</td><td><b>${r.student_name}</b></td><td>${r.status}</td><td>${r.created_at}</td></tr>`).join('')}
          </table>
        </div>`;
    }
  }

  function loadClassGrid() {
    const cls = document.getElementById('bmClass').value;
    const sub = document.getElementById('bmSub').value;
    const students = SGB.select('users_profile').filter(u => u.role === 'student');
    if (!students.length) {
      document.getElementById('classGridArea').innerHTML = `<p style="color:#dc2626;">Hakuna wanafunzi waliosajiliwa bado. Mwombe Admin apakie orodha ya wanafunzi.</p>`;
      return;
    }
    document.getElementById('classGridArea').innerHTML = `
      <form onsubmit="saveBulkClassMarks(event, '${cls}', '${sub}')">
        <table><tr><th>#</th><th>Jina la Mwanafunzi</th><th>CA (0 - 30)</th><th>Final (0 - 70 au -1)</th></tr>
        ${students.map((st, idx) => `<tr><td>${idx+1}</td><td><b>${st.full_name}</b><input type="hidden" class="bg-name" value="${st.full_name}"></td><td><input type="number" step="0.1" max="30" class="bg-ca" placeholder="CA"></td><td><input type="number" step="0.1" min="-1" max="70" class="bg-fin" placeholder="Final"></td></tr>`).join('')}
        </table><br>
        <button type="submit" class="btn btn-green" style="padding:12px 20px;">🔒 Hifadhi & Tuma Alama za Darasa Zima Kwa Mtaaluma</button>
      </form>`;
  }

  function saveBulkClassMarks(e, cls, sub) {
    e.preventDefault();
    const names = document.querySelectorAll('.bg-name');
    const cas = document.querySelectorAll('.bg-ca');
    const fins = document.querySelectorAll('.bg-fin');
    let saved = 0;

    names.forEach((inp, i) => {
      if (cas[i].value === '' && fins[i].value === '') return;
      const ca = Number(cas[i].value || 0);
      const finRaw = Number(fins[i].value || 0);
      const abs = finRaw < 0, fin = abs ? 0 : finRaw, tot = abs ? 0 : (ca + fin);
      const { grade, points } = calcGrade(tot, abs);
      SGB.insert('exam_results', { teacher: cleanTeacherName, class_name: cls, subject_name: sub, student_name: inp.value, ca_score: ca, final_score: fin, total_score: tot, grade, points });
      saved++;
    });
    alert(`✅ Alama za wanafunzi ${saved} wa ${cls} (${sub}) zimehifadhiwa na kutumwa kwa Mtaaluma!`);
    openTab('bulk_marks');
  }

  function savePrivateTest(e) {
    e.preventDefault();
    const sc = Number(document.getElementById('ptScore').value);
    const { grade } = calcGrade(sc, false);
    SGB.insert('subject_private_tests', { teacher: cleanTeacherName, title: document.getElementById('ptTitle').value, cls: document.getElementById('ptClass').value, sub: document.getElementById('ptSub').value, student: document.getElementById('ptStudent').value.trim(), score: sc, grade });
    openTab('subject_tests');
  }

  function saveCBT(e) {
    e.preventDefault();
    SGB.insert('assignments_cbt', { teacher: cleanTeacherName, type: document.getElementById('cType').value, cls: document.getElementById('cClass').value, sub: document.getElementById('cSub').value, title: document.getElementById('cTitle').value, question: document.getElementById('cQuestion').value, options: document.getElementById('cOptions').value, answer: document.getElementById('cAns').value.trim().toUpperCase() });
    alert('✅ Kazi imechapishwa kwa wanafunzi!');
    openTab('cbt_assign');
  }

  function gradeSub(id) {
    const score = prompt('Weka alama na maoni (Mfano: 18/20 - Vizuri sana):');
    if (score) { SGB.update('assignment_submissions', id, { score }); openTab('cbt_assign'); }
  }

  function saveRoll(e) {
    e.preventDefault();
    SGB.insert('rollcall_logs', { teacher: cleanTeacherName, cls: document.getElementById('rcClass').value, student_name: document.getElementById('rcSt').value.trim(), status: document.getElementById('rcStat').value });
    openTab('rollcall_qbank');
  }

  openTab('my_classes', document.querySelector('.menu-btn'));
</script>
</body>
</html>
