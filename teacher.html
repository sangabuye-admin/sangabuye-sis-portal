<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi ya Mwalimu (Teacher Portal v8.0) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 255px; background: #1e293b; color: white; display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 16px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 12px; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 8px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; margin-bottom: 3px; }
    .menu-btn:hover, .menu-btn.active { background: #2563eb; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 11px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #2563eb; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f172a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 7px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f172a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>DASHIBODI YA MWALIMU</h2>
  <p>Sangabuye Secondary School</p>
  <button class="menu-btn active" onclick="openTab('home', this)">📊 1. Muhtasari wa Mwalimu</button>
  <button class="menu-btn" onclick="openTab('marks', this)">📝 2. Ingiza Alama za Mitihani</button>
  <button class="menu-btn" onclick="openTab('attendance', this)">📋 3. Mahudhurio ya Darasa</button>
  <button class="menu-btn" onclick="openTab('homework', this)">📖 4. Kazi za Nyumbani & Notes</button>
  <button class="menu-btn" onclick="openTab('teacher_library', this)">📚 5. Maktaba (Oda & Mapendekezo)</button>
  <button class="menu-btn" onclick="openTab('discipline', this)">⚖️ 6. Ripoti ya Nidhamu</button>
</div>
<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Mwalimu</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
  <datalist id="stNamesList"></datalist>
</div>
<script>
  const user = SGB.requireRole(['teacher', 'academic', 'headmaster', 'super_admin']);
  SGB.startSessionTimer();

  function refreshStudentNames() {
    const names = new Set();
    SGB.select('users_profile').filter(u => u.role === 'student').forEach(u => names.add(u.full_name));
    SGB.select('library_members').filter(m => m.role === 'Student').forEach(m => names.add(m.full_name));
    document.getElementById('stNamesList').innerHTML = Array.from(names).map(n => `<option value="${n}">`).join('');
  }

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    refreshStudentNames();
    const area = document.getElementById('viewArea');
    const myName = user ? user.full_name : 'Mwalimu';

    if (tab === 'home') {
      const myMarks = SGB.select('exam_results').filter(r => r.teacher_name === myName);
      const books = SGB.select('library_books');
      const news = SGB.select('school_announcements');
      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Mwalimu</h4><div class="val" style="font-size:15px;">${myName}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Alama Nilizoingiza</h4><div class="val">${myMarks.length}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Vitabu Vilivyopo Maktaba</h4><div class="val">${books.length}</div></div>
        </div>
        <div class="panel">
          <h3>📢 Matangazo ya Shule</h3>
          <table><tr><th>Tarehe</th><th>Kichwa</th><th>Ujumbe</th></tr>
          ${news.slice(0, 5).map(n => `<tr><td>${n.created_at}</td><td><b>${n.title}</b></td><td>${n.body}</td></tr>`).join('') || '<tr><td colspan="3">Hakuna matangazo mapya.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'marks') {
      const results = SGB.select('exam_results').filter(r => r.teacher_name === myName);
      area.innerHTML = `
        <div class="panel">
          <h3>📝 Ingiza Alama za Mtihani wa Mwanafunzi</h3>
          <form onsubmit="saveExamMark(event)" style="display:grid; grid-template-columns:2fr 1fr 1.2fr 1fr 0.8fr auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="mkSt" list="stNamesList" required placeholder="Jina la Mwanafunzi">
            <input type="text" id="mkCls" required placeholder="Kidato (mf. Form 4A)">
            <input type="text" id="mkSubj" required placeholder="Somo (mf. Mathematics)">
            <select id="mkTerm"><option value="Midterm">Midterm</option><option value="Terminal">Terminal</option><option value="Annual">Annual</option><option value="Mock">Mock / Pre-NECTA</option></select>
            <input type="number" id="mkScore" min="0" max="100" required placeholder="Alama">
            <button type="submit" class="btn btn-green">💾 Hifadhi Alama</button>
          </form>
          <table><tr><th>Mwanafunzi</th><th>Kidato</th><th>Somo</th><th>Mtihani</th><th>Alama</th><th>Daraja</th></tr>
          ${results.map(r => `<tr><td><b>${r.student_name}</b></td><td>${r.class_name}</td><td>${r.subject}</td><td>${r.exam_type}</td><td><b>${r.score}</b></td><td><b>${r.grade}</b></td></tr>`).join('') || '<tr><td colspan="6">Hujaingiza alama bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'attendance') {
      const att = SGB.select('class_attendance');
      area.innerHTML = `
        <div class="panel">
          <h3>📋 Rekodi Mahudhurio ya Darasa</h3>
          <form onsubmit="saveClassAttendance(event)" style="display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="caSt" list="stNamesList" required placeholder="Jina la Mwanafunzi">
            <input type="text" id="caCls" required placeholder="Kidato">
            <select id="caStat"><option value="Present (Yupo)">Present (Yupo)</option><option value="Absent (Hayupo)">Absent (Hayupo)</option><option value="Excused (Ruhusa)">Excused (Ruhusa)</option></select>
            <button type="submit" class="btn btn-blue">✅ Rekodi</button>
          </form>
          <table><tr><th>Tarehe</th><th>Mwanafunzi</th><th>Kidato</th><th>Hali</th></tr>
          ${att.slice(0, 25).map(a => `<tr><td>${a.created_at}</td><td><b>${a.student_name}</b></td><td>${a.class_name}</td><td><b>${a.status}</b></td></tr>`).join('') || '<tr><td colspan="4">Hakuna rekodi bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }
    if (tab === 'homework') {
      const hw = SGB.select('class_homework');
      area.innerHTML = `
        <div class="panel">
          <h3>📖 Weka Kazi ya Nyumbani (Homework / Notes) Kwa Wanafunzi</h3>
          <form onsubmit="saveHomework(event)" style="display:grid; grid-template-columns:1fr 1fr 2fr auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="hwCls" required placeholder="Kidato (mf. Form 2B)">
            <input type="text" id="hwSubj" required placeholder="Somo">
            <input type="text" id="hwDesc" required placeholder="Maelezo ya Kazi / Maswali">
            <button type="submit" class="btn btn-green">📤 Tuma Kwa Wanafunzi</button>
          </form>
          <table><tr><th>Tarehe</th><th>Kidato</th><th>Somo</th><th>Kazi</th><th>Mwalimu</th></tr>
          ${hw.map(h => `<tr><td>${h.created_at}</td><td><b>${h.class_name}</b></td><td>${h.subject}</td><td>${h.task}</td><td>${h.teacher_name}</td></tr>`).join('') || '<tr><td colspan="5">Hakuna kazi bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'teacher_library') {
      const books = SGB.select('library_books');
      const myRes = SGB.select('library_reservations').filter(r => (r.requester || '').toLowerCase() === myName.toLowerCase());
      const myLoans = SGB.select('library_loans').filter(l => (l.student_name || '').toLowerCase() === myName.toLowerCase() && !(l.status || '').includes('Amerudisha'));
      const ebooks = SGB.select('library_ebooks');

      area.innerHTML = `
        <div class="panel">
          <h3>📚 1. Vitabu Vilivyosajiliwa Maktaba & Weka Oda ya Kitabu</h3>
          <input type="text" id="tcLibSearch" onkeyup="filterTcLibBooks()" placeholder="🔍 Tafuta kitabu kwa jina, somo, barcode au rafu..." style="margin-bottom:10px;">
          <form onsubmit="submitTcBookOrder(event)" style="display:grid; grid-template-columns:2fr auto; gap:8px; margin-bottom:12px;">
            <select id="tcBookPick" required>
              <option value="">-- Chagua Kitabu cha Kuweka Oda --</option>
              ${books.map(b => `<option value="${b.barcode}|${b.title}">${b.title} (${b.barcode}) — Rafu: ${b.shelf} | Zilizopo: ${b.available_copies}</option>`).join('')}
            </select>
            <button type="submit" class="btn btn-blue">📅 Weka Oda ya Kitabu</button>
          </form>
          <table id="tcBooksTbl">
            <thead><tr><th>Barcode</th><th>Jina la Kitabu</th><th>Mwandishi</th><th>Kategoria</th><th>Rafu</th><th>Zilizopo</th></tr></thead>
            <tbody>
            ${books.map(b => `<tr><td><b>${b.barcode}</b></td><td><b>${b.title}</b></td><td>${b.author || '-'}</td><td>${b.category}</td><td>${b.shelf}</td><td style="color:#059669;"><b>${b.available_copies}/${b.total_copies}</b></td></tr>`).join('') || '<tr><td colspan="6">Hakuna vitabu vilivyosajiliwa maktaba bado.</td></tr>'}
            </tbody>
          </table>
        </div>

        <div class="panel">
          <h3>💡 2. Tuma Pendekezo la Kitabu Kipya (Kwa Mkutubi & Mkuu wa Shule)</h3>
          <form onsubmit="submitTcBookSuggestion(event)" style="display:grid; grid-template-columns:2fr 1.5fr auto; gap:8px;">
            <input type="text" id="tcSugBook" required placeholder="Jina la Kitabu Unachopendekeza">
            <input type="text" id="tcSugSubj" required placeholder="Mwandishi au Somo (mf. Physics)">
            <button type="submit" class="btn btn-green">📩 Tuma Pendekezo</button>
          </form>
        </div>

        <div class="panel">
          <h3>📋 3. Oda Zangu, Vitabu Nilivyoazima & Maktaba Mtandao (PDF)</h3>
          <table><tr><th>Aina</th><th>Kitabu / Nyenzo</th><th>Tarehe / Ukomo</th><th>Hali / Hatua</th></tr>
          ${myRes.map(r => `<tr><td>Oda (Reservation)</td><td><b>${r.book_title}</b></td><td>${r.created_at}</td><td><b>${r.status}</b></td></tr>`).join('')}
          ${myLoans.map(l => `<tr><td>Nimeazima</td><td><b>${l.book}</b></td><td>Rudisha: ${l.due_date}</td><td><b>${l.status}</b></td></tr>`).join('')}
          ${ebooks.map(e => `<tr><td>E-Book (${e.res_type || 'PDF'})</td><td><b>${e.title}</b> (${e.subject})</td><td>Mtandaoni</td><td><button class="btn btn-blue" onclick="openTcEbook('${e.id}')">📂 Fungua</button></td></tr>`).join('')}
          </table>
        </div>`;
      return;
    }

    const disc = SGB.select('discipline_logs');
    area.innerHTML = `
      <div class="panel">
        <h3>⚖️ Ripoti ya Nidhamu ya Mwanafunzi</h3>
        <form onsubmit="saveDiscipline(event)" style="display:grid; grid-template-columns:1.5fr 2fr auto; gap:8px; margin-bottom:14px;">
          <input type="text" id="dcSt" list="stNamesList" required placeholder="Jina la Mwanafunzi">
          <input type="text" id="dcDesc" required placeholder="Maelezo ya Tukio / Hatua Iliyochukuliwa">
          <button type="submit" class="btn btn-amber">💾 Hifadhi Ripoti</button>
        </form>
        <table><tr><th>Tarehe</th><th>Mwanafunzi</th><th>Maelezo</th><th>Aliyeripoti</th></tr>
        ${disc.map(d => `<tr><td>${d.created_at}</td><td><b>${d.student_name}</b></td><td>${d.issue}</td><td>${d.reported_by}</td></tr>`).join('') || '<tr><td colspan="4">Hakuna ripoti za nidhamu.</td></tr>'}
        </table>
      </div>`;
  }
  function calcGrade(score) {
    const s = Number(score);
    if (s >= 75) return 'A';
    if (s >= 65) return 'B';
    if (s >= 45) return 'C';
    if (s >= 30) return 'D';
    return 'F';
  }

  function saveExamMark(e) {
    e.preventDefault();
    const score = Number(document.getElementById('mkScore').value);
    SGB.insert('exam_results', {
      student_name: document.getElementById('mkSt').value.trim(),
      class_name: document.getElementById('mkCls').value.trim(),
      subject: document.getElementById('mkSubj').value.trim(),
      exam_type: document.getElementById('mkTerm').value,
      score,
      grade: calcGrade(score),
      teacher_name: user ? user.full_name : 'Mwalimu'
    });
    openTab('marks');
  }

  function saveClassAttendance(e) {
    e.preventDefault();
    SGB.insert('class_attendance', { student_name: document.getElementById('caSt').value.trim(), class_name: document.getElementById('caCls').value.trim(), status: document.getElementById('caStat').value });
    openTab('attendance');
  }

  function saveHomework(e) {
    e.preventDefault();
    SGB.insert('class_homework', { class_name: document.getElementById('hwCls').value.trim(), subject: document.getElementById('hwSubj').value.trim(), task: document.getElementById('hwDesc').value.trim(), teacher_name: user ? user.full_name : 'Mwalimu' });
    openTab('homework');
  }

  function saveDiscipline(e) {
    e.preventDefault();
    SGB.insert('discipline_logs', { student_name: document.getElementById('dcSt').value.trim(), issue: document.getElementById('dcDesc').value.trim(), reported_by: user ? user.full_name : 'Mwalimu' });
    openTab('discipline');
  }

  function filterTcLibBooks() {
    const q = (document.getElementById('tcLibSearch')?.value || '').toLowerCase();
    document.querySelectorAll('#tcBooksTbl tbody tr').forEach(r => { r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'; });
  }

  function submitTcBookOrder(e) {
    e.preventDefault();
    const raw = document.getElementById('tcBookPick').value;
    if (!raw) return;
    const parts = raw.split('|');
    SGB.insert('library_reservations', { res_id: 'RES-' + Math.floor(1000 + Math.random() * 9000), barcode: parts.at(0), book_title: parts.at(1), requester: user ? user.full_name : 'Mwalimu', status: 'Inasubiri' });
    alert('✅ Oda yako ya kitabu imetumwa Maktaba!');
    openTab('teacher_library');
  }

  function submitTcBookSuggestion(e) {
    e.preventDefault();
    const book_title = document.getElementById('tcSugBook').value.trim();
    const author_subject = document.getElementById('tcSugSubj').value.trim();
    const senderName = user ? `${user.full_name} (Mwalimu)` : 'Mwalimu';
    SGB.insert('library_suggestions', { book_title, author_subject, suggested_by: senderName, status: 'Imetumwa Kwa Mkutubi & Mkuu' });
    SGB.insert('direct_messages', { sender: senderName, recipient: 'Mkuu wa Shule', subject: `PENDEKEZO LA KITABU (MWALIMU): ${book_title}`, body: `Kitabu: ${book_title} (${author_subject}).` });
    alert('✅ Pendekezo lako limetumwa kwa Mkutubi na Mkuu wa Shule!');
    openTab('teacher_library');
  }

  function openTcEbook(id) {
    const item = SGB.select('library_ebooks').find(x => String(x.id) === String(id));
    if (!item) return;
    if (item.pdf_data) { const w = window.open('', '_blank'); w.document.write(`<iframe src="${item.pdf_data}" style="width:100%;height:100%;border:none;"></iframe>`); }
    else if (item.link) window.open(item.link, '_blank');
  }

  openTab('home', document.querySelector('.menu-btn'));
</script>
</body>
</html>
