<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashibodi ya Mwalimu (Teacher Portal v9.6 — Form 1-6) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 260px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6.5px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; margin-bottom: 2px; }
    .menu-btn:hover, .menu-btn.active { background: #0284c7; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #0284c7; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .form-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .form-tools { display: flex; gap: 6px; align-items: center; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>DASHIBODI YA MWALIMU</h2>
  <p id="tcSideName">Teacher Portal | Form 1–6</p>

  <div class="grp-lbl">A. Taaluma & Alama</div>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊  Muhtasari & Graphs</button>
  <button class="menu-btn" onclick="openTab('score_entry', this)">✍️  Jaza & Tuma Score Sheet</button>
  <button class="menu-btn" onclick="openTab('subj_analytics', this)">📈  Uchambuzi wa Somo (A–F)</button>
  <button class="menu-btn" onclick="openTab('remedial', this)">🆘  Wanafunzi wa Remedial (D/F)</button>

  <div class="grp-lbl">B. Darasa, Mahudhurio & Zamu</div>
  <button class="menu-btn" onclick="openTab('attendance', this)">📋  Mahudhurio (Roll Call)</button>
  <button class="menu-btn" onclick="openTab('homework', this)">📝  Mazoezi & Notes (Students)</button>
  <button class="menu-btn" onclick="openTab('discipline', this)">⚖️  Nidhamu & Maoni ya Darasa</button>
  <button class="menu-btn" onclick="openTab('tod_duty', this)">🛡️  Ripoti ya Mwalimu wa Zamu</button>

  <div class="grp-lbl">C. Maandalio, Ratiba & Fedha</div>
  <button class="menu-btn" onclick="openTab('schemes', this)">📑  Schemes, Lesson Plans & Silabasi</button>
  <button class="menu-btn" onclick="openTab('timetable_lib', this)">📅  Ratiba Yangu & Maktaba</button>
  <button class="menu-btn" onclick="openTab('leave_swap', this)">🏖️  Omba Ruhusa / Badili Kipindi</button>
  <button class="menu-btn" onclick="openTab('payroll_imprest', this)">💼  Salary Slip & Masurufu</button>
  <button class="menu-btn" onclick="openTab('ca_tracker', this)">🧪  Mazoezi Endelevu (CA / Tests)</button>
  <button class="menu-btn" onclick="openTab('tc_messages', this)">💬  Ujumbe (Mkuu/Mtaaluma/Mhasibu)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari & Graphs</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div style="display:flex; gap:8px; align-items:center; flex:1; max-width:460px;">
      <input type="text" id="globalTcSearch" onkeyup="filterTeacherTables(this.value)" placeholder="🔍 Tafuta popote kwa herufi za jina, kidato, somo...">
      <button type="button" class="btn btn-blue" style="white-space:nowrap;" onclick="refreshTeacherNow()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['teacher', 'academic', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();

  const SYSTEM_GATEWAY_PHONE = localStorage.getItem('sgb_system_gateway_phone') || '0615000305';
  const myTeacherName = user ? (user.full_name || user.username || 'Mwalimu') : 'Mwalimu';
  if (document.getElementById('tcSideName')) document.getElementById('tcSideName').innerText = myTeacherName;
  let currentTcTab = 'overview';

  function isALevelClass(cls) {
    const c = (cls || '').toLowerCase();
    return c.includes('5') || c.includes('6') || c.includes('v') || c.includes('vi');
  }

  function gradeFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 'A';
      if (s >= 70) return 'B';
      if (s >= 60) return 'C';
      if (s >= 50) return 'D';
      if (s >= 40) return 'E';
      if (s >= 35) return 'S';
      return 'F';
    }
    if (s >= 75) return 'A';
    if (s >= 65) return 'B';
    if (s >= 45) return 'C';
    if (s >= 30) return 'D';
    return 'F';
  }

  function getMyResults() {
    const all = SGB.select('exam_results');
    const mine = all.filter(r => (r.teacher_name || '').toLowerCase() === myTeacherName.toLowerCase());
    return mine.length ? mine : all;
  }

  function formToolsHtml(placeholder = '🔍 Tafuta kwenye fomu hii...') {
    return `<div class="form-tools">
      <input type="text" onkeyup="filterTeacherTables(this.value)" placeholder="${placeholder}" style="width:220px;">
      <button type="button" class="btn btn-blue" onclick="refreshTeacherNow()">🔄 Refresh</button>
    </div>`;
  }

  function openTab(tab, btn) {
    currentTcTab = tab;
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const myAllocs = SGB.select('subject_allocations').filter(a => (a.teacher_name || '').toLowerCase().includes(myTeacherName.toLowerCase()));
      const displayAllocs = myAllocs.length ? myAllocs : SGB.select('subject_allocations');
      const examWin = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"active_exam":"Terminal 2026"}');
      const myRes = getMyResults();
      const returnedCount = myRes.filter(r => r.verified_status === 'Returned').length;
      const myAvg = myRes.length ? (myRes.reduce((s, r) => s + Number(r.score || 0), 0) / myRes.length).toFixed(1) : '0.0';

      const grades = { A: 0, B: 0, C: 0, D: 0, E: 0, S: 0, F: 0 };
      myRes.forEach(r => {
        const g = r.grade || gradeFromScore(r.score, isALevelClass(r.class_name));
        if (grades[g] !== undefined) grades[g]++;
      });
      const maxG = Math.max(1, ...Object.values(grades));

      const byGroup = {};
      myRes.forEach(r => {
        const k = `${r.class_name || '-'} (${r.subject || '-'})`;
        if (!byGroup[k]) byGroup[k] = { label: k, sum: 0, count: 0 };
        byGroup[k].sum += Number(r.score || 0); byGroup[k].count++;
      });
      const groupBars = Object.values(byGroup).map(x => ({ label: x.label, avg: Number((x.sum / x.count).toFixed(1)) }));
      const sylList = SGB.select('syllabus_tracker');

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Masomo Niliyopangiwa</h4><div class="val">${displayAllocs.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Wastani wa Masomo Yangu</h4><div class="val">${myAvg}%</div></div>
          <div class="card" style="border-color:${examWin.open ? '#059669' : '#dc2626'};"><h4>Dirisha (${examWin.active_exam})</h4><div class="val">${examWin.open ? '🟢 Wazi' : '🔒 Limefungwa'}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Score Sheets Zilizorudishwa</h4><div class="val">${returnedCount}</div></div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; margin-bottom:16px;">
          <div class="panel" style="margin-bottom:0;">
            <h3 style="margin-top:0;">📊 Grafu ya Mgawanyo wa Madaraja (A–F)</h3>
            ${Object.entries(grades).map(([g, cnt]) => {
              const pct = Math.round((cnt / maxG) * 100);
              const col = g === 'A' ? '#059669' : g === 'B' ? '#0284c7' : g === 'C' ? '#2563eb' : g === 'D' ? '#d97706' : '#dc2626';
              return `<div style="margin-bottom:7px;">
                <div style="display:flex; justify-content:space-between; font-size:12px;"><b>Daraja ${g}</b><span>${cnt} wanafunzi</span></div>
                <div style="background:#e2e8f0; height:12px; border-radius:6px; overflow:hidden;">
                  <div style="width:${pct}%; background:${col}; height:100%;"></div>
                </div>
              </div>`;
            }).join('')}
          </div>

          <div class="panel" style="margin-bottom:0;">
            <h3 style="margin-top:0;">📈 Ulinganisho wa Wastani Kwa Kidato & Somo</h3>
            ${groupBars.length ? groupBars.map(b => `
              <div style="margin-bottom:8px;">
                <div style="display:flex; justify-content:space-between; font-size:12px;"><b>${b.label}</b><span><b>${b.avg}%</b></span></div>
                <div style="background:#e2e8f0; height:14px; border-radius:6px; overflow:hidden;">
                  <div style="width:${Math.min(100, b.avg)}%; background:#1d4ed8; height:100%;"></div>
                </div>
              </div>`).join('') : '<p style="color:#64748b; font-size:12px;">Ingiza alama za wanafunzi ili grafu ya madarasa ichoreke.</p>'}
            <hr style="border:0; border-top:1px solid #e2e8f0; margin:10px 0;">
            <h4 style="margin:0 0 6px; font-size:12px;">📖 Maendeleo ya Silabasi (Syllabus Coverage)</h4>
            ${sylList.slice(0, 4).map(s => `<div style="font-size:11.5px; margin-bottom:5px;">
              ${s.class_name} (${s.subject}): <b>${s.percent}%</b>
              <div style="background:#e2e8f0; height:8px; border-radius:4px;"><div style="width:${s.percent}%; background:#059669; height:100%;"></div></div>
            </div>`).join('') || '<small style="color:#64748b;">Hakuna rekodi ya silabasi bado.</small>'}
          </div>
        </div>

        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">📚 Masomo na Madarasa Niliyopangiwa na Mtaaluma</h3>
            ${formToolsHtml('🔍 Tafuta somo au kidato...')}
          </div>
          <table>
            <thead><tr><th>Kidato / Mkondo</th><th>Somo</th><th>Vipindi/Wiki</th><th>Hatua ya Haraka</th></tr></thead>
            <tbody>
            ${displayAllocs.map(a => `<tr>
              <td><b>${a.class_name}</b></td><td><b>${a.subject}</b></td><td>${a.periods_per_week}</td>
              <td><button class="btn btn-green" onclick="openTab('score_entry')">✍️ Jaza Score Sheet</button></td>
            </tr>`).join('') || '<tr><td colspan="4">Mtaaluma bado hajakupangia somo (unaweza kuchagua darasa lolote kwenye Kichupo cha 2).</td></tr>'}
            </tbody>
          </table>
        </div>`;
      applyTcSearch();
      return;
    }
    if (tab === 'score_entry') {
      const students = SGB.select('academic_students');
      const classes = Array.from(new Set(students.map(s => s.class_name).filter(Boolean)));
      const examWin = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"active_exam":"Terminal 2026"}');

      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">✍️ Jaza & Tuma Score Sheet Kwa Mtaaluma (${examWin.active_exam})</h3>
            ${formToolsHtml('🔍 Tafuta mwanafunzi kwenye grid...')}
          </div>
          ${!examWin.open ? '<p style="color:#dc2626; font-weight:bold;">🔒 Dirisha la kuingiza alama limefungwa na Mtaaluma kwa sasa.</p>' : `
          <div style="display:grid; grid-template-columns:1fr 1.2fr 1fr auto; gap:8px; margin-bottom:12px;">
            <select id="tcClassPick" onchange="loadTeacherScoreGrid()">
              <option value="">-- Chagua Kidato --</option>
              ${classes.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
            <input type="text" id="tcSubjectInp" placeholder="Andika Somo Lako (mf. Chemistry)">
            <select id="tcExamType">
              <option value="Midterm">Midterm</option>
              <option value="Terminal">Terminal</option>
              <option value="Annual">Annual</option>
              <option value="Mock">Mock / Pre-NECTA</option>
            </select>
            <button type="button" class="btn btn-blue" onclick="loadTeacherScoreGrid()">📋 Fungua Orodha</button>
          </div>
          <div id="tcGridArea"></div>

          <div style="background:#f8fafc; padding:10px; border:1px dashed #94a3b8; border-radius:7px; margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <b>📥 Au Pakia Score Sheet kwa CSV:</b>
            <button type="button" class="btn btn-blue" onclick="downloadTcMarksCsv()">⬇️ Template (CSV)</button>
            <input type="file" id="tcCsvFile" accept=".csv" style="max-width:240px;">
            <button type="button" class="btn btn-green" onclick="uploadTcMarksCsv()">⬆️ Tuma Kwa Mtaaluma</button>
          </div>`}
        </div>`;
      return;
    }

    if (tab === 'subj_analytics') {
      const myRes = getMyResults();
      const bySubjClass = {};
      myRes.forEach(r => {
        const key = `${r.class_name}|${r.subject}`;
        if (!bySubjClass[key]) bySubjClass[key] = { cls: r.class_name, subj: r.subject, count: 0, sum: 0, A: 0, B: 0, C: 0, D: 0, E: 0, S: 0, F: 0 };
        const sc = Number(r.score || 0);
        const g = r.grade || gradeFromScore(sc, isALevelClass(r.class_name));
        bySubjClass[key].count++; bySubjClass[key].sum += sc;
        if (bySubjClass[key][g] !== undefined) bySubjClass[key][g]++;
      });
      const stats = Object.values(bySubjClass);

      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">📈 Uchambuzi wa Ufaulu wa Somo Langu (O-Level & A-Level)</h3>
            ${formToolsHtml('🔍 Tafuta kidato au somo...')}
          </div>
          <table>
            <thead><tr><th>Kidato</th><th>Somo</th><th>Watahiniwa</th><th>Wastani (%)</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>S</th><th>F</th></tr></thead>
            <tbody>
            ${stats.map(x => `<tr>
              <td><b>${x.cls}</b></td><td><b>${x.subj}</b></td><td>${x.count}</td><td><b>${(x.sum / x.count).toFixed(1)}%</b></td>
              <td>${x.A}</td><td>${x.B}</td><td>${x.C}</td><td>${x.D}</td><td>${x.E}</td><td>${x.S}</td><td style="color:#dc2626;"><b>${x.F}</b></td>
            </tr>`).join('') || '<tr><td colspan="11">Hakuna alama zilizochambuliwa bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      applyTcSearch();
      return;
    }

    if (tab === 'remedial') {
      const weak = getMyResults().filter(r => Number(r.score || 0) < 45);
      area.innerHTML = `
        <div class="panel" style="border-left:4px solid #dc2626;">
          <div class="form-bar">
            <h3 style="margin:0;">🆘 Wanafunzi Wanaohitaji Masomo ya Ziada (Remedial — Chini ya 45%)</h3>
            ${formToolsHtml('🔍 Tafuta mwanafunzi wa remedial...')}
          </div>
          <table>
            <thead><tr><th>Mwanafunzi</th><th>Kidato</th><th>Somo</th><th>Mtihani</th><th>Alama</th><th>Daraja</th><th>Hatua</th></tr></thead>
            <tbody>
            ${weak.map(w => `<tr>
              <td><b>${w.student_name}</b></td><td>${w.class_name}</td><td>${w.subject}</td><td>${w.exam_type}</td>
              <td style="color:#dc2626;"><b>${w.score}%</b></td><td><b>${w.grade}</b></td>
              <td><button class="btn btn-amber" onclick="alert('✅ Mwanafunzi ameongezwa kwenye ratiba ya Remedial!')">➕ Weka Remedial</button></td>
            </tr>`).join('') || '<tr><td colspan="7">Hongera! Hakuna mwanafunzi mwenye ufaulu hafifu kwenye rekodi zako.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      applyTcSearch();
      return;
    }
    if (tab === 'attendance') {
      const students = SGB.select('academic_students');
      const logs = SGB.select('class_attendance');
      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">📋 Mahudhurio ya Darasa (Roll Call) & Tahadhari ya Utoro (${SYSTEM_GATEWAY_PHONE})</h3>
            ${formToolsHtml('🔍 Tafuta mwanafunzi au tarehe...')}
          </div>
          <form onsubmit="saveStudentAttendance(event)" style="display:grid; grid-template-columns:1.6fr 1fr 1fr 1.2fr auto; gap:8px; margin-bottom:12px;">
            <input type="text" id="attStudent" list="stAllList" required placeholder="Jina la Mwanafunzi">
            <select id="attStatus">
              <option value="Present (Yupo)">✅ Present (Yupo)</option>
              <option value="Absent (Mtoro)">❌ Absent (Mtoro)</option>
              <option value="Sick (Mgonjwa)">🏥 Sick (Mgonjwa)</option>
              <option value="Permission (Ruhusa)">📄 Permission (Ruhusa)</option>
            </select>
            <input type="date" id="attDate" value="${new Date().toISOString().slice(0, 10)}">
            <input type="text" id="attNote" placeholder="Maelezo (hiari)">
            <button type="submit" class="btn btn-green">💾 Rekodi</button>
          </form>
          <datalist id="stAllList">${students.map(s => `<option value="${s.full_name}">`).join('')}</datalist>

          <table>
            <thead><tr><th>Tarehe</th><th>Mwanafunzi</th><th>Hali</th><th>Maelezo</th><th>Taarifa Kwa Mzazi</th></tr></thead>
            <tbody>
            ${logs.slice(0, 40).map(l => `<tr>
              <td>${l.att_date}</td><td><b>${l.student_name}</b></td>
              <td><b style="color:${l.status.includes('Absent') ? '#dc2626' : '#059669'};">${l.status}</b></td>
              <td>${l.note || '-'}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-green" style="padding:3px 7px;" onclick="alertParentAttendance('${l.student_name}','${l.status}','${l.att_date}','WA')">💬 WhatsApp</button>
                <button class="btn btn-blue" style="padding:3px 7px;" onclick="alertParentAttendance('${l.student_name}','${l.status}','${l.att_date}','SMS')">📱 SMS</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="5">Hakuna mahudhurio yaliyorekodiwa leo.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      applyTcSearch();
      return;
    }

    if (tab === 'homework') {
      const hws = SGB.select('student_assignments');
      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">📝 Toa Mazoezi ya Nyumbani & Notes Kwa Wanafunzi</h3>
            ${formToolsHtml('🔍 Tafuta zoezi au somo...')}
          </div>
          <form onsubmit="postHomework(event)" style="display:grid; grid-template-columns:1fr 1.2fr 1fr auto; gap:8px; margin-bottom:10px;">
            <input type="text" id="hwClass" required placeholder="Kidato (mf. Form 4A / Form 6 PCM)">
            <input type="text" id="hwSubj" required placeholder="Somo">
            <input type="date" id="hwDue" required title="Tarehe ya Mwisho">
            <button type="submit" class="btn btn-blue">📤 Tuma Kwa Wanafunzi</button>
            <textarea id="hwDesc" rows="2" required placeholder="Andika maswali ya zoezi au muhtasari wa somo (Notes)..." style="grid-column:1 / -1;"></textarea>
          </form>
          <table><thead><tr><th>Kidato</th><th>Somo</th><th>Zoezi / Notes</th><th>Mwisho</th><th>Mwalimu</th></tr></thead>
          <tbody>${hws.map(h => `<tr><td><b>${h.class_name}</b></td><td><b>${h.subject}</b></td><td>${h.description}</td><td>${h.due_date}</td><td>${h.teacher_name}</td></tr>`).join('') || '<tr><td colspan="5">Hakuna mazoezi yaliyotumwa bado.</td></tr>'}</tbody></table>
        </div>`;
      applyTcSearch();
      return;
    }

    if (tab === 'discipline') {
      const discs = SGB.select('discipline_logs');
      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">⚖️ Kumbukumbu za Nidhamu & Maoni ya Mwalimu wa Darasa</h3>

  function submitTeacherScoreSheet(e, cls, subj, exam) {
    e.preventDefault();
    const aLevel = isALevelClass(cls);
    let count = 0;
    document.querySelectorAll('.tc-sc-inp').forEach(inp => {
      if (inp.value !== '') {
        const sc = Number(inp.value);
        SGB.insert('exam_results', { student_name: inp.dataset.name, class_name: cls, subject: subj, exam_type: exam, score: sc, grade: gradeFromScore(sc, aLevel), teacher_name: myTeacherName, verified_status: 'Pending' });
        count++;
      }
    });
    alert(`✅ Score Sheet yenye alama ${count} imetumwa kwa Mtaaluma kwa uhakiki!`);
    openTab('subj_analytics');
  }

  function downloadTcMarksCsv() {
    const csv = "Jina la Mwanafunzi,Kidato,Somo,Mtihani,Alama\nAsha Juma Mwita,Form 4A,Chemistry,Terminal,78";
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Template_ScoreSheet_Mwalimu.csv'; a.click();
  }

  function uploadTcMarksCsv() {
    const inp = document.getElementById('tcCsvFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la CSV kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      ev.target.result.split(/\r?\n/).slice(1).forEach(line => {
        const c = line.split(',');
        if (c.length >= 5 && c.at(0).trim()) {
          const cls = c.at(1).trim();
          const sc = Number(c.at(4) || 0);
          SGB.insert('exam_results', { student_name: c.at(0).trim(), class_name: cls, subject: c.at(2).trim(), exam_type: c.at(3).trim(), score: sc, grade: gradeFromScore(sc, isALevelClass(cls)), teacher_name: myTeacherName, verified_status: 'Pending' });
        }
      });
      alert('✅ Score Sheet kutoka CSV imetumwa kwa Mtaaluma!');
      openTab('subj_analytics');
    };
    reader.readAsText(file);
  }

  function alertParentAttendance(stName, status, dt, channel) {
    const reg = SGB.select('academic_students').find(s => (s.full_name || '').toLowerCase() === stName.toLowerCase());
    let phone = reg?.parent_phone || prompt(`Ingiza namba ya simu ya mzazi wa ${stName}:`);
    if (!phone || !phone.trim()) return;
    const msg = `SHULE YA SEKONDARI SANGABUYE\nTaarifa ya Mahudhurio ya ${stName.toUpperCase()} tarehe ${dt}: ${status}.\nMawasiliano: ${SYSTEM_GATEWAY_PHONE}`;
    let intl = phone.replace(/\D/g, '');
    if (intl.startsWith('0')) intl = '255' + intl.slice(1);
    SGB.insert('sms_outbox', { recipient_name: `Mzazi wa ${stName}`, phone: phone.trim(), sender_gateway: `${SYSTEM_GATEWAY_PHONE} (${channel})`, message: msg, status: 'Imetumwa' });
    if (channel === 'WA') window.open(`https://wa.me{intl}?text=${encodeURIComponent(msg)}`, '_blank');
    else window.open(`sms:${phone.trim()}?body=${encodeURIComponent(msg)}`, '_self');
  }
