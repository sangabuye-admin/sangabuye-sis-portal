<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mtaaluma (Academic Master v11.0 — Form 1-6) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 265px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11.8px; margin-bottom: 2px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .form-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .a4-sheet {
      background: #fff; border: 2px solid #0f294a; padding: 16px 20px; max-width: 790px;
      margin: 0 auto 18px; line-height: 1.42; font-size: 11.5px; color: #0f172a;
    }
    .school-stamp {
      border: 2.5px solid #1d4ed8; color: #1d4ed8; border-radius: 50%; width: 92px; height: 92px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; font-size: 8.5px; font-weight: bold; transform: rotate(-10deg);
      padding: 4px; line-height: 1.2;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MTAALUMA</h2>
  <p>Form 1–6 | NECTA Standard</p>

  <div class="grp-lbl">A. Wanafunzi & Walimu</div>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari wa Taaluma</button>
  <button class="menu-btn" onclick="openTab('students_prem', this)">🏫 2. Wanafunzi, PREM & Tahasusi</button>
  <button class="menu-btn" onclick="openTab('allocations', this)">👨‍🏫 3. Mgawanyo wa Masomo</button>

  <div class="grp-lbl">B. Score Sheets & Alama</div>
  <button class="menu-btn" onclick="openTab('score_sheets', this)">📥 4. Pokea Score Sheets za Walimu</button>
  <button class="menu-btn" onclick="openTab('master_entry', this)">✍️ 5. Jaza Alama za Masomo Yote</button>
  <button class="menu-btn" onclick="openTab('exam_publish', this)">📢 6. Dirisha & Tangaza Matokeo</button>

  <div class="grp-lbl">C. Matokeo, SMS/WA & Ripoti A4</div>
  <button class="menu-btn" onclick="openTab('merit', this)">🏆 7. Generate Results & Broadsheet</button>
  <button class="menu-btn" onclick="openTab('subject_rank', this)">📈 8. Msimamo wa Kila Somo</button>
  <button class="menu-btn" onclick="openTab('class_compare', this)">📊 9. Ulinganisho wa Madarasa</button>
  <button class="menu-btn" onclick="openTab('term_reports', this)">📜 10. Ripoti ya Muhula (A4 Batch)</button>
  <button class="menu-btn" onclick="openTab('hall_cards', this)">🪪 11. Vibali vya Mtihani (Permits)</button>
  <button class="menu-btn" onclick="openTab('leaving_cert', this)">🎓 12. Cheti cha Kuhitimu (A4)</button>

  <div class="grp-lbl">D. Ratiba, Ukaguzi & Maktaba</div>
  <button class="menu-btn" onclick="openTab('timetable', this)">📅 13. Ratiba & Silabasi</button>
  <button class="menu-btn" onclick="openTab('lesson_audit', this)">📑 14. Ukaguzi wa Maandalio</button>
  <button class="menu-btn" onclick="openTab('promotion', this)">🔄 15. Pandisha Madarasa (F1–6)</button>
  <button class="menu-btn" onclick="openTab('acad_library', this)">📚 16. Maktaba, Vikao & SMS Outbox</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Taaluma</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div style="display:flex; gap:8px; align-items:center; flex:1; max-width:460px;">
      <input type="text" id="globalAcadSearch" onkeyup="filterAcademicTables(this.value)" placeholder="🔍 Tafuta kwa herufi za jina, PREM, simu, kidato au somo...">
      <button type="button" class="btn btn-blue" style="white-space:nowrap;" onclick="refreshAcademicNow()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['academic', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();

  const SYSTEM_GATEWAY_PHONE = '0615000305';
  localStorage.setItem('sgb_system_gateway_phone', SYSTEM_GATEWAY_PHONE);
  let currentActiveTab = 'overview';

  const STANDARD_CLASSES = [
    'Form 1A', 'Form 1B', 'Form 1C', 'Form 1D',
    'Form 2A', 'Form 2B', 'Form 2C', 'Form 2D',
    'Form 3A', 'Form 3B', 'Form 3C', 'Form 3D',
    'Form 4A', 'Form 4B', 'Form 4C', 'Form 4D',
    'Form 5 PCM', 'Form 5 PCB', 'Form 5 PGM', 'Form 5 CBG', 'Form 5 EGM', 'Form 5 ECA', 'Form 5 HGL', 'Form 5 HKL', 'Form 5 HGK', 'Form 5 PMC',
    'Form 6 PCM', 'Form 6 PCB', 'Form 6 PGM', 'Form 6 CBG', 'Form 6 EGM', 'Form 6 ECA', 'Form 6 HGL', 'Form 6 HKL', 'Form 6 HGK', 'Form 6 PMC'
  ];

  function classOptionsHtml(selected = '') {
    return STANDARD_CLASSES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  function normClass(str) {
    return String(str || '').toLowerCase()
      .replace(/kidato cha kwanza|kwanza/g, '1')
      .replace(/kidato cha pili|pili/g, '2')
      .replace(/kidato cha tatu|tatu/g, '3')
      .replace(/kidato cha nne|nne/g, '4')
      .replace(/kidato cha tano|tano/g, '5')
      .replace(/kidato cha sita|sita/g, '6')
      .replace(/form|kidato|cha|stream|mkondo/g, '')
      .replace(/\bvi\b/g, '6').replace(/\bv\b/g, '5').replace(/\biv\b/g, '4')
      .replace(/\biii\b/g, '3').replace(/\bii\b/g, '2').replace(/\bi\b/g, '1')
      .replace(/[^a-z0-9]/g, '');
  }
  function getExamTypesList() {
    const saved = JSON.parse(localStorage.getItem('sgb_exam_types') || 'null');
    if (saved && saved.length) return saved;
    const defaults = ['Midterm March', 'Terminal', 'Midterm September', 'Annual', 'Mock / Pre-NECTA'];
    localStorage.setItem('sgb_exam_types', JSON.stringify(defaults));
    return defaults;
  }

  function examOptionsHtml(selected = '') {
    return getExamTypesList().map(ex => `<option value="${ex}" ${ex === selected ? 'selected' : ''}>${ex}</option>`).join('');
  }

  function getUnifiedStudents() {
    const map = {};
    SGB.select('academic_students').forEach(s => {
      const k = (s.full_name || '').trim().toLowerCase();
      if (k) map[k] = { ...s, full_name: s.full_name.trim(), gender: (s.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M' };
    });
    SGB.select('users_profile').filter(u => (u.role || '').toLowerCase() === 'student').forEach(u => {
      const k = (u.full_name || '').trim().toLowerCase();
      if (k && !map[k]) {
        map[k] = {
          id: u.id, full_name: u.full_name.trim(), gender: (u.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M',
          class_name: u.class_name || u.department || 'Form 1A', combination: u.combination || 'O-Level',
          prem_no: u.username || '-', parent_phone: u.phone || ''
        };
      }
    });
    return Object.values(map);
  }

  function isALevelClass(cls) {
    const n = normClass(cls);
    return n.startsWith('5') || n.startsWith('6');
  }

  function gradeFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 'A'; if (s >= 70) return 'B'; if (s >= 60) return 'C';
      if (s >= 50) return 'D'; if (s >= 40) return 'E'; if (s >= 35) return 'S';
      return 'F';
    }
    if (s >= 75) return 'A'; if (s >= 65) return 'B'; if (s >= 45) return 'C';
    if (s >= 30) return 'D'; return 'F';
  }

  function remarkFromGrade(g) {
    if (g === 'A') return 'Vizuri Sana (Excellent)';
    if (g === 'B') return 'Vizuri (Very Good)';
    if (g === 'C') return 'Wastani (Good)';
    if (g === 'D') return 'Inaridhisha (Satisfactory)';
    if (g === 'E' || g === 'S') return 'Subsidiary / Pass';
    return 'Feli - Ongeza Bidii (Fail)';
  }
  function computeClassSummaries(filterClass = 'ALL', exam1 = 'ALL', exam2 = 'NONE') {
    const regStudents = getUnifiedStudents();
    let targetStudents = regStudents;
    if (filterClass !== 'ALL') {
      targetStudents = regStudents.filter(s => normClass(s.class_name) === normClass(filterClass));
    }

    const allResults = SGB.select('exam_results').filter(r => r.verified_status !== 'Returned');
    const isCombined = exam2 && exam2 !== 'NONE' && exam1 !== 'ALL';

    const summaries = targetStudents.map(reg => {
      const stNameLow = (reg.full_name || '').trim().toLowerCase();
      const stRes = allResults.filter(r => (r.student_name || '').trim().toLowerCase() === stNameLow);
      const aLevel = isALevelClass(reg.class_name);
      const minRequired = aLevel ? 3 : 7;

      const subjMap = {};
      stRes.forEach(r => {
        const ex = (r.exam_type || '').trim();
        if (exam1 !== 'ALL') {
          if (!isCombined && ex.toLowerCase() !== exam1.toLowerCase()) return;
          if (isCombined && ex.toLowerCase() !== exam1.toLowerCase() && ex.toLowerCase() !== exam2.toLowerCase()) return;
        }
        const sName = (r.subject || 'Somo').trim();
        if (!subjMap[sName]) subjMap[sName] = { subject: sName, s1: null, s2: null, scores: new Array(), teacher: r.teacher_name || '-' };
        const sc = Number(r.score || 0);
        subjMap[sName].scores.push(sc);
        if (ex.toLowerCase() === exam1.toLowerCase()) subjMap[sName].s1 = sc;
        else if (isCombined && ex.toLowerCase() === exam2.toLowerCase()) subjMap[sName].s2 = sc;
      });

      const subjects = Object.values(subjMap).map(item => {
        const finalScore = isCombined
          ? Number((((item.s1 ?? item.s2 ?? 0) + (item.s2 ?? item.s1 ?? 0)) / 2).toFixed(1))
          : Number((item.scores.reduce((a, b) => a + b, 0) / item.scores.length).toFixed(1));
        return {
          subject: item.subject, s1: item.s1, s2: item.s2,
          score: finalScore, grade: gradeFromScore(finalScore, aLevel), teacher_name: item.teacher
        };
      });

      const subCount = subjects.length;
      const total = Number(subjects.reduce((sum, x) => sum + x.score, 0).toFixed(1));
      const avg = subCount > 0 ? Number((total / subCount).toFixed(1)) : 0;

      if (subCount === 0) {
        return { name: reg.full_name, gender: reg.gender, cls: reg.class_name, comb: reg.combination || 'O-Level', prem: reg.prem_no || '-', parent_phone: reg.parent_phone || '', subjects, subCount: 0, total: 0, avg: 0, totalPts: '-', div: 'ABSENT (ABS)', statusFlag: 'ABS', levelTag: aLevel ? 'A-Level' : 'O-Level' };
      }
      if (subCount < minRequired) {
        return { name: reg.full_name, gender: reg.gender, cls: reg.class_name, comb: reg.combination || 'O-Level', prem: reg.prem_no || '-', parent_phone: reg.parent_phone || '', subjects, subCount, total, avg, totalPts: '-', div: `INCOMPLETE (${subCount}/${minRequired})`, statusFlag: 'INC', levelTag: aLevel ? 'A-Level' : 'O-Level' };
      }

      if (aLevel) {
        const principalSubs = subjects.filter(s => !['gs', 'general studies', 'bam', 'basic applied mathematics'].includes(s.subject.toLowerCase()));
        if (principalSubs.length < 3) {
          return { name: reg.full_name, gender: reg.gender, cls: reg.class_name, comb: reg.combination || 'PCB/PCM', prem: reg.prem_no || '-', parent_phone: reg.parent_phone || '', subjects, subCount, total, avg, totalPts: '-', div: `INCOMPLETE (${principalSubs.length}/3 Prin)`, statusFlag: 'INC', levelTag: 'A-Level' };
        }
        const pts = principalSubs.map(s => s.score >= 80 ? 1 : s.score >= 70 ? 2 : s.score >= 60 ? 3 : s.score >= 50 ? 4 : s.score >= 40 ? 5 : s.score >= 35 ? 6 : 7).sort((a, b) => a - b).slice(0, 3);
        const totalPts = pts.reduce((a, b) => a + b, 0);
        const div = totalPts <= 9 ? 'Div I' : totalPts <= 12 ? 'Div II' : totalPts <= 17 ? 'Div III' : totalPts <= 19 ? 'Div IV' : 'Div 0';
        return { name: reg.full_name, gender: reg.gender, cls: reg.class_name, comb: reg.combination || 'A-Level', prem: reg.prem_no || '-', parent_phone: reg.parent_phone || '', subjects, subCount, total, avg, totalPts, div, statusFlag: 'COMPLETE', levelTag: 'A-Level' };
      } else {
        const pts = subjects.map(s => s.score >= 75 ? 1 : s.score >= 65 ? 2 : s.score >= 45 ? 3 : s.score >= 30 ? 4 : 5).sort((a, b) => a - b).slice(0, 7);
        const totalPts = pts.reduce((a, b) => a + b, 0);
        const div = totalPts <= 17 ? 'Div I' : totalPts <= 21 ? 'Div II' : totalPts <= 25 ? 'Div III' : totalPts <= 33 ? 'Div IV' : 'Div 0';
        return { name: reg.full_name, gender: reg.gender, cls: reg.class_name, comb: 'O-Level', prem: reg.prem_no || '-', parent_phone: reg.parent_phone || '', subjects, subCount, total, avg, totalPts, div, statusFlag: 'COMPLETE', levelTag: 'O-Level' };
      }
    });

    const sorted = summaries.sort((a, b) => {
      const order = { COMPLETE: 1, INC: 2, ABS: 3 };
      if (order[a.statusFlag] !== order[b.statusFlag]) return order[a.statusFlag] - order[b.statusFlag];
      return b.avg - a.avg;
    });
    const activeCandidates = sorted.filter(x => x.statusFlag !== 'ABS').length;
    return sorted.map((item, idx) => ({ ...item, rank: item.statusFlag === 'ABS' ? '-' : idx + 1, outOf: activeCandidates }));
  }
  function openTab(tab, btn) {
    currentActiveTab = tab;
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const students = getUnifiedStudents();
      const boys = students.filter(s => s.gender === 'M').length;
      const girls = students.filter(s => s.gender === 'F').length;
      const summaries = computeClassSummaries('ALL', 'ALL', 'NONE');
      const results = SGB.select('exam_results');
      const pendingSheets = results.filter(r => r.verified_status === 'Pending').length;
      const activeList = summaries.filter(s => s.statusFlag !== 'ABS');
      const schoolAvg = activeList.length ? (activeList.reduce((s, x) => s + x.avg, 0) / activeList.length).toFixed(1) : '0.0';

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Wanafunzi (Wavulana: ${boys} | Wasichana: ${girls})</h4><div class="val">${students.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Wastani wa Shule</h4><div class="val">${schoolAvg}%</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Score Sheets Zinazosubiri</h4><div class="val">${pendingSheets}</div></div>
          <div class="card" style="border-color:#7c3aed;"><h4>Aina za Mitihani</h4><div class="val">${getExamTypesList().length}</div></div>
        </div>

        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">🏅 Wanafunzi 10 Bora Shuleni (Waliokamilisha Masomo 7)</h3>
            <button class="btn btn-blue" onclick="refreshAcademicNow()">🔄 Refresh Fomu</button>
          </div>
          <table>
            <thead><tr><th>Nafasi</th><th>Jina la Mwanafunzi</th><th>Jinsia</th><th>Kidato</th><th>Masomo</th><th>Jumla</th><th>Wastani</th><th>Points</th><th>Division</th></tr></thead>
            <tbody>
            ${summaries.filter(x => x.statusFlag === 'COMPLETE').slice(0, 10).map((s, idx) => `<tr>
              <td><b>#${idx + 1}</b></td><td><b>${s.name}</b></td><td>${s.gender}</td><td>${s.cls}</td><td>${s.subCount}</td>
              <td>${s.total}</td><td><b>${s.avg}%</b></td><td>${s.totalPts}</td><td><b>${s.div}</b></td>
            </tr>`).join('') || '<tr><td colspan="9">Hakuna mwanafunzi aliyekamilisha masomo 7 bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      applyActiveSearchFilter();
      return;
    }
    if (tab === 'students_prem') {
      const students = getUnifiedStudents();
      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">🏫 Sajili Mwanafunzi (Kidato Sanifu Form 1–6, Jinsia M/F, PREM & Simu ya Mzazi)</h3>
            <button class="btn btn-blue" onclick="refreshAcademicNow()">🔄 Refresh Fomu</button>
          </div>
          <form onsubmit="addAcadStudent(event)" style="display:grid; grid-template-columns:1.6fr 0.7fr 1fr 0.8fr 0.9fr 1fr auto; gap:6px; margin-bottom:12px;">
            <input type="text" id="stFull" required placeholder="Jina Kamili">
            <select id="stGender" required><option value="M">M (Mvulana)</option><option value="F">F (Msichana)</option></select>
            <select id="stClass" onchange="autoSetCombinationFromClass(this.value)" required>${classOptionsHtml('Form 1A')}</select>
            <select id="stComb">
              <option value="O-Level">O-Level</option>
              <option value="PCM">PCM</option><option value="PCB">PCB</option><option value="PGM">PGM</option>
              <option value="CBG">CBG</option><option value="EGM">EGM</option><option value="ECA">ECA</option>
              <option value="HGL">HGL</option><option value="HKL">HKL</option><option value="HGK">HGK</option><option value="PMC">PMC</option>
            </select>
            <input type="text" id="stPrem" placeholder="PREM No">
            <input type="tel" id="stParentPhone" placeholder="Simu ya Mzazi (07...)">
            <button type="submit" class="btn btn-green">✅ Sajili</button>
          </form>

          <div style="background:#f8fafc; padding:10px; border:1px dashed #94a3b8; border-radius:7px; margin-bottom:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <b>📥 Pakia Wanafunzi Wengi (CSV):</b>
            <button type="button" class="btn btn-blue" onclick="downloadStTemplate()">⬇️ Pakua Template (CSV)</button>
            <input type="file" id="stCsvFile" accept=".csv" style="max-width:240px;">
            <button type="button" class="btn btn-amber" onclick="uploadStCsv()">⬆️ Pakia Wote</button>
          </div>

          <table>
            <thead><tr><th>PREM No</th><th>Jina Kamili</th><th>Jinsia</th><th>Kidato</th><th>Tahasusi</th><th>Simu ya Mzazi</th><th>Kitendo</th></tr></thead>
            <tbody>
            ${students.map(s => `<tr>
              <td><b>${s.prem_no || '-'}</b></td><td><b>${s.full_name}</b></td><td><b>${s.gender}</b></td>
              <td><b>${s.class_name}</b></td><td>${s.combination || 'O-Level'}</td><td><b>${s.parent_phone || '-'}</b></td>
              <td style="white-space:nowrap;">
                <button class="btn btn-amber" onclick="transferStudentStream('${s.id}','${(s.full_name || '').replace(/'/g, '')}','${s.class_name}','${s.combination || 'O-Level'}')">🔄 Hamisha</button>
                <button class="btn btn-red" onclick="deleteAcadStudent('${s.id}','${(s.full_name || '').replace(/'/g, '')}')">Futa</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="7">Hakuna wanafunzi waliosajiliwa bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      applyActiveSearchFilter();
      return;
    }
    if (tab === 'allocations') {
      const allocs = SGB.select('subject_allocations');
      const teachers = SGB.select('users_profile').filter(u => ['teacher', 'academic', 'headmaster'].includes((u.role || '').toLowerCase()));
      area.innerHTML = `
        <div class="panel">
          <div class="form-bar">
            <h3 style="margin:0;">👨‍🏫 Panga Mgawanyo wa Masomo Kwa Walimu (Kidato Sanifu Form 1–6)</h3>
            <button class="btn btn-blue" onclick="refreshAcademicNow()">🔄 Refresh Fomu</button>
          </div>
          <form onsubmit="addSubjectAllocation(event)" style="display:grid; grid-template-columns:1.5fr 1fr 1.2fr 0.7fr auto; gap:8px; margin-bottom:12px;">
            <select id="alTeacher" required>
              <option value="">-- Chagua Mwalimu --</option>

  function generateA4Reports(mode) {
    const cls = document.getElementById('repClassPick')?.value || 'Form 1A';
    const ex1 = document.getElementById('repEx1Pick')?.value || 'Terminal';
    const ex2 = document.getElementById('repEx2Pick')?.value || 'NONE';
    const acadPhone = (document.getElementById('repAcadPhone')?.value || '').trim();
    if (!acadPhone) { alert('⚠️ Tafadhali ingiza namba ya simu ya Mtaaluma kwanza kabla ya kutengeneza ripoti.'); return; }
    localStorage.setItem('sgb_academic_master_phone', acadPhone);

    const opts = {
      ex1, ex2, acadPhone,
      closeDate: document.getElementById('repCloseDate')?.value || '2026-12-04',
      openDate: document.getElementById('repOpenDate')?.value || '2027-01-11',
      conduct: document.getElementById('repConduct')?.value || 'Nzuri Sana',
      termLbl: document.getElementById('repTermLbl')?.value || 'Ripoti ya Maendeleo ya Muhula — 2026',
      ctRem: document.getElementById('repClassTeacherRem')?.value || '',
      acRem: document.getElementById('repAcadRem')?.value || '',
      hmRem: document.getElementById('repHmRem')?.value || ''
    };

    const classSummaries = computeClassSummaries(cls, ex1, ex2);
    let targets = classSummaries;
    if (mode === 'SINGLE') {
      const name = document.getElementById('singleStReportPick')?.value;
      if (!name) { alert('⚠️ Chagua mwanafunzi mmoja kwanza.'); return; }
      targets = classSummaries.filter(s => s.name === name);
    }
    if (!targets.length) { alert(`⚠️ Hakuna wanafunzi waliosajiliwa kwenye darasa la ${cls}.`); return; }
    document.getElementById('a4ReportsContainer').innerHTML = targets.map(st => buildSingleA4ReportHtml(st, opts)).join('');
  }

  function transferStudentStream(id, fullName, oldClass, oldComb) {
    const newClass = prompt(`Ingiza Kidato/Mkondo mpya wa ${fullName} (mf. Form 1B au Form 5 PCB — sasa ni ${oldClass}):`, oldClass);
    if (!newClass || !newClass.trim()) return;
    const newComb = prompt(`Ingiza Tahasusi mpya (sasa ni ${oldComb}):`, oldComb) || oldComb;
    const nLow = (fullName || '').trim().toLowerCase();

    const acadList = SGB.select('academic_students').map(x =>
      (String(x.id) === String(id) || (nLow && (x.full_name || '').trim().toLowerCase() === nLow))
        ? { ...x, class_name: newClass.trim(), combination: newComb.trim() } : x
    );
    if (!acadList.some(x => (x.full_name || '').trim().toLowerCase() === nLow)) {
      acadList.push({ id: id || Date.now(), full_name: fullName, gender: 'M', class_name: newClass.trim(), combination: newComb.trim(), prem_no: '-' });
    }
    localStorage.setItem('sgb_academic_students', JSON.stringify(acadList));
    SGB.pushToCloud('academic_students');

    const userList = SGB.select('users_profile').map(u =>
      (String(u.id) === String(id) || (nLow && (u.full_name || '').trim().toLowerCase() === nLow))
        ? { ...u, class_name: newClass.trim(), department: newClass.trim(), combination: newComb.trim() } : u
    );
    localStorage.setItem('sgb_users_profile', JSON.stringify(userList));
    SGB.pushToCloud('users_profile');

    alert('✅ Mwanafunzi amehamishwa mkondo/tahasusi!');
    openTab('students_prem');
  }

  function uploadStCsv() {
    const inp = document.getElementById('stCsvFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la CSV kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      ev.target.result.split(/\r?\n/).slice(1).forEach(line => {
        const c = line.split(',');
        if (c.length >= 2 && c.at(0).trim()) {
          SGB.insert('academic_students', { full_name: c.at(0).trim(), gender: (c.at(1) || 'M').trim().toUpperCase().startsWith('F') ? 'F' : 'M', class_name: (c.at(2) || 'Form 1A').trim(), combination: (c.at(3) || 'O-Level').trim(), prem_no: (c.at(4) || '-').trim(), parent_phone: (c.at(5) || '').trim() });
        }
      });
      openTab('students_prem');
    };
    reader.readAsText(file);
  }

    openTab('merit');
  }
  function downloadMarksCsvTemplate() {
    const csv = "Jina la Mwanafunzi,Kidato,Somo,Mtihani,Alama\nAsha Juma Mwita,Form 5 PCM,Physics,Terminal,82";
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Template_Alama_Masomo.csv'; a.click();
  }

  function uploadMarksCsv() {
    const inp = document.getElementById('marksCsvFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la CSV kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      ev.target.result.split(/\r?\n/).slice(1).forEach(line => {
        const c = line.split(',');
        if (c.length >= 5 && c.at(0).trim()) {
          const cls = c.at(1).trim();
          const sc = Number(c.at(4) || 0);
          SGB.insert('exam_results', { student_name: c.at(0).trim(), class_name: cls, subject: c.at(2).trim(), exam_type: c.at(3).trim(), score: sc, grade: gradeFromScore(sc, isALevelClass(cls)), teacher_name: 'Ofisi ya Mtaaluma (CSV)', verified_status: 'Approved' });
        }
      });
      alert('✅ Alama zote kutoka CSV zimepakiwa!');
      openTab('merit');
    };
    reader.readAsText(file);
  }
  function filterAcademicTables(query) {
    const q = (query || '').trim().toLowerCase();
    document.querySelectorAll('#viewArea table tbody tr').forEach(tr => {
      tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  }

  function applyActiveSearchFilter() {
    const q = document.getElementById('globalAcadSearch')?.value || '';
    if (q.trim()) filterAcademicTables(q);
  }

  async function refreshAcademicNow() {
    await SGB.pullFromCloud(true);
    openTab(currentActiveTab);
    const st = document.getElementById('syncTime');
    if (st) st.innerText = ` (Imesasishwa: ${new Date().toLocaleTimeString()})`;
  }
  function sendStudentResultMsg(studentName, channel) {
    const selCls = window._meritClass || 'ALL';
    const selEx1 = window._meritEx1 || 'ALL';
    const selEx2 = window._meritEx2 || 'NONE';
    const st = computeClassSummaries(selCls, selEx1, selEx2).find(x => x.name === studentName);
    if (!st) return;
    const reg = getUnifiedStudents().find(s => (s.full_name || '').toLowerCase() === studentName.toLowerCase());
    let phone = reg?.parent_phone || st.parent_phone || prompt(`Ingiza namba ya simu ya mzazi wa ${st.name}:`);
    if (!phone || !phone.trim()) return;

    const acadPhone = localStorage.getItem('sgb_academic_master_phone') || SYSTEM_GATEWAY_PHONE;
    const subjLines = st.subjects.map(sub => `${sub.subject}: ${sub.score}% (${sub.grade})`).join(', ');
    const msg = `SHULE YA SEKONDARI SANGABUYE\nMatokeo ya ${st.name.toUpperCase()} (${st.cls}):\n${subjLines || 'ABSENT (ABS)'}\nJumla: ${st.total} | Wastani: ${st.avg}% | ${st.div} | Nafasi: ${st.rank === '-' ? 'ABS' : '#' + st.rank + '/' + st.outOf}.\nOfisi ya Mtaaluma: ${acadPhone}`;

    let intl = phone.replace(/\D/g, '');
    if (intl.startsWith('0')) intl = '255' + intl.slice(1);
    SGB.insert('sms_outbox', { recipient_name: `Mzazi wa ${st.name}`, phone: phone.trim(), sender_gateway: `${acadPhone} (${channel})`, message: msg, status: 'Imetumwa' });
    if (channel === 'WA') window.open(`https://wa.me{intl}?text=${encodeURIComponent(msg)}`, '_blank');
    else window.open(`sms:${phone.trim()}?body=${encodeURIComponent(msg)}`, '_self');
  }
  function updateExamPublishState(open, published) {
    const active_exam = document.getElementById('pubExamTitle')?.value.trim() || 'Terminal';
    localStorage.setItem('sgb_exam_window', JSON.stringify({ open, published, active_exam }));
    SGB.pushToCloud('exam_window');
    openTab('exam_publish');
  }

  function addTimetableSlot(e) {
    e.preventDefault();
    SGB.insert('school_timetable', { day_name: document.getElementById('ttDay').value, time_slot: document.getElementById('ttTime').value.trim(), class_name: document.getElementById('ttCls').value, subject: document.getElementById('ttSubj').value.trim(), teacher_name: document.getElementById('ttTeacher').value.trim() });
    openTab('timetable');
  }

  function addSyllabusLog(e) {
    e.preventDefault();
    SGB.insert('syllabus_tracker', { class_name: document.getElementById('syCls').value, subject: document.getElementById('sySubj').value.trim(), teacher_name: document.getElementById('syTeacher').value.trim(), percent: Number(document.getElementById('syPct').value || 0) });
    openTab('timetable');
  }

  function submitLessonPlanLog(e) {
    e.preventDefault();
    SGB.insert('lesson_plans', { teacher_name: document.getElementById('lpTeacher').value.trim(), class_name: document.getElementById('lpClass').value, subject: document.getElementById('lpSubj').value.trim(), doc_type: document.getElementById('lpType').value, status: 'Inasubiri Uhakiki' });
    openTab('lesson_audit');
  }
  function promoteAllStudents() {
    if (!confirm('Je, una uhakika unataka kupandisha wanafunzi wote (Form 1–6) darasa linalofuata?')) return;
    const upgraded = SGB.select('academic_students').map(s => {
      const c = (s.class_name || '').toLowerCase();
      let next = s.class_name;
      if (c.includes('1')) next = s.class_name.replace(/1/g, '2');
      else if (c.includes('2')) next = s.class_name.replace(/2/g, '3');
      else if (c.includes('3')) next = s.class_name.replace(/3/g, '4');
      else if (c.includes('4')) next = 'Alumni O-Level (Mhitimu F4)';
      else if (c.includes('5')) next = s.class_name.replace(/5/g, '6');
      else if (c.includes('6')) next = 'Alumni A-Level (Mhitimu F6)';
      return { ...s, class_name: next };
    });
    localStorage.setItem('sgb_academic_students', JSON.stringify(upgraded));
    SGB.pushToCloud('academic_students');
    alert('✅ Wanafunzi wote (Form 1–6) wamepandishwa madarasa!');
    openTab('students_prem');
  }

  function downloadMeritCsv() {
    const selCls = window._meritClass || 'Form 1A';
    const selEx1 = window._meritEx1 || 'ALL';
    const selEx2 = window._meritEx2 || 'NONE';
    const list = computeClassSummaries(selCls, selEx1, selEx2);
    let csv = "Nafasi,Mwanafunzi,Jinsia,Kidato,Masomo,Jumla,Wastani,Points,Division_au_Hali\n";
    list.forEach(s => { csv += `"${s.rank}","${s.name}","${s.gender}","${s.cls}",${s.subCount},${s.total},${s.avg},"${s.totalPts}","${s.div}"\n`; });
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = `Matokeo_${selCls}_Sangabuye.csv`; a.click();
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
