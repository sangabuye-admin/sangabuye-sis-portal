<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mtaaluma (Academic Master v13.0 — Mtaala Mpya) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <script src="https://sheetjs.com"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; overflow-x: hidden; }
    .sidebar { width: 265px; flex-shrink: 0; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11.8px; margin-bottom: 2px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { background: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 16px; min-width: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 10.5px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; overflow-x: auto; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; min-width: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .a4-sheet { border: 2px solid #0f294a; padding: 14px 18px; background: #fff; margin-bottom: 16px; line-height: 1.4; }
    .school-stamp { border: 2px solid #1d4ed8; color: #1d4ed8; border-radius: 50%; width: 82px; height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 7.5px; font-weight: bold; transform: rotate(-10deg); }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MTAALUMA</h2>
  <p id="acSideName">Form 1–6 | Mtaala Mpya & NECTA</p>

  <div class="grp-lbl">A. Wanafunzi & Walimu</div>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari wa Taaluma</button>
  <button class="menu-btn" onclick="openTab('students_prem', this)">🏫 2. Wanafunzi, PREM & Tahasusi</button>
  <button class="menu-btn" onclick="openTab('allocations', this)">👨‍🏫 3. Mgawanyo wa Masomo</button>

  <div class="grp-lbl">B. Score Sheets & Alama</div>
  <button class="menu-btn" onclick="openTab('score_sheets', this)">📥 4. Pokea Score Sheets za Walimu</button>
  <button class="menu-btn" onclick="openTab('master_entry', this)">✍️ 5. Jaza Alama & Excel (.xlsx)</button>
  <button class="menu-btn" onclick="openTab('exam_publish', this)">📢 6. Dirisha, Muda & Tangaza Matokeo</button>

  <div class="grp-lbl">C. Matokeo, SMS/WA & Ripoti A4</div>
  <button class="menu-btn" onclick="openTab('merit', this)">🏆 7. Generate Results & Broadsheet</button>
  <button class="menu-btn" onclick="openTab('subject_rank', this)">📈 8. Msimamo wa Kila Somo</button>
  <button class="menu-btn" onclick="openTab('class_compare', this)">📊 9. Ulinganisho wa Madarasa</button>
  <button class="menu-btn" onclick="openTab('term_reports', this)">📜 10. Ripoti ya Muhula (A4 Batch)</button>
  <button class="menu-btn" onclick="openTab('hall_cards', this)">🪪 11. Vibali vya Mtihani (Permits)</button>
  <button class="menu-btn" onclick="openTab('leaving_cert', this)">🎓 12. Cheti cha Kuhitimu (A4)</button>

  <div class="grp-lbl">D. Ratiba, Ukaguzi & Maktaba</div>
  <button class="menu-btn" onclick="openTab('timetable', this)">📅 13. Ratiba & Silabasi</button>
  <button class="menu-btn" onclick="openTab('lesson_audit', this)">📑 14. Ukaguzi wa Maandalio</button>
  <button class="menu-btn" onclick="openTab('promotion', this)">🔄 15. Pandisha Madarasa (F1–6)</button>
  <button class="menu-btn" onclick="openTab('acad_library', this)">📚 16. Maktaba, Vikao & SMS Outbox</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Taaluma</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div style="display:flex; gap:8px; align-items:center; flex:1; max-width:460px;">
      <input type="text" id="globalAcadSearch" onkeyup="filterAcademicTables(this.value)" placeholder="🔍 Tafuta popote kwa jina, kidato, somo...">
      <button type="button" class="btn btn-blue" style="white-space:nowrap;" onclick="refreshAcademicNow()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['academic', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();
  let currentActiveTab = 'overview';

  const SCHOOL_CLASSES = [
    'Form 1A', 'Form 1B', 'Form 1C', 'Form 1D',
    'Form 2A', 'Form 2B', 'Form 2C', 'Form 2D',
    'Form 3A', 'Form 3B', 'Form 3C', 'Form 3D',
    'Form 4A', 'Form 4B', 'Form 4C', 'Form 4D',
    'Form 5 PCM', 'Form 5 PCB', 'Form 5 PGM', 'Form 5 EGM', 'Form 5 HGL', 'Form 5 HKL', 'Form 5 HGE', 'Form 5 ECA', 'Form 5 CBG',
    'Form 6 PCM', 'Form 6 PCB', 'Form 6 PGM', 'Form 6 EGM', 'Form 6 HGL', 'Form 6 HKL', 'Form 6 HGE', 'Form 6 ECA', 'Form 6 CBG'
  ];

  const ALL_CURRICULUM_SUBJECTS = [
    'Historia ya Tanzania na Maadili',
    'Business Studies (Biashara)',
    'Civics',
    'History',
    'Geography',
    'Kiswahili',
    'English Language',
    'Literature in English',
    'Basic Mathematics',
    'Additional Mathematics',
    'Physics',
    'Chemistry',
    'Biology',
    'Agriculture',
    'Book-Keeping',
    'Commerce',
    'Computer Science / ICT',
    'Music',
    'Fine Art',
    'Theatre Arts',
    'Food and Human Nutrition',
    'Physical Education & Sport',
    'French',
    'Arabic',
    'Chinese',
    'Bible Knowledge',
    'Islamic Knowledge',
    'General Studies (GS)',
    'Advanced Mathematics',
    'Economics',
    'Accountancy'
  ];

  function saveTableClean(table, arr) {
    if (SGB.forceReplaceCloud) SGB.forceReplaceCloud(table, arr);
    else { localStorage.setItem('sgb_' + table, JSON.stringify(arr)); SGB.pushToCloud(table); }
  }
  function normClass(str) {
    return String(str || '').toLowerCase()
      .replace(/kidato cha kwanza|kwanza/g, '1')
      .replace(/kidato cha pili|pili/g, '2')
      .replace(/kidato cha tatu|tatu/g, '3')
      .replace(/kidato cha nne|nne/g, '4')
      .replace(/kidato cha tano|tano/g, '5')
      .replace(/kidato cha sita|sita/g, '6')
      .replace(/form|kidato|cha|stream|mkondo/g, '')
      .replace(/\bvi\b/g, '6').replace(/\bv\b/g, '5').replace(/\biv\b/g, '4')
      .replace(/\biii\b/g, '3').replace(/\bii\b/g, '2').replace(/\bi\b/g, '1')
      .replace(/[^a-z0-9]/g, '');
  }

  function isALevelClass(cls) {
    const n = normClass(cls);
    return n.startsWith('5') || n.startsWith('6');
  }

  function gradeFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 'A'; if (s >= 70) return 'B'; if (s >= 60) return 'C';
      if (s >= 50) return 'D'; if (s >= 40) return 'E'; if (s >= 35) return 'S';
      return 'F';
    }
    if (s >= 75) return 'A'; if (s >= 65) return 'B'; if (s >= 45) return 'C';
    if (s >= 30) return 'D'; return 'F';
  }

  function pointsFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 1; if (s >= 70) return 2; if (s >= 60) return 3;
      if (s >= 50) return 4; if (s >= 40) return 5; if (s >= 35) return 6;
      return 7;
    }
    if (s >= 75) return 1; if (s >= 65) return 2; if (s >= 45) return 3;
    if (s >= 30) return 4; return 5;
  }

  function getExamTypesList() {
    const saved = JSON.parse(localStorage.getItem('sgb_exam_types') || 'null');
    if (saved && saved.length) return saved;
    return ['Midterm March', 'Terminal', 'Midterm September', 'Annual', 'Mock / Pre-NECTA'];
  }

  function examOptionsHtml(selected = '') {
    return getExamTypesList().map(ex => `<option value="${ex}" ${ex === selected ? 'selected' : ''}>${ex}</option>`).join('');
  }

  function classOptionsHtml(selected = 'Form 1A') {
    return SCHOOL_CLASSES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  function scopeOptionsHtml(selected = 'Form 1A') {
    const wholeForms = [
      { val: 'ALL_SCHOOL', lbl: '🏫 SHULE NZIMA (Form 1–6)' },
      { val: 'FORM_1_ALL', lbl: '📘 FORM 1 NZIMA (Mikondo Yote)' },
      { val: 'FORM_2_ALL', lbl: '📘 FORM 2 NZIMA (Mikondo Yote)' },
      { val: 'FORM_3_ALL', lbl: '📘 FORM 3 NZIMA (Mikondo Yote)' },
      { val: 'FORM_4_ALL', lbl: '📘 FORM 4 NZIMA (Mikondo Yote)' },
      { val: 'FORM_5_ALL', lbl: '📗 FORM 5 NZIMA (Tahasusi Zote)' },
      { val: 'FORM_6_ALL', lbl: '📗 FORM 6 NZIMA (Tahasusi Zote)' }
    ];
    return `<optgroup label="Kwa Kidato Kizima / Shule">${wholeForms.map(f => `<option value="${f.val}" ${f.val === selected ? 'selected' : ''}>${f.lbl}</option>`).join('')}</optgroup>
            <optgroup label="Kwa Mkondo / Tahasusi Maalum">${SCHOOL_CLASSES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('')}</optgroup>`;
  }

  function scopeLabel(scope) {
    const map = { ALL_SCHOOL: 'Shule Nzima (Form 1–6)', FORM_1_ALL: 'Form 1 Nzima', FORM_2_ALL: 'Form 2 Nzima', FORM_3_ALL: 'Form 3 Nzima', FORM_4_ALL: 'Form 4 Nzima', FORM_5_ALL: 'Form 5 Nzima', FORM_6_ALL: 'Form 6 Nzima' };
    return map[scope] || scope;
  }
  function getUnifiedStudents() {
    const map = {};
    SGB.select('academic_students').forEach(s => {
      const k = (s.full_name || '').trim().toLowerCase();
      if (k) map[k] = { id: s.id, full_name: s.full_name.trim(), gender: (s.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: s.class_name || 'Form 1A', combination: s.combination || 'O-Level', prem_no: s.prem_no || '-', parent_phone: s.parent_phone || '' };
    });
    SGB.select('users_profile').filter(u => (u.role || '').toLowerCase() === 'student').forEach(u => {
      const k = (u.full_name || '').trim().toLowerCase();
      if (k && !map[k]) {
        map[k] = { id: u.id, full_name: u.full_name.trim(), gender: (u.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: u.class_name || u.department || 'Form 1A', combination: u.combination || 'O-Level', prem_no: u.username || '-', parent_phone: u.phone || '' };
      }
    });
    return Object.values(map);
  }

  function getStudentsByScope(scope) {
    const all = getUnifiedStudents();
    if (!scope || scope === 'ALL_SCHOOL') return all;
    if (scope === 'FORM_1_ALL') return all.filter(s => normClass(s.class_name).startsWith('1'));
    if (scope === 'FORM_2_ALL') return all.filter(s => normClass(s.class_name).startsWith('2'));
    if (scope === 'FORM_3_ALL') return all.filter(s => normClass(s.class_name).startsWith('3'));
    if (scope === 'FORM_4_ALL') return all.filter(s => normClass(s.class_name).startsWith('4'));
    if (scope === 'FORM_5_ALL') return all.filter(s => normClass(s.class_name).startsWith('5'));
    if (scope === 'FORM_6_ALL') return all.filter(s => normClass(s.class_name).startsWith('6'));
    const targetNorm = normClass(scope);
    return all.filter(s => normClass(s.class_name) === targetNorm);
  }

  function computeScopeSummaries(scope = 'ALL_SCHOOL', exam1 = 'ALL', exam2 = 'NONE') {
    const students = getStudentsByScope(scope);
    const results = SGB.select('exam_results').filter(r => r.verified_status !== 'Returned');
    const isCombined = exam2 && exam2 !== 'NONE' && exam1 !== 'ALL';

    const resByStudent = {};
    results.forEach(r => {
      const k = (r.student_name || '').trim().toLowerCase();
      if (!k) return;
      if (!resByStudent[k]) resByStudent[k] = new Array();
      resByStudent[k].push(r);
    });

    const summaries = students.map(st => {
      const nLow = st.full_name.toLowerCase();
      const cls = st.class_name || 'Form 1A';
      const aLevel = isALevelClass(cls);
      const minRequired = aLevel ? 3 : 7;
      const stResults = resByStudent[nLow] || new Array();

      const subjMap = {};
      stResults.forEach(r => {
        const ex = (r.exam_type || '').trim();
        if (exam1 !== 'ALL') {
          if (!isCombined && ex.toLowerCase() !== exam1.toLowerCase()) return;
          if (isCombined && ex.toLowerCase() !== exam1.toLowerCase() && ex.toLowerCase() !== exam2.toLowerCase()) return;
        }
        const sName = (r.subject || 'Somo').trim();
        if (!subjMap[sName]) subjMap[sName] = { subject: sName, s1: null, s2: null, scores: new Array(), teacher_name: r.teacher_name || '-' };
        const sc = Number(r.score || 0);
        subjMap[sName].scores.push(sc);
        if (ex.toLowerCase() === exam1.toLowerCase()) subjMap[sName].s1 = sc;
        else if (isCombined && ex.toLowerCase() === exam2.toLowerCase()) subjMap[sName].s2 = sc;
      });

      const subjects = Object.values(subjMap).map(item => {
        const finalScore = isCombined
          ? Number((((item.s1 ?? item.s2 ?? 0) + (item.s2 ?? item.s1 ?? 0)) / 2).toFixed(1))
          : Number((item.scores.reduce((a, b) => a + b, 0) / item.scores.length).toFixed(1));
        return { subject: item.subject, s1: item.s1, s2: item.s2, score: finalScore, grade: gradeFromScore(finalScore, aLevel), teacher_name: item.teacher_name };
      });

      const subCount = subjects.length;
      const total = Number(subjects.reduce((s, x) => s + x.score, 0).toFixed(1));
      const avg = subCount ? Number((total / subCount).toFixed(1)) : 0;

      let div = 'ABSENT (ABS)', totalPts = '-', statusFlag = 'ABS';
      if (subCount > 0 && subCount < minRequired) {
        div = `INCOMPLETE (${subCount}/${minRequired})`; statusFlag = 'INC';
      } else if (subCount >= minRequired) {
        statusFlag = 'COMPLETE';
        const pArr = subjects.map(x => pointsFromScore(x.score, aLevel)).sort((a, b) => a - b).slice(0, minRequired);
        totalPts = pArr.reduce((a, b) => a + b, 0);
        div = aLevel ? (totalPts <= 9 ? 'Div I' : totalPts <= 12 ? 'Div II' : totalPts <= 17 ? 'Div III' : totalPts <= 19 ? 'Div IV' : 'Div 0') : (totalPts <= 17 ? 'Div I' : totalPts <= 21 ? 'Div II' : totalPts <= 25 ? 'Div III' : totalPts <= 33 ? 'Div IV' : 'Div 0');
      }

      return { name: st.full_name, gender: st.gender, cls, comb: st.combination, prem: st.prem_no, parent_phone: st.parent_phone, levelTag: aLevel ? 'A-Level' : 'O-Level', minRequired, subjects, subCount, total, avg, totalPts, div, statusFlag };
    });

    const orderWeight = { COMPLETE: 1, INC: 2, ABS: 3 };
    summaries.sort((a, b) => (orderWeight[a.statusFlag] - orderWeight[b.statusFlag]) || (b.avg - a.avg));
    const satCount = summaries.filter(s => s.statusFlag !== 'ABS').length;
    let rankCounter = 0;
    return summaries.map(s => {
      if (s.statusFlag !== 'ABS') rankCounter++;
      return { ...s, rank: s.statusFlag === 'ABS' ? '-' : rankCounter, outOf: satCount };
    });
  }
  function openTab(tab, btn) {
    currentActiveTab = tab;
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const students = getUnifiedStudents();
      const boys = students.filter(s => s.gender === 'M').length;
      const girls = students.filter(s => s.gender === 'F').length;
      const results = SGB.select('exam_results');
      const pendingSheets = results.filter(r => r.verified_status === 'Pending').length;
      const unlockReqs = JSON.parse(localStorage.getItem('sgb_unlock_requests') || '[]').filter(x => x.status === 'Pending');
      const summaries = computeScopeSummaries('ALL_SCHOOL', 'ALL', 'NONE');
      const completeList = summaries.filter(s => s.statusFlag === 'COMPLETE');
      const schoolAvg = completeList.length ? (completeList.reduce((s, x) => s + x.avg, 0) / completeList.length).toFixed(1) : '0.0';

      const divCounts = { 'Div I': 0, 'Div II': 0, 'Div III': 0, 'Div IV': 0, 'Div 0': 0, 'INC': 0, 'ABS': 0 };
      summaries.forEach(s => {
        if (s.statusFlag === 'INC') divCounts['INC']++;
        else if (s.statusFlag === 'ABS') divCounts['ABS']++;
        else if (divCounts[s.div] !== undefined) divCounts[s.div]++;
      });
      const maxDiv = Math.max(1, ...Object.values(divCounts));

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Wanafunzi Wote (F1–6)</h4><div class="val">${students.length}</div><small>M: ${boys} | F: ${girls}</small></div>
          <div class="card" style="border-color:#059669;"><h4>Wastani wa Shule</h4><div class="val">${schoolAvg}%</div><small>Waliokamilisha: ${completeList.length}</small></div>
          <div class="card" style="border-color:#d97706;"><h4>Score Sheets Pending</h4><div class="val">${pendingSheets}</div><small>Maombi ya Kufunguliwa: ${unlockReqs.length}</small></div>
          <div class="card" style="border-color:#7c3aed;"><h4>Masomo ya Mtaala</h4><div class="val">${ALL_CURRICULUM_SUBJECTS.length}</div><small>Mtaala Mpya + Zamani</small></div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(310px, 1fr)); gap:14px; margin-bottom:16px;">
          <div class="panel" style="margin-bottom:0; border-top:4px solid #1d4ed8;">
            <h3 style="margin-top:0;">📊 Grafu ya Divisions (NECTA Distribution)</h3>
            ${Object.entries(divCounts).map(([lbl, cnt]) => {
              const pct = Math.round((cnt / maxDiv) * 100);
              const col = lbl === 'Div I' ? '#059669' : lbl === 'Div II' ? '#0284c7' : lbl === 'Div III' ? '#2563eb' : lbl === 'Div IV' ? '#d97706' : '#dc2626';
              return `<div style="margin-bottom:7px;">
                <div style="display:flex; justify-content:space-between; font-size:12px;"><b>${lbl}</b><span><b>${cnt}</b> wanafunzi</span></div>
                <div style="background:#e2e8f0; height:12px; border-radius:6px; overflow:hidden;"><div style="width:${pct}%; background:${col}; height:100%;"></div></div>
              </div>`;
            }).join('')}
          </div>

          <div class="panel" style="margin-bottom:0; border-top:4px solid #059669;">
            <h3 style="margin-top:0;">🏆 Wanafunzi 10 Bora Shuleni</h3>
            <table><thead><tr><th>#</th><th>Mwanafunzi</th><th>Kidato</th><th>Wastani</th><th>Div</th></tr></thead><tbody>
            ${completeList.slice(0, 10).map((s, i) => `<tr><td><b>${i + 1}</b></td><td><b>${s.name}</b></td><td>${s.cls}</td><td><b>${s.avg}%</b></td><td><b>${s.div}</b></td></tr>`).join('') || '<tr><td colspan="5">Hakuna matokeo bado.</td></tr>'}
            </tbody></table>
          </div>
        </div>`;
      return;
    }
    if (tab === 'students_prem') {
      const students = getUnifiedStudents();
      area.innerHTML = `
        <div id="editStudentModalBox"></div>
        <div class="panel">
          <h3>🏫 Sajili, Hariri (Edit) & Futa Wanafunzi (Form 1–6)</h3>
          <form onsubmit="addAcadStudent(event)" style="display:grid; grid-template-columns:1.6fr 0.7fr 1fr 0.9fr 0.9fr 1fr auto; gap:6px; margin-bottom:10px;">
            <input type="text" id="stFull" required placeholder="Jina Kamili la Mwanafunzi">
            <select id="stGender"><option value="M">M</option><option value="F">F</option></select>
            <select id="stClass" onchange="autoSetCombinationFromClass(this.value)">${classOptionsHtml('Form 1A')}</select>
            <select id="stComb"><option value="O-Level">O-Level</option><option value="PCM">PCM</option><option value="PCB">PCB</option><option value="PGM">PGM</option><option value="EGM">EGM</option><option value="HGL">HGL</option><option value="HKL">HKL</option><option value="HGE">HGE</option><option value="ECA">ECA</option><option value="CBG">CBG</option></select>
            <input type="text" id="stPrem" placeholder="PREM No">
            <input type="tel" id="stParentPhone" placeholder="Simu ya Mzazi">
            <button type="submit" class="btn btn-green">➕ Sajili</button>
          </form>

  function downloadMultiSheetExcel() {
    if (typeof XLSX === 'undefined') {
      alert('⚠️ Maktaba ya Excel inapakia kutoka mtandaoni, subiri sekunde 2 jaribu tena.');
      return;
    }
    const cls = document.getElementById('meClass')?.value || 'Form 1A';
    const exam = document.getElementById('meExam')?.value || 'Terminal';
    const selectedSubjs = Array.from(document.querySelectorAll('.ex-subj-chk:checked')).map(c => c.value);
    if (!selectedSubjs.length) { alert('⚠️ Tafadhali tiki angalau somo moja kwanza.'); return; }

    const students = getUnifiedStudents().filter(s => normClass(s.class_name) === normClass(cls));
    if (!students.length) { alert(`⚠️ Hakuna wanafunzi waliosajiliwa kwenye ${cls}.`); return; }

    const wb = XLSX.utils.book_new();
    const usedNames = {};
    selectedSubjs.forEach(subj => {
      const sheetRows = [['Jina la Mwanafunzi', 'PREM No', 'Kidato', 'Somo', 'Mtihani', 'Alama (0-100)']];
      students.forEach(st => {
        sheetRows.push([st.full_name, st.prem_no || '-', st.class_name, subj, exam, '']);
      });
      const ws = XLSX.utils.aoa_to_sheet(sheetRows);
      let baseName = subj.replace(/[\\/?*[\]:]/g, '').trim().slice(0, 28) || 'Somo';
      if (usedNames[baseName]) { usedNames[baseName]++; baseName = `${baseName}_${usedNames[baseName]}`; }
      else usedNames[baseName] = 1;
      XLSX.utils.book_append_sheet(wb, ws, baseName);
    });
    XLSX.writeFile(wb, `ScoreSheets_${cls.replace(/\s+/g, '_')}_${exam.replace(/\s+/g, '_')}.xlsx`);
  }

  function uploadMultiSheetExcel() {
    if (typeof XLSX === 'undefined') { alert('⚠️ Maktaba ya Excel haijapakia bado.'); return; }
    const inp = document.getElementById('multiExcelFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la Excel (.xlsx) lililojazwa alama kwanza.'); return; }

    const fallbackCls = document.getElementById('meClass')?.value || 'Form 1A';
    const fallbackExam = document.getElementById('meExam')?.value || 'Terminal';
    const reader = new FileReader();

    reader.onload = (ev) => {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      let allResults = SGB.select('exam_results');
      let importedCount = 0;

      wb.SheetNames.forEach(sheetName => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1 });
        rows.slice(1).forEach(r => {
          const stName = String(r.at(0) || '').trim();
          const cls = String(r.at(2) || fallbackCls).trim();
          const subj = String(r.at(3) || sheetName).trim();
          const exam = String(r.at(4) || fallbackExam).trim();
          const rawScore = r.at(5);
          if (stName && rawScore !== undefined && rawScore !== null && String(rawScore).trim() !== '') {
            const sc = Number(rawScore);
            if (!isNaN(sc)) {
              const alloc = SGB.select('subject_allocations').find(a => normClass(a.class_name) === normClass(cls) && (a.subject || '').toLowerCase() === subj.toLowerCase());
              const assignedTeacher = alloc ? alloc.teacher_name : 'Ofisi ya Mtaaluma';
              allResults = allResults.filter(x => !(normClass(x.class_name) === normClass(cls) && (x.subject || '').toLowerCase() === subj.toLowerCase() && (x.exam_type || '').toLowerCase() === exam.toLowerCase() && (x.student_name || '').toLowerCase() === stName.toLowerCase()));
              allResults.unshift({
                id: Date.now() + Math.floor(Math.random() * 10000),
                created_at: new Date().toLocaleString('sw-TZ'),
                student_name: stName, class_name: cls, subject: subj, exam_type: exam,
                score: sc, grade: gradeFromScore(sc, isALevelClass(cls)),
                teacher_name: assignedTeacher, verified_status: 'Approved'
              });
              importedCount++;
            }
          }
        });
      });

      saveTableClean('exam_results', allResults);
      alert(`✅ Alama ${importedCount} kutoka kwenye sheets ${wb.SheetNames.length} zimepakiwa kwenye mfumo!`);
      openTab('merit');
    };
    reader.readAsArrayBuffer(file);
  }
  function saveSubmissionDeadline() {
    const exam = document.getElementById('pubExamTitle')?.value || 'Terminal';
    const dl = document.getElementById('pubDeadlineInput')?.value || '';
    const prev = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"published":true,"unlocked_teachers":[]}');
    localStorage.setItem('sgb_exam_window', JSON.stringify({ ...prev, active_exam: exam, deadline: dl }));
    SGB.pushToCloud('exam_window');
    alert(`✅ Muda wa mwisho wa "${exam}" umewekwa! Tangazo linapita juu ya dashibodi za walimu.`);
    openTab('exam_publish');
  }

  function updateExamPublishState(open, published) {
    const active_exam = document.getElementById('pubExamTitle')?.value.trim() || 'Terminal';
    const prev = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"unlocked_teachers":[]}');
    localStorage.setItem('sgb_exam_window', JSON.stringify({ ...prev, open, published, active_exam }));
    SGB.pushToCloud('exam_window');
    openTab('exam_publish');
  }

  function approveSingleTeacherUnlock(reqIdx) {
    const reqs = JSON.parse(localStorage.getItem('sgb_unlock_requests') || '[]');
    const rq = reqs.at(reqIdx);
    if (!rq) return;
    rq.status = 'Approved';
    localStorage.setItem('sgb_unlock_requests', JSON.stringify(reqs));
    SGB.pushToCloud('unlock_requests');

    const cfg = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":false,"published":true,"unlocked_teachers":[]}');
    const list = Array.isArray(cfg.unlocked_teachers) ? cfg.unlocked_teachers : new Array();
    if (!list.includes(rq.teacher)) list.push(rq.teacher);
    cfg.unlocked_teachers = list;
    localStorage.setItem('sgb_exam_window', JSON.stringify(cfg));
    SGB.pushToCloud('exam_window');

    alert(`✅ Mwalimu ${rq.teacher} amefunguliwa dirisha la kuingiza alama yeye peke yake!`);
    openTab('exam_publish');
  }

  function runScopeResultGeneration() {
    window._meritScope = document.getElementById('meritScopePick')?.value || 'Form 1A';
    window._meritEx1 = document.getElementById('meritEx1Pick')?.value || 'ALL';
    window._meritEx2 = document.getElementById('meritEx2Pick')?.value || 'NONE';
    const list = computeScopeSummaries(window._meritScope, window._meritEx1, window._meritEx2);
    if (!list.length) { alert('⚠️ Hakuna wanafunzi kwenye darasa/mkondo huu.'); return; }
    window._meritGenerated = true;
    alert(`✅ Matokeo ya ${scopeLabel(window._meritScope)} yamechakata wanafunzi ${list.length}!`);
    openTab('merit');
  }
  function downloadGeneratedResultPdf() {
    const scope = window._meritScope || 'Form 1A';
    const ex1 = window._meritEx1 || 'ALL';
    const ex2 = window._meritEx2 || 'NONE';
    const style = document.getElementById('pdfFormatStyle')?.value || 'NECTA';
    const showNames = document.getElementById('nectaShowNamesChk')?.checked ?? true;
    const list = computeScopeSummaries(scope, ex1, ex2);
    const acadPhone = localStorage.getItem('sgb_academic_master_phone') || '0763061124';
    const allSubjs = Array.from(new Set(list.flatMap(s => s.subjects.map(x => x.subject))));
    const titleExam = (ex2 && ex2 !== 'NONE' && ex1 !== 'ALL') ? `${ex1} + ${ex2}` : ex1;

    let bodyHtml = style === 'NECTA'
      ? `<h3>SANGABUYE SECONDARY SCHOOL — NECTA RESULTS (${scopeLabel(scope)} | ${titleExam}) | Tel: ${acadPhone}</h3><table><thead><tr><th>PREM</th>${showNames ? '<th>CANDIDATE NAME</th>' : ''}<th>SEX</th><th>CLASS</th><th>PTS</th><th>DIV</th><th>SUBJECTS</th></tr></thead><tbody>${list.map(s => `<tr><td><b>${s.prem}</b></td>${showNames ? `<td><b>${s.name.toUpperCase()}</b></td>` : ''}<td>${s.gender}</td><td>${s.cls}</td><td><b>${s.totalPts}</b></td><td><b>${s.div}</b></td><td>${s.subjects.map(sub => `${sub.subject.slice(0, 4).toUpperCase()}-'${sub.grade}'`).join(' ') || 'ABS'}</td></tr>`).join('')}</tbody></table>`
      : `<h3>SHULE YA SEKONDARI SANGABUYE — MATOKEO (${scopeLabel(scope)} | ${titleExam}) | Tel: ${acadPhone}</h3><table><thead><tr><th>#</th><th>Mwanafunzi</th><th>Jinsia</th><th>Kidato</th>${allSubjs.map(sb => `<th>${sb.slice(0, 5)}</th>`).join('')}<th>Wastani</th><th>Pts</th><th>Div</th></tr></thead><tbody>${list.map(s => `<tr><td><b>${s.rank}</b></td><td><b>${s.name}</b></td><td>${s.gender}</td><td>${s.cls}</td>${allSubjs.map(sb => { const f = s.subjects.find(x => x.subject === sb); return `<td>${f ? f.score + '(' + f.grade + ')' : '-'}</td>`; }).join('')}<td><b>${s.avg}%</b></td><td>${s.totalPts}</td><td><b>${s.div}</b></td></tr>`).join('')}</tbody></table>`;

    const w = window.open('', '', 'width=1050,height=750');
    w.document.write(`<html><head><title>Matokeo_${scopeLabel(scope)}</title><style>@page{size:A4 landscape;margin:8mm;}body{font-family:sans-serif;font-size:10.5px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:4px;}</style></head><body>${bodyHtml}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 350);
  }

  function generateA4Reports(mode) {
    const scope = document.getElementById('repScopePick')?.value || 'Form 1A';
    const ex1 = document.getElementById('repEx1Pick')?.value || 'Terminal';
    const ex2 = document.getElementById('repEx2Pick')?.value || 'NONE';
    const acadPhone = document.getElementById('repAcadPhone')?.value || '0763061124';
    const hmPhone = document.getElementById('repHmPhone')?.value || '0755000000';
    const list = computeScopeSummaries(scope, ex1, ex2);
    const q = (document.getElementById('repSearchStInput')?.value || '').trim().toLowerCase();
    const targets = mode === 'SINGLE' && q ? list.filter(s => s.name.toLowerCase().includes(q)) : list;
    document.getElementById('a4ReportsContainer').innerHTML = targets.map(st => `<div class="a4-sheet"><b>SHULE YA SEKONDARI SANGABUYE</b> | Simu Taaluma: <b>${acadPhone}</b> | Simu Mkuu: <b>${hmPhone}</b><br><b>Mwanafunzi:</b> ${st.name.toUpperCase()} (${st.cls}) | <b>Wastani:</b> ${st.avg}% | <b>Matokeo:</b> ${st.div} | <b>Nafasi:</b> #${st.rank}/${st.outOf}<table><thead><tr><th>Somo</th><th>Alama (%)</th><th>Daraja</th></tr></thead><tbody>${st.subjects.map(sb => `<tr><td>${sb.subject}</td><td>${sb.score}%</td><td>${sb.grade}</td></tr>`).join('') || '<tr><td colspan="3">ABSENT</td></tr>'}</tbody></table></div>`).join('');
  }

  function printA4Sheets(id) {
    const html = document.getElementById(id)?.innerHTML;
    if (!html) return;
    const w = window.open('', '', 'width=900,height=700');
    w.document.write(`<html><head><title>Print A4</title><style>@page{size:A4;margin:8mm;}body{font-family:sans-serif;}.a4-sheet{border:2px solid #000;padding:12px;page-break-after:always;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:4px;}</style></head><body>${html}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 350);
  }
  function autoSetCombinationFromClass(cls) {
    const combSel = document.getElementById('stComb');
    if (!combSel) return;
    const parts = cls.split(' ');
    combSel.value = (parts.length >= 3 && ['5', '6'].includes(parts.at(1))) ? parts.at(2) : 'O-Level';
  }

  function addAcadStudent(e) {
    e.preventDefault();
    SGB.insert('academic_students', { full_name: document.getElementById('stFull').value.trim(), gender: document.getElementById('stGender').value, class_name: document.getElementById('stClass').value, combination: document.getElementById('stComb').value, prem_no: document.getElementById('stPrem').value.trim() || '-', parent_phone: document.getElementById('stParentPhone').value.trim() || '' });
    openTab('students_prem');
  }

  function openEditStudentModal(id, fullName, gender, cls, comb, prem, phone) {
    document.getElementById('editStudentModalBox').innerHTML = `<div class="panel" style="border:2px solid #0284c7;background:#f0f9ff;"><h4>✏️ Hariri: ${fullName}</h4><form onsubmit="saveEditedStudent(event,'${id}','${fullName}')" style="display:grid;grid-template-columns:1.5fr 0.6fr 1fr 0.8fr 0.8fr 1fr auto;gap:6px;"><input type="text" id="edStFull" value="${fullName}" required><select id="edStGender"><option value="M" ${gender==='M'?'selected':''}>M</option><option value="F" ${gender==='F'?'selected':''}>F</option></select><select id="edStClass">${classOptionsHtml(cls)}</select><input type="text" id="edStComb" value="${comb}"><input type="text" id="edStPrem" value="${prem}"><input type="tel" id="edStPhone" value="${phone}"><button type="submit" class="btn btn-green">💾 Hifadhi</button></form></div>`;
  }

  function saveEditedStudent(e, id, oldName) {
    e.preventDefault();
    const newFull = document.getElementById('edStFull').value.trim();
    const newGen = document.getElementById('edStGender').value;
    const newCls = document.getElementById('edStClass').value;
    const newComb = document.getElementById('edStComb').value.trim() || 'O-Level';
    const newPrem = document.getElementById('edStPrem').value.trim() || '-';
    const newPhone = document.getElementById('edStPhone').value.trim();
    const oldLow = oldName.trim().toLowerCase();
    const acadList = SGB.select('academic_students').map(x => (String(x.id) === String(id) || (x.full_name || '').toLowerCase() === oldLow) ? { ...x, full_name: newFull, gender: newGen, class_name: newCls, combination: newComb, prem_no: newPrem, parent_phone: newPhone } : x);
    saveTableClean('academic_students', acadList);
    openTab('students_prem');
  }

  function deleteAcadStudent(id, fullName) {
    if (!confirm(`Futa ${fullName}?`)) return;
    const nLow = fullName.toLowerCase();
    saveTableClean('academic_students', SGB.select('academic_students').filter(x => String(x.id) !== String(id) && (x.full_name || '').toLowerCase() !== nLow));
    saveTableClean('users_profile', SGB.select('users_profile').filter(u => String(u.id) !== String(id) && (u.full_name || '').toLowerCase() !== nLow));
    openTab('students_prem');
  }

  function addSubjectAllocation(e) {
    e.preventDefault();
    const teacher = document.getElementById('alTeacher').value.trim();
    const subj = document.getElementById('alSubj').value.trim();
    const periods = Number(document.getElementById('alPeriods').value || 4);
    const selectedClasses = Array.from(document.querySelectorAll('.al-cls-chk:checked')).map(c => c.value);
    if (!selectedClasses.length) { alert('⚠️ Tiki angalau darasa moja.'); return; }
    selectedClasses.forEach(cls => SGB.insert('subject_allocations', { teacher_name: teacher, class_name: cls, subject: subj, periods_per_week: periods }));
    openTab('allocations');
  }

  function deleteAllocation(id) {
    saveTableClean('subject_allocations', SGB.select('subject_allocations').filter(x => String(x.id) !== String(id)));
    openTab('allocations');
  }

  function downloadStTemplate() {
    const csv = "Jina Kamili,Jinsia (M/F),Kidato,Tahasusi,PREM No,Simu ya Mzazi\nAsha Juma Mwita,F,Form 1A,O-Level,2026001122,0712345678";
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Template_Wanafunzi.csv'; a.click();
  }

  function uploadStCsv() {
    const file = document.getElementById('stCsvFile')?.files?.item(0);
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      ev.target.result.split(/\r?\n/).slice(1).forEach(line => {
        const c = line.split(',');
        if (c.length >= 2 && c.at(0).trim()) SGB.insert('academic_students', { full_name: c.at(0).trim(), gender: (c.at(1) || 'M').trim().toUpperCase().startsWith('F') ? 'F' : 'M', class_name: (c.at(2) || 'Form 1A').trim(), combination: (c.at(3) || 'O-Level').trim(), prem_no: (c.at(4) || '-').trim(), parent_phone: (c.at(5) || '').trim() });
      });
      openTab('students_prem');
    };
    reader.readAsText(file);
  }

  function downloadMeritCsv() {
    const list = computeScopeSummaries(window._meritScope || 'Form 1A', window._meritEx1 || 'ALL', window._meritEx2 || 'NONE');
    let csv = "Nafasi,Mwanafunzi,Jinsia,Kidato,Wastani,Points,Division\n";
    list.forEach(s => { csv += `"${s.rank}","${s.name}","${s.gender}","${s.cls}",${s.avg},"${s.totalPts}","${s.div}"\n`; });
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Matokeo_Sangabuye.csv'; a.click();
  }

  function promoteAllStudents() {
    if (!confirm('Pandisha wanafunzi wote madarasa?')) return;
    const upgraded = SGB.select('academic_students').map(s => {
      const c = (s.class_name || '').toLowerCase();
      let next = s.class_name;
      if (c.includes('1')) next = s.class_name.replace(/1/g, '2');
      else if (c.includes('2')) next = s.class_name.replace(/2/g, '3');
      else if (c.includes('3')) next = s.class_name.replace(/3/g, '4');
      else if (c.includes('4')) next = 'Alumni O-Level';
      else if (c.includes('5')) next = s.class_name.replace(/5/g, '6');
      else if (c.includes('6')) next = 'Alumni A-Level';
      return { ...s, class_name: next };
    });
    saveTableClean('academic_students', upgraded);
    openTab('students_prem');
  }

  function filterAcademicTables(q) {
    const low = (q || '').toLowerCase();
    document.querySelectorAll('#viewArea table tbody tr').forEach(tr => { tr.style.display = tr.innerText.toLowerCase().includes(low) ? '' : 'none'; });
  }

  async function refreshAcademicNow() {
    await SGB.pullFromCloud(true);
    openTab(currentActiveTab);
    document.getElementById('syncTime').innerText = ` (Imesasishwa: ${new Date().toLocaleTimeString()})`;
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
