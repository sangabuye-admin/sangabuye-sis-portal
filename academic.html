<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mhasibu (FFARS & Enterprise Finance) | Sangabuye SIS</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 275px; background: #064e3b; color: white; display: flex; flex-direction: column; padding: 15px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fde68a; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #a7f3d0; margin: 0 0 12px; }
    .menu-btn { background: transparent; border: none; color: #ecfdf5; text-align: left; padding: 7.5px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; margin-bottom: 3px; }
    .menu-btn:hover, .menu-btn.active { background: #059669; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 13px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #059669; }
    .card h4 { margin: 0 0 5px; font-size: 10.5px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 15.5px; font-weight: bold; color: #064e3b; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 7px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #064e3b; }
    .btn { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MHASIBU</h2>
  <p>Ilemela MC | Sangabuye Sec</p>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari wa Fedha & Vyanzo</button>
  <button class="menu-btn" onclick="openTab('receipts', this)">🛒 2. Mapokezi (Kapu la Michango)</button>
  <button class="menu-btn" onclick="openTab('parent_stmt', this)">📄 3. Taarifa Kwa Mzazi & Wadaiwa</button>
  <button class="menu-btn" onclick="openTab('expenses', this)">💸 4. Matumizi (Filters & FFARS PV)</button>
  <button class="menu-btn" onclick="openTab('procurement', this)">🤝 5. Kamati ya Manunuzi</button>
  <button class="menu-btn" onclick="openTab('payroll', this)">💼 6. Mishahara (Pre-Audit, PV & Slip)</button>
  <button class="menu-btn" onclick="openTab('study_camp', this)">⛺ 7. Kambi ya Masomo & Basi</button>
  <button class="menu-btn" onclick="openTab('fee_struct', this)">🏷️ 8. Viwango vya Ada & Michango</button>
  <button class="menu-btn" onclick="openTab('store', this)">📦 9. Stoo ya Vyakula & Vifaa</button>
  <button class="menu-btn" onclick="openTab('reports', this)">📈 10. Ripoti Zote za Kifedha</button>
  <button class="menu-btn" onclick="openTab('lock_accounts', this)">🔒 11. Funga Hesabu & Clearance</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Fedha & Vyanzo</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
  <datalist id="stList"></datalist>
</div>
<script>
  const user = SGB.requireRole(['accountant', 'super_admin']);
  SGB.startSessionTimer();

  let receiptCart = [];
  let procItemsDraft = [];

  function checkLockedDate(isoDate) {
    const locks = SGB.select('account_locks').filter(l => l.status === 'Locked');
    if (!locks.length) return false;
    const d = isoDate || new Date().toISOString().slice(0, 10);
    return locks.some(l => d >= l.start_date && d <= l.end_date);
  }

  function updateNames() {
    const names = new Set();
    SGB.select('users_profile').filter(u => u.role === 'student').forEach(u => names.add(u.full_name));
    SGB.select('accounting_receipts').forEach(r => names.add(r.student_name));
    SGB.select('camp_students').forEach(c => names.add(c.student_name));
    document.getElementById('stList').innerHTML = Array.from(names).map(n => `<option value="${n}">`).join('');
  }

  function autoFillStudentReg(nameInputId = 'rName', regInputId = 'rReg', phoneInputId = 'rPhone') {
    const typed = (document.getElementById(nameInputId)?.value || '').trim().toLowerCase();
    if (!typed) return;
    const u = SGB.select('users_profile').find(x => (x.full_name || '').toLowerCase() === typed);
    if (u && u.reg_or_staff_no && document.getElementById(regInputId)) {
      document.getElementById(regInputId).value = u.reg_or_staff_no;
      if (u.phone_number && document.getElementById(phoneInputId)) document.getElementById(phoneInputId).value = u.phone_number;
      return;
    }
    const prevRec = SGB.select('accounting_receipts').find(r => (r.student_name || '').toLowerCase() === typed);
    if (prevRec && prevRec.student_reg_no && document.getElementById(regInputId)) {
      document.getElementById(regInputId).value = prevRec.student_reg_no;
    }
  }

  function calcFinanceSummary(startDate = '', endDate = '') {
    const inRange = (dt) => {
      if (!startDate || !endDate) return true;
      const d = (dt || '').slice(0, 10);
      return d >= startDate && d <= endDate;
    };
    const isKambi = (s) => (s || '').toLowerCase().includes('kambi');
    const isHostel = (s) => (s || '').toLowerCase().includes('hostel') || (s || '').toLowerCase().includes('bweni');

    const recs = SGB.select('accounting_receipts').filter(r => inRange(r.tx_date || r.created_at));
    const vchs = SGB.select('expense_vouchers').filter(v => v.status === 'Paid' && inRange(v.tx_date || v.created_at));
    const procs = SGB.select('procurement_committee').filter(p => p.status === 'Paid' && inRange(p.meeting_date || p.created_at));
    const pays = SGB.select('staff_payroll').filter(p => p.status === 'Paid' && inRange(p.paid_date || p.created_at));

    const crdbIn = recs.filter(r => r.payment_method === 'CRDB_Bank').reduce((s, r) => s + Number(r.amount_paid), 0);
    const cashIn = recs.filter(r => r.payment_method === 'Cash').reduce((s, r) => s + Number(r.amount_paid), 0);
    const totalIn = crdbIn + cashIn;

    const kambiIn = recs.filter(r => isKambi(r.source_fund || r.payment_category)).reduce((s, r) => s + Number(r.amount_paid), 0);
    const hostelIn = recs.filter(r => isHostel(r.source_fund || r.payment_category)).reduce((s, r) => s + Number(r.amount_paid), 0);
    const kutwaIn = totalIn - kambiIn - hostelIn;

    const sumOutBy = (fn) => vchs.filter(v => fn(v.source_fund)).reduce((s, v) => s + Number(v.amount), 0)
                           + procs.filter(p => fn(p.source_fund)).reduce((s, p) => s + Number(p.estimated_budget), 0)
                           + pays.filter(p => fn(p.source_fund)).reduce((s, p) => s + Number(p.net_pay), 0);

    const kambiOut = sumOutBy(isKambi);
    const hostelOut = sumOutBy(isHostel);
    const totalOut = vchs.reduce((s, v) => s + Number(v.amount), 0) + procs.reduce((s, p) => s + Number(p.estimated_budget), 0) + pays.reduce((s, p) => s + Number(p.net_pay), 0);
    const kutwaOut = totalOut - kambiOut - hostelOut;

    return {
      crdbIn, cashIn, totalIn, totalOut, balance: totalIn - totalOut,
      kutwaIn, kutwaOut, kutwaBal: kutwaIn - kutwaOut,
      hostelIn, hostelOut, hostelBal: hostelIn - hostelOut,
      kambiIn, kambiOut, kambiBal: kambiIn - kambiOut
    };
  }
  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    updateNames();
    const cfg = SGB.getConfig();
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const sum = calcFinanceSummary();
      const recs = SGB.select('accounting_receipts');
      const maxVal = Math.max(1, sum.kutwaIn, sum.hostelIn, sum.kambiIn, sum.kutwaOut, sum.hostelOut, sum.kambiOut);
      const bar = (val, color) => `<div style="background:#e2e8f0;height:12px;border-radius:6px;margin-top:4px;"><div style="background:${color};height:12px;border-radius:6px;width:${Math.min(100, Math.round((val/maxVal)*100))}%;"></div></div>`;

      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h3 style="margin:0; color:#064e3b;">Muhtasari Mkuu wa Fedha (CRDB, Cash, Matumizi & Salio)</h3>
          <button class="btn btn-blue" onclick="SGB.liveRefresh(false)">🔄 Refresh Data</button>
        </div>

        <div class="cards">
          <div class="card"><h4>CRDB (${cfg.crdb})</h4><div class="val">TZS ${sum.crdbIn.toLocaleString()}</div></div>
          <div class="card"><h4>Pesa Taslimu (Cash)</h4><div class="val">TZS ${sum.cashIn.toLocaleString()}</div></div>
          <div class="card" style="border-color:#dc2626;"><h4>Jumla ya Matumizi</h4><div class="val">TZS ${sum.totalOut.toLocaleString()}</div></div>
          <div class="card" style="border-color:#1d4ed8;"><h4>Salio Kuu (Net Balance)</h4><div class="val">TZS ${sum.balance.toLocaleString()}</div></div>
        </div>

        <div class="panel">
          <h3>📊 Uchambuzi wa Mapato, Matumizi & Salio Kwa Kila Chanzo (Graphs & Charts)</h3>
          <table>
            <tr><th>Chanzo cha Fedha</th><th>Mapato (TZS)</th><th>Matumizi (TZS)</th><th>Salio Halisi (TZS)</th><th>Mchoro (Mapato vs Matumizi)</th></tr>
            <tr>
              <td><b>1. Kutwa (Day Scholars)</b></td>
              <td style="color:#059669;"><b>${sum.kutwaIn.toLocaleString()}</b></td>
              <td style="color:#dc2626;"><b>${sum.kutwaOut.toLocaleString()}</b></td>
              <td style="color:#1d4ed8;"><b>TZS ${sum.kutwaBal.toLocaleString()}</b></td>
              <td style="width:32%;">${bar(sum.kutwaIn, '#059669')}${bar(sum.kutwaOut, '#dc2626')}</td>
            </tr>
            <tr>
              <td><b>2. Hostel (Bweni)</b></td>
              <td style="color:#059669;"><b>${sum.hostelIn.toLocaleString()}</b></td>
              <td style="color:#dc2626;"><b>${sum.hostelOut.toLocaleString()}</b></td>
              <td style="color:#1d4ed8;"><b>TZS ${sum.hostelBal.toLocaleString()}</b></td>
              <td>${bar(sum.hostelIn, '#059669')}${bar(sum.hostelOut, '#dc2626')}</td>
            </tr>
            <tr>
              <td><b>3. Kambi ya Masomo</b></td>
              <td style="color:#059669;"><b>${sum.kambiIn.toLocaleString()}</b></td>
              <td style="color:#dc2626;"><b>${sum.kambiOut.toLocaleString()}</b></td>
              <td style="color:#1d4ed8;"><b>TZS ${sum.kambiBal.toLocaleString()}</b></td>
              <td>${bar(sum.kambiIn, '#059669')}${bar(sum.kambiOut, '#dc2626')}</td>
            </tr>
          </table>
          <small style="color:#64748b;"><i>Mstari wa Kijani = Mapato | Mstari Mwekundu = Matumizi</i></small>
        </div>

        <div class="panel">
          <h3>Miamala ya Mapokezi ya Hivi Karibuni</h3>
          <table><tr><th>Risiti Na.</th><th>Mwanafunzi (Reg No.)</th><th>Michango</th><th>Chanzo</th><th>Njia</th><th>Kiasi (TZS)</th><th>Tarehe</th></tr>
          ${recs.slice(0, 12).map(r => `<tr><td><b>${r.receipt_number}</b></td><td>${r.student_name} <small>(${r.student_reg_no})</small></td><td>${r.payment_category}</td><td>${r.source_fund || 'Kutwa'}</td><td>${r.payment_method}</td><td><b>${Number(r.amount_paid).toLocaleString()}</b></td><td>${r.created_at}</td></tr>`).join('') || '<tr><td colspan="7">Hakuna miamala bado.</td></tr>'}
          </table>
        </div>`;
    }
    if (tab === 'receipts') {
      const fees = SGB.select('fee_structures');
      area.innerHTML = `
        <div class="panel">
          <h3>Mapokezi ya Ada & Kapu la Michango (Multi-Item Receipt + Auto SMS & WhatsApp)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <div>
              <label style="font-size:11px;font-weight:bold;">Jina la Mwanafunzi (Andika herufi chache):</label>
              <input type="text" id="rName" list="stList" oninput="autoFillStudentReg()" onchange="autoFillStudentReg()" placeholder="Andika jina la mwanafunzi...">
            </div>
            <div>
              <label style="font-size:11px;font-weight:bold;">Namba ya Usajili (Auto-Fill):</label>
              <input type="text" id="rReg" placeholder="Namba ya Usajili (Mfano: S.2026/001)">
            </div>
            <div>
              <label style="font-size:11px;font-weight:bold;">Simu ya Mzazi (Kwa SMS/WhatsApp):</label>
              <input type="text" id="rPhone" placeholder="0755123456">
            </div>
          </div>

          <div style="background:#f8fafc; padding:12px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:12px;">
            <b style="font-size:12px; color:#064e3b;">➕ Ongeza Mchango Kwenye Kapu (Unaweza kuweka zaidi ya mmoja):</b>
            <div style="display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; margin-top:8px;">
              <input type="text" id="itemCat" list="catOpts" placeholder="Chagua/Andika Mchango (Ada, Kambi, Hostel, Chakula...)">
              <datalist id="catOpts">
                <option value="Ada ya Shule (Kutwa)">
                <option value="Ada ya Bweni (Hostel)">
                <option value="Kambi ya Masomo (Academic Camp)">
                <option value="Mchango wa Chakula">
                <option value="Mchango wa Mitihani">
                ${fees.map(f => `<option value="${f.category}">`).join('')}
              </datalist>
              <select id="itemSource">
                <option value="Kutwa">Chanzo: Kutwa</option>
                <option value="Hostel">Chanzo: Hostel</option>
                <option value="Kambi ya Masomo">Chanzo: Kambi ya Masomo</option>
              </select>
              <input type="number" id="itemAmt" placeholder="Kiasi (TZS)">
              <button type="button" class="btn btn-blue" onclick="addToReceiptCart()">➕ Weka Kapuni</button>
            </div>
            <div id="cartTableArea" style="margin-top:10px;"></div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
            <select id="rMethod">
              <option value="CRDB_Bank">CRDB Bank (${cfg.crdb})</option>
              <option value="Cash">Pesa Taslimu (Cash)</option>
            </select>
            <input type="text" id="rRef" placeholder="Namba ya Slip ya CRDB (Au CASH)">
            <input type="date" id="rDate" value="${new Date().toISOString().slice(0, 10)}">
            <button type="button" class="btn btn-green" style="grid-column: span 3; padding:12px;" onclick="finalizeCartReceipt()">💾 Hifadhi Risiti, Chapisha & Tuma SMS/WhatsApp Kwa Mzazi</button>
          </div>
          <div id="receiptBox" style="margin-top:18px;"></div>
        </div>`;
      renderReceiptCart();
    }
    if (tab === 'parent_stmt') {
      const fees = SGB.select('fee_structures');
      const totalAnnualReq = fees.reduce((s, f) => s + Number(f.amount), 0) || 450000;
      const students = SGB.select('users_profile').filter(u => u.role === 'student');
      const allRecs = SGB.select('accounting_receipts');

      area.innerHTML = `
        <div class="panel">
          <h3>1. Taarifa ya Malipo Kwa Mzazi (Halmashauri ya Manispaa ya Ilemela — A4 PDF)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="psName" list="stList" oninput="autoFillStudentReg('psName','psReg','psPhone')" placeholder="Andika jina la mwanafunzi...">
            <input type="text" id="psReg" placeholder="Namba ya Usajili (Auto-Fill)">
            <input type="text" id="psClass" placeholder="Kidato/Mkondo (Mfano: Form 4A)">
            <input type="text" id="psPhone" placeholder="Simu ya Mzazi (07...)">
            <input type="text" id="psAccName" value="Mhasibu wa Shule" placeholder="Jina la Mhasibu Aliyeandaa">
            <input type="text" id="psHmName" value="Mkuu wa Shule" placeholder="Jina la Mkuu wa Shule">
            <button class="btn btn-green" style="grid-column: span 2; padding:10px;" onclick="buildParentStatement()">📄 Tengeneza Taarifa Kwa Mzazi</button>
          </div>
          <div id="parentStmtBox"></div>
        </div>

        <div class="panel">
          <h3>2. Orodha ya Wadaiwa wa Ada & Michango (Fee Defaulters List)</h3>
          <table><tr><th>Mwanafunzi</th><th>Reg No.</th><th>Amelipa (TZS)</th><th>Salio / Deni (TZS)</th><th>Kumbusha Mzazi</th></tr>
          ${students.map(st => {
            const paid = allRecs.filter(r => r.student_name.toLowerCase() === st.full_name.toLowerCase()).reduce((s, r) => s + Number(r.amount_paid), 0);
            const debt = Math.max(0, totalAnnualReq - paid);
            const msg = `SANGABUYE SEC: Mzazi wa ${st.full_name} (${st.reg_or_staff_no||'-'}), mwanao amelipa TZS ${paid.toLocaleString()} na anadaiwa salio la TZS ${debt.toLocaleString()}. Lipa CRDB: 0150838972100.`;
            return `<tr><td><b>${st.full_name}</b></td><td>${st.reg_or_staff_no || '-'}</td><td style="color:#059669;"><b>${paid.toLocaleString()}</b></td><td style="color:${debt>0?'#dc2626':'#059669'};"><b>${debt.toLocaleString()}</b></td>
            <td><button class="btn btn-green" onclick="SGB.sendWhatsApp('${st.phone_number||''}', '${msg}')">💬 WA</button> <button class="btn btn-amber" onclick="SGB.sendSMS('${st.phone_number||''}', '${msg}')">📲 SMS</button></td></tr>`;
          }).join('') || '<tr><td colspan="5">Hakuna wanafunzi waliosajiliwa bado.</td></tr>'}
          </table>
        </div>`;
    }
    if (tab === 'expenses') {
      area.innerHTML = `
        <div class="panel">
          <h3>1. Andaa Vocha ya Matumizi (FFARS Standard Payment Voucher)</h3>
          <form onsubmit="submitExpenseVoucher(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="exPayee" required placeholder="Jina la Mlipwaji (Payee Name)">
            <input type="text" id="exPhone" placeholder="Simu ya Mlipwaji (Mobile #)">
            <input type="text" id="exCode" value="081-2005-02032-509B-000000" placeholder="Account Code (FFARS)">
            <input type="text" id="exDesc" required placeholder="Maelezo ya Malipo (Payment in respective of...)">
            <select id="exSource">
              <option value="Kutwa">Fund Source: Kutwa</option>
              <option value="Hostel">Fund Source: Hostel</option>
              <option value="Kambi ya Masomo">Fund Source: Kambi ya Masomo</option>
            </select>
            <select id="exAcc"><option value="CRDB BANK LIMITED (${cfg.crdb})">CRDB (${cfg.crdb})</option><option value="Cash Box">Cash Box</option></select>
            <input type="number" id="exAmt" required placeholder="Kiasi (Amount TZS)">
            <input type="date" id="exDate" value="${new Date().toISOString().slice(0, 10)}" required>
            <button type="submit" class="btn btn-amber">📤 Tuma Kwa Mkuu wa Shule Aidhinishe</button>
          </form>

          <h3>2. Orodha ya Matumizi & Kuchapisha FFARS Payment Voucher (A4 PDF)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-bottom:10px;">
            <select id="expFilterType" onchange="renderExpensesList()">
              <option value="ALL">Matumizi Yote (All)</option>
              <option value="MONTH">Mwezi Huu (This Month)</option>
              <option value="YEAR">Mwaka Huu (This Year)</option>
              <option value="RANGE">Kipindi Maalum (Date Range)</option>
            </select>
            <input type="date" id="expFrom" onchange="renderExpensesList()">
            <input type="date" id="expTo" onchange="renderExpensesList()">
            <button class="btn btn-blue" onclick="renderExpensesList()">🔄 Refresh Orodha</button>
          </div>
          <div id="expPrintArea"></div>
          <div id="ffarsPvOutput" style="margin-top:15px;"></div>
        </div>`;
      renderExpensesList();
    }
    if (tab === 'procurement') {
      const procs = SGB.select('procurement_committee');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Kikao cha Kamati ya Manunuzi (Wajumbe, Mahitaji & Makadirio Kiotomatiki)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px;">
            <input type="text" id="prTitle" placeholder="Kichwa cha Kikao (Mfano: Kikao cha Manunuzi ya Chakula)">
            <input type="date" id="prDate" value="${new Date().toISOString().slice(0, 10)}">
            <select id="prSource">
              <option value="Kutwa">Chanzo cha Pato: Kutwa</option>
              <option value="Hostel">Chanzo cha Pato: Hostel</option>
              <option value="Kambi ya Masomo">Chanzo cha Pato: Kambi ya Masomo</option>
            </select>
          </div>
          <textarea id="prMembers" rows="2" placeholder="Majina ya Wajumbe Waliohudhuria na Nyadhifa zao..."></textarea>

          <div style="background:#f8fafc; padding:12px; border:1px solid #cbd5e1; border-radius:8px; margin:10px 0;">
            <b style="font-size:12px;">➕ Ongeza Hitaji la Manunuzi:</b>

  function buildParentStatement() {
    const name = document.getElementById('psName').value.trim();
    const reg = document.getElementById('psReg').value.trim() || '-';
    const cls = document.getElementById('psClass').value.trim() || '-';
    const phone = document.getElementById('psPhone').value.trim();
    const accName = document.getElementById('psAccName').value.trim() || 'Mhasibu wa Shule';
    const hmName = document.getElementById('psHmName').value.trim() || 'Mkuu wa Shule';
    if (!name) { alert('⚠️ Andika jina la mwanafunzi kwanza.'); return; }

    const fees = SGB.select('fee_structures');
    const recs = SGB.select('accounting_receipts').filter(r => r.student_name.toLowerCase() === name.toLowerCase());
    const cfg = SGB.getConfig();
    const qr = SGB.qrImg(`SANGABUYE-PARENT-STMT:${name}|${reg}`);
    const todayStr = new Date().toLocaleDateString('sw-TZ');

    const catMap = {};
    fees.forEach(f => { catMap[f.category] = { name: f.category, required: Number(f.amount), paid: 0 }; });
    recs.forEach(r => {
      if (!catMap[r.payment_category]) catMap[r.payment_category] = { name: r.payment_category, required: Number(r.amount_paid), paid: 0 };
      catMap[r.payment_category].paid += Number(r.amount_paid);
    });

    const rows = Object.values(catMap);
    let totReq = 0, totPaid = 0, totDebt = 0;

    const tableRowsHtml = rows.map((item, idx) => {
      const debt = Math.max(0, item.required - item.paid);
      totReq += item.required; totPaid += item.paid; totDebt += debt;
      return `<tr><td>${idx + 1}</td><td><b>${item.name}</b></td><td style="color:#059669;"><b>${item.paid.toLocaleString()}</b></td><td style="color:${debt > 0 ? '#dc2626' : '#059669'};"><b>${debt.toLocaleString()}</b></td></tr>`;
    }).join('') || '<tr><td colspan="4">Hakuna kumbukumbu za michango bado.</td></tr>';

    const smsSummary = `SANGABUYE SEC: Taarifa ya Malipo ya ${name} (${reg}). Amelipa: TZS ${totPaid.toLocaleString()}, Salio/Deni: TZS ${totDebt.toLocaleString()}. Lipa CRDB: ${cfg.crdb}.`;

    document.getElementById('parentStmtBox').innerHTML = `
      <div id="parentStmtPrint" style="border:2px solid #064e3b; padding:24px; background:#fff; max-width:760px;">

            <p style="margin:2px 0; font-size:12px;">S.L.P 11898, Ilemela - Mwanza | Simu: 0784 755 173 / 0615 000 305</p>
            <p style="margin:0; font-size:12px;"><b>Akaunti ya CRDB:</b> SHULE YA SEKONDARI SANGABUYE E.K (<code>${cfg.crdb}</code>)</p>
          </div>
          <img src="${qr}" alt="QR">
        </div>

        <div style="background:#f8fafc; padding:10px 14px; border:1px solid #cbd5e1; border-radius:6px; margin:12px 0; font-size:13px;">
          <b>TAARIFA ZA MWANAFUNZI:</b><br>
          <b>Jina Kamili:</b> ${name.toUpperCase()} &nbsp;|&nbsp; <b>Namba ya Usajili:</b> ${reg} &nbsp;|&nbsp; <b>Kidato:</b> ${cls}
        </div>

        <h4 style="margin:10px 0 6px; color:#064e3b;">TAARIFA ZA MALIPO YA MWANAFUNZI</h4>
        <table>
          <tr><th>Na.</th><th>Aina ya Malipo</th><th>Kiasi Kilicholipwa (TZS)</th><th>Salio / Deni (TZS)</th></tr>
          ${tableRowsHtml}
        </table>

        <div style="background:#ecfdf5; border:1px solid #059669; padding:12px; border-radius:6px; margin-top:14px; font-size:13px;">
          <b>UFUPISHO WA MALIPO NA SALIO:</b><br>
          • <b>Jumla ya Michango Inayotakiwa:</b> TZS ${totReq.toLocaleString()}/=<br>
          • <b>Jumla ya Kiasi Kilicholipwa:</b> <span style="color:#059669;"><b>TZS ${totPaid.toLocaleString()}/=</b></span><br>
          • <b>Jumla ya Salio / Deni Lililobaki:</b> <span style="color:${totDebt > 0 ? '#dc2626' : '#059669'};"><b>TZS ${totDebt.toLocaleString()}/=</b></span>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:28px; font-size:12.5px; line-height:1.7;">

            ___________________________<br>
            <b>Mkuu wa Shule</b><br>
            Tarehe: ${todayStr}
          </div>
        </div>
      </div><br>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-blue" onclick="printDiv('parentStmtPrint')">🖨️ Chapisha Taarifa (A4 PDF)</button>
        <button class="btn btn-green" onclick="SGB.sendWhatsApp('${phone}', '${smsSummary}')">💬 Tuma WhatsApp</button>

      </div>`;

  function addToReceiptCart() {
    const cat = document.getElementById('itemCat').value.trim();
    const src = document.getElementById('itemSource').value;
    const amt = Number(document.getElementById('itemAmt').value);
    if (!cat || !amt || amt <= 0) { alert('⚠️ Weka aina ya mchango na kiasi sahihi.'); return; }
    receiptCart.push({ category: cat, source_fund: src, amount: amt });
    document.getElementById('itemCat').value = '';
    document.getElementById('itemAmt').value = '';
    renderReceiptCart();
  }

  function removeCartItem(idx) { receiptCart.splice(idx, 1); renderReceiptCart(); }

  function renderReceiptCart() {
    const box = document.getElementById('cartTableArea');
    if (!box) return;

  function editAndResendProc(id) {
    const proc = SGB.select('procurement_committee').find(p => p.id === id);
    if (!proc) return;
    const updatedItems = (proc.items || []).map(it => {
      if (it.rejected) {
        const newPrice = Number(prompt(`Hitaji "${it.name}" lilirejeshwa (${it.hm_note}). Ingiza bei mpya ya kimoja:`, it.price));
        if (newPrice > 0) return { ...it, price: newPrice, total: it.qty * newPrice, rejected: false, hm_note: '' };
      }
      return it;
    });
    const newTotal = updatedItems.reduce((s, x) => s + x.total, 0);
    SGB.update('procurement_committee', id, { items: updatedItems, estimated_budget: newTotal, status: 'Resent (Imetumwa Upya Kwa Mkuu)' });
    openTab('procurement');
  }

            <td>${i.tx_date || i.created_at}</td>
            <td><b>${i.supplier}</b></td>
            <td>${i.donor_type || '-'}</td>
            <td><b>${i.item_name}</b> (${i.category || 'Chakula'})</td>
            <td><b>${i.quantity} ${i.unit}</b></td>
            <td><button class="btn btn-amber" onclick="deductStore(${i.id}, ${i.quantity})">- Toa Matumizi</button></td>
          </tr>`).join('') || '<tr><td colspan="6">Hakuna rekodi za stoo kwenye kichujio hiki.</td></tr>'}
        </table>
      </div>`;
  }

  function deductStore(id, cur) {
    const used = Number(prompt('Ingiza kiasi kilichotumika:'));
    if (used > 0) { SGB.update('store_inventory', id, { quantity: Math.max(0, cur - used) }); renderStoreFiltered(); }
  }

  function checkClearance() {
    const name = document.getElementById('clrName').value.trim();
    const prepBy = document.getElementById('clrPrepBy').value.trim() || 'Mhasibu wa Shule';
    if (!name) { alert('⚠️ Andika jina la mwanafunzi kwanza.'); return; }

    const fees = SGB.select('fee_structures');
    const recs = SGB.select('accounting_receipts').filter(r => r.student_name.toLowerCase() === name.toLowerCase());
    const unreturned = SGB.select('library_loans').filter(l => l.student_name.toLowerCase() === name.toLowerCase() && l.status.includes('Ameazima'));
    const userObj = SGB.select('users_profile').find(u => u.full_name.toLowerCase() === name.toLowerCase());
    const regNo = userObj?.reg_or_staff_no || (recs?.student_reg_no || '-');

    const totalReq = fees.reduce((s, f) => s + Number(f.amount), 0);
    const totalPaid = recs.reduce((s, r) => s + Number(r.amount_paid), 0);
    const feeDebt = Math.max(0, totalReq - totalPaid);
    const hasBooks = unreturned.length > 0;
    const isClear = feeDebt === 0 && !hasBooks;
    const todayStr = new Date().toLocaleDateString('sw-TZ');
    const qr = SGB.qrImg(`CLEARANCE:${name}|STATUS:${isClear ? 'CLEARED' : 'DEBT'}`);

    const debtLines = [];
    if (feeDebt > 0) debtLines.push(`• Deni la Ada / Michango ya Shule: TZS ${feeDebt.toLocaleString()}/= (Amelipa TZS ${totalPaid.toLocaleString()} kati ya TZS ${totalReq.toLocaleString()})`);
    if (hasBooks) debtLines.push(`• Vitabu vya Maktaba Hajarudisha: ${unreturned.map(x => x.book).join(', ')}`);

    document.getElementById('clrResult').innerHTML = `
      <div id="clrPrintA4" style="border:2px solid #064e3b; padding:24px; background:#fff; max-width:720px; line-height:1.8; font-size:13.5px;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #064e3b; padding-bottom:10px;">
          <div>
            <b>HALMASHAURI YA MANISPAA YA ILEMELA</b><br>
            <h3 style="margin:2px 0; color:#064e3b;">SHULE YA SEKONDARI SANGABUYE</h3>
            <small>S.L.P 11898, Ilemela - Mwanza | Simu: 0784 755 173 / 0615 000 305</small>
          </div>
          <img src="${qr}">
        </div>
        <h3 style="text-align:center; text-decoration:underline; margin:14px 0;">CHETI CHA UHAKIKI WA MADENI (STUDENT CLEARANCE CERTIFICATE)</h3>
        <p>
          <b>Jina Kamili la Mwanafunzi:</b> ${name.toUpperCase()}<br>
          <b>Namba ya Usajili:</b> ${regNo}<br>
          <b>Tarehe ya Uhakiki:</b> ${todayStr}
        </p>
        <p>
          <b>HALI YA UHAKIKI (STATUS):</b>
          ${isClear
            ? '<span style="color:#059669; font-weight:bold;">✅ AMEKAMILISHA (CLEARED) — HANA DENI LOLOTE SHULENI.</span>'
            : '<span style="color:#dc2626; font-weight:bold;">❌ HAJAKAMILISHA (NOT CLEARED) — ANADAIWA YAFUATAYO:</span>'}
        </p>
        ${!isClear ? `<div style="background:#fef2f2; border-left:4px solid #dc2626; padding:10px 14px; margin:10px 0;">${debtLines.join('<br>')}</div>` : '<p>Inathibitishwa kuwa mwanafunzi tajwa hapo juu amekamilisha malipo yote yote ya fedha na amerudisha mali zote za maktaba ya shule.</p>'}
        <div style="display:flex; justify-content:space-between; margin-top:26px; font-size:12.5px;">
          <div><b>Aliyeandaa Uhakiki:</b><br>${prepBy}<br>______________________<br>Sahihi & Tarehe: ${todayStr}</div>
          <div><b>Imethibitishwa na:</b><br>Mkuu wa Shule<br>______________________<br>Muhuri & Tarehe: ${todayStr}</div>
        </div>
      </div>

      <div id="clrPrintThermal" style="display:none;">
        <div style="max-width:280px; font-family:monospace; font-size:12px; border:1px dashed #000; padding:10px;">
          <center><b>SANGABUYE SEC SCHOOL</b><br>CLEARANCE SLIP</center><hr>
          <b>Mwanafunzi:</b> ${name}<br><b>Reg No:</b> ${regNo}<br><b>Tarehe:</b> ${todayStr}<hr>
          <b>Hali:</b> ${isClear ? 'CLEARED (HANA DENI)' : 'ANADAIWA'}<br>
          ${!isClear ? debtLines.join('<br>') : 'Amekamilisha malipo na maktaba.'}<hr>
          <b>Aliyeandaa:</b> ${prepBy}<br><center><img src="${qr}"></center>
        </div>
      </div><br>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-blue" onclick="printDiv('clrPrintA4')">🖨️ Pakua / Print Cheti (A4 PDF)</button>
        <button class="btn btn-amber" onclick="printThermalClearance()">🧾 Print Kwenye Printa Isiyo na Wino (Thermal)</button>
      </div>`;
  }

  function printThermalClearance() {
    const html = document.getElementById('clrPrintThermal').innerHTML;
    const w = window.open('', '', 'width=400,height=600');
    w.document.write('<html><head><title>Thermal Clearance</title></head><body>' + html + '</body></html>');
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 300);
  }
  function genFinReport(type) {
    const sum = calcFinanceSummary();
    const recs = SGB.select('accounting_receipts');
    const vchs = SGB.select('expense_vouchers').filter(v => v.status === 'Paid');
    const procs = SGB.select('procurement_committee').filter(p => p.status === 'Paid');
    const pays = SGB.select('staff_payroll').filter(p => p.status === 'Paid');
    const qr = SGB.qrImg(`SANGABUYE-FIN-REPORT:${type}`);

    let bodyHtml = '';
    if (type === 'INCOME_EXP') {
      bodyHtml = `<h4>TAARIFA YA MAPATO NA MATUMIZI</h4>
        <table><tr><th>Maelezo</th><th>Kiasi (TZS)</th></tr>
        <tr><td>Mapato: CRDB (0150838972100)</td><td>${sum.crdbIn.toLocaleString()}</td></tr>
        <tr><td>Mapato: Pesa Taslimu (Cash)</td><td>${sum.cashIn.toLocaleString()}</td></tr>
        <tr style="background:#ecfdf5;"><td><b>JUMLA YA MAPATO</b></td><td><b>${sum.totalIn.toLocaleString()}</b></td></tr>
        <tr><td>Matumizi: Vocha za Kawaida</td><td>${vchs.reduce((s, v) => s + Number(v.amount), 0).toLocaleString()}</td></tr>
        <tr><td>Matumizi: Kamati ya Manunuzi</td><td>${procs.reduce((s, p) => s + Number(p.estimated_budget), 0).toLocaleString()}</td></tr>
        <tr><td>Matumizi: Mishahara</td><td>${pays.reduce((s, p) => s + Number(p.net_pay), 0).toLocaleString()}</td></tr>
        <tr style="background:#fef2f2;"><td><b>JUMLA YA MATUMIZI</b></td><td><b>${sum.totalOut.toLocaleString()}</b></td></tr>
        <tr style="background:#eff6ff;"><td><b>SALIO HALISI (NET BALANCE)</b></td><td><b>TZS ${sum.balance.toLocaleString()}</b></td></tr></table>`;
    } else if (type === 'SOURCES') {
      bodyHtml = `<h4>RIPOTI YA VYANZO VYA FEDHA (KUTWA, HOSTEL & KAMBI YA MASOMO)</h4>
        <table><tr><th>Chanzo</th><th>Mapato (TZS)</th><th>Matumizi (TZS)</th><th>Salio (TZS)</th></tr>
        <tr><td>1. Kutwa (Day)</td><td>${sum.kutwaIn.toLocaleString()}</td><td>${sum.kutwaOut.toLocaleString()}</td><td><b>${sum.kutwaBal.toLocaleString()}</b></td></tr>
        <tr><td>2. Hostel (Bweni)</td><td>${sum.hostelIn.toLocaleString()}</td><td>${sum.hostelOut.toLocaleString()}</td><td><b>${sum.hostelBal.toLocaleString()}</b></td></tr>
        <tr><td>3. Kambi ya Masomo</td><td>${sum.kambiIn.toLocaleString()}</td><td>${sum.kambiOut.toLocaleString()}</td><td><b>${sum.kambiBal.toLocaleString()}</b></td></tr></table>`;
    } else if (type === 'CASHBOOK') {
      bodyHtml = `<h4>KITABU CHA FEDHA (CASHBOOK)</h4>
        <table><tr><th>Tarehe</th><th>Maelezo</th><th>Chanzo</th><th>Mapato (+)</th><th>Matumizi (-)</th></tr>
        ${recs.map(r => `<tr><td>${r.tx_date || r.created_at}</td><td>Risiti ${r.receipt_number} (${r.student_name})</td><td>${r.source_fund || 'Kutwa'}</td><td style="color:#059669;">${Number(r.amount_paid).toLocaleString()}</td><td>-</td></tr>`).join('')}
        ${vchs.map(v => `<tr><td>${v.tx_date || v.created_at}</td><td>PV ${v.voucher_no} (${v.description})</td><td>${v.source_fund || 'Kutwa'}</td><td>-</td><td style="color:#dc2626;">${Number(v.amount).toLocaleString()}</td></tr>`).join('')}
        </table>`;
    } else if (type === 'PAYROLL_REP') {
      bodyHtml = `<h4>RIPOTI YA MISHAHARA ILIYOLIPWA</h4>
        <table><tr><th>Mtumishi</th><th>Kazi</th><th>Chanzo</th><th>Gross</th><th>Net Pay (TZS)</th><th>Tarehe</th></tr>
        ${pays.map(p => `<tr><td><b>${p.name}</b></td><td>${p.job_title || '-'}</td><td>${p.source_fund || 'Kutwa'}</td><td>${Number(p.gross).toLocaleString()}</td><td><b>${Number(p.net_pay).toLocaleString()}</b></td><td>${p.paid_date || p.created_at}</td></tr>`).join('')}
        </table>`;
    }

    document.getElementById('finReportArea').innerHTML = `
      <div id="repPrintBox" style="border:1px solid #064e3b; padding:18px; background:#fff;">
        <div style="display:flex; justify-content:space-between;"><div><b>HALMASHAURI YA MANISPAA YA ILEMELA</b><h3>SHULE YA SEKONDARI SANGABUYE</h3></div><img src="${qr}"></div>
        ${bodyHtml}
      </div><br><button class="btn btn-blue" onclick="printDiv('repPrintBox')">🖨️ Pakua / Print Ripoti (A4 PDF)</button>`;
  }

  function lockPeriodRange(e) {
    e.preventDefault();
    const label = document.getElementById('lkLabel').value.trim();
    const start_date = document.getElementById('lkStart').value;
    const end_date = document.getElementById('lkEnd').value;
    const periodSum = calcFinanceSummary(start_date, end_date);
    if (!confirm(`⚠️ Funga hesabu za "${label}"?\n• Mapato: TZS ${periodSum.totalIn.toLocaleString()}\n• Matumizi: TZS ${periodSum.totalOut.toLocaleString()}\n• Salio: TZS ${periodSum.balance.toLocaleString()}`)) return;
    SGB.insert('account_locks', { label, start_date, end_date, period_in: periodSum.totalIn, period_out: periodSum.totalOut, period_bal: periodSum.balance, status: 'Locked', unlock_requested: false });
    openTab('lock_accounts');
  }

  function requestUnlock(id, label) {
    SGB.update('account_locks', id, { unlock_requested: true });
    SGB.insert('direct_messages', { sender: 'Mhasibu (0615 000 305)', recipient: 'Mkuu wa Shule', subject: `OMBI LA KUFUNGUA HESABU: ${label}`, body: `Naomba ruhusa ya kufungua hesabu za: ${label}.` });
    openTab('lock_accounts');
  }

  function relockPeriod(id) {
    const lk = SGB.select('account_locks').find(x => x.id === id);
    if (!lk) return;
    const fresh = calcFinanceSummary(lk.start_date, lk.end_date);
    SGB.update('account_locks', id, { period_in: fresh.totalIn, period_out: fresh.totalOut, period_bal: fresh.balance, status: 'Locked', unlock_requested: false });
    openTab('lock_accounts');
  }

  function deleteLockRec(id) {
    if (!confirm('Futa rekodi hii?')) return;
    localStorage.setItem('sgb_account_locks', JSON.stringify(SGB.select('account_locks').filter(x => x.id !== id)));
    SGB.pushToCloud('account_locks'); openTab('lock_accounts');
  }

  function addCampStudent(e) { e.preventDefault(); SGB.insert('camp_students', { student_name: document.getElementById('cpName').value.trim(), class_name: document.getElementById('cpClass').value.trim(), camp_name: document.getElementById('cpTitle').value.trim(), fee_required: Number(document.getElementById('cpFee').value) }); openTab('study_camp'); }
  function addBusStudent(e) { e.preventDefault(); SGB.insert('school_bus_routes', { student_name: document.getElementById('bsName').value.trim(), route: document.getElementById('bsRoute').value.trim(), paid: Number(document.getElementById('bsPaid').value), phone: document.getElementById('bsPhone').value.trim() }); openTab('study_camp'); }
  function addFeeStruct(e) { e.preventDefault(); SGB.insert('fee_structures', { category: document.getElementById('fsCat').value.trim(), source_fund: document.getElementById('fsSource').value, amount: Number(document.getElementById('fsAmt').value) }); openTab('fee_struct'); }
  function delFeeStruct(id) { localStorage.setItem('sgb_fee_structures', JSON.stringify(SGB.select('fee_structures').filter(x => x.id !== id))); SGB.pushToCloud('fee_structures'); openTab('fee_struct'); }

  function printDiv(id) {
    const html = document.getElementById(id).innerHTML;
    const w = window.open('', '', 'width=850,height=650');
    w.document.write('<html><head><title>Sangabuye Print</title><style>body{font-family:sans-serif;padding:15px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:7px;font-size:12px;}</style></head><body>' + html + '</body></html>');
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 300);
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
</body>
