<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mtaaluma (Academic Master v14.0 — NECTA & A4) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <script src="https://sheetjs.com"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; overflow-x: hidden; }
    .sidebar { width: 265px; flex-shrink: 0; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11.8px; margin-bottom: 2px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { background: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 16px; min-width: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 10.5px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; overflow-x: auto; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; min-width: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #cbd5e1; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-purple { background: #7c3aed; color: white; }
    .a4-sheet { border: 2px solid #000; padding: 14px 18px; background: #fff; margin-bottom: 18px; color: #000; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MTAALUMA</h2>
  <p id="acSideName">Form 1–6 | Mtaala Mpya & NECTA</p>

  <div class="grp-lbl">A. Wanafunzi & Walimu</div>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari wa Taaluma</button>
  <button class="menu-btn" onclick="openTab('students_prem', this)">🏫 2. Wanafunzi, PREM & Tahasusi</button>
  <button class="menu-btn" onclick="openTab('allocations', this)">👨‍🏫 3. Mgawanyo wa Masomo</button>

  <div class="grp-lbl">B. Score Sheets & Alama</div>
  <button class="menu-btn" onclick="openTab('score_sheets', this)">📥 4. Pokea Score Sheets za Walimu</button>
  <button class="menu-btn" onclick="openTab('master_entry', this)">✍️ 5. Pakua & Pakia Excel (Multi-Sheet)</button>
  <button class="menu-btn" onclick="openTab('exam_publish', this)">📢 6. Dirisha, Muda & Tangaza Matokeo</button>

  <div class="grp-lbl">C. Matokeo, Summary & Ripoti A4</div>
  <button class="menu-btn" onclick="openTab('merit', this)">🏆 7. Generate Results & Summary (A/B)</button>
  <button class="menu-btn" onclick="openTab('subject_rank', this)">📈 8. Msimamo wa Kila Somo</button>
  <button class="menu-btn" onclick="openTab('class_compare', this)">📊 9. Ulinganisho wa Madarasa</button>
  <button class="menu-btn" onclick="openTab('term_reports', this)">📜 10. Ripoti ya Maendeleo (A4 Mzazi)</button>
  <button class="menu-btn" onclick="openTab('hall_cards', this)">🪪 11. Vibali vya Mtihani (Permits)</button>
  <button class="menu-btn" onclick="openTab('leaving_cert', this)">🎓 12. Cheti cha Kuhitimu (A4)</button>

  <div class="grp-lbl">D. Ratiba, Ukaguzi & Maktaba</div>
  <button class="menu-btn" onclick="openTab('timetable', this)">📅 13. Ratiba & Silabasi</button>
  <button class="menu-btn" onclick="openTab('lesson_audit', this)">📑 14. Ukaguzi wa Maandalio</button>
  <button class="menu-btn" onclick="openTab('promotion', this)">🔄 15. Pandisha Madarasa (F1–6)</button>
  <button class="menu-btn" onclick="openTab('acad_library', this)">📚 16. Maktaba, Vikao & SMS Outbox</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Taaluma</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div style="display:flex; gap:8px; align-items:center; flex:1; max-width:460px;">
      <input type="text" id="globalAcadSearch" onkeyup="filterAcademicTables(this.value)" placeholder="🔍 Tafuta popote kwa jina, kidato, somo...">
      <button type="button" class="btn btn-blue" style="white-space:nowrap;" onclick="refreshAcademicNow()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['academic', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();
  let currentActiveTab = 'overview';

  const SCHOOL_CLASSES = [
    'Form 1A', 'Form 1B', 'Form 1C', 'Form 1D','Form 1E','Form 1F',
    'Form 2A', 'Form 2B', 'Form 2C', 'Form 2D','Form 2E','Form 2F',
    'Form 3A', 'Form 3B', 'Form 3C', 'Form 3D','Form 3E','Form 3F',
    'Form 4A', 'Form 4B', 'Form 4C', 'Form 4D','Form 4E','Form 4F',
    'Form 5 PCM', 'Form 5 PCB', 'Form 5 PGM', 'Form 5 EGM', 'Form 5 HGL', 'Form 5 HKL', 'Form 5 HGE', 'Form 5 ECA', 'Form 5 CBG',
    'Form 6 PCM', 'Form 6 PCB', 'Form 6 PGM', 'Form 6 EGM', 'Form 6 HGL', 'Form 6 HKL', 'Form 6 HGE', 'Form 6 ECA', 'Form 6 CBG'
  ];

  const ALL_CURRICULUM_SUBJECTS = [
    'Historia ya Tanzania na Maadili', 'Business Studies (Biashara)', 'Civics', 'History', 'Geography',
    'Kiswahili', 'English Language', 'Literature in English', 'Basic Mathematics', 'Additional Mathematics',
    'Physics', 'Chemistry', 'Biology', 'Agriculture', 'Book-Keeping', 'Commerce',
    'Computer Science / ICT', 'Music', 'Fine Art', 'Theatre Arts', 'Food and Human Nutrition',
    'Physical Education & Sport', 'French', 'Arabic', 'Chinese', 'Bible Knowledge', 'Islamic Knowledge',
    'General Studies (GS)', 'Advanced Mathematics', 'Economics', 'Accountancy'
  ];

  function saveTableClean(table, arr) {
    if (SGB.forceReplaceCloud) SGB.forceReplaceCloud(table, arr);
    else { localStorage.setItem('sgb_' + table, JSON.stringify(arr)); SGB.pushToCloud(table); }
  }
  function normClass(str) {
    return String(str || '').toLowerCase()
      .replace(/kidato cha kwanza|kwanza/g, '1')
      .replace(/kidato cha pili|pili/g, '2')
      .replace(/kidato cha tatu|tatu/g, '3')
      .replace(/kidato cha nne|nne/g, '4')
      .replace(/kidato cha tano|tano/g, '5')
      .replace(/kidato cha sita|sita/g, '6')
      .replace(/form|kidato|cha|stream|mkondo/g, '')
      .replace(/\bvi\b/g, '6').replace(/\bv\b/g, '5').replace(/\biv\b/g, '4')
      .replace(/\biii\b/g, '3').replace(/\bii\b/g, '2').replace(/\bi\b/g, '1')
      .replace(/[^a-z0-9]/g, '');
  }

  function isALevelClass(cls) {
    const n = normClass(cls);
    return n.startsWith('5') || n.startsWith('6');
  }

  function gradeFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 'A'; if (s >= 70) return 'B'; if (s >= 60) return 'C';
      if (s >= 50) return 'D'; if (s >= 40) return 'E'; if (s >= 35) return 'S';
      return 'F';
    }
    if (s >= 75) return 'A'; if (s >= 65) return 'B'; if (s >= 45) return 'C';
    if (s >= 30) return 'D'; return 'F';
  }

  function pointsFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 1; if (s >= 70) return 2; if (s >= 60) return 3;
      if (s >= 50) return 4; if (s >= 40) return 5; if (s >= 35) return 6;
      return 7;
    }
    if (s >= 75) return 1; if (s >= 65) return 2; if (s >= 45) return 3;
    if (s >= 30) return 4; return 5;
  }

  function remarkFromGrade(g) {
    const map = { A: 'Bora Sana (Excellent)', B: 'Vizuri Sana (Very Good)', C: 'Vizuri (Good)', D: 'Inaridhisha (Satisfactory)', E: 'Wastani (Fair)', S: 'Subsidiary', F: 'Feli (Fail)' };
    return map[g] || '-';
  }

  function getExamTypesList() {
    const saved = JSON.parse(localStorage.getItem('sgb_exam_types') || 'null');
    if (saved && saved.length) return saved;
    return ['Midterm March', 'Terminal', 'Midterm September', 'Annual', 'Mock / Pre-NECTA'];
  }

  function examOptionsHtml(selected = '') {
    return getExamTypesList().map(ex => `<option value="${ex}" ${ex === selected ? 'selected' : ''}>${ex}</option>`).join('');
  }

  function classOptionsHtml(selected = 'Form 1A') {
    return SCHOOL_CLASSES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  function scopeOptionsHtml(selected = 'Form 1A') {
    const wholeForms = [
      { val: 'ALL_SCHOOL', lbl: '🏫 SHULE NZIMA (Form 1–6)' },
      { val: 'FORM_1_ALL', lbl: '📘 FORM 1 NZIMA (Mikondo Yote)' },
      { val: 'FORM_2_ALL', lbl: '📘 FORM 2 NZIMA (Mikondo Yote)' },
      { val: 'FORM_3_ALL', lbl: '📘 FORM 3 NZIMA (Mikondo Yote)' },
      { val: 'FORM_4_ALL', lbl: '📘 FORM 4 NZIMA (Mikondo Yote)' },
      { val: 'FORM_5_ALL', lbl: '📗 FORM 5 NZIMA (Tahasusi Zote)' },
      { val: 'FORM_6_ALL', lbl: '📗 FORM 6 NZIMA (Tahasusi Zote)' }
    ];
    return `<optgroup label="Kwa Kidato Kizima / Shule">${wholeForms.map(f => `<option value="${f.val}" ${f.val === selected ? 'selected' : ''}>${f.lbl}</option>`).join('')}</optgroup>
            <optgroup label="Kwa Mkondo / Tahasusi Maalum">${SCHOOL_CLASSES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('')}</optgroup>`;
  }

  function scopeLabel(scope) {
    const map = { ALL_SCHOOL: 'Shule Nzima (Form 1–6)', FORM_1_ALL: 'Form 1 Nzima', FORM_2_ALL: 'Form 2 Nzima', FORM_3_ALL: 'Form 3 Nzima', FORM_4_ALL: 'Form 4 Nzima', FORM_5_ALL: 'Form 5 Nzima', FORM_6_ALL: 'Form 6 Nzima' };
    return map[scope] || scope;
  }
  function getUnifiedStudents() {
    const map = {};
    SGB.select('academic_students').forEach(s => {
      const k = (s.full_name || '').trim().toLowerCase();
      if (k) map[k] = { id: s.id, full_name: s.full_name.trim(), gender: (s.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: s.class_name || 'Form 1A', combination: s.combination || 'O-Level', prem_no: s.prem_no || '-', parent_phone: s.parent_phone || '' };
    });
    SGB.select('users_profile').filter(u => (u.role || '').toLowerCase() === 'student').forEach(u => {
      const k = (u.full_name || '').trim().toLowerCase();
      if (k && !map[k]) {
        map[k] = { id: u.id, full_name: u.full_name.trim(), gender: (u.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: u.class_name || u.department || 'Form 1A', combination: u.combination || 'O-Level', prem_no: u.username || '-', parent_phone: u.phone || '' };
      }
    });
    return Object.values(map);
  }

  function getStudentsByScope(scope) {
    const all = getUnifiedStudents();
    if (!scope || scope === 'ALL_SCHOOL') return all;
    if (scope === 'FORM_1_ALL') return all.filter(s => normClass(s.class_name).startsWith('1'));
    if (scope === 'FORM_2_ALL') return all.filter(s => normClass(s.class_name).startsWith('2'));
    if (scope === 'FORM_3_ALL') return all.filter(s => normClass(s.class_name).startsWith('3'));
    if (scope === 'FORM_4_ALL') return all.filter(s => normClass(s.class_name).startsWith('4'));
    if (scope === 'FORM_5_ALL') return all.filter(s => normClass(s.class_name).startsWith('5'));
    if (scope === 'FORM_6_ALL') return all.filter(s => normClass(s.class_name).startsWith('6'));
    const targetNorm = normClass(scope);
    return all.filter(s => normClass(s.class_name) === targetNorm);
  }

  function computeScopeSummaries(scope = 'ALL_SCHOOL', exam1 = 'ALL', exam2 = 'NONE') {
    const students = getStudentsByScope(scope);
    const results = SGB.select('exam_results').filter(r => r.verified_status !== 'Returned');
    const isCombined = exam2 && exam2 !== 'NONE' && exam1 !== 'ALL';

    const resByStudent = {};
    results.forEach(r => {
      const k = (r.student_name || '').trim().toLowerCase();
      if (!k) return;
      if (!resByStudent[k]) resByStudent[k] = new Array();
      resByStudent[k].push(r);
    });

    const summaries = students.map(st => {
      const nLow = st.full_name.toLowerCase();
      const cls = st.class_name || 'Form 1A';
      const aLevel = isALevelClass(cls);
      const minRequired = aLevel ? 3 : 7;
      const stResults = resByStudent[nLow] || new Array();

      const subjMap = {};
      stResults.forEach(r => {
        const ex = (r.exam_type || '').trim();
        if (exam1 !== 'ALL') {
          if (!isCombined && ex.toLowerCase() !== exam1.toLowerCase()) return;
          if (isCombined && ex.toLowerCase() !== exam1.toLowerCase() && ex.toLowerCase() !== exam2.toLowerCase()) return;
        }
        const sName = (r.subject || 'Somo').trim();
        if (!subjMap[sName]) subjMap[sName] = { subject: sName, s1: null, s2: null, scores: new Array(), teacher_name: r.teacher_name || '-' };
        const sc = Number(r.score || 0);
        subjMap[sName].scores.push(sc);
        if (ex.toLowerCase() === exam1.toLowerCase()) subjMap[sName].s1 = sc;
        else if (isCombined && ex.toLowerCase() === exam2.toLowerCase()) subjMap[sName].s2 = sc;
      });

      const subjects = Object.values(subjMap).map(item => {
        const finalScore = isCombined
          ? Number((((item.s1 ?? item.s2 ?? 0) + (item.s2 ?? item.s1 ?? 0)) / 2).toFixed(1))
          : Number((item.scores.reduce((a, b) => a + b, 0) / item.scores.length).toFixed(1));
        return { subject: item.subject, s1: item.s1, s2: item.s2, score: finalScore, grade: gradeFromScore(finalScore, aLevel), teacher_name: item.teacher_name };
      });

      const subCount = subjects.length;
      const total = Number(subjects.reduce((s, x) => s + x.score, 0).toFixed(1));
      const avg = subCount ? Number((total / subCount).toFixed(1)) : 0;

      let div = 'ABSENT (ABS)', totalPts = '-', statusFlag = 'ABS';
      if (subCount > 0 && subCount < minRequired) {
        div = `INCOMPLETE (${subCount}/${minRequired})`; statusFlag = 'INC';
      } else if (subCount >= minRequired) {
        statusFlag = 'COMPLETE';
        const pArr = subjects.map(x => pointsFromScore(x.score, aLevel)).sort((a, b) => a - b).slice(0, minRequired);
        totalPts = pArr.reduce((a, b) => a + b, 0);
        div = aLevel ? (totalPts <= 9 ? 'Div I' : totalPts <= 12 ? 'Div II' : totalPts <= 17 ? 'Div III' : totalPts <= 19 ? 'Div IV' : 'Div 0') : (totalPts <= 17 ? 'Div I' : totalPts <= 21 ? 'Div II' : totalPts <= 25 ? 'Div III' : totalPts <= 33 ? 'Div IV' : 'Div 0');
      }

      return { name: st.full_name, gender: st.gender, cls, comb: st.combination, prem: st.prem_no, parent_phone: st.parent_phone, levelTag: aLevel ? 'A-Level' : 'O-Level', minRequired, subjects, subCount, total, avg, totalPts, div, statusFlag };
    });

    // Kokotoa nafasi ya mwanafunzi kwenye kila somo ndani ya kundi hili
    const subjScoresPool = {};
    summaries.forEach(s => s.subjects.forEach(sb => {
      if (!subjScoresPool[sb.subject]) subjScoresPool[sb.subject] = new Array();
      subjScoresPool[sb.subject].push(sb.score);
    }));
    Object.values(subjScoresPool).forEach(arr => arr.sort((a, b) => b - a));
    summaries.forEach(s => s.subjects.forEach(sb => {
      const pool = subjScoresPool[sb.subject] || new Array();
      sb.subjRank = `${pool.indexOf(sb.score) + 1}/${pool.length}`;
    }));

    const orderWeight = { COMPLETE: 1, INC: 2, ABS: 3 };
    summaries.sort((a, b) => (orderWeight[a.statusFlag] - orderWeight[b.statusFlag]) || (b.avg - a.avg));
    const satCount = summaries.filter(s => s.statusFlag !== 'ABS').length;
    let rankCounter = 0;
    return summaries.map(s => {
      if (s.statusFlag !== 'ABS') rankCounter++;
      return { ...s, rank: s.statusFlag === 'ABS' ? '-' : rankCounter, outOf: satCount };
    });
  }
  function buildSectionAAndBData(scope = 'Form 1A', exam1 = 'ALL', exam2 = 'NONE') {
    const list = computeScopeSummaries(scope, exam1, exam2);
    const isA = isALevelClass(scope) || (list.length > 0 && list.every(s => s.levelTag === 'A-Level'));

    const initRow = () => ({ reg: 0, sat: 0, I: 0, II: 0, III: 0, IV: 0, O: 0, pass: 0, fail: 0, abs: 0 });
    const rows = { F: initRow(), M: initRow(), T: initRow() };

    list.forEach(s => {
      const g = s.gender === 'F' ? 'F' : 'M';
      rows[g].reg++; rows.T.reg++;
      if (s.statusFlag === 'ABS') { rows[g].abs++; rows.T.abs++; return; }
      rows[g].sat++; rows.T.sat++;
      if (s.div === 'Div I') { rows[g].I++; rows.T.I++; rows[g].pass++; rows.T.pass++; }
      else if (s.div === 'Div II') { rows[g].II++; rows.T.II++; rows[g].pass++; rows.T.pass++; }
      else if (s.div === 'Div III') { rows[g].III++; rows.T.III++; rows[g].pass++; rows.T.pass++; }
      else if (s.div === 'Div IV') { rows[g].IV++; rows.T.IV++; rows[g].pass++; rows.T.pass++; }
      else if (s.div === 'Div 0') { rows[g].O++; rows.T.O++; rows[g].fail++; rows.T.fail++; }
    });

    const passPct = (r) => r.sat ? ((r.pass / r.sat) * 100).toFixed(1) + '%' : '0.0%';

    // Top 1 Wasichana & Wavulana
    const topGirl = list.find(s => s.gender === 'F' && s.statusFlag !== 'ABS') || null;
    const topBoy = list.find(s => s.gender === 'M' && s.statusFlag !== 'ABS') || null;

    // Uchambuzi wa Kila Somo (SEHEMU B)
    const subjMap = {};
    const allocs = SGB.select('subject_allocations');
    list.forEach(s => {
      s.subjects.forEach(sb => {
        if (!subjMap[sb.subject]) {
          const al = allocs.find(a => normClass(a.class_name) === normClass(s.cls) && (a.subject || '').toLowerCase() === sb.subject.toLowerCase());
          subjMap[sb.subject] = { name: sb.subject, sat: 0, A: 0, B: 0, C: 0, D: 0, E: 0, S: 0, F: 0, sumScore: 0, teacher: al ? al.teacher_name : (sb.teacher_name || '-') };
        }
        const m = subjMap[sb.subject];
        m.sat++; m.sumScore += sb.score;
        if (m[sb.grade] !== undefined) m[sb.grade]++;
      });
    });

    const subjList = Object.values(subjMap).map(m => {
      const passCnt = isA ? (m.A + m.B + m.C + m.D + m.E + m.S) : (m.A + m.B + m.C + m.D);
      const gpaVal = m.sat
        ? (isA
          ? ((m.A * 1 + m.B * 2 + m.C * 3 + m.D * 4 + m.E * 5 + m.S * 6 + m.F * 7) / m.sat)
          : ((m.A * 1 + m.B * 2 + m.C * 3 + m.D * 4 + m.F * 5) / m.sat))
        : 0;
      return {
        ...m,
        passCnt,
        passPct: m.sat ? ((passCnt / m.sat) * 100).toFixed(1) : '0.0',
        avgScore: m.sat ? (m.sumScore / m.sat).toFixed(1) : '0.0',
        gpa: m.sat ? gpaVal.toFixed(4) : '-',
        gpaNum: gpaVal
      };
    }).sort((a, b) => a.gpaNum - b.gpaNum);

    subjList.forEach((x, idx) => { x.rank = idx + 1; });
    const classGpa = subjList.length ? (subjList.reduce((s, x) => s + x.gpaNum, 0) / subjList.length).toFixed(4) : '-';

    return { list, rows, passPct, topGirl, topBoy, subjList, classGpa, isA };
  }
  function renderSectionAHtml(data) {
    const { rows, passPct } = data;
    return `
      <div style="background:#e2e8f0; padding:5px 8px; font-weight:bold; border:1px solid #000; margin-top:8px; font-size:11.5px;">SEHEMU A: MUHTASARI WA UFAULU WA DARASA (DIVISION SUMMARY)</div>
      <table style="margin-top:0; font-size:11px;">
        <thead><tr>
          <th>Jinsia</th><th>Walio-sajiliwa</th><th>Walio-fanya</th><th>DIV I</th><th>DIV II</th><th>DIV III</th><th>DIV IV</th><th>DIV 0</th><th>Waliofaulu (Div I–IV)</th><th>Waliofeli (Div 0)</th><th>Ufaulu (%)</th>
        </tr></thead>
        <tbody>

  function escXml(str) {

  function downloadMultiSheetExcel() {
    const cls = document.getElementById('meClass')?.value || 'Form 1A';
    const exam = document.getElementById('meExam')?.value || 'Terminal';
    const selectedSubjs = Array.from(document.querySelectorAll('.ex-subj-chk:checked')).map(c => c.value);
    if (!selectedSubjs.length) { alert('⚠️ Tafadhali tiki angalau somo moja kwanza.'); return; }

    const students = getUnifiedStudents().filter(s => normClass(s.class_name) === normClass(cls));
    if (!students.length) { alert(`⚠️ Hakuna wanafunzi waliosajiliwa kwenye ${cls}.`); return; }

    const fileName = `ScoreSheets_${cls.replace(/\s+/g, '_')}_${exam.replace(/\s+/g, '_')}.xlsx`;
    const usedNames = {};
    const uniqueTabName = (raw) => {
      let base = raw.replace(/[\\/?*[\]:]/g, '').trim().slice(0, 28) || 'Somo';
      if (usedNames[base]) { usedNames[base]++; base = `${base}_${usedNames[base]}`; }
      else usedNames[base] = 1;
      return base;
    };

    if (typeof XLSX !== 'undefined' && XLSX.utils) {
      const wb = XLSX.utils.book_new();
      selectedSubjs.forEach(subj => {
        const sheetRows = [['Jina la Mwanafunzi', 'PREM No', 'Kidato', 'Somo', 'Mtihani', 'Alama (0-100)']];
        students.forEach(st => sheetRows.push([st.full_name, st.prem_no || '-', st.class_name, subj, exam, '']));
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheetRows), uniqueTabName(subj));
      });
      XLSX.writeFile(wb, fileName);
      return;
    }

    let xml = `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">`;
    selectedSubjs.forEach(subj => {
      const tName = escXml(uniqueTabName(subj));
      xml += `<Worksheet ss:Name="${tName}"><Table>`;
      xml += `<Row><Cell><Data ss:Type="String">Jina la Mwanafunzi</Data></Cell><Cell><Data ss:Type="String">PREM No</Data></Cell><Cell><Data ss:Type="String">Kidato</Data></Cell><Cell><Data ss:Type="String">Somo</Data></Cell><Cell><Data ss:Type="String">Mtihani</Data></Cell><Cell><Data ss:Type="String">Alama (0-100)</Data></Cell></Row>`;
      students.forEach(st => {
        xml += `<Row><Cell><Data ss:Type="String">${escXml(st.full_name)}</Data></Cell><Cell><Data ss:Type="String">${escXml(st.prem_no || '-')}</Data></Cell><Cell><Data ss:Type="String">${escXml(st.class_name)}</Data></Cell><Cell><Data ss:Type="String">${escXml(subj)}</Data></Cell><Cell><Data ss:Type="String">${escXml(exam)}</Data></Cell><Cell><Data ss:Type="Number"></Data></Cell></Row>`;
      });
      xml += `</Table></Worksheet>`;
    });
    xml += `</Workbook>`;

    const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName.replace('.xlsx', '.xls');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  function uploadMultiSheetExcel() {
    const inp = document.getElementById('multiExcelFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la Excel (.xlsx au .xls) lililojazwa alama kwanza.'); return; }

    const fallbackCls = document.getElementById('meClass')?.value || 'Form 1A';
    const fallbackExam = document.getElementById('meExam')?.value || 'Terminal';
    const reader = new FileReader();

    reader.onload = (ev) => {
      let allResults = SGB.select('exam_results');
      let importedCount = 0;
      let sheetCounter = 0;

      const saveImportedCell = (stName, cls, subj, exam, rawScore) => {
        if (!stName || rawScore === undefined || rawScore === null || String(rawScore).trim() === '') return;
        const sc = Number(rawScore);
        if (isNaN(sc)) return;
        const alloc = SGB.select('subject_allocations').find(a => normClass(a.class_name) === normClass(cls) && (a.subject || '').toLowerCase() === subj.toLowerCase());
        const assignedTeacher = alloc ? alloc.teacher_name : 'Ofisi ya Mtaaluma';
        allResults = allResults.filter(x => !(normClass(x.class_name) === normClass(cls) && (x.subject || '').toLowerCase() === subj.toLowerCase() && (x.exam_type || '').toLowerCase() === exam.toLowerCase() && (x.student_name || '').toLowerCase() === stName.toLowerCase()));
        allResults.unshift({
          id: Date.now() + Math.floor(Math.random() * 10000),
          created_at: new Date().toLocaleString('sw-TZ'),
          student_name: stName, class_name: cls, subject: subj, exam_type: exam,
          score: sc, grade: gradeFromScore(sc, isALevelClass(cls)),
          teacher_name: assignedTeacher, verified_status: 'Approved'
        });
        importedCount++;
      };

      const buf = ev.target.result;
      const headText = new TextDecoder().decode(new Uint8Array(buf).slice(0, 200));

      if (headText.includes('<Workbook') || headText.includes('<?xml')) {
        const fullXml = new TextDecoder().decode(new Uint8Array(buf));
        const doc = new DOMParser().parseFromString(fullXml, 'text/xml');
        const sheets = Array.from(doc.getElementsByTagName('Worksheet'));
        sheetCounter = sheets.length;
        sheets.forEach(ws => {
          const sName = ws.getAttribute('ss:Name') || 'Somo';
          const rows = Array.from(ws.getElementsByTagName('Row'));
          rows.slice(1).forEach(row => {
            const cells = Array.from(row.getElementsByTagName('Cell')).map(c => c.textContent.trim());
            saveImportedCell(cells.at(0), cells.at(2) || fallbackCls, cells.at(3) || sName, cells.at(4) || fallbackExam, cells.at(5));
          });
        });
      } else if (typeof XLSX !== 'undefined' && XLSX.read) {
        const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        sheetCounter = wb.SheetNames.length;
        wb.SheetNames.forEach(sheetName => {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1 });
          rows.slice(1).forEach(r => saveImportedCell(String(r.at(0) || '').trim(), String(r.at(2) || fallbackCls).trim(), String(r.at(3) || sheetName).trim(), String(r.at(4) || fallbackExam).trim(), r.at(5)));
        });
      }

      saveTableClean('exam_results', allResults);
      alert(`✅ Alama ${importedCount} kutoka kwenye sheets ${sheetCounter} zimepakiwa kwenye mfumo!`);
      openTab('merit');
    };
    reader.readAsArrayBuffer(file);
  }

  function approveSingleTeacherUnlock(reqIdx) {
    const reqs = JSON.parse(localStorage.getItem('sgb_unlock_requests') || '[]');
    const rq = reqs.at(reqIdx);
    if (!rq) return;
    rq.status = 'Approved';
    localStorage.setItem('sgb_unlock_requests', JSON.stringify(reqs));
    SGB.pushToCloud('unlock_requests');

    const cfg = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":false,"published":true,"unlocked_teachers":[]}');
    const list = Array.isArray(cfg.unlocked_teachers) ? cfg.unlocked_teachers : new Array();
    if (!list.includes(rq.teacher)) list.push(rq.teacher);
    cfg.unlocked_teachers = list;
    localStorage.setItem('sgb_exam_window', JSON.stringify(cfg));
    SGB.pushToCloud('exam_window');

    alert(`✅ Mwalimu ${rq.teacher} amefunguliwa dirisha la kuingiza alama yeye peke yake!`);
    openTab('exam_publish');
  }

      openTab('students_prem');
    };
    reader.readAsText(file);
  }

  function downloadMeritCsv() {
    const list = computeScopeSummaries(window._meritScope || 'Form 1A', window._meritEx1 || 'ALL', window._meritEx2 || 'NONE');
    let csv = "Nafasi,Mwanafunzi,Jinsia,Kidato,Wastani,Points,Division\n";
    list.forEach(s => { csv += `"${s.rank}","${s.name}","${s.gender}","${s.cls}",${s.avg},"${s.totalPts}","${s.div}"\n`; });
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Matokeo_Sangabuye.csv'; a.click();
  }

  function promoteAllStudents() {
    if (!confirm('Pandisha wanafunzi wote madarasa?')) return;
    const upgraded = SGB.select('academic_students').map(s => {
      const c = (s.class_name || '').toLowerCase();
      let next = s.class_name;
      if (c.includes('1')) next = s.class_name.replace(/1/g, '2');
      else if (c.includes('2')) next = s.class_name.replace(/2/g, '3');
      else if (c.includes('3')) next = s.class_name.replace(/3/g, '4');
      else if (c.includes('4')) next = 'Alumni O-Level';
      else if (c.includes('5')) next = s.class_name.replace(/5/g, '6');
      else if (c.includes('6')) next = 'Alumni A-Level';
      return { ...s, class_name: next };
    });
    saveTableClean('academic_students', upgraded);
    openTab('students_prem');
  }

  function filterAcademicTables(q) {
    const low = (q || '').toLowerCase();
    document.querySelectorAll('#viewArea table tbody tr').forEach(tr => { tr.style.display = tr.innerText.toLowerCase().includes(low) ? '' : 'none'; });
  }

  async function refreshAcademicNow() {
    await SGB.pullFromCloud(true);
    openTab(currentActiveTab);
    document.getElementById('syncTime').innerText = ` (Imesasishwa: ${new Date().toLocaleTimeString()})`;
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
</body>
</html>
