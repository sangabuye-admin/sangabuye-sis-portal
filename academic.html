<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Taaluma (NECTA Standard) | Sangabuye SIS Portal</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 270px; background: #1e1b4b; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fde68a; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #c7d2fe; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #e0e7ff; text-align: left; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #4338ca; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #1e1b4b; }
    .btn { padding: 7px 13px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-indigo { background: #4338ca; color: white; }
    .btn-green { background: #059669; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MTAALUMA</h2>
  <p>Sangabuye Sec | NECTA Standard</p>
  <button class="menu-btn active" onclick="openTab('exams_ctrl', this)">📝 1. Usimamizi wa Mitihani & Publish</button>
  <button class="menu-btn" onclick="openTab('necta_master', this)">📊 2. Master Sheet (O & A-Level NECTA)</button>
  <button class="menu-btn" onclick="openTab('seating_isal', this)">🪑 3. Viti 40 (Real Mix), ISAL & CAL</button>
  <button class="menu-btn" onclick="openTab('analytics_gpa', this)">📈 4. Kijinsia (M/F), GPA & Remedial</button>
  <button class="menu-btn" onclick="openTab('report_card', this)">📄 5. Ripoti Binafsi (A4 PDF)</button>
  <button class="menu-btn" onclick="openTab('subjects_map', this)">📚 6. Pangia Walimu & Tahasusi</button>
  <button class="menu-btn" onclick="openTab('timetable', this)">🗓️ 7. Smart Timetable (Clash-Free)</button>
  <button class="menu-btn" onclick="openTab('transfer_bulk', this)">🎓 8. Transfer Cert & Bulk Marks</button>
  <button class="menu-btn" onclick="openTab('top_awards', this)">🏆 9. Top 10 Wanafunzi & Walimu Bora</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📝 1. Usimamizi wa Mitihani & Publish</strong> <span id="syncTime" style="font-size:11px; color:#4338ca;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
  <datalist id="stList"></datalist>
</div>
<script>
  const user = SGB.requireRole(['academic', 'super_admin']);
  SGB.startSessionTimer();

  function updateNames() {
    const names = new Set();
    SGB.select('users_profile').filter(u => u.role === 'student').forEach(u => names.add(u.full_name));
    SGB.select('exam_results').forEach(r => names.add(r.student_name));
    document.getElementById('stList').innerHTML = Array.from(names).map(n => `<option value="${n}">`).join('');
  }

  function calcOLevelDiv(pts) {
    if (pts >= 7 && pts <= 17) return 'Division I';
    if (pts >= 18 && pts <= 21) return 'Division II';
    if (pts >= 22 && pts <= 25) return 'Division III';
    if (pts >= 26 && pts <= 33) return 'Division IV';
    return 'Division 0';
  }

  function calcALevelDiv(pts) {
    if (pts >= 3 && pts <= 9) return 'Division I';
    if (pts >= 10 && pts <= 12) return 'Division II';
    if (pts >= 13 && pts <= 17) return 'Division III';
    if (pts >= 18 && pts <= 19) return 'Division IV';
    return 'Division 0';
  }

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    updateNames();
    const area = document.getElementById('viewArea');

    if (tab === 'exams_ctrl') {
      const exams = SGB.select('exams_list');
      area.innerHTML = `
        <div class="panel">
          <h3>Unda Mtihani Mpya (Exam Creation & Lock/Publish Control)</h3>
          <form onsubmit="createExam(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="exTitle" required placeholder="Jina la Mtihani (Mfano: Terminal Exam 2026)">
            <select id="exLevel"><option value="O-Level">O-Level (Form 1 - 4)</option><option value="A-Level">A-Level (Form 5 - 6)</option></select>
            <select id="exTerm"><option value="Term I">Muhula wa I (Term I)</option><option value="Term II">Muhula wa II (Term II)</option></select>
            <button type="submit" class="btn btn-indigo" style="grid-column: span 3;">➕ Fungua Mtihani Mpya</button>
          </form>
          <table><tr><th>Jina la Mtihani</th><th>Ngazi</th><th>Muhula</th><th>Hali (Status)</th><th>Udhibiti (Lock / Publish)</th></tr>
          ${exams.map(e => `<tr><td><b>${e.title}</b></td><td>${e.level}</td><td>${e.term}</td><td><b>${e.status}</b></td>
          <td>
            <button class="btn btn-amber" onclick="SGB.update('exams_list', ${e.id}, {status:'Locked (Alama Zimefungwa)'}); openTab('exams_ctrl')">🔒 Lock Marks</button>
            <button class="btn btn-green" onclick="SGB.update('exams_list', ${e.id}, {status:'Published (Yamechapishwa Kwa Wazazi)'}); openTab('exams_ctrl')">📢 Publish Results</button>
          </td></tr>`).join('') || '<tr><td colspan="5">Hakuna mtihani ulioundwa bado.</td></tr>'}
          </table>
        </div>`;
    }
    if (tab === 'necta_master') {
      area.innerHTML = `
        <div class="panel">
          <h3>Master Result Sheet (Chagua Ngazi & Muundo wa Ripoti)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <select id="msLevel" onchange="renderMasterSheet()">
              <option value="O-Level">O-Level (Form 1–4 | Masomo 7 Bora)</option>
              <option value="A-Level">A-Level (Form 5–6 | Principal 3)</option>
            </select>
            <select id="msFormat" onchange="renderMasterSheet()">
              <option value="NECTA">Muundo wa NECTA (Cand No, Sex, Agg, Div, Subjects)</option>
              <option value="STANDARD">Muundo wa Kawaida (Pos, Name, Total, Avg, Grade)</option>
            </select>
            <button class="btn btn-indigo" onclick="printSection('masterPrintArea')">🖨️ Pakua A4 Landscape PDF</button>
          </div>
          <div id="masterPrintArea"></div>
        </div>`;
      renderMasterSheet();
    }

    if (tab === 'seating_isal') {
      area.innerHTML = `
        <div class="panel">
          <h3>Upangaji wa Viti 40 (Real Student Mix), ISAL & CAL</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="exRoom" value="Chumba 01 (Hall A)" placeholder="Jina la Chumba">
            <input type="text" id="exSubj" value="012 History" placeholder="Somo & Msimbo">
            <input type="date" id="exDate">
            <button class="btn btn-indigo" onclick="genRealSeating()">🪑 1. Panga Viti 40 (Majina Halisi)</button>
            <button class="btn btn-green" onclick="genRealISAL()">📋 2. Zalisha Fomu ya ISAL</button>
            <button class="btn btn-amber" onclick="genRealCAL()">📑 3. Zalisha Fomu ya CAL</button>
          </div>
          <div id="examFormsOutput"></div>
        </div>`;
    }

    if (tab === 'analytics_gpa') {
      const marks = SGB.select('exam_results');
      const maps = SGB.select('student_subjects');
      const bySubj = {};
      const bySt = {};

      marks.forEach(m => {
        const k = m.student_name.toLowerCase();
        if (!bySt[k]) {
          const info = maps.find(x => x.student_name.toLowerCase() === k);
          bySt[k] = { name: m.student_name, sex: info ? info.sex : 'M', pts: [], hasX: false };
        }
        if (m.grade === 'X') bySt[k].hasX = true;
        else if (m.points > 0) bySt[k].pts.push(Number(m.points));

        if (m.grade !== 'X') {
          if (!bySubj[m.subject_name]) bySubj[m.subject_name] = { count: 0, pts: 0, pass: 0 };
          bySubj[m.subject_name].count++;
          bySubj[m.subject_name].pts += Number(m.points);
          if (Number(m.points) <= 4) bySubj[m.subject_name].pass++;
        }
      });

      const genderStats = { F: { I:0, II:0, III:0, IV:0, O:0, X:0 }, M: { I:0, II:0, III:0, IV:0, O:0, X:0 } };
      Object.values(bySt).forEach(s => {
        const g = s.sex === 'F' ? 'F' : 'M';
        if (s.pts.length < 7 && s.hasX) { genderStats[g].X++; return; }
        const agg = s.pts.sort((a,b)=>a-b).slice(0,7).reduce((a,b)=>a+b,0);
        if (s.pts.length < 7) return;
        if (agg <= 17) genderStats[g].I++;
        else if (agg <= 21) genderStats[g].II++;
        else if (agg <= 25) genderStats[g].III++;
        else if (agg <= 33) genderStats[g].IV++;
        else genderStats[g].O++;
      });

      const remedial = marks.filter(m => Number(m.total_score) < 35 && m.grade !== 'X');

      area.innerHTML = `
        <div class="panel">
          <h3>1. NECTA Gender Division Summary (Wasichana vs Wavulana)</h3>
          <table><tr><th>Jinsia (Sex)</th><th>Div I</th><th>Div II</th><th>Div III</th><th>Div IV</th><th>Div 0</th><th>ABS ('X')</th><th>Jumla</th></tr>
          <tr><td><b>Wasichana (F)</b></td><td>${genderStats.F.I}</td><td>${genderStats.F.II}</td><td>${genderStats.F.III}</td><td>${genderStats.F.IV}</td><td>${genderStats.F.O}</td><td>${genderStats.F.X}</td><td><b>${Object.values(genderStats.F).reduce((a,b)=>a+b,0)}</b></td></tr>
          <tr><td><b>Wavulana (M)</b></td><td>${genderStats.M.I}</td><td>${genderStats.M.II}</td><td>${genderStats.M.III}</td><td>${genderStats.M.IV}</td><td>${genderStats.M.O}</td><td>${genderStats.M.X}</td><td><b>${Object.values(genderStats.M).reduce((a,b)=>a+b,0)}</b></td></tr>
          </table>
        </div>
        <div class="panel">
          <h3>2. Wastani wa Ufaulu Kila Somo (Subject GPA & Pass Rate)</h3>
          <table><tr><th>Somo</th><th>Watahiniwa</th><th>Waliofaulu (A–D)</th><th>Wastani wa GPA</th></tr>
          ${Object.entries(bySubj).map(([sub, d]) => `<tr><td><b>${sub}</b></td><td>${d.count}</td><td>${d.pass} (${Math.round((d.pass/d.count)*100)}%)</td><td><b>${(d.pts/d.count).toFixed(2)}</b></td></tr>`).join('') || '<tr><td colspan="4">Hakuna alama bado.</td></tr>'}
          </table>
        </div>
        <div class="panel">
          <h3>3. Orodha ya Wanafunzi wa Msaada Maalum (Remedial List &lt; 35%)</h3>
          <table><tr><th>Mwanafunzi</th><th>Somo</th><th>Alama</th><th>Daraja</th></tr>
          ${remedial.map(r => `<tr><td><b>${r.student_name}</b></td><td>${r.subject_name}</td><td style="color:#dc2626;"><b>${r.total_score}%</b></td><td>${r.grade}</td></tr>`).join('') || '<tr><td colspan="4">Hakuna mwanafunzi wa Remedial.</td></tr>'}
          </table>
        </div>`;
    }
    if (tab === 'report_card') {
      area.innerHTML = `
        <div class="panel">
          <h3>Ripoti Binafsi ya Maendeleo ya Mwanafunzi (A4 Portrait PDF)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="rcName" list="stList" placeholder="Andika herufi chache za jina la mwanafunzi...">
            <input type="text" id="rcClass" placeholder="Kidato/Mkondo (Mfano: Form 4A)">
            <input type="text" id="rcTeacherComment" value="Ameonesha bidii nzuri darasani." placeholder="Maoni ya Mwalimu wa Darasa">
            <input type="text" id="rcHMComment" value="Hongera, ongeza juhudi zaidi." placeholder="Maoni ya Mkuu wa Shule">
            <button class="btn btn-indigo" style="grid-column: span 2;" onclick="buildReportCard()">📄 Tengeneza Ripoti ya A4 PDF</button>
          </div>
          <div id="rcOutput"></div>
        </div>`;
    }

    if (tab === 'subjects_map') {
      const maps = SGB.select('student_subjects');
      const allocs = SGB.select('teacher_allocations');
      const teachers = SGB.select('users_profile').filter(u => u.role === 'teacher');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Pangia Walimu Masomo na Madarasa (Teacher Allocation)</h3>
          <form onsubmit="saveTeacherAlloc(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="taTeacher" list="tList" required placeholder="Jina la Mwalimu (Mfano: Mwalimu wa Somo)">
            <datalist id="tList">${teachers.map(t => `<option value="${t.full_name}">`).join('')}<option value="Mwalimu wa Somo"></datalist>
            <input type="text" id="taClass" required placeholder="Darasa (Mfano: Form 2A)">
            <input type="text" id="taSubject" required placeholder="Somo (Mfano: Physics)">
            <select id="taIsClassTeacher"><option value="Hapana">Mwalimu wa Somo Tu</option><option value="Ndiyo">Ndiyo (Class Teacher)</option></select>
            <button type="submit" class="btn btn-indigo" style="grid-column: span 4;">✅ Mpangie Mwalimu Somo & Darasa</button>
          </form>
          <table><tr><th>Mwalimu</th><th>Darasa</th><th>Somo</th><th>Class Teacher?</th><th>Hatua</th></tr>
          ${allocs.map(a => `<tr><td><b>${a.teacher_name}</b></td><td>${a.class_name}</td><td>${a.subject_name}</td><td>${a.is_class_teacher}</td><td><button class="btn btn-red" onclick="delAlloc(${a.id})">Futa</button></td></tr>`).join('') || '<tr><td colspan="5">Hakuna mwalimu aliyepangiwa bado.</td></tr>'}
          </table>
        </div>
        <div class="panel">
          <h3>2. Usajili wa Tahasusi (A-Level) & Masomo ya Hiari ya Wanafunzi</h3>
          <form onsubmit="saveSubjMap(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="smName" list="stList" required placeholder="Jina la Mwanafunzi">
            <select id="smSex"><option value="M">Mvulana (M)</option><option value="F">Msichana (F)</option></select>
            <input type="text" id="smComb" required placeholder="Tahasusi / Electives (Mfano: PCM, HKL, Commerce)">
            <button type="submit" class="btn btn-green" style="grid-column: span 3;">💾 Hifadhi Usajili wa Wanafunzi</button>
          </form>
          <table><tr><th>Mwanafunzi</th><th>Jinsia</th><th>Tahasusi / Masomo ya Hiari</th></tr>
          ${maps.map(m => `<tr><td><b>${m.student_name}</b></td><td>${m.sex}</td><td>${m.combination}</td></tr>`).join('')}
          </table>
        </div>`;
    }

    if (tab === 'timetable') {
      const tt = SGB.select('smart_timetable');
      area.innerHTML = `
        <div class="panel">
          <h3>Jenereta ya Ratiba (Smart Timetable yenye Clash Detection)</h3>
          <form onsubmit="addTimetable(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <select id="ttDay"><option>Jumatatu</option><option>Jumanne</option><option>Jumatano</option><option>Alhamisi</option><option>Ijumaa</option></select>
            <input type="text" id="ttTime" required placeholder="Muda (08:00 - 09:20)">
            <input type="text" id="ttClass" required placeholder="Darasa (Form 2A)">
            <input type="text" id="ttTeacher" required placeholder="Mwalimu & Somo">
            <button type="submit" class="btn btn-indigo" style="grid-column: span 4;">➕ Ongeza Kipindi</button>
          </form>
          <table><tr><th>Siku</th><th>Muda</th><th>Darasa</th><th>Mwalimu & Somo</th></tr>
          ${tt.map(t => `<tr><td><b>${t.day}</b></td><td>${t.time}</td><td>${t.cls}</td><td>${t.teacher}</td></tr>`).join('')}
          </table>
        </div>`;
    }

    if (tab === 'transfer_bulk') {
      const marks = SGB.select('exam_results');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Barua Rasmi ya Uhamisho (Transfer Out Certificate PDF + QR)</h3>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="trName" list="stList" placeholder="Jina la Mwanafunzi">
            <input type="text" id="trToSchool" placeholder="Shule Anakohamia (Mfano: Mwanza Sec)">
            <input type="text" id="trReason" value="Uhamisho wa Wazazi Kikazi" placeholder="Sababu ya Uhamisho">
            <button class="btn btn-indigo" style="grid-column: span 3;" onclick="buildTransferCert()">📜 Zalisha Barua ya Uhamisho (PDF)</button>
          </div>
          <div id="trOutput"></div>
        </div>
        <div class="panel">
          <h3>2. Kupakia Alama kwa Mkupuo (Bulk Marks CSV) & Kurekebisha Alama</h3>
          <textarea id="bulkMarksTxt" rows="4" placeholder="Amina Hassan, Mathematics, 24, 58&#10;Baraka John, Mathematics, 19, 46"></textarea><br><br>
          <button class="btn btn-green" onclick="importBulkMarks()">📥 Pakia Alama Zote Sasa</button>
          <table><tr><th>Mwanafunzi</th><th>Somo</th><th>Jumla</th><th>Daraja</th><th>Hatua</th></tr>
          ${marks.slice(0, 15).map(m => `<tr><td>${m.student_name}</td><td>${m.subject_name}</td><td>${m.total_score}%</td><td><b>${m.grade}</b></td><td><button class="btn btn-amber" onclick="editMark(${m.id}, ${m.ca_score}, ${m.final_score})">✏️ Rekebisha</button></td></tr>`).join('')}
          </table>
        </div>`;
    }

    if (tab === 'top_awards') {
      const marks = SGB.select('exam_results').filter(m => m.grade !== 'X');
      const bySt = {};
      const bySubjTeacher = {};

      marks.forEach(m => {
        const sk = m.student_name.toLowerCase();
        if (!bySt[sk]) bySt[sk] = { name: m.student_name, cls: m.class_name || '-', scores: [], pts: [] };
        bySt[sk].scores.push(Number(m.total_score));
        if (m.points > 0) bySt[sk].pts.push(Number(m.points));

        const tk = `${m.subject_name} (${m.teacher || 'Mwalimu'})`;
        if (!bySubjTeacher[tk]) bySubjTeacher[tk] = { label: tk, scores: [] };
        bySubjTeacher[tk].scores.push(Number(m.total_score));
      });

      const top10Students = Object.values(bySt).map(s => {
        const tot = s.scores.reduce((a,b) => a + b, 0);
        const avg = s.scores.length ? (tot / s.scores.length).toFixed(1) : 0;
        const agg = s.pts.sort((a,b) => a - b).slice(0, 7).reduce((a,b) => a + b, 0);
        return { ...s, tot, avg: Number(avg), agg };
      }).sort((a,b) => b.avg - a.avg).slice(0, 10);

      const topTeachers = Object.values(bySubjTeacher).map(t => {
        const avg = (t.scores.reduce((a,b) => a + b, 0) / t.scores.length).toFixed(1);
        return { ...t, avg: Number(avg), count: t.scores.length };
      }).sort((a,b) => b.avg - a.avg).slice(0, 5);

      const qr = SGB.qrImg('SANGABUYE-TOP-10-AWARDS');

      area.innerHTML = `
        <div class="panel" id="awardsPrintArea">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><h3>🏆 WANAFUNZI 10 BORA WA SHULE (TOP 10 OVERALL STUDENTS)</h3><p style="font-size:12px;">Sangabuye Secondary School — Orodha ya Zawadi za Taaluma</p></div>
            <img src="${qr}">
          </div>
          <table><tr><th>Nafasi</th><th>Jina Kamili la Mwanafunzi</th><th>Kidato</th><th>Jumla ya Alama</th><th>Wastani (%)</th><th>Pointi (Best 7)</th></tr>
          ${top10Students.map((s, idx) => `<tr><td><b>#${idx + 1}</b></td><td><b>${s.name}</b></td><td>${s.cls}</td><td>${s.tot}</td><td><b style="color:#059669;">${s.avg}%</b></td><td>${s.agg}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna alama za kutosha bado.</td></tr>'}
          </table>

          <h3 style="margin-top:25px;">⭐ WALIMU & MASOMO 5 BORA (TOP PERFORMING SUBJECTS & TEACHERS)</h3>
          <table><tr><th>Nafasi</th><th>Somo & Mwalimu</th><th>Watahiniwa</th><th>Wastani wa Ufaulu (%)</th></tr>
          ${topTeachers.map((t, idx) => `<tr><td><b>#${idx + 1}</b></td><td><b>${t.label}</b></td><td>${t.count}</td><td><b style="color:#4338ca;">${t.avg}%</b></td></tr>`).join('') || '<tr><td colspan="4">Hakuna takwimu za masomo bado.</td></tr>'}
          </table>
        </div>
        <button class="btn btn-indigo" onclick="printSection('awardsPrintArea')">🖨️ Chapisha Orodha ya Zawadi (A4 PDF)</button>`;
    }
  }
  function createExam(e) {
    e.preventDefault();
    SGB.insert('exams_list', { title: document.getElementById('exTitle').value, level: document.getElementById('exLevel').value, term: document.getElementById('exTerm').value, status: 'Open (Wazi)' });

  function renderMasterSheet() {
    const level = document.getElementById('msLevel').value;
    const fmt = document.getElementById('msFormat').value;
    const marks = SGB.select('exam_results');
    const maps = SGB.select('student_subjects');
    const bySt = {};

    marks.forEach(m => {
      const k = m.student_name.toLowerCase();
      if (!bySt[k]) {
        const info = maps.find(x => x.student_name.toLowerCase() === k);
        bySt[k] = { name: m.student_name, sex: info ? info.sex : 'M', pts: [], scores: [], subList: [] };
      }
      if (m.points > 0) bySt[k].pts.push(Number(m.points));
      if (m.grade !== 'X') bySt[k].scores.push(Number(m.total_score));
      bySt[k].subList.push(`${m.subject_name.slice(0,4).toUpperCase()}-'${m.grade}'`);
    });

    const reqCount = level === 'O-Level' ? 7 : 3;
    const ranked = Object.values(bySt).map(s => {
      const best = s.pts.sort((a,b) => a - b).slice(0, reqCount);
      const agg = best.reduce((a,b) => a + b, 0);
      const tot = s.scores.reduce((a,b) => a + b, 0);
      const avg = s.scores.length ? (tot / s.scores.length).toFixed(1) : 0;
      const div = best.length >= reqCount ? (level === 'O-Level' ? calcOLevelDiv(agg) : calcALevelDiv(agg)) : `Incomplete (${best.length}/${reqCount})`;
      return { ...s, agg, tot, avg, div };
    }).sort((a,b) => b.avg - a.avg);

    const qr = SGB.qrImg(`SANGABUYE-MASTER-${level}`);
    let html = `<div style="display:flex; justify-content:space-between; align-items:center;"><div><h4>SANGABUYE SECONDARY SCHOOL — ${level} MASTER SHEET (${fmt})</h4></div><img src="${qr}"></div>`;

    if (fmt === 'NECTA') {
      html += `<table><tr><th>Cand No.</th><th>Jina Kamili</th><th>Sex</th><th>Agg</th><th>Division</th><th>Matokeo Kila Somo</th></tr>
      ${ranked.map((r, i) => `<tr><td>S.2026/${String(i+1).padStart(4,'0')}</td><td><b>${r.name}</b></td><td>${r.sex}</td><td><b>${r.agg}</b></td><td><b style="color:#4338ca;">${r.div}</b></td><td>${r.subList.join('  ')}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna alama zilizotumwa bado.</td></tr>'}</table>`;
    } else {
      html += `<table><tr><th>Pos</th><th>Jina Kamili</th><th>Sex</th><th>Total</th><th>Average</th><th>Division</th></tr>
      ${ranked.map((r, i) => `<tr><td><b>#${i+1}</b></td><td><b>${r.name}</b></td><td>${r.sex}</td><td>${r.tot}</td><td><b>${r.avg}%</b></td><td>${r.div}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna alama bado.</td></tr>'}</table>`;
    }
    document.getElementById('masterPrintArea').innerHTML = html;
  }

  function getRealCandidates() {
    const users = SGB.select('users_profile').filter(u => u.role === 'student');
    const cands = [];
    for (let i = 0; i < 40; i++) {
      if (users[i]) cands.push({ no: users[i].reg_or_staff_no || `S.2026/${String(i+1).padStart(4,'0')}`, name: users[i].full_name });
      else cands.push({ no: `S.2026/${String(i+1).padStart(4,'0')}`, name: `Mtahiniwa #${i+1}` });
    }
    return cands;
  }

  function importBulkMarks() {
    const lines = document.getElementById('bulkMarksTxt').value.trim().split('\n').filter(Boolean);
    lines.forEach(l => {
      const [st, sub, caStr, finStr] = l.split(',').map(x => x.trim());
      const ca = Number(caStr || 0), finRaw = Number(finStr || 0);
      const abs = finRaw < 0, fin = abs ? 0 : finRaw, tot = abs ? 0 : (ca + fin);
      let grade = 'F', points = 5;
      if (abs) { grade = 'X'; points = 0; }
      else if (tot >= 75) { grade = 'A'; points = 1; }
      else if (tot >= 65) { grade = 'B'; points = 2; }
      else if (tot >= 45) { grade = 'C'; points = 3; }
      else if (tot >= 30) { grade = 'D'; points = 4; }
      if (st && sub) SGB.insert('exam_results', { student_name: st, subject_name: sub, ca_score: ca, final_score: fin, total_score: tot, grade, points });
    });
    alert(`✅ Alama za wanafunzi ${lines.length} zimepakiwa kikamilifu!`);
    openTab('transfer_bulk');
  }

  function editMark(id, oldCa, oldFin) {
    const newCa = Number(prompt('Ingiza alama mpya ya CA (0-30):', oldCa));
    const newFin = Number(prompt('Ingiza alama mpya ya Final (0-70 au -1):', oldFin));
    if (isNaN(newCa) || isNaN(newFin)) return;
    const abs = newFin < 0, fin = abs ? 0 : newFin, tot = abs ? 0 : (newCa + fin);
    let grade = 'F', points = 5;
    if (abs) { grade = 'X'; points = 0; }
    else if (tot >= 75) { grade = 'A'; points = 1; }
    else if (tot >= 65) { grade = 'B'; points = 2; }
    else if (tot >= 45) { grade = 'C'; points = 3; }
    else if (tot >= 30) { grade = 'D'; points = 4; }
    SGB.update('exam_results', id, { ca_score: newCa, final_score: fin, total_score: tot, grade, points });
    openTab('transfer_bulk');
  }

  }

  function addTimetable(e) {
    e.preventDefault();
    const day = document.getElementById('ttDay').value;
    const time = document.getElementById('ttTime').value.trim();
    const cls = document.getElementById('ttClass').value.trim();
    const teacher = document.getElementById('ttTeacher').value.trim();
    const clash = SGB.select('smart_timetable').find(x => x.day === day && x.time === time && (x.teacher.toLowerCase() === teacher.toLowerCase() || x.cls.toLowerCase() === cls.toLowerCase()));
    if (clash) { alert(`⛔ MGONGANO WA RATIBA: ${clash.teacher} au ${clash.cls} tayari lina kipindi ${day} saa ${time}!`); return; }
    SGB.insert('smart_timetable', { day, time, cls, teacher });
    openTab('timetable');
  }

  function printSection(id) {
    const html = document.getElementById(id).innerHTML;
    const w = window.open('', '', 'width=850,height=650');
    w.document.write('<html><head><title>Sangabuye NECTA Print</title><style>body{font-family:sans-serif;padding:15px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:6px;font-size:11.5px;}</style></head><body>' + html + '</body></html>');
    w.document.close(); w.focus();
    setTimeout(() => { w.print(); w.close(); }, 300);
  }

  openTab('exams_ctrl', document.querySelector('.menu-btn'));
