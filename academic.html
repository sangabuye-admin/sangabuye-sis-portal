<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mtaaluma (Academic Master v13.0 — Form 1-6) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 265px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11.8px; margin-bottom: 2px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 10.5px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .a4-sheet { background: white; border: 2px solid #0f294a; padding: 16px 20px; margin-bottom: 16px; font-size: 11px; line-height: 1.4; }
    .school-stamp { border: 2px solid #1d4ed8; color: #1d4ed8; border-radius: 50%; width: 84px; height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 7.5px; font-weight: bold; transform: rotate(-10deg); }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MTAALUMA</h2>
  <p>Academic Master | Form 1–6</p>

  <div class="grp-lbl">A. Wanafunzi & Walimu</div>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊 1. Muhtasari wa Taaluma</button>
  <button class="menu-btn" onclick="openTab('students_prem', this)">🏫 2. Wanafunzi, PREM & Tahasusi</button>
  <button class="menu-btn" onclick="openTab('allocations', this)">👨‍🏫 3. Mgawanyo wa Masomo</button>

  <div class="grp-lbl">B. Score Sheets & Alama</div>
  <button class="menu-btn" onclick="openTab('score_sheets', this)">📥 4. Pokea Score Sheets za Walimu</button>
  <button class="menu-btn" onclick="openTab('master_entry', this)">✍️ 5. Jaza Alama & Excel Multi-Sheet</button>
  <button class="menu-btn" onclick="openTab('exam_publish', this)">📢 6. Dirisha, Muda & Tangaza</button>

  <div class="grp-lbl">C. Matokeo, SMS/WA & Ripoti A4</div>
  <button class="menu-btn" onclick="openTab('merit', this)">🏆 7. Generate Results & Broadsheet</button>
  <button class="menu-btn" onclick="openTab('subject_rank', this)">📈 8. Msimamo wa Kila Somo</button>
  <button class="menu-btn" onclick="openTab('class_compare', this)">📊 9. Ulinganisho wa Madarasa</button>
  <button class="menu-btn" onclick="openTab('term_reports', this)">📜 10. Ripoti ya Muhula (A4 Batch)</button>
  <button class="menu-btn" onclick="openTab('hall_cards', this)">🪪 11. Vibali vya Mtihani (Permits)</button>
  <button class="menu-btn" onclick="openTab('leaving_cert', this)">🎓 12. Cheti cha Kuhitimu (A4)</button>

  <div class="grp-lbl">D. Ratiba, Ukaguzi & Maktaba</div>
  <button class="menu-btn" onclick="openTab('timetable', this)">📅 13. Ratiba & Silabasi</button>
  <button class="menu-btn" onclick="openTab('lesson_audit', this)">📑 14. Ukaguzi wa Maandalio</button>
  <button class="menu-btn" onclick="openTab('promotion', this)">🔄 15. Pandisha Madarasa (F1–6)</button>
  <button class="menu-btn" onclick="openTab('acad_library', this)">📚 16. Maktaba & SMS Outbox</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊 1. Muhtasari wa Taaluma</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div style="display:flex; gap:8px; align-items:center; flex:1; max-width:460px;">
      <input type="text" id="globalAcadSearch" onkeyup="filterAcademicTables(this.value)" placeholder="🔍 Tafuta jina, PREM, simu, kidato au somo...">
      <button type="button" class="btn btn-blue" style="white-space:nowrap;" onclick="refreshAcademicNow()">🔄 Refresh</button>
    </div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['academic', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();
  let currentActiveTab = 'overview';

  const STANDARD_CLASSES = [
    'Form 1A', 'Form 1B', 'Form 1C', 'Form 1D',
    'Form 2A', 'Form 2B', 'Form 2C', 'Form 2D',
    'Form 3A', 'Form 3B', 'Form 3C', 'Form 3D',
    'Form 4A', 'Form 4B', 'Form 4C', 'Form 4D',
    'Form 5 PCM', 'Form 5 PCB', 'Form 5 PGM', 'Form 5 EGM', 'Form 5 HGL', 'Form 5 HKL', 'Form 5 HGK',
    'Form 6 PCM', 'Form 6 PCB', 'Form 6 PGM', 'Form 6 EGM', 'Form 6 HGL', 'Form 6 HKL', 'Form 6 HGK'
  ];

  const ALL_SCHOOL_SUBJECTS = [
    'Civics', 'History', 'Geography', 'Kiswahili', 'English Language',
    'Physics', 'Chemistry', 'Biology', 'Basic Mathematics', 'Book-Keeping', 'Commerce', 'Computer Studies',
    'Advanced Mathematics', 'General Studies (GS)', 'Basic Applied Mathematics (BAM)', 'Economics', 'Divinity / Islamic'
  ];

  function classOptionsHtml(selected = '') {
    return STANDARD_CLASSES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  function scopeOptionsHtml(selected = 'Form 1A') {
    const groups = [
      { val: 'ALL_SCHOOL', lbl: '🏫 SHULE NZIMA (Form 1–6 Wote)' },
      { val: 'ALL_F1', lbl: '📘 DARASA ZIMA: Form 1 (Mikondo Yote)' },
      { val: 'ALL_F2', lbl: '📘 DARASA ZIMA: Form 2 (Mikondo Yote)' },
      { val: 'ALL_F3', lbl: '📘 DARASA ZIMA: Form 3 (Mikondo Yote)' },
      { val: 'ALL_F4', lbl: '📘 DARASA ZIMA: Form 4 (Mikondo Yote)' },
      { val: 'ALL_F5', lbl: '🎓 DARASA ZIMA: Form 5 (Tahasusi Zote)' },
      { val: 'ALL_F6', lbl: '🎓 DARASA ZIMA: Form 6 (Tahasusi Zote)' }
    ];
    return groups.map(g => `<option value="${g.val}" ${g.val === selected ? 'selected' : ''}>${g.lbl}</option>`).join('') +
      STANDARD_CLASSES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>🔹 Mkondo: ${c}</option>`).join('');
  }

  function scopeLabel(sc) {
    const map = { ALL_SCHOOL: 'Shule Nzima', ALL_F1: 'Form 1 (Mikondo Yote)', ALL_F2: 'Form 2 (Mikondo Yote)', ALL_F3: 'Form 3 (Mikondo Yote)', ALL_F4: 'Form 4 (Mikondo Yote)', ALL_F5: 'Form 5 (Tahasusi Zote)', ALL_F6: 'Form 6 (Tahasusi Zote)' };
    return map[sc] || sc;
  }

  function getExamTypesList() {
    const saved = JSON.parse(localStorage.getItem('sgb_exam_types') || 'null');
    if (saved && saved.length) return saved;
    return ['Midterm March', 'Terminal', 'Midterm September', 'Annual', 'Mock / Pre-NECTA'];
  }

  function examOptionsHtml(selected = '') {
    return getExamTypesList().map(ex => `<option value="${ex}" ${ex === selected ? 'selected' : ''}>${ex}</option>`).join('');
  }
  function normClass(str) {
    return String(str || '').toLowerCase()
      .replace(/kidato cha kwanza|kwanza/g, '1')
      .replace(/kidato cha pili|pili/g, '2')
      .replace(/kidato cha tatu|tatu/g, '3')
      .replace(/kidato cha nne|nne/g, '4')
      .replace(/kidato cha tano|tano/g, '5')
      .replace(/kidato cha sita|sita/g, '6')
      .replace(/form|kidato|cha|stream|mkondo/g, '')
      .replace(/\bvi\b/g, '6').replace(/\bv\b/g, '5').replace(/\biv\b/g, '4')
      .replace(/\biii\b/g, '3').replace(/\bii\b/g, '2').replace(/\bi\b/g, '1')
      .replace(/[^a-z0-9]/g, '');
  }

  function isALevelClass(cls) {
    const n = normClass(cls);
    return n.startsWith('5') || n.startsWith('6');
  }

  function gradeFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 'A'; if (s >= 70) return 'B'; if (s >= 60) return 'C';
      if (s >= 50) return 'D'; if (s >= 40) return 'E'; if (s >= 35) return 'S';
      return 'F';
    }
    if (s >= 75) return 'A'; if (s >= 65) return 'B'; if (s >= 45) return 'C';
    if (s >= 30) return 'D'; return 'F';
  }

  function pointsFromGrade(g, isALevel = false) {
    if (isALevel) return ({ A: 1, B: 2, C: 3, D: 4, E: 5, S: 6, F: 7 })[g] || 7;
    return ({ A: 1, B: 2, C: 3, D: 4, F: 5 })[g] || 5;
  }

  function remarkFromGrade(g) {
    return ({ A: 'Bora Sana (Excellent)', B: 'Vizuri Sana (Very Good)', C: 'Vizuri (Good)', D: 'Wastani (Satisfactory)', E: 'Inaridhisha (Pass)', S: 'Dhaifu (Subsidiary)', F: 'Feli (Fail)' })[g] || '-';
  }

  function getUnifiedStudents() {
    const map = {};
    SGB.select('academic_students').forEach(s => {
      const k = (s.full_name || '').trim().toLowerCase();
      if (k) map[k] = { id: s.id, full_name: s.full_name.trim(), gender: (s.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: s.class_name || 'Form 1A', combination: s.combination || (isALevelClass(s.class_name) ? 'PCM' : 'O-Level'), prem_no: s.prem_no || '-', parent_phone: s.parent_phone || '' };
    });
    SGB.select('users_profile').filter(u => (u.role || '').toLowerCase() === 'student').forEach(u => {
      const k = (u.full_name || '').trim().toLowerCase();
      if (k && !map[k]) {
        const cls = u.class_name || u.department || 'Form 1A';
        map[k] = { id: u.id, full_name: u.full_name.trim(), gender: (u.gender || 'M').toUpperCase().startsWith('F') ? 'F' : 'M', class_name: cls, combination: u.combination || (isALevelClass(cls) ? 'PCM' : 'O-Level'), prem_no: u.username || '-', parent_phone: u.phone || '' };
      }
    });
    return Object.values(map);
  }

  function getStudentsByScope(scope) {
    const all = getUnifiedStudents();
    if (!scope || scope === 'ALL_SCHOOL') return all;
    if (scope === 'ALL_F1') return all.filter(s => normClass(s.class_name).startsWith('1'));
    if (scope === 'ALL_F2') return all.filter(s => normClass(s.class_name).startsWith('2'));
    if (scope === 'ALL_F3') return all.filter(s => normClass(s.class_name).startsWith('3'));
    if (scope === 'ALL_F4') return all.filter(s => normClass(s.class_name).startsWith('4'));
    if (scope === 'ALL_F5') return all.filter(s => normClass(s.class_name).startsWith('5'));
    if (scope === 'ALL_F6') return all.filter(s => normClass(s.class_name).startsWith('6'));
    return all.filter(s => normClass(s.class_name) === normClass(scope));
  }
  function computeScopeSummaries(scope = 'ALL_SCHOOL', exam1 = 'ALL', exam2 = 'NONE') {
    const results = SGB.select('exam_results').filter(r => r.verified_status !== 'Returned');
    const regStudents = getStudentsByScope(scope);
    const isCombined = exam2 && exam2 !== 'NONE' && exam1 !== 'ALL';
    const bySt = {};

    regStudents.forEach(s => {
      const key = s.full_name.toLowerCase();
      bySt[key] = { name: s.full_name, gender: s.gender, cls: s.class_name, comb: s.combination, prem: s.prem_no, parent_phone: s.parent_phone, subjMap: {} };
    });

    results.forEach(r => {
      const stName = (r.student_name || '').trim();
      const key = stName.toLowerCase();
      if (!bySt[key]) return;
      const ex = (r.exam_type || '').trim();
      if (exam1 !== 'ALL') {
        if (!isCombined && ex.toLowerCase() !== exam1.toLowerCase()) return;
        if (isCombined && ex.toLowerCase() !== exam1.toLowerCase() && ex.toLowerCase() !== exam2.toLowerCase()) return;
      }
      const subj = (r.subject || 'Somo').trim();
      if (!bySt[key].subjMap[subj]) bySt[key].subjMap[subj] = { subject: subj, s1: null, s2: null, scores: new Array(), teacher_name: r.teacher_name || '-' };
      const sc = Number(r.score || 0);
      bySt[key].subjMap[subj].scores.push(sc);
      if (ex.toLowerCase() === exam1.toLowerCase()) bySt[key].subjMap[subj].s1 = sc;
      else if (isCombined && ex.toLowerCase() === exam2.toLowerCase()) bySt[key].subjMap[subj].s2 = sc;
    });

    const list = Object.values(bySt).map(st => {
      const aLevel = isALevelClass(st.cls);
      const minRequired = aLevel ? 3 : 7;
      const subjects = Object.values(st.subjMap).map(item => {
        const finalScore = isCombined
          ? Number((((item.s1 ?? item.s2 ?? 0) + (item.s2 ?? item.s1 ?? 0)) / 2).toFixed(1))
          : Number((item.scores.reduce((a, b) => a + b, 0) / item.scores.length).toFixed(1));
        const g = gradeFromScore(finalScore, aLevel);
        return { subject: item.subject, s1: item.s1, s2: item.s2, score: finalScore, grade: g, points: pointsFromGrade(g, aLevel), teacher_name: item.teacher_name };
      });

      const subCount = subjects.length;
      const total = Number(subjects.reduce((sum, x) => sum + x.score, 0).toFixed(1));
      const avg = subCount ? Number((total / subCount).toFixed(1)) : 0;

      let div = 'ABSENT (ABS)', totalPts = '-', statusFlag = 'ABS';
      if (subCount > 0 && subCount < minRequired) {
        div = `INCOMPLETE (${subCount}/${minRequired})`; statusFlag = 'INC';
      } else if (subCount >= minRequired) {
        statusFlag = 'OK';
        const bestPts = subjects.map(s => s.points).sort((a, b) => a - b).slice(0, minRequired);
        totalPts = bestPts.reduce((a, b) => a + b, 0);
        div = aLevel
          ? (totalPts <= 9 ? 'Div I' : totalPts <= 12 ? 'Div II' : totalPts <= 17 ? 'Div III' : totalPts <= 19 ? 'Div IV' : 'Div 0')
          : (totalPts <= 17 ? 'Div I' : totalPts <= 21 ? 'Div II' : totalPts <= 25 ? 'Div III' : totalPts <= 33 ? 'Div IV' : 'Div 0');
      }
      return { ...st, subjects, subCount, minRequired, total, avg, totalPts, div, statusFlag, isCombined, levelTag: aLevel ? 'A-Level' : 'O-Level' };
    });

    const eligible = list.filter(x => x.statusFlag === 'OK').sort((a, b) => (a.totalPts !== b.totalPts ? a.totalPts - b.totalPts : b.avg - a.avg));
    const incList = list.filter(x => x.statusFlag === 'INC').sort((a, b) => b.avg - a.avg);
    const absList = list.filter(x => x.statusFlag === 'ABS').sort((a, b) => a.name.localeCompare(b.name));
    const finalSorted = [...eligible, ...incList, ...absList];

    finalSorted.forEach((item, idx) => {
      item.rank = item.statusFlag === 'OK' ? (idx + 1) : '-';
      item.outOf = eligible.length;
    });
    return finalSorted;
  }
  function openTab(tab, btn) {
    currentActiveTab = tab;
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const students = getUnifiedStudents();
      const boys = students.filter(s => s.gender === 'M').length;
      const girls = students.filter(s => s.gender === 'F').length;
      const allSumm = computeScopeSummaries('ALL_SCHOOL', 'ALL', 'NONE');
      const eligible = allSumm.filter(s => s.statusFlag === 'OK');
      const schoolAvg = eligible.length ? (eligible.reduce((s, x) => s + x.avg, 0) / eligible.length).toFixed(1) : '0.0';
      const pendingSheets = SGB.select('exam_results').filter(r => !r.verified_status || r.verified_status === 'Pending').length;
      const allocCount = SGB.select('subject_allocations').length;

      const divCounts = { 'Div I': 0, 'Div II': 0, 'Div III': 0, 'Div IV': 0, 'Div 0': 0, 'INC': 0, 'ABS': 0 };
      allSumm.forEach(s => {
        if (s.statusFlag === 'INC') divCounts['INC']++;
        else if (s.statusFlag === 'ABS') divCounts['ABS']++;
        else if (divCounts[s.div] !== undefined) divCounts[s.div]++;
      });
      const maxDiv = Math.max(1, ...Object.values(divCounts));

      const classBars = ['Form 1', 'Form 2', 'Form 3', 'Form 4', 'Form 5', 'Form 6'].map(lbl => {
        const grp = allSumm.filter(s => normClass(s.cls).startsWith(lbl.slice(-1)) && s.statusFlag !== 'ABS');
        const avg = grp.length ? Number((grp.reduce((a, b) => a + b.avg, 0) / grp.length).toFixed(1)) : 0;
        return { lbl, avg, count: grp.length };
      });

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Jumla ya Wanafunzi</h4><div class="val">${students.length}</div><small>M: ${boys} | F: ${girls}</small></div>
          <div class="card" style="border-color:#059669;"><h4>Wastani wa Shule</h4><div class="val">${schoolAvg}%</div><small>Waliokamilisha: ${eligible.length}</small></div>
          <div class="card" style="border-color:#d97706;"><h4>Score Sheets Pending</h4><div class="val">${pendingSheets}</div><small>Zinasubiri Uhakiki</small></div>
          <div class="card" style="border-color:#7c3aed;"><h4>Mgawanyo & Mitihani</h4><div class="val">${allocCount} | ${getExamTypesList().length}</div><small>Allocations | Exams</small></div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; margin-bottom:16px;">
          <div class="panel" style="margin-bottom:0; border-top:4px solid #1d4ed8;">
            <h3 style="margin-top:0;">📊 Grafu ya Divisions (NECTA Standard)</h3>
            ${Object.entries(divCounts).map(([dv, cnt]) => {
              const pct = Math.round((cnt / maxDiv) * 100);
              const col = dv === 'Div I' ? '#059669' : dv === 'Div II' ? '#0284c7' : dv === 'Div III' ? '#2563eb' : dv === 'Div IV' ? '#d97706' : '#dc2626';
              return `<div style="margin-bottom:7px;">
                <div style="display:flex; justify-content:space-between; font-size:12px;"><b>${dv}</b><span>${cnt} wanafunzi</span></div>
                <div style="background:#e2e8f0; height:12px; border-radius:6px; overflow:hidden;"><div style="width:${pct}%; background:${col}; height:100%;"></div></div>
              </div>`;
            }).join('')}
          </div>

          <div class="panel" style="margin-bottom:0; border-top:4px solid #059669;">
            <h3 style="margin-top:0;">📈 Wastani wa Ufaulu Kwa Kidato (Form 1–6)</h3>
            ${classBars.map(b => `<div style="margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between; font-size:12px;"><b>${b.lbl} (${b.count} watahiniwa)</b><span><b>${b.avg}%</b></span></div>
              <div style="background:#e2e8f0; height:13px; border-radius:6px; overflow:hidden;"><div style="width:${Math.min(100, b.avg)}%; background:#059669; height:100%;"></div></div>
            </div>`).join('')}
          </div>
        </div>

        <div class="panel">
          <h3>🏅 Wanafunzi 10 Bora Shuleni (Waliokamilisha Masomo 7 / 3)</h3>
          <table><thead><tr><th>Nafasi</th><th>Jina la Mwanafunzi</th><th>Jinsia</th><th>Kidato</th><th>Masomo</th><th>Jumla</th><th>Wastani</th><th>Points</th><th>Division</th></tr></thead>
          <tbody>${eligible.slice(0, 10).map(s => `<tr><td><b>#${s.rank}</b></td><td><b>${s.name}</b></td><td>${s.gender}</td><td>${s.cls}</td><td>${s.subCount}</td><td>${s.total}</td><td><b>${s.avg}%</b></td><td><b>${s.totalPts}</b></td><td><b style="color:#059669;">${s.div}</b></td></tr>`).join('') || '<tr><td colspan="9">Hakuna mwanafunzi aliyekamilisha masomo 7 bado.</td></tr>'}</tbody></table>
        </div>`;
      applyActiveSearchFilter();
      return;
    }
    if (tab === 'students_prem') {
      const students = getUnifiedStudents();
      area.innerHTML = `
        <div class="panel">
          <h3>🏫 Sajili Wanafunzi (Form 1–6), PREM & Tahasusi</h3>
          <form onsubmit="addAcadStudent(event)" style="display:grid; grid-template-columns:1.6fr 0.7fr 1fr 0.9fr 0.9fr 1fr auto; gap:6px; margin-bottom:10px;">
            <input type="text" id="stFull" required placeholder="Jina Kamili la Mwanafunzi">
            <select id="stGender"><option value="M">M (Mvulana)</option><option value="F">F (Msichana)</option></select>

  function downloadMultiSheetExcel() {
    const cls = document.getElementById('meClass')?.value || 'Form 1A';
    const exam = document.getElementById('meExam')?.value || 'Terminal';
    const selectedSubjs = Array.from(document.querySelectorAll('.ex-subj-chk:checked')).map(c => c.value);
    if (!selectedSubjs.length) { alert('⚠️ Tafadhali tiki angalau somo moja kwanza.'); return; }

    const students = getUnifiedStudents().filter(s => normClass(s.class_name) === normClass(cls));
    if (!students.length) { alert(`⚠️ Hakuna wanafunzi waliosajiliwa kwenye ${cls}.`); return; }

    if (typeof XLSX !== 'undefined') {
      const wb = XLSX.utils.book_new();
      selectedSubjs.forEach(subj => {
        const sheetRows = [['Jina la Mwanafunzi', 'PREM No', 'Kidato', 'Somo', 'Mtihani', 'Alama (0-100)']];
        students.forEach(st => {
          sheetRows.push([st.full_name, st.prem_no || '-', st.class_name, subj, exam, '']);
        });
        const ws = XLSX.utils.aoa_to_sheet(sheetRows);
        const safeTabName = subj.replace(/[\\/?*[\]]/g, '').slice(0, 30);
        XLSX.utils.book_append_sheet(wb, ws, safeTabName);
      });
      XLSX.writeFile(wb, `ScoreSheets_${cls.replace(/\s+/g, '_')}_${exam.replace(/\s+/g, '_')}.xlsx`);
    } else {
      let csv = 'Jina la Mwanafunzi,PREM No,Kidato,Somo,Mtihani,Alama (0-100)\n';
      selectedSubjs.forEach(subj => {
        students.forEach(st => {
          csv += `"${st.full_name}","${st.prem_no || '-'}","${st.class_name}","${subj}","${exam}",\n`;
        });
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `ScoreSheets_${cls.replace(/\s+/g, '_')}_${exam.replace(/\s+/g, '_')}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
  }
  function uploadMultiSheetExcel() {
    const inp = document.getElementById('multiExcelFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la Excel (.xlsx) au CSV lililojazwa alama kwanza.'); return; }

    const fallbackCls = document.getElementById('meClass')?.value || 'Form 1A';
    const fallbackExam = document.getElementById('meExam')?.value || 'Terminal';
    const reader = new FileReader();

    reader.onload = (ev) => {
      let allResults = SGB.select('exam_results');
      let importedCount = 0;

      const processRow = (r, sheetSubj) => {
        const stName = String(r || '').trim();
        const cls = String(r || fallbackCls).trim();
        const subj = String(r || sheetSubj).trim();
        const exam = String(r || fallbackExam).trim();
        const rawScore = r;
        if (stName && rawScore !== undefined && rawScore !== null && String(rawScore).trim() !== '') {
          const sc = Number(rawScore);
          if (!isNaN(sc)) {
            const alloc = SGB.select('subject_allocations').find(a => normClass(a.class_name) === normClass(cls) && (a.subject || '').toLowerCase() === subj.toLowerCase());
            const assignedTeacher = alloc ? alloc.teacher_name : 'Ofisi ya Mtaaluma';
            allResults = allResults.filter(x => !(normClass(x.class_name) === normClass(cls) && (x.subject || '').toLowerCase() === subj.toLowerCase() && (x.exam_type || '').toLowerCase() === exam.toLowerCase() && (x.student_name || '').toLowerCase() === stName.toLowerCase()));
            allResults.unshift({
              id: Date.now() + Math.floor(Math.random() * 10000),
              created_at: new Date().toLocaleString('sw-TZ'),
              student_name: stName, class_name: cls, subject: subj, exam_type: exam,
              score: sc, grade: gradeFromScore(sc, isALevelClass(cls)),
              teacher_name: assignedTeacher, verified_status: 'Approved'
            });
            importedCount++;
          }
        }
      };

      if (typeof XLSX !== 'undefined') {
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        wb.SheetNames.forEach(sheetName => {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1 });
          rows.slice(1).forEach(r => processRow(r, sheetName));
        });
      }

      saveTableClean('exam_results', allResults);
      alert(`✅ Alama ${importedCount} zimepakiwa kwenye mfumo! Walimu wa masomo husika wataziona moja kwa moja.`);
      openTab('merit');
    };
    reader.readAsArrayBuffer(file);
  }

  function verifyScoreSheet(cls, subj, exam, newStatus) {
    const all = SGB.select('exam_results').map(r => (normClass(r.class_name) === normClass(cls) && (r.subject || '').toLowerCase() === subj.toLowerCase() && (r.exam_type || '').toLowerCase() === exam.toLowerCase()) ? { ...r, verified_status: newStatus } : r);
    saveTableClean('exam_results', all);
    alert(newStatus === 'Approved' ? '✅ Score Sheet imethibitishwa na kufungwa (Locked)!' : '↩️ Score Sheet imerudishwa kwa mwalimu!');
    openTab('score_sheets');
  }

  function sendStudentResultMsg(studentName, channel) {
    const scope = window._meritScope || 'ALL_SCHOOL';
    const ex1 = window._meritEx1 || 'ALL';
    const ex2 = window._meritEx2 || 'NONE';
    const st = computeScopeSummaries(scope, ex1, ex2).find(x => x.name === studentName);
    if (!st) return;
    const reg = getUnifiedStudents().find(s => (s.full_name || '').toLowerCase() === studentName.toLowerCase());
    let phone = reg?.parent_phone || st.parent_phone || prompt(`Ingiza namba ya simu ya mzazi wa ${st.name}:`);
    if (!phone || !phone.trim()) return;
    const acadPhone = localStorage.getItem('sgb_academic_master_phone') || '0763061124';
    const subjLines = st.subjects.map(sub => `${sub.subject}: ${sub.score}% (${sub.grade})`).join(', ');
    const msg = `SHULE YA SEKONDARI SANGABUYE\nMatokeo ya ${st.name.toUpperCase()} (${st.cls}):\n${subjLines || 'ABSENT (ABS)'}\nJumla: ${st.total} | Wastani: ${st.avg}% | ${st.div} | Nafasi: ${st.rank === '-' ? 'ABS' : '#' + st.rank + '/' + st.outOf}.\nOfisi ya Mtaaluma: ${acadPhone}`;
    let intl = phone.replace(/\D/g, '');
    if (intl.startsWith('0')) intl = '255' + intl.slice(1);
    SGB.insert('sms_outbox', { recipient_name: `Mzazi wa ${st.name}`, phone: phone.trim(), sender_gateway: `${acadPhone} (${channel})`, message: msg, status: 'Imetumwa' });
    if (channel === 'WA') window.open(`https://wa.me{intl}?text=${encodeURIComponent(msg)}`, '_blank');
    else window.open(`sms:${phone.trim()}?body=${encodeURIComponent(msg)}`, '_self');
  }
  function filterAcademicTables(query) {
    const q = (query || '').trim().toLowerCase();
    document.querySelectorAll('#viewArea table tbody tr').forEach(tr => {
      tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  }

  function applyActiveSearchFilter() {
    const q = document.getElementById('globalAcadSearch')?.value || '';
    if (q.trim()) filterAcademicTables(q);
  }

  async function refreshAcademicNow() {
    await SGB.pullFromCloud(true);
    openTab(currentActiveTab);
    const st = document.getElementById('syncTime');
    if (st) st.innerText = ` (Imesasishwa: ${new Date().toLocaleTimeString()})`;
  }

  function updateExamPublishState(open, published) {
    const active_exam = document.getElementById('pubExamTitle')?.value.trim() || 'Terminal';
    const prev = JSON.parse(localStorage.getItem('sgb_exam_window') || '{}');
    localStorage.setItem('sgb_exam_window', JSON.stringify({ ...prev, open, published, active_exam }));
    SGB.pushToCloud('exam_window');
    openTab('exam_publish');
  }

  function addTimetableSlot(e) {
    e.preventDefault();
    SGB.insert('school_timetable', { day_name: document.getElementById('ttDay').value, time_slot: document.getElementById('ttTime').value.trim(), class_name: document.getElementById('ttCls').value, subject: document.getElementById('ttSubj').value.trim(), teacher_name: document.getElementById('ttTeacher').value.trim() });
    openTab('timetable');
  }

  function addSyllabusLog(e) {
    e.preventDefault();
    SGB.insert('syllabus_tracker', { class_name: document.getElementById('syCls').value, subject: document.getElementById('sySubj').value.trim(), teacher_name: document.getElementById('syTeacher').value.trim(), percent: Number(document.getElementById('syPct').value || 0) });
    openTab('timetable');
  }
  function submitLessonPlanLog(e) {
    e.preventDefault();
    SGB.insert('lesson_plans', {
      teacher_name: document.getElementById('lpTeacher').value.trim(),
      class_name: document.getElementById('lpClass').value,
      subject: document.getElementById('lpSubj').value.trim(),
      doc_type: document.getElementById('lpType').value,
      status: 'Inasubiri Uhakiki'
    });
    openTab('lesson_audit');
  }

  function promoteAllStudents() {
    if (!confirm('Je, una uhakika unataka kupandisha wanafunzi wote (Form 1–6) darasa linalofuata?')) return;
    const upgraded = SGB.select('academic_students').map(s => {
      const c = (s.class_name || '').toLowerCase();
      let next = s.class_name;
      if (c.includes('1')) next = s.class_name.replace(/1/g, '2');
      else if (c.includes('2')) next = s.class_name.replace(/2/g, '3');
      else if (c.includes('3')) next = s.class_name.replace(/3/g, '4');
      else if (c.includes('4')) next = 'Alumni O-Level (Mhitimu F4)';
      else if (c.includes('5')) next = s.class_name.replace(/5/g, '6');
      else if (c.includes('6')) next = 'Alumni A-Level (Mhitimu F6)';
      return { ...s, class_name: next };
    });
    saveTableClean('academic_students', upgraded);
    alert('✅ Wanafunzi wote (Form 1–6) wamepandishwa madarasa!');
    openTab('students_prem');
  }
  function downloadMeritCsv() {
    const scope = window._meritScope || 'Form 1A';
    const ex1 = window._meritEx1 || 'ALL';
    const ex2 = window._meritEx2 || 'NONE';
    const list = computeScopeSummaries(scope, ex1, ex2);
    let csv = "Nafasi,Mwanafunzi,Jinsia,Kidato,Masomo,Jumla,Wastani,Points,Division_au_Hali\n";
    list.forEach(s => {
      csv += `"${s.rank}","${s.name}","${s.gender}","${s.cls}",${s.subCount},${s.total},${s.avg},"${s.totalPts}","${s.div}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Matokeo_${scopeLabel(scope)}_Sangabuye.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
</body>
