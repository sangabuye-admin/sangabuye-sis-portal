<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofisi ya Mtaaluma (Academic Master v9.2 — Form 1-6) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 265px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 12px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 15.5px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 10px; }
    .grp-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin: 7px 6px 3px; font-weight: bold; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 11.8px; margin-bottom: 2px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 11px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    input, select, textarea { padding: 7.5px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    th, td { padding: 6px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .a4-sheet {
      background: #fff; border: 2px solid #0f294a; padding: 16px 20px; max-width: 790px;
      margin: 0 auto 18px; line-height: 1.42; font-size: 11.5px; color: #0f172a;
    }
    .school-stamp {
      border: 2.5px solid #1d4ed8; color: #1d4ed8; border-radius: 50%; width: 92px; height: 92px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; font-size: 8.5px; font-weight: bold; transform: rotate(-10deg);
      padding: 4px; line-height: 1.2;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>OFISI YA MTAALUMA</h2>
  <p>Form 1–6 | Sangabuye Sec</p>

  <div class="grp-lbl">A. Wanafunzi & Walimu</div>
  <button class="menu-btn active" onclick="openTab('overview', this)">📊  Muhtasari wa Taaluma</button>
  <button class="menu-btn" onclick="openTab('students_prem', this)">🏫 Wanafunzi, PREM & Tahasusi</button>
  <button class="menu-btn" onclick="openTab('allocations', this)">👨‍🏫 Mgawanyo wa Masomo</button>

  <div class="grp-lbl">B. Score Sheets & Alama</div>
  <button class="menu-btn" onclick="openTab('score_sheets', this)">📥  Pokea Score Sheets za Walimu</button>
  <button class="menu-btn" onclick="openTab('master_entry', this)">✍️ Jaza Alama za Masomo Yote</button>
  <button class="menu-btn" onclick="openTab('exam_publish', this)">📢 Dirisha & Tangaza Matokeo</button>

  <div class="grp-lbl">C. Matokeo & Ripoti A4</div>
  <button class="menu-btn" onclick="openTab('merit', this)">🏆  Broadsheet & Divisions (F1–6)</button>
  <button class="menu-btn" onclick="openTab('subject_rank', this)">📈 Msimamo wa Kila Somo</button>
  <button class="menu-btn" onclick="openTab('class_compare', this)">📊  Ulinganisho wa Madarasa</button>
  <button class="menu-btn" onclick="openTab('term_reports', this)">📜  Ripoti ya Muhula (A4 Batch)</button>
  <button class="menu-btn" onclick="openTab('hall_cards', this)">🪪 Vibali vya Mtihani (Permits)</button>
  <button class="menu-btn" onclick="openTab('leaving_cert', this)">🎓  Cheti cha Kuhitimu (A4)</button>

  <div class="grp-lbl">D. Ratiba, Ukaguzi & Maktaba</div>
  <button class="menu-btn" onclick="openTab('timetable', this)">📅  Ratiba & Silabasi</button>
  <button class="menu-btn" onclick="openTab('lesson_audit', this)">📑  Ukaguzi wa Maandalio</button>
  <button class="menu-btn" onclick="openTab('promotion', this)">🔄  Pandisha Madarasa (F1–6)</button>
  <button class="menu-btn" onclick="openTab('acad_library', this)">📚  Maktaba & Vikao vya Taaluma</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">📊  Muhtasari wa Taaluma</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['academic', 'headmaster', 'super_admin', 'admin']);
  SGB.startSessionTimer();

  function isALevelClass(cls) {
    const c = (cls || '').toLowerCase();
    return c.includes('5') || c.includes('6') || c.includes('v') || c.includes('vi');
  }

  function gradeFromScore(sc, isALevel = false) {
    const s = Number(sc);
    if (isALevel) {
      if (s >= 80) return 'A';
      if (s >= 70) return 'B';
      if (s >= 60) return 'C';
      if (s >= 50) return 'D';
      if (s >= 40) return 'E';
      if (s >= 35) return 'S';
      return 'F';
    }
    if (s >= 75) return 'A';
    if (s >= 65) return 'B';
    if (s >= 45) return 'C';
    if (s >= 30) return 'D';
    return 'F';
  }

  function remarkFromGrade(g) {
    if (g === 'A') return 'Vizuri Sana (Excellent)';
    if (g === 'B') return 'Vizuri (Very Good)';
    if (g === 'C') return 'Wastani (Good)';
    if (g === 'D') return 'Inaridhisha (Satisfactory)';
    if (g === 'E' || g === 'S') return 'Subsidiary / Pass';
    return 'Feli - Ongeza Bidii (Fail)';
  }
  function computeStudentSummaries(filterClass = 'ALL', includeUnverified = true) {
    let results = SGB.select('exam_results');
    if (!includeUnverified) results = results.filter(r => r.verified_status !== 'Returned');
    if (filterClass !== 'ALL') results = results.filter(r => (r.class_name || '').toLowerCase() === filterClass.toLowerCase());

    const regStudents = SGB.select('academic_students');
    const byStudent = {};

    results.forEach(r => {
      const key = (r.student_name || 'Mwanafunzi').trim();
      if (!byStudent[key]) {
        const reg = regStudents.find(s => (s.full_name || '').toLowerCase() === key.toLowerCase());
        byStudent[key] = {
          name: key,
          cls: r.class_name || (reg ? reg.class_name : '-'),
          comb: reg ? (reg.combination || 'O-Level') : 'O-Level',
          prem: reg ? reg.prem_no : '-',
          gender: reg ? reg.gender : 'M',
          exam_no: reg ? reg.exam_no : '-',
          subjects: new Array(),
          total: 0
        };
      }
      byStudent[key].subjects.push(r);
      byStudent[key].total += Number(r.score || 0);
    });

    const ranked = Object.values(byStudent).map(st => {
      const count = st.subjects.length || 1;
      const avg = Number((st.total / count).toFixed(1));
      const aLevel = isALevelClass(st.cls);

      if (aLevel) {
        const principalSubs = st.subjects.filter(s => !['gs', 'general studies', 'bam', 'basic applied mathematics'].includes((s.subject || '').toLowerCase()));
        const pts = (principalSubs.length ? principalSubs : st.subjects).map(s => {
          const sc = Number(s.score || 0);
          if (sc >= 80) return 1;
          if (sc >= 70) return 2;
          if (sc >= 60) return 3;
          if (sc >= 50) return 4;
          if (sc >= 40) return 5;
          if (sc >= 35) return 6;
          return 7;
        }).sort((a, b) => a - b).slice(0, 3);
        while (pts.length < 3) pts.push(7);
        const totalPts = pts.reduce((a, b) => a + b, 0);
        let div = 'Div 0';
        if (totalPts <= 9) div = 'Div I';
        else if (totalPts <= 12) div = 'Div II';
        else if (totalPts <= 17) div = 'Div III';
        else if (totalPts <= 19) div = 'Div IV';
        return { ...st, count, avg, totalPts, div, levelTag: 'A-Level' };
      } else {
        const pts = st.subjects.map(s => {
          const sc = Number(s.score || 0);
          if (sc >= 75) return 1;
          if (sc >= 65) return 2;
          if (sc >= 45) return 3;
          if (sc >= 30) return 4;
          return 5;
        }).sort((a, b) => a - b).slice(0, 7);
        while (pts.length < 7) pts.push(5);
        const totalPts = pts.reduce((a, b) => a + b, 0);
        let div = 'Div 0';
        if (totalPts <= 17) div = 'Div I';
        else if (totalPts <= 21) div = 'Div II';
        else if (totalPts <= 25) div = 'Div III';
        else if (totalPts <= 33) div = 'Div IV';
        return { ...st, count, avg, totalPts, div, levelTag: 'O-Level' };
      }
    }).sort((a, b) => b.avg - a.avg);

    return ranked.map((item, idx) => ({ ...item, rank: idx + 1, outOf: ranked.length }));
  }
  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'overview') {
      const students = SGB.select('academic_students');
      const summaries = computeStudentSummaries();
      const results = SGB.select('exam_results');
      const pendingSheets = results.filter(r => r.verified_status === 'Pending').length;
      const schoolAvg = summaries.length ? (summaries.reduce((s, x) => s + x.avg, 0) / summaries.length).toFixed(1) : '0.0';
      const divI = summaries.filter(x => x.div === 'Div I').length;

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Wanafunzi (Form 1–6)</h4><div class="val">${students.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Wastani wa Shule</h4><div class="val">${schoolAvg}%</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Score Sheets Zinazosubiri</h4><div class="val">${pendingSheets}</div></div>
          <div class="card" style="border-color:#7c3aed;"><h4>Division I (O & A-Level)</h4><div class="val">${divI}</div></div>
        </div>

        <div class="panel">
          <h3>🏅 Wanafunzi 10 Bora Shuleni (Form 1–6 Top Performers)</h3>
          <table>
            <thead><tr><th>Nafasi</th><th>Jina la Mwanafunzi</th><th>Kidato</th><th>Tahasusi</th><th>Jumla</th><th>Wastani</th><th>Points</th><th>Division</th></tr></thead>
            <tbody>
            ${summaries.slice(0, 10).map(s => `<tr>
              <td><b>#${s.rank}</b></td><td><b>${s.name}</b></td><td>${s.cls}</td><td>${s.comb}</td>
              <td>${s.total}</td><td><b>${s.avg}%</b></td><td>${s.totalPts}</td><td><b>${s.div}</b></td>
            </tr>`).join('') || '<tr><td colspan="8">Hakuna alama zilizoingizwa bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      return;
    }
    if (tab === 'students_prem') {
      const students = SGB.select('academic_students');
      area.innerHTML = `
        <div class="panel">
          <h3>🏫 Sajili Mwanafunzi (Form 1–6), PREM & Tahasusi (A-Level Combinations)</h3>
          <form onsubmit="addAcadStudent(event)" style="display:grid; grid-template-columns:1.8fr 0.6fr 0.9fr 0.9fr 1fr 1fr auto; gap:7px; margin-bottom:12px;">
            <input type="text" id="stFull" required placeholder="Jina Kamili (Majina Matatu)">
            <select id="stGender"><option value="M">M</option><option value="F">F</option></select>
            <input type="text" id="stClass" required placeholder="Kidato (mf. Form 5 PCM / Form 4A)">
            <select id="stComb">
              <option value="O-Level">O-Level (F1–F4)</option>
              <option value="PCM">PCM</option><option value="PCB">PCB</option><option value="PGM">PGM</option>
              <option value="CBG">CBG</option><option value="EGM">EGM</option><option value="ECA">ECA</option>
              <option value="HGL">HGL</option><option value="HKL">HKL</option><option value="HGK">HGK</option><option value="PMC">PMC</option>
            </select>
            <input type="text" id="stPrem" placeholder="PREM No">
            <input type="text" id="stExamNo" placeholder="Exam No">
            <button type="submit" class="btn btn-green">✅ Sajili</button>
          </form>

          <div style="background:#f8fafc; padding:10px; border:1px dashed #94a3b8; border-radius:7px; margin-bottom:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <b>📥 Pakia Wanafunzi Wengi (CSV):</b>
            <button type="button" class="btn btn-blue" onclick="downloadStTemplate()">⬇️ Pakua Template (CSV)</button>
            <input type="file" id="stCsvFile" accept=".csv" style="max-width:240px;">
            <button type="button" class="btn btn-amber" onclick="uploadStCsv()">⬆️ Pakia Wote</button>
          </div>

          <table>
            <thead><tr><th>PREM No</th><th>Exam No</th><th>Jina Kamili</th><th>Jinsia</th><th>Kidato</th><th>Tahasusi</th><th>Kitendo</th></tr></thead>
            <tbody>
            ${students.map(s => `<tr>
              <td><b>${s.prem_no || '-'}</b></td><td>${s.exam_no || '-'}</td><td><b>${s.full_name}</b></td>
              <td>${s.gender}</td><td><b>${s.class_name}</b></td><td>${s.combination || 'O-Level'}</td>
              <td>
                <button class="btn btn-amber" onclick="transferStudentStream('${s.id}','${s.class_name}','${s.combination || 'O-Level'}')">🔄 Hamisha</button>
                <button class="btn btn-red" onclick="deleteAcadStudent('${s.id}')">Futa</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="7">Hakuna wanafunzi waliosajiliwa bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      return;
    }
    if (tab === 'allocations') {
      const allocs = SGB.select('subject_allocations');
      const teachers = SGB.select('users_profile').filter(u => ['teacher', 'academic', 'headmaster'].includes((u.role || '').toLowerCase()));
      area.innerHTML = `
        <div class="panel">
          <h3>👨‍🏫 Panga Mgawanyo wa Masomo Kwa Walimu (Form 1–6)</h3>
          <form onsubmit="addSubjectAllocation(event)" style="display:grid; grid-template-columns:1.5fr 1fr 1.2fr 0.8fr auto; gap:8px; margin-bottom:12px;">
            <input type="text" id="alTeacher" list="tcList" required placeholder="Jina la Mwalimu">
            <input type="text" id="alClass" required placeholder="Kidato (mf. Form 6 PCB)">
            <input type="text" id="alSubj" required placeholder="Somo (mf. Advanced Chemistry)">
            <input type="number" id="alPeriods" value="6" min="1" required>
            <button type="submit" class="btn btn-green">✅ Pangia</button>
          </form>
          <datalist id="tcList">${teachers.map(t => `<option value="${t.full_name}">`).join('')}</datalist>
          <table>
            <thead><tr><th>Mwalimu</th><th>Kidato</th><th>Somo</th><th>Vipindi/Wiki</th><th>Kitendo</th></tr></thead>
            <tbody>
            ${allocs.map(a => `<tr><td><b>${a.teacher_name}</b></td><td><b>${a.class_name}</b></td><td>${a.subject}</td><td>${a.periods_per_week}</td><td><button class="btn btn-red" onclick="deleteAllocation('${a.id}')">Futa</button></td></tr>`).join('') || '<tr><td colspan="5">Hakuna mgawanyo bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      return;
    }
    if (tab === 'score_sheets') {
      const results = SGB.select('exam_results');
      const sheetsMap = {};
      results.forEach(r => {
        const key = `${r.teacher_name || 'Mwalimu'}|${r.class_name}|${r.subject}|${r.exam_type}`;
        if (!sheetsMap[key]) {
          sheetsMap[key] = { key, teacher: r.teacher_name || 'Mwalimu', cls: r.class_name, subj: r.subject, exam: r.exam_type, count: 0, sum: 0, status: r.verified_status || 'Approved' };
        }
        sheetsMap[key].count++;
        sheetsMap[key].sum += Number(r.score || 0);
        if (r.verified_status === 'Pending') sheetsMap[key].status = 'Pending';
      });
      const sheets = Object.values(sheetsMap);

      area.innerHTML = `
        <div class="panel">
          <h3>📥 Score Sheets Zilizowasilishwa Kutoka Kwa Walimu wa Masomo</h3>
          <table>
            <thead><tr><th>Mwalimu</th><th>Kidato</th><th>Somo</th><th>Mtihani</th><th>Wanafunzi</th><th>Wastani</th><th>Hali</th><th>Hatua ya Mtaaluma</th></tr></thead>
            <tbody>
            ${sheets.map(sh => `<tr>
              <td><b>${sh.teacher}</b></td><td><b>${sh.cls}</b></td><td><b>${sh.subj}</b></td><td>${sh.exam}</td>
              <td>${sh.count}</td><td><b>${(sh.sum / sh.count).toFixed(1)}%</b></td>
              <td><b style="color:${sh.status === 'Approved' ? '#059669' : '#d97706'};">${sh.status}</b></td>
              <td>
                <button class="btn btn-green" onclick="verifyScoreSheet('${sh.cls}','${sh.subj}','${sh.exam}','Approved')">✅ Thibitisha</button>
                <button class="btn btn-amber" onclick="verifyScoreSheet('${sh.cls}','${sh.subj}','${sh.exam}','Returned')">↩️ Rudisha</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="8">Hakuna Score Sheets zilizotumwa na walimu bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      return;
    }
    if (tab === 'master_entry') {
      const students = SGB.select('academic_students');
      const classes = Array.from(new Set(students.map(s => s.class_name).filter(Boolean)));
      area.innerHTML = `
        <div class="panel">
          <h3>✍️ Jaza Alama za Somo Lolote Kwa Darasa Zima (Form 1–6 Master Grid)</h3>
          <div style="display:grid; grid-template-columns:1fr 1.2fr 1fr auto; gap:8px; margin-bottom:12px;">
            <select id="meClass" onchange="loadMasterEntryGrid()">
              <option value="">-- Chagua Kidato --</option>
              ${classes.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
            <input type="text" id="meSubject" placeholder="Andika Somo (mf. Physics / General Studies)">
            <select id="meExam">
              <option value="Midterm">Midterm</option>
              <option value="Terminal">Terminal</option>
              <option value="Annual">Annual</option>
              <option value="Mock">Mock / Pre-NECTA</option>
            </select>
            <button type="button" class="btn btn-blue" onclick="loadMasterEntryGrid()">📋 Fungua Jedwali</button>
          </div>
          <div id="masterGridBox"></div>

          <div style="background:#f8fafc; padding:10px; border:1px dashed #94a3b8; border-radius:7px; margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <b>📥 Au Pakia Alama kwa Excel/CSV:</b>
            <button type="button" class="btn btn-blue" onclick="downloadMarksCsvTemplate()">⬇️ Template ya Alama (CSV)</button>
            <input type="file" id="marksCsvFile" accept=".csv" style="max-width:240px;">
            <button type="button" class="btn btn-green" onclick="uploadMarksCsv()">⬆️ Pakia Alama Zote</button>
          </div>
        </div>`;
      return;
    }

    if (tab === 'exam_publish') {
      const cfg = JSON.parse(localStorage.getItem('sgb_exam_window') || '{"open":true,"published":true,"active_exam":"Terminal 2026"}');
      area.innerHTML = `
        <div class="panel">
          <h3>📢 Udhibiti wa Dirisha la Alama & Kutangaza Matokeo Kwa Wazazi/Wanafunzi</h3>
          <div style="display:grid; grid-template-columns:2fr auto auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="pubExamTitle" value="${cfg.active_exam || 'Terminal 2026'}" placeholder="Jina la Mtihani">
            <button class="btn btn-green" onclick="updateExamPublishState(true, ${cfg.published})">🟢 Fungua Kuingiza Alama</button>
            <button class="btn btn-red" onclick="updateExamPublishState(false, ${cfg.published})">🔒 Funga Kuingiza Alama</button>
          </div>
          <div style="background:#f8fafc; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
            <b>Hali ya Matokeo Kwa Wazazi & Wanafunzi:</b> <span style="color:${cfg.published ? '#059669' : '#d97706'}; font-weight:bold;">${cfg.published ? '✅ YAMETANGAZWA (Yanaonekana)' : '⏳ YAMEFICHWA (Bado Yanahakikiwa)'}</span><br><br>
            <button class="btn btn-blue" onclick="updateExamPublishState(${cfg.open}, true)">📢 TANGAZA MATOKEO RASMI SASA (PUBLISH)</button>
            <button class="btn btn-amber" onclick="updateExamPublishState(${cfg.open}, false)">🙈 Ficha Matokeo Kwa Muda</button>
          </div>
        </div>`;
      return;
    }
    if (tab === 'merit') {
      const summaries = computeStudentSummaries();
      const boys = summaries.filter(s => s.gender === 'M');
      const girls = summaries.filter(s => s.gender === 'F');
      area.innerHTML = `
        <div class="panel">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <h3 style="margin:0;">🏆 Broadsheet & Uchambuzi wa Jinsia (Wavulana: ${boys.length} | Wasichana: ${girls.length})</h3>
            <div style="display:flex; gap:8px;">

  function generateA4Reports(mode) {
    const opts = {
      closeDate: document.getElementById('repCloseDate')?.value || '2026-12-04',
      openDate: document.getElementById('repOpenDate')?.value || '2027-01-11',
      conduct: document.getElementById('repConduct')?.value || 'Nzuri Sana',
      termLbl: document.getElementById('repTermLbl')?.value || 'Muhula wa Pili — 2026',
      ctRem: document.getElementById('repClassTeacherRem')?.value || '',
      acRem: document.getElementById('repAcadRem')?.value || '',
      hmRem: document.getElementById('repHmRem')?.value || ''
    };
    const all = computeStudentSummaries();
    let targets = new Array();
    if (mode === 'SINGLE') {
      const name = document.getElementById('singleStReportPick')?.value;
      if (!name) { alert('⚠️ Chagua mwanafunzi kwanza.'); return; }
      targets = all.filter(s => s.name === name);
    } else {
      const cls = document.getElementById('batchClassReportPick')?.value || 'ALL';
      targets = cls === 'ALL' ? all : all.filter(s => s.cls === cls);
      if (targets.length === 0) { alert('⚠️ Hakuna matokeo ya darasa hilo bado.'); return; }
    }
    document.getElementById('a4ReportsContainer').innerHTML = targets.map(st => buildSingleA4ReportHtml(st, opts)).join('');
  }

    document.getElementById('lcPrintArea').innerHTML = `

          <b style="font-size:15px; text-decoration:underline;">CHETI CHA KUHITIMU SHULE (SCHOOL LEAVING CERTIFICATE)</b>

          Katika kipindi chote alichokuwa hapa shuleni, tabia na mwenendo wake vilikuwa: <b>${beh}</b>.

  function printA4Sheets(containerId) {
    const html = document.getElementById(containerId)?.innerHTML;
    if (!html || !html.trim()) { alert('⚠️ Tengeneza ripoti kwanza kabla ya kuchapisha.'); return; }
    const w = window.open('', '', 'width=900,height=700');
    w.document.write(`<html><head><title>Sangabuye A4 Print</title><style>
      @page { size: A4 portrait; margin: 8mm; }
      body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
      .a4-sheet { border: 2px solid #0f294a; padding: 14px 18px; page-break-after: always; font-size: 11px; line-height: 1.38; }
      table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
      th, td { border: 1px solid #334155; padding: 4.5px 6px; text-align: left; font-size: 10.5px; }
      th { background: #f1f5f9; }
      .school-stamp { border: 2px solid #1d4ed8; color: #1d4ed8; border-radius: 50%; width: 86px; height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 8px; font-weight: bold; transform: rotate(-10deg); }
    </style></head><body>${html}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 350);
  }
  function addAcadStudent(e) {
    e.preventDefault();
    SGB.insert('academic_students', {
      full_name: document.getElementById('stFull').value.trim(),
      gender: document.getElementById('stGender').value,
      class_name: document.getElementById('stClass').value.trim(),
      combination: document.getElementById('stComb').value,
      prem_no: document.getElementById('stPrem').value.trim() || '-',
      exam_no: document.getElementById('stExamNo').value.trim() || '-'
    });
    openTab('students_prem');
  }

  function transferStudentStream(id, oldClass, oldComb) {
    const newClass = prompt(`Ingiza Kidato/Mkondo mpya (sasa ni ${oldClass}):`, oldClass);
    if (!newClass || !newClass.trim()) return;
    const newComb = prompt(`Ingiza Tahasusi mpya (sasa ni ${oldComb}):`, oldComb) || oldComb;
    SGB.update('academic_students', id, { class_name: newClass.trim(), combination: newComb.trim() });
    alert('✅ Mwanafunzi amehamishwa mkondo/tahasusi!');
    openTab('students_prem');
  }

  function deleteAcadStudent(id) {
    const list = SGB.select('academic_students').filter(x => String(x.id) !== String(id));
    localStorage.setItem('sgb_academic_students', JSON.stringify(list));
    SGB.pushToCloud('academic_students');
    openTab('students_prem');
  }

  function downloadStTemplate() {
    const csv = "Jina Kamili,Jinsia (M/F),Kidato,Tahasusi,PREM No,Exam No\nAsha Juma Mwita,F,Form 5 PCM,PCM,2026001122,S.1234/0501";
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Template_Wanafunzi_Form1_6.csv'; a.click();
  }

  function uploadStCsv() {
    const inp = document.getElementById('stCsvFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la CSV kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      ev.target.result.split(/\r?\n/).slice(1).forEach(line => {
        const c = line.split(',');
        if (c.length >= 2 && c.at(0).trim()) {
          SGB.insert('academic_students', { full_name: c.at(0).trim(), gender: (c.at(1) || 'M').trim(), class_name: (c.at(2) || 'Form 1A').trim(), combination: (c.at(3) || 'O-Level').trim(), prem_no: (c.at(4) || '-').trim(), exam_no: (c.at(5) || '-').trim() });
        }
      });
      openTab('students_prem');
    };
    reader.readAsText(file);
  }
  function addSubjectAllocation(e) {
    e.preventDefault();
    SGB.insert('subject_allocations', { teacher_name: document.getElementById('alTeacher').value.trim(), class_name: document.getElementById('alClass').value.trim(), subject: document.getElementById('alSubj').value.trim(), periods_per_week: Number(document.getElementById('alPeriods').value || 4) });
    openTab('allocations');
  }

  function deleteAllocation(id) {
    const list = SGB.select('subject_allocations').filter(x => String(x.id) !== String(id));
    localStorage.setItem('sgb_subject_allocations', JSON.stringify(list));
    SGB.pushToCloud('subject_allocations');
    openTab('allocations');
  }

  function verifyScoreSheet(cls, subj, exam, newStatus) {
    const all = SGB.select('exam_results').map(r => (r.class_name === cls && r.subject === subj && r.exam_type === exam) ? { ...r, verified_status: newStatus } : r);
    localStorage.setItem('sgb_exam_results', JSON.stringify(all));
    SGB.pushToCloud('exam_results');
    alert(newStatus === 'Approved' ? '✅ Score Sheet imethibitishwa!' : '↩️ Score Sheet imerudishwa kwa mwalimu!');
    openTab('score_sheets');
  }
  function loadMasterEntryGrid() {
    const cls = document.getElementById('meClass')?.value;
    const subj = document.getElementById('meSubject')?.value.trim();
    const exam = document.getElementById('meExam')?.value;
    if (!cls || !subj) { alert('⚠️ Chagua Kidato na uandike Somo kwanza.'); return; }
    const list = SGB.select('academic_students').filter(s => s.class_name === cls);
    document.getElementById('masterGridBox').innerHTML = `
      <form onsubmit="saveMasterGridScores(event, '${cls}', '${subj}', '${exam}')">
        <table><thead><tr><th>Mwanafunzi</th><th>PREM</th><th>Alama (0-100)</th></tr></thead>
        <tbody>
        ${list.map(s => `<tr><td><b>${s.full_name}</b></td><td>${s.prem_no}</td><td><input type="number" class="mg-score" data-name="${s.full_name}" min="0" max="100" placeholder="Alama"></td></tr>`).join('') || '<tr><td colspan="3">Hakuna wanafunzi kwenye kidato hiki.</td></tr>'}
        </tbody></table>
        <button type="submit" class="btn btn-green" style="margin-top:10px;">💾 Hifadhi Alama Zote za ${subj}</button>
      </form>`;
  }

  function saveMasterGridScores(e, cls, subj, exam) {
    e.preventDefault();
    const aLevel = isALevelClass(cls);
    document.querySelectorAll('.mg-score').forEach(inp => {
      if (inp.value !== '') {
        const sc = Number(inp.value);
        SGB.insert('exam_results', { student_name: inp.dataset.name, class_name: cls, subject: subj, exam_type: exam, score: sc, grade: gradeFromScore(sc, aLevel), teacher_name: 'Ofisi ya Mtaaluma', verified_status: 'Approved' });
      }
    });
    alert('✅ Alama zote zimehifadhiwa!');
    openTab('merit');
  }

  function downloadMarksCsvTemplate() {
    const csv = "Jina la Mwanafunzi,Kidato,Somo,Mtihani,Alama\nAsha Juma Mwita,Form 5 PCM,Physics,Terminal,82";
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Template_Alama_Masomo.csv'; a.click();
  }

  function uploadMarksCsv() {
    const inp = document.getElementById('marksCsvFile');
    const file = inp && inp.files ? inp.files.item(0) : null;
    if (!file) { alert('⚠️ Chagua faili la CSV kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      ev.target.result.split(/\r?\n/).slice(1).forEach(line => {
        const c = line.split(',');
        if (c.length >= 5 && c.at(0).trim()) {
          const cls = c.at(1).trim();
          const sc = Number(c.at(4) || 0);
          SGB.insert('exam_results', { student_name: c.at(0).trim(), class_name: cls, subject: c.at(2).trim(), exam_type: c.at(3).trim(), score: sc, grade: gradeFromScore(sc, isALevelClass(cls)), teacher_name: 'Ofisi ya Mtaaluma (CSV)', verified_status: 'Approved' });
        }
      });
      alert('✅ Alama zote kutoka CSV zimepakiwa!');
      openTab('merit');
    };
    reader.readAsText(file);
  }
  function updateExamPublishState(open, published) {
    const active_exam = document.getElementById('pubExamTitle')?.value.trim() || 'Terminal 2026';
    localStorage.setItem('sgb_exam_window', JSON.stringify({ open, published, active_exam }));

    e.preventDefault();

    openTab('lesson_audit');
  }

  function addAcadMinute(e) {
    e.preventDefault();
    SGB.insert('academic_minutes', { title: document.getElementById('mnTitle').value.trim(), summary: document.getElementById('mnBody').value.trim() });
    openTab('acad_library');
  }

  function promoteAllStudents() {
    if (!confirm('Je, una uhakika unataka kupandisha wanafunzi wote (Form 1–6) darasa linalofuata?')) return;
    const upgraded = SGB.select('academic_students').map(s => {
      const c = (s.class_name || '').toLowerCase();
      let next = s.class_name;
      if (c.includes('1')) next = s.class_name.replace(/1/g, '2');
      else if (c.includes('2')) next = s.class_name.replace(/2/g, '3');
      else if (c.includes('3')) next = s.class_name.replace(/3/g, '4');
      else if (c.includes('4')) next = 'Alumni O-Level (Mhitimu F4)';
      else if (c.includes('5')) next = s.class_name.replace(/5/g, '6');
      else if (c.includes('6')) next = 'Alumni A-Level (Mhitimu F6)';
      return { ...s, class_name: next };
    });
    localStorage.setItem('sgb_academic_students', JSON.stringify(upgraded));
    SGB.pushToCloud('academic_students');
    alert('✅ Wanafunzi wote (Form 1–6) wamepandishwa madarasa!');
    openTab('students_prem');
  }

  function downloadMeritCsv() {
    const list = computeStudentSummaries();
    let csv = "Nafasi,Mwanafunzi,Jinsia,Kidato,Ngazi,Jumla,Wastani,Points,Division\n";
    list.forEach(s => { csv += `${s.rank},"${s.name}","${s.gender}","${s.cls}","${s.levelTag}",${s.total},${s.avg},${s.totalPts},"${s.div}"\n`; });
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'Broadsheet_Form1_6_Sangabuye.csv'; a.click();
  }

  openTab('overview', document.querySelector('.menu-btn'));
</script>
