<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tovuti ya Mwanafunzi (Student Portal v8.0) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 255px; background: #0f294a; color: white; display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 16px; margin: 0 0 2px; color: #fde68a; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #cbd5e1; margin: 0 0 12px; }
    .menu-btn { background: transparent; border: none; color: #e2e8f0; text-align: left; padding: 8px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; margin-bottom: 3px; }
    .menu-btn:hover, .menu-btn.active { background: #059669; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 11px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #059669; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f294a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 7px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f294a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>TOVUTI YA MWANAFUNZI</h2>
  <p>Sangabuye Secondary School</p>
  <button class="menu-btn active" onclick="openTab('profile', this)">🎓 1. Muhtasari & Matokeo</button>
  <button class="menu-btn" onclick="openTab('fees', this)">💳 2. Taarifa Zangu za Ada</button>
  <button class="menu-btn" onclick="openTab('homework', this)">📖 3. Kazi za Nyumbani (Notes)</button>
  <button class="menu-btn" onclick="openTab('student_library', this)">📚 4. Maktaba (Oda & Mapendekezo)</button>
</div>
<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">🎓 1. Muhtasari & Matokeo</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['student', 'super_admin']);
  SGB.startSessionTimer();

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');
    const myName = user ? user.full_name : 'Mwanafunzi';

    if (tab === 'profile') {
      const results = SGB.select('exam_results').filter(r => (r.student_name || '').toLowerCase() === myName.toLowerCase());
      const loans = SGB.select('library_loans').filter(l => (l.student_name || '').toLowerCase() === myName.toLowerCase() && !(l.status || '').includes('Amerudisha'));
      const news = SGB.select('school_announcements');
      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Mwanafunzi</h4><div class="val" style="font-size:15px;">${myName}</div></div>
          <div class="card" style="border-color:#1d4ed8;"><h4>Masomo Yaliyofanyiwa Mtihani</h4><div class="val">${results.length}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Vitabu Nilivyoazima Maktaba</h4><div class="val">${loans.length}</div></div>
        </div>
        <div class="panel">
          <h3>📊 Matokeo Yangu ya Mitihani</h3>
          <table><tr><th>Somo</th><th>Kidato</th><th>Mtihani</th><th>Alama</th><th>Daraja</th></tr>
          ${results.map(r => `<tr><td><b>${r.subject}</b></td><td>${r.class_name}</td><td>${r.exam_type}</td><td><b>${r.score}</b></td><td><b>${r.grade}</b></td></tr>`).join('') || '<tr><td colspan="5">Hakuna matokeo yaliyowekwa bado.</td></tr>'}
          </table>
        </div>
        <div class="panel">
          <h3>📢 Matangazo ya Shule</h3>
          <table><tr><th>Tarehe</th><th>Kichwa</th><th>Ujumbe</th></tr>
          ${news.slice(0, 5).map(n => `<tr><td>${n.created_at}</td><td><b>${n.title}</b></td><td>${n.body}</td></tr>`).join('') || '<tr><td colspan="3">Hakuna matangazo mapya.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'fees') {
      const recs = SGB.select('accounting_receipts').filter(r => (r.student_name || '').toLowerCase() === myName.toLowerCase());
      const totalPaid = recs.reduce((s, r) => s + Number(r.amount_paid || 0), 0);
      area.innerHTML = `
        <div class="panel">
          <h3>💳 Kumbukumbu Zangu za Malipo ya Ada & Michango (Jumla: TZS ${totalPaid.toLocaleString()})</h3>
          <table><tr><th>Risiti Na.</th><th>Aina ya Mchango</th><th>Kategoria</th><th>Njia</th><th>Kiasi (TZS)</th><th>Tarehe</th></tr>
          ${recs.map(r => `<tr><td><b>${r.receipt_number}</b></td><td>${r.payment_category}</td><td>${r.source_fund || 'Kutwa'}</td><td>${r.payment_method}</td><td style="color:#059669;"><b>${Number(r.amount_paid).toLocaleString()}</b></td><td>${r.tx_date || r.created_at}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna rekodi za malipo bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'homework') {
      const hw = SGB.select('class_homework');
      area.innerHTML = `
        <div class="panel">
          <h3>📖 Kazi za Nyumbani (Homework & Notes Kutoka Kwa Walimu)</h3>
          <table><tr><th>Tarehe</th><th>Kidato</th><th>Somo</th><th>Maelezo ya Kazi</th><th>Mwalimu</th></tr>
          ${hw.map(h => `<tr><td>${h.created_at}</td><td><b>${h.class_name}</b></td><td><b>${h.subject}</b></td><td>${h.task}</td><td>${h.teacher_name}</td></tr>`).join('') || '<tr><td colspan="5">Hakuna kazi ya nyumbani iliyowekwa bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }
    const books = SGB.select('library_books');
    const myRes = SGB.select('library_reservations').filter(r => (r.requester || '').toLowerCase() === myName.toLowerCase());
    const myLoans = SGB.select('library_loans').filter(l => (l.student_name || '').toLowerCase() === myName.toLowerCase() && !(l.status || '').includes('Amerudisha'));
    const ebooks = SGB.select('library_ebooks');

    area.innerHTML = `
      <div class="panel">
        <h3>📚 1. Vitabu Vilivyosajiliwa Maktaba & Weka Oda ya Kitabu</h3>
        <input type="text" id="stLibSearch" onkeyup="filterStLibBooks()" placeholder="🔍 Tafuta kitabu kwa jina, somo, barcode au rafu..." style="margin-bottom:10px;">
        <form onsubmit="submitStBookOrder(event)" style="display:grid; grid-template-columns:2fr auto; gap:8px; margin-bottom:12px;">
          <select id="stBookPick" required>
            <option value="">-- Chagua Kitabu cha Kuweka Oda --</option>
            ${books.map(b => `<option value="${b.barcode}|${b.title}">${b.title} (${b.barcode}) — Rafu: ${b.shelf} | Zilizopo: ${b.available_copies}</option>`).join('')}
          </select>
          <button type="submit" class="btn btn-blue">📅 Weka Oda ya Kitabu</button>
        </form>
        <table id="stBooksTbl">
          <thead><tr><th>Barcode</th><th>Jina la Kitabu</th><th>Mwandishi</th><th>Kategoria</th><th>Rafu</th><th>Zilizopo</th></tr></thead>
          <tbody>
          ${books.map(b => `<tr><td><b>${b.barcode}</b></td><td><b>${b.title}</b></td><td>${b.author || '-'}</td><td>${b.category}</td><td>${b.shelf}</td><td style="color:#059669;"><b>${b.available_copies}/${b.total_copies}</b></td></tr>`).join('') || '<tr><td colspan="6">Hakuna vitabu vilivyosajiliwa maktaba bado.</td></tr>'}
          </tbody>
        </table>
      </div>

      <div class="panel">
        <h3>💡 2. Tuma Pendekezo la Kitabu Kipya Maktaba</h3>
        <form onsubmit="submitStBookSuggestion(event)" style="display:grid; grid-template-columns:2fr 1.5fr auto; gap:8px;">
          <input type="text" id="stSugBook" required placeholder="Jina la Kitabu Unachopendekeza">
          <input type="text" id="stSugSubj" required placeholder="Mwandishi au Somo (mf. Biology)">
          <button type="submit" class="btn btn-green">📩 Tuma Pendekezo</button>
        </form>
      </div>

      <div class="panel">
        <h3>📋 3. Oda Zangu, Vitabu Nilivyoazima & Maktaba Mtandao (PDF)</h3>
        <table><tr><th>Aina</th><th>Kitabu / Nyenzo</th><th>Tarehe / Ukomo</th><th>Hali / Hatua</th></tr>
        ${myRes.map(r => `<tr><td>Oda (Reservation)</td><td><b>${r.book_title}</b></td><td>${r.created_at}</td><td><b>${r.status}</b></td></tr>`).join('')}
        ${myLoans.map(l => `<tr><td>Nimeazima</td><td><b>${l.book}</b></td><td>Rudisha: ${l.due_date}</td><td><b>${l.status}</b></td></tr>`).join('')}
        ${ebooks.map(e => `<tr><td>E-Book (${e.res_type || 'PDF'})</td><td><b>${e.title}</b> (${e.subject})</td><td>Mtandaoni</td><td><button class="btn btn-blue" onclick="openStEbook('${e.id}')">📂 Fungua</button></td></tr>`).join('')}
        </table>
      </div>`;
  }
  function filterStLibBooks() {
    const q = (document.getElementById('stLibSearch')?.value || '').toLowerCase();
    document.querySelectorAll('#stBooksTbl tbody tr').forEach(r => { r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'; });
  }

  function submitStBookOrder(e) {
    e.preventDefault();
    const raw = document.getElementById('stBookPick').value;
    if (!raw) return;
    const parts = raw.split('|');
    SGB.insert('library_reservations', { res_id: 'RES-' + Math.floor(1000 + Math.random() * 9000), barcode: parts.at(0), book_title: parts.at(1), requester: user ? user.full_name : 'Mwanafunzi', status: 'Inasubiri' });
    alert('✅ Oda yako ya kitabu imetumwa Maktaba!');
    openTab('student_library');
  }

  function submitStBookSuggestion(e) {
    e.preventDefault();
    const book_title = document.getElementById('stSugBook').value.trim();
    const author_subject = document.getElementById('stSugSubj').value.trim();
    const senderName = user ? `${user.full_name} (Mwanafunzi)` : 'Mwanafunzi';
    SGB.insert('library_suggestions', { book_title, author_subject, suggested_by: senderName, status: 'Imetumwa Kwa Mkutubi & Mkuu' });
    alert('✅ Pendekezo lako la kitabu limetumwa Maktaba!');
    openTab('student_library');
  }

  function openStEbook(id) {
    const item = SGB.select('library_ebooks').find(x => String(x.id) === String(id));
    if (!item) return;
    if (item.pdf_data) { const w = window.open('', '_blank'); w.document.write(`<iframe src="${item.pdf_data}" style="width:100%;height:100%;border:none;"></iframe>`); }
    else if (item.link) window.open(item.link, '_blank');
  }

  openTab('profile', document.querySelector('.menu-btn'));
</script>
</body>
</html>
