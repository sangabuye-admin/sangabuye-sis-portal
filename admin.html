<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Administrator (Admin Portal v8.1) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 255px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 16px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 12px; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 8px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; margin-bottom: 3px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 11px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f172a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 7px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f172a; }
    .btn { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>SYSTEM ADMIN</h2>
  <p>Sangabuye SIS Control</p>
  <button class="menu-btn active" onclick="openTab('users', this)">👥 1. Watumiaji & Uthibitisho</button>
  <button class="menu-btn" onclick="openTab('settings', this)">⚙️ 2. Mipangilio & Matengenezo</button>
  <button class="menu-btn" onclick="openTab('logs', this)">🛡️ 3. Kumbukumbu za Ukaguzi</button>
</div>
<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">👥 1. Watumiaji & Uthibitisho</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['super_admin']);
  SGB.startSessionTimer();

  function filterUsersTbl() {
    const q = (document.getElementById('usrSearch')?.value || '').toLowerCase();
    document.querySelectorAll('#allUsersTbl tbody tr').forEach(r => {
      r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  }

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'users') {
      const users = SGB.select('users_profile');
      const pendingUsers = users.filter(u => u.status && u.status !== 'Approved' && u.status !== 'Active');

      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Watumiaji Wote</h4><div class="val">${users.length}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Wanaosubiri Uthibitisho</h4><div class="val">${pendingUsers.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Waliothibitishwa (Active)</h4><div class="val">${users.length - pendingUsers.length}</div></div>
        </div>

        <div class="panel" style="border-left:4px solid #d97706;">
          <h3>⏳ 1. Maombi Mapya ya Usajili (Waliojisajili Wenyewe Kwenye Login)</h3>
          <table>
            <thead><tr><th>Tarehe</th><th>Jina Kamili</th><th>Nafasi</th><th>Username</th><th>Simu</th><th>Hatua ya Admin</th></tr></thead>
            <tbody>
            ${pendingUsers.map(u => `<tr>
              <td>${u.created_at || '-'}</td>
              <td><b>${u.full_name}</b></td>
              <td><b>${u.role}</b></td>
              <td>${u.username}</td>
              <td>${u.phone_number || '-'}</td>
              <td>
                <button class="btn btn-green" onclick="approveUserAccount('${u.id}')">✅ Thibitisha (Approve)</button>
                <button class="btn btn-red" onclick="deleteUserAccount('${u.id}')">✕ Kataa</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="6">Hakuna maombi mapya yanayosubiri uthibitisho sasa.</td></tr>'}
            </tbody>
          </table>
        </div>

        <div class="panel">
          <h3>➕ 2. Sajili Mtumiaji Mpya Moja kwa Moja</h3>
          <form onsubmit="adminCreateUser(event)" style="display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr 1fr auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="adFull" required placeholder="Jina Kamili">
            <select id="adRole">
              <option value="accountant">Mhasibu (accountant)</option>
              <option value="headmaster">Mkuu wa Shule (headmaster)</option>
              <option value="academic">Mtaaluma (academic)</option>
              <option value="teacher">Mwalimu (teacher)</option>
              <option value="librarian">Mkutubi (librarian)</option>
              <option value="matron">Bweni/Zahanati (matron)</option>
              <option value="parent">Mzazi (parent)</option>
              <option value="student">Mwanafunzi (student)</option>
              <option value="super_admin">Admin (super_admin)</option>
            </select>
            <input type="text" id="adUser" required placeholder="Username">
            <input type="text" id="adPass" required placeholder="Password">
            <input type="text" id="adPhone" placeholder="Simu (07...)">
            <button type="submit" class="btn btn-blue">✅ Sajili</button>
          </form>

          <h3>📋 3. Orodha ya Watumiaji Wote Kwenye Mfumo</h3>
          <input type="text" id="usrSearch" onkeyup="filterUsersTbl()" placeholder="🔍 Tafuta mtumiaji kwa jina, username au nafasi..." style="margin-bottom:8px;">
          <table id="allUsersTbl">
            <thead><tr><th>Jina Kamili</th><th>Nafasi</th><th>Username</th><th>Password</th><th>Simu</th><th>Hali</th><th>Hatua</th></tr></thead>
            <tbody>
            ${users.map(u => `<tr>
              <td><b>${u.full_name}</b></td>
              <td>${u.role}</td>
              <td><b>${u.username}</b></td>
              <td><code>${u.password}</code></td>
              <td>${u.phone_number || '-'}</td>
              <td><b style="color:${(u.status==='Approved'||u.status==='Active'||!u.status)?'#059669':'#d97706'};">${u.status || 'Approved'}</b></td>
              <td>
                <button class="btn btn-amber" onclick="resetUserPassword('${u.id}')">🔑 Badili Pass</button>
                ${u.username !== 'admin' ? `<button class="btn btn-red" onclick="deleteUserAccount('${u.id}')">Futa</button>` : ''}
              </td>
            </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      return;
    }
    if (tab === 'settings') {
      const cfg = SGB.getConfig();
      const maint = JSON.parse(localStorage.getItem('sgb_maintenance_mode') || '{"enabled":false}');
      area.innerHTML = `
        <div class="panel">
          <h3>🏫 1. Mipangilio Mikuu ya Shule & Akaunti ya Benki</h3>
          <form onsubmit="saveSchoolConfig(event)" style="display:grid; grid-template-columns:1fr 1fr 1.5fr auto; gap:10px; margin-bottom:14px;">
            <input type="text" id="cfgYear" value="${cfg.year || '2026'}" required placeholder="Mwaka wa Masomo">
            <input type="text" id="cfgTerm" value="${cfg.term || 'Term I'}" required placeholder="Muhula">
            <input type="text" id="cfgCrdb" value="${cfg.crdb || '0150838972100'}" required placeholder="Akaunti ya CRDB">
            <button type="submit" class="btn btn-green">💾 Hifadhi</button>
          </form>
        </div>

        <div class="panel" style="border-left:4px solid ${maint.enabled ? '#dc2626' : '#059669'};">
          <h3>🛠️ 2. Hali ya Matengenezo ya Mfumo (Maintenance Mode)</h3>
          <p>Hali ya Sasa: <b>${maint.enabled ? '🔴 IMEWASHWA (Watumiaji wa kawaida hawawezi kuingia)' : '🟢 IMEZIMWA (Mfumo uko hewani kwa wote)'}</b></p>
          <button class="btn ${maint.enabled ? 'btn-green' : 'btn-red'}" onclick="toggleMaintenanceMode(${!maint.enabled})">
            ${maint.enabled ? '🟢 Zima Matengenezo (Ruhusu Watumiaji)' : '🔴 Washa Matengenezo (Funga Kwa Muda)'}
          </button>
        </div>`;
      return;
    }

    const logs = SGB.select('audit_logs');
    area.innerHTML = `
      <div class="panel">
        <h3>🛡️ Kumbukumbu za Ukaguzi wa Mfumo (System Audit Logs)</h3>
        <table><thead><tr><th>Muda</th><th>Mtumiaji</th><th>Kitendo</th></tr></thead>
        <tbody>
        ${logs.slice(0, 60).map(l => `<tr><td>${l.time}</td><td><b>${l.actor}</b></td><td>${l.action}</td></tr>`).join('') || '<tr><td colspan="3">Hakuna kumbukumbu bado.</td></tr>'}
        </tbody></table>
      </div>`;
  }
  function approveUserAccount(id) {
    SGB.update('users_profile', id, { status: 'Approved' });
    alert('✅ Akaunti imethibitishwa! Mtumiaji sasa anaweza kuingia kwenye mfumo.');
    openTab('users');
  }

  function adminCreateUser(e) {
    e.preventDefault();
    const username = document.getElementById('adUser').value.trim().toLowerCase();
    if (SGB.select('users_profile').some(u => (u.username || '').toLowerCase() === username)) {
      alert('⚠️ Username hiyo tayari ipo.');
      return;
    }
    SGB.insert('users_profile', {
      full_name: document.getElementById('adFull').value.trim(),
      role: document.getElementById('adRole').value,
      username,
      password: document.getElementById('adPass').value.trim(),
      phone_number: document.getElementById('adPhone').value.trim(),
      status: 'Approved'
    });
    openTab('users');
  }

  function resetUserPassword(id) {
    const newPass = prompt('Ingiza nenosiri jipya (New Password):');
    if (!newPass || !newPass.trim()) return;
    SGB.update('users_profile', id, { password: newPass.trim() });
    alert('✅ Nenosiri limebadilishwa!');
    openTab('users');
  }

  function deleteUserAccount(id) {
    if (!confirm('Je, una uhakika unataka kufuta akaunti hii?')) return;
    const list = SGB.select('users_profile').filter(u => String(u.id) !== String(id));
    localStorage.setItem('sgb_users_profile', JSON.stringify(list));
    SGB.pushToCloud('users_profile');
    openTab('users');
  }

  function saveSchoolConfig(e) {
    e.preventDefault();
    const cfg = {
      year: document.getElementById('cfgYear').value.trim(),
      term: document.getElementById('cfgTerm').value.trim(),
      crdb: document.getElementById('cfgCrdb').value.trim()
    };
    localStorage.setItem('sgb_school_config', JSON.stringify(cfg));
    SGB.pushToCloud('school_config');
    alert('✅ Mipangilio ya shule imehifadhiwa!');
    openTab('settings');
  }

  function toggleMaintenanceMode(enable) {
    localStorage.setItem('sgb_maintenance_mode', JSON.stringify({ enabled: enable }));
    SGB.pushToCloud('maintenance_mode');
    openTab('settings');
  }

  openTab('users', document.querySelector('.menu-btn'));
</script>
</body>
</html>
