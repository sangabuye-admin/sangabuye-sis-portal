<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mkurugenzi & Super Admin | Sangabuye SIS Portal</title>
  <script src="core.js?v=6.8"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 270px; background: #1e1b4b; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fbbf24; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #c7d2fe; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #e0e7ff; text-align: left; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 12.5px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #4338ca; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #4338ca; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 17px; font-weight: bold; color: #1e1b4b; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #1e1b4b; }
    .btn { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>MKURUGENZI (DIRECTOR)</h2>
  <p>Ilemela MC | Sangabuye Sec</p>
  <button class="menu-btn active" onclick="openTab('exec_overview', this)">🏛️ 1. Muhtasari Mkuu & Vyanzo</button>
  <button class="menu-btn" onclick="openTab('verify_receipt', this)">🧾 2. Uhakiki wa Risiti (SGB-)</button>
  <button class="menu-btn" onclick="openTab('users_mgmt', this)">👥 3. Usimamizi wa Watumiaji & Nywila</button>
  <button class="menu-btn" onclick="openTab('sys_config', this)">⚙️ 4. Mipangilio ya Shule & Hesabu</button>
  <button class="menu-btn" onclick="openTab('audit_logs', this)">🛡️ 5. Kumbukumbu za Usalama (Audit Logs)</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>
<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">🏛️ 1. Muhtasari Mkuu & Vyanzo</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['super_admin', 'director']);
  SGB.startSessionTimer();

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'exec_overview') {
      const recs = SGB.select('accounting_receipts');
      const vchs = SGB.select('expense_vouchers').filter(v => v.status === 'Paid');
      const procs = SGB.select('procurement_committee').filter(p => p.status === 'Paid');
      const pays = SGB.select('staff_payroll').filter(p => p.status === 'Paid');
      const users = SGB.select('users_profile');

      const totalIn = recs.reduce((s, r) => s + Number(r.amount_paid), 0);
      const totalOut = vchs.reduce((s, v) => s + Number(v.amount), 0) + procs.reduce((s, p) => s + Number(p.estimated_budget), 0) + pays.reduce((s, p) => s + Number(p.net_pay), 0);

      area.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <h3 style="margin:0; color:#1e1b4b;">Muhtasari wa Taasisi (Executive Dashboard)</h3>
          <button class="btn btn-blue" onclick="SGB.liveRefresh(false)">🔄 Refresh Data</button>
        </div>
        <div class="cards">
          <div class="card"><h4>Jumla ya Mapato</h4><div class="val" style="color:#059669;">TZS ${totalIn.toLocaleString()}</div></div>
          <div class="card" style="border-color:#dc2626;"><h4>Jumla ya Matumizi</h4><div class="val" style="color:#dc2626;">TZS ${totalOut.toLocaleString()}</div></div>
          <div class="card" style="border-color:#1d4ed8;"><h4>Salio Halisi</h4><div class="val" style="color:#1d4ed8;">TZS ${(totalIn - totalOut).toLocaleString()}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Watumiaji Wote</h4><div class="val">${users.length}</div></div>
        </div>
        <div class="panel">
          <h3>Miamala ya Mapokezi ya Hivi Karibuni</h3>
          <table><tr><th>Risiti Na.</th><th>Mwanafunzi</th><th>Mchango</th><th>Chanzo</th><th>Kiasi (TZS)</th><th>Tarehe</th></tr>
          ${recs.slice(0, 12).map(r => `<tr><td><b>${r.receipt_number}</b></td><td>${r.student_name}</td><td>${r.payment_category}</td><td>${r.source_fund || 'Kutwa'}</td><td><b>${Number(r.amount_paid).toLocaleString()}</b></td><td>${r.created_at}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna miamala bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'verify_receipt') {
      const recentRcpts = SGB.select('accounting_receipts');
      area.innerHTML = `
        <div class="panel">
          <h3>Uhakiki wa Uhalali wa Risiti (Andika Namba Pekee — SGB- Inajijaza Yenyewe)</h3>
          <p style="font-size:12px; color:#64748b;">Mfumo umeweka <b>SGB-</b> tayari. Andika tarakimu za risiti pekee (Mfano: <b>482910</b>) kisha bofya Hakiki.</p>
          <div style="display:flex; gap:8px; max-width:480px; align-items:center;">
            <span style="background:#1e1b4b; color:#fff; padding:9px 14px; border-radius:6px; font-weight:bold; font-size:13.5px; letter-spacing:1px;">SGB-</span>
            <input type="text" id="rcptCode" placeholder="Andika namba pekee (Mfano: 482910)" onkeyup="if(event.key==='Enter') verifyRcpt()">
            <button class="btn btn-blue" onclick="verifyRcpt()">🔍 Hakiki</button>
          </div>
          <div id="rcptRes" style="margin-top:15px;"></div>
        </div>
        <div class="panel">
          <h4>Risiti za Hivi Karibuni Zilizotolewa na Mfumo (Bofya Namba Kuhakiki Haraka)</h4>
          <table><tr><th>Namba ya Risiti</th><th>Mwanafunzi</th><th>Mchango</th><th>Chanzo</th><th>Kiasi (TZS)</th><th>Tarehe</th></tr>
          ${recentRcpts.slice(0, 15).map(r => {
            const pureDigits = (r.receipt_number || '').replace(/^SGB-?/i, '');
            return `<tr><td><a href="javascript:void(0)" onclick="document.getElementById('rcptCode').value='${pureDigits}'; verifyRcpt();"><b>${r.receipt_number}</b></a></td><td>${r.student_name}</td><td>${r.payment_category}</td><td>${r.source_fund || 'Kutwa'}</td><td><b>${Number(r.amount_paid).toLocaleString()}</b></td><td>${r.created_at}</td></tr>`;
          }).join('') || '<tr><td colspan="6">Hakuna risiti bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }
    if (tab === 'users_mgmt') {
      const users = SGB.select('users_profile');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Sajili Mtumiaji Mpya (Mwalimu, Mwanafunzi, Mzazi, Mhasibu, Mkuu)</h3>
          <form onsubmit="addUserAccount(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="uFull" required placeholder="Jina Kamili">
            <select id="uRole">
              <option value="student">Mwanafunzi (Student)</option>
              <option value="parent">Mzazi / Mlezi (Parent)</option>
              <option value="teacher">Mwalimu (Teacher)</option>
              <option value="academic">Mtaaluma (Academic)</option>
              <option value="accountant">Mhasibu (Accountant)</option>
              <option value="headmaster">Mkuu wa Shule (Headmaster)</option>
              <option value="librarian">Maktaba (Librarian)</option>
              <option value="matron">Bweni & Zahanati (Matron/Patron)</option>
              <option value="super_admin">Super Admin / Mkurugenzi</option>
            </select>
            <input type="text" id="uReg" placeholder="Namba ya Usajili / Cheo">
            <input type="text" id="uPhone" placeholder="Namba ya Simu (07...)">
            <input type="text" id="uUser" required placeholder="Username ya Kuingilia">
            <input type="text" id="uPass" required placeholder="Nywila (Password)">
            <button type="submit" class="btn btn-green" style="grid-column: span 3;">➕ Hifadhi Akaunti Mpya</button>
          </form>

          <h3>2. Orodha ya Watumiaji Wote (${users.length})</h3>
          <table><tr><th>Jina Kamili</th><th>Cheo (Role)</th><th>Reg / Simu</th><th>Username</th><th>Password</th><th>Hatua</th></tr>
          ${users.map(u => `<tr>
            <td><b>${u.full_name}</b></td><td>${u.role}</td><td>${u.reg_or_staff_no || '-'} | ${u.phone_number || '-'}</td>
            <td><code>${u.username}</code></td><td><code>${u.password}</code></td>
            <td><button class="btn btn-amber" onclick="resetUserPass(${u.id})">🔑 Badili Nywila</button> <button class="btn btn-red" onclick="deleteUserAcc(${u.id})">🗑️ Futa</button></td>
          </tr>`).join('') || '<tr><td colspan="6">Hakuna watumiaji waliosajiliwa bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'sys_config') {
      const cfg = SGB.getConfig();
      const locks = SGB.select('account_locks');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Mipangilio ya Shule & Akaunti ya Benki</h3>
          <form onsubmit="saveSchoolCfg(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="cfgYear" value="${cfg.year}" required placeholder="Mwaka wa Masomo">
            <input type="text" id="cfgTerm" value="${cfg.term}" required placeholder="Muhula (Term)">
            <input type="text" id="cfgCrdb" value="${cfg.crdb}" required placeholder="Akaunti ya CRDB">
            <button type="submit" class="btn btn-blue" style="grid-column: span 3;">💾 Hifadhi Mipangilio</button>
          </form>
        </div>
        <div class="panel">
          <h3>2. Udhibiti wa Hesabu Zilizofungwa (Admin Unlock Override)</h3>
          <table><tr><th>Kipindi</th><th>Mapato / Matumizi / Salio</th><th>Hali</th><th>Hatua ya Admin</th></tr>
          ${locks.map(l => `<tr>
            <td><b>${l.label}</b> (${l.start_date} - ${l.end_date})</td>
            <td>In: ${Number(l.period_in||0).toLocaleString()} | Out: ${Number(l.period_out||0).toLocaleString()} | Bal: ${Number(l.period_bal||0).toLocaleString()}</td>
            <td><b>${l.status}</b></td>
            <td>${l.status === 'Locked' ? `<button class="btn btn-green" onclick="SGB.update('account_locks', ${l.id}, {status:'Unlocked', unlock_requested:false}); openTab('sys_config')">🔓 Fungua (Admin Override)</button>` : 'Imefunguliwa'}</td>
          </tr>`).join('') || '<tr><td colspan="4">Hakuna kipindi kilichofungwa.</td></tr>'}
          </table>
        </div>`;
      return;
    }

    if (tab === 'audit_logs') {
      const logs = SGB.select('audit_logs');
      area.innerHTML = `
        <div class="panel">
          <h3>Kumbukumbu za Usalama na Mienendo ya Mfumo (Audit Trail)</h3>
          <table><tr><th>Muda</th><th>Mtumiaji</th><th>Tukio / Hatua</th></tr>
          ${logs.map(l => `<tr><td>${l.time}</td><td><b>${l.actor}</b></td><td>${l.action}</td></tr>`).join('') || '<tr><td colspan="3">Hakuna kumbukumbu bado.</td></tr>'}
          </table>
        </div>`;
      return;
    }
  }
  async function verifyRcpt() {
    await SGB.pullFromCloud(true);
    let raw = (document.getElementById('rcptCode').value || '').trim().toUpperCase();
    if (!raw) { alert('⚠️ Ingiza namba ya risiti kwanza.'); return; }

    // Ondoa herufi zozote za SGB- kama mtumiaji aliziandika, kisha iunge mara moja kwa usahihi
    const digitsOnly = raw.replace(/^SGB-?/i, '').trim();
    const fullCode = 'SGB-' + digitsOnly;

    const matches = SGB.select('accounting_receipts').filter(r => {
      const dbCode = (r.receipt_number || '').trim().toUpperCase();
      return dbCode === fullCode || dbCode === digitsOnly || dbCode.endsWith('-' + digitsOnly);
    });

    if (matches.length > 0) {
      const first = matches;
      const totalAmt = matches.reduce((s, x) => s + Number(x.amount_paid), 0);
      const itemsList = matches.map(x => `• <b>${x.payment_category}</b> (${x.source_fund || 'Kutwa'}): TZS ${Number(x.amount_paid).toLocaleString()}/=`).join('<br>');

      document.getElementById('rcptRes').innerHTML = `
        <div style="background:#ecfdf5; border:2px solid #059669; padding:16px; border-radius:8px; max-width:600px;">
          <h4 style="margin:0 0 8px; color:#059669;">✅ RISITI HII NI HALALI KABISA! (${first.receipt_number})</h4>
          <b>Jina la Mwanafunzi:</b> ${first.student_name} (${first.student_reg_no || '-'})<br>
          <b>Njia ya Malipo:</b> ${first.payment_method} (Ref: ${first.bank_ref_no || '-'})<br>
          <b>Tarehe ya Malipo:</b> ${first.tx_date || first.created_at}<hr>
          <b>Mchanganuo wa Michango Iliyolipwa:</b><br>${itemsList}<hr>
          <b style="font-size:15px; color:#064e3b;">JUMLA KUU ILIYOLIPWA: TZS ${totalAmt.toLocaleString()}/=</b>
        </div>`;
    } else {
      document.getElementById('rcptRes').innerHTML = `
        <div style="background:#fef2f2; border:2px solid #dc2626; padding:16px; border-radius:8px; max-width:600px;">
          <b style="color:#dc2626;">❌ RISITI NAMBA "${fullCode}" HAIKUPATIKANA KWENYE MFUMO!</b><br>
          <small>Hakikisha umeandika tarakimu sahihi za risiti au bofya 🔄 Refresh kuvuta data mpya kutoka hewani.</small>
        </div>`;
    }
  }

  function addUserAccount(e) {
    e.preventDefault();
    SGB.insert('users_profile', {
      full_name: document.getElementById('uFull').value.trim(),
      role: document.getElementById('uRole').value,
      reg_or_staff_no: document.getElementById('uReg').value.trim(),
      phone_number: document.getElementById('uPhone').value.trim(),
      username: document.getElementById('uUser').value.trim(),
      password: document.getElementById('uPass').value.trim()
    });
    alert('✅ Akaunti mpya imeundwa na kupandishwa hewani!');
    openTab('users_mgmt');
  }

  function resetUserPass(id) {
    const np = prompt('Ingiza nywila (password) mpya:');
    if (np && np.trim()) { SGB.update('users_profile', id, { password: np.trim() }); openTab('users_mgmt'); }
  }

  function deleteUserAcc(id) {
    if (!confirm('Una uhakika unataka kufuta mtumiaji huyu?')) return;
    localStorage.setItem('sgb_users_profile', JSON.stringify(SGB.select('users_profile').filter(x => x.id !== id)));
    SGB.pushToCloud('users_profile');
    openTab('users_mgmt');
  }

  function saveSchoolCfg(e) {
    e.preventDefault();
    const cfg = { year: document.getElementById('cfgYear').value.trim(), term: document.getElementById('cfgTerm').value.trim(), crdb: document.getElementById('cfgCrdb').value.trim() };
    localStorage.setItem('sgb_school_config', JSON.stringify(cfg));
    SGB.pushToCloud('school_config');
    alert('✅ Mipangilio imehifadhiwa!');
  }

  openTab('exec_overview', document.querySelector('.menu-btn'));
</script>
</body>
</html>
