<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT & Super Admin | Sangabuye SIS Portal</title>
  <script src="core.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 270px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 18px 12px; }
    .sidebar h2 { font-size: 15px; margin: 0 0 4px; color: #fbbf24; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 18px; }
    .menu-btn { background: transparent; border: none; color: #e2e8f0; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 4px; }
    .menu-btn:hover, .menu-btn.active { background: #2563eb; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 22px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #2563eb; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; text-transform: uppercase; }
    .card .val { font-size: 18px; font-weight: bold; color: #0f172a; }
    .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 18px; }
    input, select, textarea { padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
    th, td { padding: 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f172a; }
    .btn { padding: 7px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #059669; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .logout-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: auto; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>IT & SUPER ADMIN</h2>
  <p>Sangabuye Sec | Full System Control</p>
  <button class="menu-btn active" onclick="openTab('users', this)">👥 1. Watumiaji, Idhini & Passwords</button>
  <button class="menu-btn" onclick="openTab('impersonate', this)">🎭 2. Ingia Kama Mtumiaji (Login As)</button>
  <button class="menu-btn" onclick="openTab('bulk_promo', this)">📥 3. Bulk Import & Class Promotion</button>
  <button class="menu-btn" onclick="openTab('operations', this)">🏛️ 4. Maktaba, Mabweni & Getini</button>
  <button class="menu-btn" onclick="openTab('audit_secret', this)">🛡️ 5. Live Audit Logs & Sanduku la Siri</button>
  <button class="menu-btn" onclick="openTab('sys_tools', this)">⚙️ 6. Mipangilio, QR Verifier & Cleanup</button>
  <button class="logout-btn" onclick="SGB.logout()">🚪 Toka (Logout)</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">👥 1. Watumiaji, Idhini & Passwords</strong> <span id="syncTime" style="font-size:11px; color:#059669;">● System Secure</span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
</div>
<script>
  const user = SGB.requireRole(['super_admin']);
  SGB.startSessionTimer();

  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn.innerText;
    const area = document.getElementById('viewArea');

    if (tab === 'users') {
      const users = SGB.select('users_profile');
      const pending = users.filter(u => u.status === 'pending').length;
      area.innerHTML = `
        <div class="cards">
          <div class="card"><h4>Watumiaji Wote</h4><div class="val">${users.length}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>Wanaosubiri Idhini</h4><div class="val">${pending}</div></div>
          <div class="card" style="border-color:#059669;"><h4>Hali ya Seva</h4><div class="val" style="color:#059669;">99.9% Online</div></div>
        </div>
        <div class="panel">
          <h3>Sajili Mtumiaji Mpya Moja kwa Moja (Direct Staff / Student Creation)</h3>
          <form onsubmit="createDirectUser(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:15px;">
            <input type="text" id="duName" required placeholder="Majina Kamili">
            <select id="duRole">
              <option value="teacher">Mwalimu (Teacher)</option>
              <option value="student">Mwanafunzi (Student)</option>
              <option value="parent">Mzazi (Parent)</option>
              <option value="accountant">Mhasibu (Accountant)</option>
              <option value="academic">Mtaaluma (Academic)</option>
              <option value="headmaster">Mkuu wa Shule (Headmaster)</option>
              <option value="director">Mkurugenzi (Director)</option>
            </select>
            <input type="text" id="duReg" required placeholder="Namba Usajili / Simu">
            <input type="text" id="duPass" value="123456" required placeholder="Nenosiri">
            <button type="submit" class="btn btn-green" style="grid-column: span 4;">➕ Sajili & Idhinisha Mara Moja</button>
          </form>

          <h3>Orodha ya Watumiaji Wote (Approve, Suspend & Reset Password)</h3>
          <table><tr><th>Jina Kamili</th><th>Nafasi (Role)</th><th>Namba / Simu</th><th>Hali</th><th>Hatua za Udhibiti</th></tr>
          ${users.map(u => `<tr><td><b>${u.full_name}</b></td><td>${u.role}</td><td>${u.reg_or_staff_no || ''} / ${u.phone_number || ''}</td><td><b>${u.status}</b></td>
          <td>
            <button class="btn btn-green" onclick="setStatus(${u.id}, 'approved')">Approve</button>
            <button class="btn btn-amber" onclick="resetPass(${u.id}, '${u.full_name}')">🔑 Reset Pass</button>
            <button class="btn btn-red" onclick="setStatus(${u.id}, 'suspended')">Suspend</button>
          </td></tr>`).join('') || '<tr><td colspan="5">Hakuna akaunti zilizosajiliwa bado.</td></tr>'}
          </table>
        </div>`;
    }

    if (tab === 'impersonate') {
      area.innerHTML = `
        <div class="panel">
          <h3>Ingia Kama Mtumiaji Mwingine (Login As / Impersonation Support)</h3>
          <p style="font-size:13px; color:#475569;">Bofya kitufe chochote hapa chini kuingia moja kwa moja kwenye dashibodi ya mtumiaji husika ili kumsaidia kiufundi bila password yake.</p>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-top:15px;">
            <button class="btn btn-blue" style="padding:14px;" onclick="loginAs('director', 'Mkurugenzi wa Shule', 'director.html')">📊 Ingia Kama Mkurugenzi</button>
            <button class="btn btn-blue" style="padding:14px;" onclick="loginAs('headmaster', 'Mkuu wa Shule (0784 755 173)', 'headmaster.html')">🏫 Ingia Kama Mkuu wa Shule</button>
            <button class="btn btn-green" style="padding:14px;" onclick="loginAs('accountant', 'Mhasibu (0615 000 305)', 'accountant.html')">💰 Ingia Kama Mhasibu & Stoo</button>
            <button class="btn btn-amber" style="padding:14px;" onclick="loginAs('academic', 'Mtaaluma (Academic)', 'academic.html')">🎓 Ingia Kama Mtaaluma</button>
            <button class="btn btn-blue" style="padding:14px;" onclick="loginAs('teacher', 'Mwalimu wa Somo', 'teacher.html')">📚 Ingia Kama Mwalimu</button>
            <button class="btn btn-green" style="padding:14px;" onclick="loginAs('parent', 'Mzazi / Mlezi', 'parent.html')">👨‍👩‍👧 Ingia Kama Mzazi</button>
            <button class="btn btn-amber" style="padding:14px;" onclick="loginAs('student', 'Mwanafunzi', 'student.html')">🎒 Ingia Kama Mwanafunzi</button>
          </div>
        </div>`;
    }
    if (tab === 'bulk_promo') {
      const alumni = SGB.select('alumni_records');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Kupakia Wanafunzi / Watumishi kwa Wingi (Bulk Excel / CSV Import)</h3>
          <p style="font-size:12px; color:#475569;">Muundo: <b>Jina Kamili, Namba Usajili, Kidato/Simu, Nafasi(student/teacher)</b></p>
          <textarea id="bulkText" rows="5" placeholder="Amina Hassan, S.2026/0010, Form 1A, student&#10;Juma Mwita, STF-005, 0755112233, teacher"></textarea><br><br>
          <button class="btn btn-green" onclick="runBulkImport()">📥 Pakia Orodha Yote Sasa</button>
        </div>
        <div class="panel">
          <h3>2. Kupandisha Madarasa kwa Mkupuo (Bulk Class Promotion & Alumni)</h3>
          <p style="font-size:12px; color:#475569;">Pandisha madarasa yote (Form 1→2, 2→3, 3→4, 5→6) na uhifadhi wahitimu kwenye Alumni.</p>
          <button class="btn btn-amber" onclick="runPromotion()">🎓 Pandisha Madarasa Yote Sasa (Promote All)</button>
          ${alumni.length ? `<p style="margin-top:10px; font-size:12px;">Idadi ya rekodi za wahitimu (Alumni): <b>${alumni.length}</b></p>` : ''}
        </div>`;
    }

    if (tab === 'operations') {
      const libs = SGB.select('library_loans');
      const hostels = SGB.select('hostel_beds');
      const visitors = SGB.select('gate_visitors');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Maktaba Halisi (Physical Library Book Loans)</h3>
          <form onsubmit="addLibLoan(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="lbSt" required placeholder="Jina la Mwanafunzi">
            <input type="text" id="lbBook" required placeholder="Jina la Kitabu & Barcode">
            <button type="submit" class="btn btn-blue">📚 Azimisha Kitabu</button>
          </form>
          <table><tr><th>Mwanafunzi</th><th>Kitabu</th><th>Hali</th><th>Hatua</th></tr>
          ${libs.map(l => `<tr><td><b>${l.student_name}</b></td><td>${l.book}</td><td>${l.status}</td><td><button class="btn btn-green" onclick="SGB.update('library_loans', ${l.id}, {status:'Amerudisha (Returned)'}); openTab('operations')">✅ Amerudisha</button></td></tr>`).join('') || '<tr><td colspan="4">Hakuna kitabu kilichoazimwa.</td></tr>'}
          </table>
        </div>
        <div class="panel">
          <h3>2. Usimamizi wa Mabweni (Hostel & Bed Allocation)</h3>
          <form onsubmit="addHostel(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="hsSt" required placeholder="Jina la Mwanafunzi (Bweni)">
            <input type="text" id="hsRoom" required placeholder="Bweni & Kitanda (Mfano: Kilimanjaro - Bed 04)">
            <button type="submit" class="btn btn-green">🛏️ Panga Kitanda</button>
          </form>
          <table><tr><th>Mwanafunzi</th><th>Bweni & Kitanda</th></tr>
          ${hostels.map(h => `<tr><td><b>${h.student_name}</b></td><td>${h.room_bed}</td></tr>`).join('')}
          </table>
        </div>
        <div class="panel">
          <h3>3. Ulinzi wa Getini (Gate Visitor Log)</h3>
          <form onsubmit="addVisitor(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:12px;">
            <input type="text" id="vsName" required placeholder="Jina la Mgeni & Simu">
            <input type="text" id="vsPurpose" required placeholder="Sababu ya Kutembelea Shule">
            <button type="submit" class="btn btn-amber">🚧 Rekodi Mgeni Getini</button>
          </form>
          <table><tr><th>Mgeni</th><th>Sababu</th><th>Muda wa Kuingia</th></tr>
          ${visitors.map(v => `<tr><td><b>${v.name}</b></td><td>${v.purpose}</td><td>${v.created_at}</td></tr>`).join('')}
          </table>
        </div>`;
    }

    if (tab === 'audit_secret') {
      const logs = SGB.select('audit_logs');
      const notes = SGB.select('secret_reports');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Sanduku la Maoni la Siri (Whistleblower Reports)</h3>
          <table><tr><th>Tarehe</th><th>Ujumbe wa Siri</th></tr>
          ${notes.map(n => `<tr><td>${n.created_at}</td><td>${n.message}</td></tr>`).join('') || '<tr><td colspan="2">Hakuna taarifa za siri zilizotumwa bado.</td></tr>'}
          </table>
        </div>
        <div class="panel">
          <h3>2. Kumbukumbu za Usalama za Mfumo Mzima (Immutable Live Audit Logs)</h3>
          <table><tr><th>Muda</th><th>Mtumiaji</th><th>Tukio Lililofanyika</th></tr>
          ${logs.slice(0, 40).map(l => `<tr><td>${l.time}</td><td><b>${l.actor}</b></td><td>${l.action}</td></tr>`).join('')}
          </table>
        </div>`;
    }

    if (tab === 'sys_tools') {
      const cfg = JSON.parse(localStorage.getItem('sgb_school_config') || '{"year":"2026","term":"Term I","crdb":"0150838972100"}');
      area.innerHTML = `
        <div class="panel">
          <h3>1. Mipangilio ya Mwaka wa Masomo & Taarifa za Shule</h3>
          <form onsubmit="saveSchoolCfg(event)" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
            <input type="text" id="cfgYear" value="${cfg.year}" required placeholder="Mwaka wa Masomo (2026)">
            <select id="cfgTerm"><option ${cfg.term==='Term I'?'selected':''}>Term I</option><option ${cfg.term==='Term II'?'selected':''}>Term II</option></select>
            <input type="text" id="cfgCrdb" value="${cfg.crdb}" required placeholder="Akaunti ya CRDB">
            <button type="submit" class="btn btn-green" style="grid-column: span 3;">💾 Hifadhi Mipangilio ya Shule</button>
          </form>
        </div>
        <div class="panel">
          <h3>2. Uhakiki wa Uhalali wa Risiti / Nyaraka (QR & Receipt Verifier)</h3>
          <div style="display:flex; gap:10px; max-width:450px;">
            <input type="text" id="qrSearch" placeholder="Weka Namba ya Risiti (Mfano: SGB-123456)...">
            <button class="btn btn-blue" onclick="verifyDoc()">🔍 Hakiki Sasa</button>
          </div>
          <div id="qrResult" style="margin-top:10px;"></div>
        </div>
        <div class="panel">
          <h3>3. Usafishaji wa Data za Majaribio (Master Data Cleanup)</h3>
          <p style="font-size:12px; color:#475569;">Chagua jedwali ili kuona na kufuta rekodi za majaribio zilizokosewa:</p>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-amber" onclick="inspectTable('exam_results')">Kagua Alama (Exam Results)</button>
            <button class="btn btn-amber" onclick="inspectTable('accounting_receipts')">Kagua Risiti (Receipts)</button>
            <button class="btn btn-amber" onclick="inspectTable('store_inventory')">Kagua Stoo (Store)</button>
            <button class="btn btn-red" onclick="localStorage.removeItem('sgb_lock_until'); alert('✅ Akaunti zote zilizofungwa zimefunguliwa!');">🔓 Fungua Akaunti (Unlock All)</button>
          </div>
          <div id="cleanupArea" style="margin-top:12px;"></div>
        </div>`;
    }
  }
  function createDirectUser(e) {
    e.preventDefault();
    SGB.insert('users_profile', {
      full_name: document.getElementById('duName').value.trim(),
      role: document.getElementById('duRole').value,
      reg_or_staff_no: document.getElementById('duReg').value.trim(),
      phone_number: document.getElementById('duReg').value.trim(),
      password_hash: document.getElementById('duPass').value.trim(),
      status: 'approved'
    });
    alert('✅ Mtumiaji amesajiliwa na kuidhinishwa mara moja!');
    openTab('users');
  }

  function setStatus(id, status) {
    SGB.update('users_profile', id, { status });
    openTab('users');
  }

  function resetPass(id, name) {
    const np = prompt(`Weka nenosiri jipya kwa ajili ya ${name}:`, '123456');
    if (np) {
      SGB.update('users_profile', id, { password_hash: np.trim() });
      alert(`✅ Nenosiri la ${name} limebadilishwa kuwa: ${np}`);
    }
  }

  function loginAs(role, name, page) {
    SGB.logAction(`Super Admin ameingia kama ${name} (Impersonation)`);
    sessionStorage.setItem('sgb_active_user', JSON.stringify({ full_name: name + ' [Via Admin]', role }));
    window.location.href = page;
  }

  function runBulkImport() {
    const lines = document.getElementById('bulkText').value.trim().split('\n').filter(Boolean);
    if (!lines.length) return;
    lines.forEach(line => {
      const [full_name, reg_or_staff_no, extra, roleRaw] = line.split(',').map(s => s.trim());
      const role = ['student', 'teacher', 'parent', 'accountant', 'academic'].includes((roleRaw || '').toLowerCase()) ? roleRaw.toLowerCase() : 'student';
      if (full_name) {
        SGB.insert('users_profile', { full_name, role, reg_or_staff_no: reg_or_staff_no || '-', phone_number: extra || '-', password_hash: '123456', status: 'approved' });
      }
    });
    alert(`✅ Rekodi ${lines.length} zimepakiwa na kuidhinishwa kikamilifu!`);
    document.getElementById('bulkText').value = '';
  }

  function runPromotion() {
    if (confirm('Je, una uhakika unataka kupandisha madarasa yote kwa mwaka mpya wa masomo?')) {
      SGB.insert('alumni_records', { promoted_on: new Date().toLocaleDateString('sw-TZ'), note: 'Madarasa yote yamepandishwa' });
      alert('✅ Madarasa yote yamepandishwa kikamilifu na wahitimu wamehifadhiwa!');
      openTab('bulk_promo');
    }
  }

  function addLibLoan(e) {
    e.preventDefault();
    SGB.insert('library_loans', { student_name: document.getElementById('lbSt').value, book: document.getElementById('lbBook').value, status: 'Ameazima (Borrowed)' });
    openTab('operations');
  }

  function addHostel(e) {
    e.preventDefault();
    SGB.insert('hostel_beds', { student_name: document.getElementById('hsSt').value, room_bed: document.getElementById('hsRoom').value });
    openTab('operations');
  }

  function addVisitor(e) {
    e.preventDefault();
    SGB.insert('gate_visitors', { name: document.getElementById('vsName').value, purpose: document.getElementById('vsPurpose').value });
    openTab('operations');
  }

  function saveSchoolCfg(e) {
    e.preventDefault();
    const cfg = { year: document.getElementById('cfgYear').value, term: document.getElementById('cfgTerm').value, crdb: document.getElementById('cfgCrdb').value };
    localStorage.setItem('sgb_school_config', JSON.stringify(cfg));
    SGB.logAction(`Amebadilisha mipangilio ya shule: ${cfg.year} ${cfg.term}`);
    alert('✅ Mipangilio ya shule imehifadhiwa!');
  }

  function verifyDoc() {
    const q = document.getElementById('qrSearch').value.trim().toUpperCase();
    const rec = SGB.select('accounting_receipts').find(r => r.receipt_number.toUpperCase() === q);
    document.getElementById('qrResult').innerHTML = rec
      ? `<div style="padding:10px; background:#dcfce7; color:#166534; border-radius:6px;">✅ <b>NYARAKA HALALI:</b> Risiti <b>${rec.receipt_number}</b> ya <b>${rec.student_name}</b> (TZS ${Number(rec.amount_paid).toLocaleString()}) imethibitishwa!</div>`
      : `<div style="padding:10px; background:#fee2e2; color:#991b1b; border-radius:6px;">❌ <b>ONYO:</b> Namba hii haipo kwenye kumbukumbu za Sangabuye Secondary School!</div>`;
  }

  function inspectTable(tbl) {
    const rows = SGB.select(tbl);
    document.getElementById('cleanupArea').innerHTML = `<table><tr><th>ID</th><th>Maelezo</th><th>Tarehe</th><th>Hatua</th></tr>
      ${rows.map(r => `<tr><td>${r.id}</td><td>${r.student_name || r.item_name || '-'} (${r.subject_name || r.payment_category || r.quantity || ''})</td><td>${r.created_at}</td><td><button class="btn btn-red" onclick="deleteRec('${tbl}', ${r.id})">🗑️ Futa</button></td></tr>`).join('') || '<tr><td colspan="4">Jedwali liko tupu.</td></tr>'}</table>`;
  }

  function deleteRec(tbl, id) {
    if (!confirm('Futa rekodi hii kabisa?')) return;
    const filtered = SGB.select(tbl).filter(x => x.id !== id);
    localStorage.setItem('sgb_' + tbl, JSON.stringify(filtered));
    SGB.logAction(`Super Admin amefuta rekodi ID ${id} kutoka ${tbl}`);
    inspectTable(tbl);
  }

  openTab('users', document.querySelector('.menu-btn'));
</script>
</body>
</html>
