<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maktaba (School Library v7.5) | Sangabuye SIS</title>
  <script src="core.js?v=7.5"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background: #f1f5f9; display: flex; min-height: 100vh; color: #1e293b; }
    .sidebar { width: 255px; background: #0f172a; color: white; display: flex; flex-direction: column; padding: 14px 10px; overflow-y: auto; }
    .sidebar h2 { font-size: 16px; margin: 0 0 2px; color: #38bdf8; text-align: center; }
    .sidebar p { font-size: 11px; text-align: center; color: #94a3b8; margin: 0 0 12px; }
    .menu-btn { background: transparent; border: none; color: #cbd5e1; text-align: left; padding: 7.5px 11px; border-radius: 7px; cursor: pointer; font-size: 12.5px; margin-bottom: 3px; }
    .menu-btn:hover, .menu-btn.active { background: #1d4ed8; color: white; font-weight: bold; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .topbar { background: white; padding: 11px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .content { padding: 18px; }
    .cards-5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1d4ed8; }
    .card h4 { margin: 0 0 5px; font-size: 11px; color: #64748b; }
    .card .val { font-size: 20px; font-weight: bold; color: #0f172a; }
    .panel { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 16px; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 7px 8px; border: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #0f172a; }
    .btn { padding: 7px 11px; border: none; border-radius: 6px; cursor: pointer; font-size: 11.5px; font-weight: bold; }
    .btn-green { background: #059669; color: white; }
    .btn-blue { background: #1d4ed8; color: white; }
    .btn-amber { background: #d97706; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .badge-ok { background: #dcfce7; color: #166534; padding: 3px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; }
    .badge-late { background: #fee2e2; color: #991b1b; padding: 3px 7px; border-radius: 5px; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>
<div class="sidebar">
  <h2>📚 Maktaba</h2>
  <p>School Library | Sangabuye Sec</p>
  <button class="menu-btn active" onclick="openTab('dash', this)">🏠 Dashibodi</button>
  <button class="menu-btn" onclick="openTab('catalog', this)">📖 Katalogi ya Vitabu</button>
  <button class="menu-btn" onclick="openTab('members', this)">👥 Wanafunzi & Walimu</button>
  <button class="menu-btn" onclick="openTab('issue_return', this)">🔄 Azima & Rudisha</button>
  <button class="menu-btn" onclick="openTab('attendance', this)">📋 Mahudhurio Maktaba</button>
  <button class="menu-btn" onclick="openTab('reservations', this)">🔖 Uhifadhi (Reservations)</button>
  <button class="menu-btn" onclick="openTab('fines', this)">💰 Faini</button>
  <button class="menu-btn" onclick="openTab('ebooks', this)">💻 Maktaba Mtandao</button>
  <button class="menu-btn" onclick="openTab('ict', this)">🖥️ Vifaa vya TEHAMA</button>
  <button class="menu-btn" onclick="openTab('clearance', this)">🎓 Kibali / Clearance</button>
  <button class="menu-btn" onclick="openTab('id_cards', this)">🪪 Vitambulisho (QR)</button>
  <button class="menu-btn" onclick="openTab('book_labels', this)">🏷️ Stika za Vitabu (QR)</button>
  <button class="menu-btn" onclick="openTab('suggestions', this)">💡 Mapendekezo</button>
  <button class="menu-btn" onclick="openTab('reports', this)">📊 Ripoti / Taarifa</button>
</div>

<div class="main">
  <div class="topbar">
    <div><strong id="tabTitle">👋 Karibu, Librarian!</strong> <span id="syncTime" style="font-size:11px; color:#059669;"></span></div>
    <div></div>
  </div>
  <div class="content" id="viewArea"></div>
  <datalist id="libMemberList"></datalist>
  <datalist id="libBookList"></datalist>
</div>
<script>
  const user = SGB.requireRole(['librarian', 'super_admin', 'academic', 'headmaster']);
  SGB.startSessionTimer();

  function getSeatStats() {
    const raw = JSON.parse(localStorage.getItem('sgb_library_seats') || '{"total":50,"occupied":2}');
    return { total: Number(raw.total || 50), occupied: Number(raw.occupied || 0), free: Math.max(0, Number(raw.total || 50) - Number(raw.occupied || 0)) };
  }

  function changeSeats(delta) {
    const s = getSeatStats();
    s.occupied = Math.min(s.total, Math.max(0, s.occupied + delta));
    localStorage.setItem('sgb_library_seats', JSON.stringify(s));
    SGB.pushToCloud('library_seats');
    openTab('dash');
  }

  function syncDatalists() {
    const members = SGB.select('library_members');
    const books = SGB.select('library_books');
    document.getElementById('libMemberList').innerHTML = members.map(m => `<option value="${m.full_name} (${m.member_id})">`).join('');
    document.getElementById('libBookList').innerHTML = books.map(b => `<option value="${b.title} [${b.barcode}]">`).join('');
  }

  function generateNextMemberId(role) {
    const list = SGB.select('library_members');
    const prefix = role === 'Teacher' ? 'T-2026-' : 'S-2026-';
    const count = list.filter(x => (x.member_id || '').startsWith(prefix)).length + 1;
    return prefix + String(count).padStart(3, '0');
  }

  function filterTableRows(inputId, tableId) {
    const q = (document.getElementById(inputId)?.value || '').toLowerCase();
    const rows = document.querySelectorAll(`#${tableId} tbody tr`);
    rows.forEach(r => {
      r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
    });
  }
  function openTab(tab, btn) {
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (btn) document.getElementById('tabTitle').innerText = btn ? btn.innerText : '👋 Karibu, Librarian!';
    syncDatalists();
    const area = document.getElementById('viewArea');

    if (tab === 'dash') {
      const books = SGB.select('library_books');
      const loans = SGB.select('library_loans');
      const ebooks = SGB.select('library_ebooks');
      const members = SGB.select('library_members');
      const seats = getSeatStats();

      const totalCopies = books.reduce((s, b) => s + Number(b.total_copies || 1), 0);
      const activeLoans = loans.filter(l => (l.status || '').includes('Ameazima') || (l.status || '').includes('Kwa Wakati') || (l.status || '').includes('Imechelewa'));
      const todayIso = new Date().toISOString().slice(0, 10);
      const dueToday = activeLoans.filter(l => l.due_date === todayIso).length;

      // Takwimu za Vitabu Vinavyopendwa, Wasomaji Bora na Madarasa Yanayoongoza
      const bookCounts = {}, readerCounts = {}, classCounts = {};
      loans.forEach(l => {
        bookCounts[l.book] = (bookCounts[l.book] || 0) + 1;
        readerCounts[l.student_name] = (readerCounts[l.student_name] || 0) + 1;
        const mObj = members.find(m => m.full_name.toLowerCase() === (l.student_name || '').toLowerCase());
        const cls = mObj ? mObj.class_dept : 'Form 4';
        classCounts[cls] = (classCounts[cls] || 0) + 1;
      });
      const topBooks = Object.entries(bookCounts).sort((a, b) => b - a).slice(0, 3);
      const topReaders = Object.entries(readerCounts).sort((a, b) => b - a).slice(0, 3);
      const topClasses = Object.entries(classCounts).sort((a, b) => b - a).slice(0, 3);

      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
      const heights =;

      area.innerHTML = `
        <div class="panel" style="padding:10px 14px; margin-bottom:14px;">
          <input type="text" id="globalLibSearch" onkeyup="filterTableRows('globalLibSearch','dashLoansTbl')" placeholder="🔍 Tafuta kitabu, barcode, au jina la mwanafunzi/mwalimu papo hapo...">
        </div>

        <div class="cards-5">
          <div class="card"><h4>📚 Jumla ya Vitabu</h4><div class="val">${totalCopies.toLocaleString()}</div></div>
          <div class="card" style="border-color:#d97706;"><h4>👥 Walioazima</h4><div class="val">${activeLoans.length}</div></div>
          <div class="card" style="border-color:#059669;"><h4>📅 Vinavyorejeshwa Leo</h4><div class="val">${dueToday}</div></div>
          <div class="card" style="border-color:#7c3aed;"><h4>💻 E-Books</h4><div class="val">${ebooks.length}</div></div>
          <div class="card" style="border-color:#0284c7;">
            <h4>🪑 Viti Vilivyo Wazi</h4>
            <div class="val">${seats.free}/${seats.total}</div>
            <div style="display:flex; gap:5px; margin-top:6px;">
              <button class="btn btn-green" style="padding:3px 7px; font-size:10px;" onclick="changeSeats(-1)">+1 Ingia</button>
              <button class="btn btn-red" style="padding:3px 7px; font-size:10px;" onclick="changeSeats(1)">-1 Toka</button>
            </div>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1.6fr; gap:14px; margin-bottom:14px;">
          <div class="panel">
            <h3 style="margin-top:0;">📈 Mwenendo wa Uazimaji</h3>
            <div style="display:flex; align-items:flex-end; justify-content:space-around; height:145px; padding-top:15px; border-bottom:1px solid #cbd5e1;">
              ${months.map((m, idx) => `<div style="text-align:center; width:14%;">
                <div style="background:#2563eb; height:${heights[idx]}px; border-radius:4px 4px 0 0;"></div>
                <small style="font-size:11px; color:#64748b;">${m}</small>
              </div>`).join('')}
            </div>
          </div>

          <div class="panel">
            <h3 style="margin-top:0;">🕒 Uazimaji wa Hivi Karibuni</h3>
            <table id="dashLoansTbl">
              <thead><tr><th>Kitabu</th><th>Aliyeazima</th><th>Tarehe Kurudisha</th><th>Hali</th></tr></thead>
              <tbody>
              ${activeLoans.slice(0, 6).map(l => {
                const isLate = l.due_date && l.due_date < todayIso;
                return `<tr>
                  <td><b>${l.book}</b></td><td>${l.student_name}</td><td>${l.due_date || '-'}</td>
                  <td><span class="${isLate ? 'badge-late' : 'badge-ok'}">${isLate ? 'Imechelewa' : 'Kwa Wakati'}</span></td>
                </tr>`;
              }).join('') || '<tr><td colspan="4">Hakuna vitabu vilivyoazimwa sasa.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:14px;">
          <div class="panel"><h4 style="margin-top:0;">⭐ Vitabu Vinavyopendwa</h4>${topBooks.map((x, i) => `<div style="font-size:12px; padding:4px 0;">${i+1}. <b>${x}</b> (${x})</div>`).join('') || '<small>Hakuna takwimu bado.</small>'}</div>
          <div class="panel"><h4 style="margin-top:0;">🏆 Wasomaji Bora</h4>${topReaders.map((x, i) => `<div style="font-size:12px; padding:4px 0;">${i+1}. <b>${x}</b> (${x})</div>`).join('') || '<small>Hakuna takwimu bado.</small>'}</div>
          <div class="panel"><h4 style="margin-top:0;">🎓 Madarasa Yanayoongoza</h4>${topClasses.map((x, i) => `<div style="font-size:12px; padding:4px 0;">${i+1}. <b>${x}</b> (${x})</div>`).join('') || '<small>Hakuna takwimu bado.</small>'}</div>
        </div>`;
      return;
    }
    if (tab === 'catalog') {
      const books = SGB.select('library_books');
      area.innerHTML = `
        <div class="panel" style="padding:10px;">
          <input type="text" id="catSearch" onkeyup="filterTableRows('catSearch','booksTbl')" placeholder="🔍 Tafuta kitabu kwa Barcode, Jina la Kitabu, Mwandishi, Kategoria au Rafu...">
        </div>
        <div class="panel">
          <h3>➕ Sajili Kitabu Kimoja Kimoja</h3>
          <form onsubmit="addSingleBook(event)" style="display:grid; grid-template-columns:1fr 2fr 1.5fr 1fr 1fr 0.8fr auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="bkCode" required placeholder="Barcode (mf. BK-1006)">
            <input type="text" id="bkTitle" required placeholder="Jina la Kitabu">
            <input type="text" id="bkAuthor" placeholder="Mwandishi">
            <input type="text" id="bkCat" required placeholder="Kategoria (mf. Sayansi)">
            <input type="text" id="bkShelf" required placeholder="Rafu (mf. R-03)">
            <input type="number" id="bkQty" value="1" min="1" required placeholder="Jumla">
            <button type="submit" class="btn btn-green">✅ Sajili Kitabu</button>
          </form>

          <div style="background:#f8fafc; padding:12px; border:1px dashed #94a3b8; border-radius:8px; margin-bottom:14px;">
            <b>📥 Usajili wa Vitabu Vingi (Bulk Upload)</b>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;">
              <button type="button" class="btn btn-blue" onclick="downloadBooksTemplate()">⬇️ Pakua Template ya Vitabu (CSV)</button>
              <input type="file" id="bkCsvFile" accept=".csv" style="max-width:250px;">
              <button type="button" class="btn btn-amber" onclick="uploadBooksCsv()">⬆️ Pakia Vitabu</button>
            </div>
          </div>

          <h3>📚 Orodha ya Vitabu Maktaba</h3>
          <table id="booksTbl">
            <thead><tr><th>Barcode</th><th>Jina la Kitabu</th><th>Mwandishi</th><th>Kategoria</th><th>Rafu</th><th>Jumla</th><th>Zilizopo</th></tr></thead>
            <tbody>
            ${books.map(b => `<tr>
              <td><b>${b.barcode}</b></td><td><b>${b.title}</b></td><td>${b.author || '-'}</td><td>${b.category}</td>
              <td>${b.shelf}</td><td><b>${b.total_copies}</b></td><td style="color:#059669;"><b>${b.available_copies}</b></td>
            </tr>`).join('') || '<tr><td colspan="7">Hakuna vitabu vilivyosajiliwa bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      return;
    }

    if (tab === 'members') {
      const members = SGB.select('library_members');
      area.innerHTML = `
        <div class="panel" style="padding:10px;">
          <input type="text" id="memSearch" onkeyup="filterTableRows('memSearch','membersTbl')" placeholder="🔍 Tafuta Mwanafunzi au Mwalimu kwa ID, Jina, au Darasa/Idara...">
        </div>
        <div class="panel">
          <h3>➕ Sajili Mwanafunzi au Mwalimu (ID Inatokea Otomatiki)</h3>
          <form onsubmit="addSingleMember(event)" style="display:grid; grid-template-columns:2fr 1.2fr 1.5fr auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="mFull" required placeholder="Jina Kamili la Mwanafunzi au Mwalimu">
            <select id="mRole"><option value="Student">Mwanafunzi (Student)</option><option value="Teacher">Mwalimu (Teacher)</option></select>
            <input type="text" id="mClassDept" required placeholder="Darasa au Idara (mf. Form 4A)">
            <button type="submit" class="btn btn-green">✅ Sajili Mmoja</button>
          </form>

          <div style="background:#f8fafc; padding:12px; border:1px dashed #94a3b8; border-radius:8px; margin-bottom:14px;">
            <b>📥 Au Pakia Wanafunzi/Walimu Wengi kwa Pamoja (Bulk Upload)</b>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;">
              <button type="button" class="btn btn-blue" onclick="downloadMembersTemplate()">⬇️ Pakua Template ya Wanafunzi (CSV)</button>
              <input type="file" id="memCsvFile" accept=".csv" style="max-width:250px;">
              <button type="button" class="btn btn-amber" onclick="uploadMembersCsv()">⬆️ Pakia Wote</button>
            </div>
          </div>

          <h3>👥 Orodha ya Wanafunzi na Walimu Waliosajiliwa</h3>
          <table id="membersTbl">
            <thead><tr><th>ID (Auto)</th><th>Jina Kamili</th><th>Nafasi</th><th>Darasa / Idara</th></tr></thead>
            <tbody>
            ${members.map(m => `<tr><td><b>${m.member_id}</b></td><td><b>${m.full_name}</b></td><td>${m.role}</td><td>${m.class_dept}</td></tr>`).join('') || '<tr><td colspan="4">Hakuna wanafunzi au walimu waliosajiliwa bado.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      return;
    }

    if (tab === 'issue_return') {
      const loans = SGB.select('library_loans');
      const todayIso = new Date().toISOString().slice(0, 10);
      area.innerHTML = `
        <div class="panel" style="padding:10px;">
          <input type="text" id="loanSearch" onkeyup="filterTableRows('loanSearch','loansTbl')" placeholder="🔍 Tafuta muamala kwa ID (TR-), Jina la Kitabu, au Aliyeazima...">
        </div>
        <div class="panel">
          <h3>🔄 Azimisha Kitabu (Andika Jina au Mulika QR Code)</h3>
          <form onsubmit="issueBookLoan(event)" style="display:grid; grid-template-columns:2fr 2fr 0.8fr auto auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="lnBook" list="libBookList" required placeholder="Andika jina, barcode au somo la kitabu...">
            <input type="text" id="lnMember" list="libMemberList" required placeholder="Andika jina la mwanafunzi/mwalimu...">
            <input type="number" id="lnDays" value="7" min="1" required title="Siku za Kuazima">
            <button type="submit" class="btn btn-green">✅ Azimisha</button>
            <button type="button" class="btn btn-blue" onclick="scanQrPrompt()">📷 Scan QR</button>
          </form>

          <h3>Vitabu Vilivyoazimwa Sasa</h3>
          <table id="loansTbl">
            <thead><tr><th>ID</th><th>Kitabu</th><th>Aliyeazima</th><th>Tarehe Kurudisha</th><th>Hali</th><th>Faini</th><th>Kitendo</th></tr></thead>
            <tbody>
            ${loans.filter(l => !(l.status || '').includes('Amerudisha')).map(l => {
              const isLate = l.due_date && l.due_date < todayIso;
              const daysLate = isLate ? Math.max(1, Math.floor((new Date(todayIso) - new Date(l.due_date)) / 86400000)) : 0;
              const fine = daysLate * 500;
              return `<tr>
                <td><b>${l.tx_id || 'TR-' + String(l.id).slice(-4)}</b></td>
                <td><b>${l.book}</b></td>
                <td>${l.student_name}</td>
                <td>${l.due_date}</td>
                <td><span class="${isLate ? 'badge-late' : 'badge-ok'}">${isLate ? 'Imechelewa' : 'Kwa Wakati'}</span></td>
                <td><b>${fine.toLocaleString()}</b></td>
                <td><button class="btn btn-amber" onclick="returnBookLoan('${l.id}', ${fine})">Rudisha</button></td>
              </tr>`;
            }).join('') || '<tr><td colspan="7">Hakuna vitabu vilivyoazimwa sasa.</td></tr>'}
            </tbody>
          </table>
        </div>`;
      return;
    }
    if (tab === 'clearance') {
      area.innerHTML = `
        <div class="panel">
          <h3>🎓 Kibali cha Kumaliza Shule / Kuhama (Library Clearance)</h3>
          <div style="display:grid; grid-template-columns:2fr auto auto auto auto; gap:8px; margin-bottom:14px;">
            <input type="text" id="libClrName" list="libMemberList" placeholder="Andika jina la mwanafunzi au mwalimu...">
            <button class="btn btn-blue" onclick="verifyLibraryClearance()">🔍 Hakiki Kibali</button>
            <button class="btn btn-amber" onclick="printLibClearance('58MM')">🧾 Printa Ndogo (58mm)</button>
            <button class="btn btn-green" onclick="printLibClearance('A4')">🖨️ Karatasi ya A4</button>
            <button class="btn btn-red" onclick="printLibClearance('PDF')">⬇️ Pakua PDF</button>
          </div>
          <div id="libClrResult"></div>
        </div>`;
      return;
    }

    if (tab === 'attendance') {
      const logs = SGB.select('library_attendance');
      area.innerHTML = `
        <div class="panel">
          <h3>📋 Mahudhurio ya Wasomaji Maktaba</h3>
          <form onsubmit="addLibAttendance(event)" style="display:grid; grid-template-columns:2fr 1fr auto; gap:8px; margin-bottom:12px;">
            <input type="text" id="attName" list="libMemberList" required placeholder="Jina la Mwanafunzi / Mwalimu">
            <input type="text" id="attPurpose" value="Kujisomea" placeholder="Sababu">
            <button type="submit" class="btn btn-green">✅ Rekodi Kuingia</button>
          </form>
          <table><tr><th>Muda</th><th>Jina</th><th>Sababu</th></tr>
          ${logs.map(a => `<tr><td>${a.created_at}</td><td><b>${a.name}</b></td><td>${a.purpose}</td></tr>`).join('')}
          </table>
        </div>`;
      return;
    }

    if (tab === 'ebooks') {
      const ebooks = SGB.select('library_ebooks');
      area.innerHTML = `
        <div class="panel">
          <h3>💻 Maktaba Mtandao (E-Books & Digital Notes)</h3>
          <form onsubmit="addEbook(event)" style="display:grid; grid-template-columns:2fr 1fr 2fr auto; gap:8px; margin-bottom:12px;">
            <input type="text" id="ebTitle" required placeholder="Jina la E-Book / Notes">
            <input type="text" id="ebSubj" required placeholder="Somo / Kidato">
            <input type="text" id="ebLink" required placeholder="Kiungo (Link / URL)">
            <button type="submit" class="btn btn-blue">➕ Ongeza E-Book</button>
          </form>
          <table><tr><th>Jina la E-Book</th><th>Somo</th><th>Kiungo</th></tr>
          ${ebooks.map(e => `<tr><td><b>${e.title}</b></td><td>${e.subject}</td><td><a href="${e.link}" target="_blank">Fungua Kitabu</a></td></tr>`).join('')}
          </table>
        </div>`;
      return;
    }

    if (tab === 'ict') {
      const ict = SGB.select('library_ict');
      area.innerHTML = `
        <div class="panel">
          <h3>🖥️ Vifaa vya TEHAMA Maktaba</h3>
          <form onsubmit="addIctDevice(event)" style="display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:8px; margin-bottom:12px;">
            <input type="text" id="icName" required placeholder="Kifaa (mf. Kompyuta HP #01)">
            <input type="text" id="icCode" required placeholder="Namba / Serial">
            <select id="icStatus"><option value="Nzima">Nzima</option><option value="Matengenezo">Inahitaji Matengenezo</option></select>
            <button type="submit" class="btn btn-green">➕ Hifadhi</button>
          </form>
          <table><tr><th>Kifaa</th><th>Namba</th><th>Hali</th></tr>
          ${ict.map(x => `<tr><td><b>${x.name}</b></td><td>${x.code}</td><td>${x.status}</td></tr>`).join('')}
          </table>
        </div>`;
      return;
    }

    if (tab === 'id_cards' || tab === 'book_labels') {
      const isId = tab === 'id_cards';
      const list = isId ? SGB.select('library_members') : SGB.select('library_books');
      area.innerHTML = `
        <div class="panel">
          <h3>${isId ? '🪪 Vitambulisho vya Maktaba (QR Codes)' : '🏷️ Stika za Vitabu (Barcode & QR Labels)'}</h3>
          <button class="btn btn-blue" onclick="printDiv('qrGridBox')">🖨️ Chapisha Zote</button>
          <div id="qrGridBox" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; margin-top:12px;">
            ${list.map(x => {
              const title = isId ? x.full_name : x.title;
              const code = isId ? x.member_id : x.barcode;
              const sub = isId ? `${x.role} - ${x.class_dept}` : `Rafu: ${x.shelf} | ${x.category}`;
              return `<div style="border:1.5px solid #0f172a; padding:10px; border-radius:8px; text-align:center; background:#fff;">
                <b style="font-size:11px;">SANGABUYE SEC LIBRARY</b><br>
                <img src="${SGB.qrImg(code + '|' + title)}" style="margin:6px 0;"><br>
                <b>${title}</b><br><small>${code} | ${sub}</small>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      return;
    }

    // Vichupo vingine vilivyobaki (Reservations, Fines, Suggestions, Reports)
    const loansAll = SGB.select('library_loans');
    area.innerHTML = `
      <div class="panel">
        <h3>📊 Muhtasari wa Kumbukumbu & Ripoti za Maktaba</h3>
        <table><tr><th>ID</th><th>Kitabu</th><th>Aliyeazima</th><th>Tarehe</th><th>Hali</th><th>Faini (TZS)</th></tr>
        ${loansAll.map(l => `<tr><td>${l.tx_id || l.id}</td><td><b>${l.book}</b></td><td>${l.student_name}</td><td>${l.due_date || l.created_at}</td><td>${l.status}</td><td>${Number(l.fine_paid || 0).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="6">Hakuna kumbukumbu bado.</td></tr>'}
        </table>
      </div>`;
  }
  function addSingleBook(e) {
    e.preventDefault();
    const qty = Number(document.getElementById('bkQty').value || 1);
    SGB.insert('library_books', {
      barcode: document.getElementById('bkCode').value.trim(),
      title: document.getElementById('bkTitle').value.trim(),
      author: document.getElementById('bkAuthor').value.trim() || '-',
      category: document.getElementById('bkCat').value.trim(),
      shelf: document.getElementById('bkShelf').value.trim(),
      total_copies: qty,
      available_copies: qty
    });
    openTab('catalog');
  }

  function downloadBooksTemplate() {
    const csv = "Barcode,Jina la Kitabu,Mwandishi,Kategoria,Rafu,Jumla\nBK-1006,Biology For Secondary School Book Two,TIE,Sayansi,R-01,15\nBK-1007,Kiswahili Kidato cha Tatu,TUKI,Lugha,R-02,20";
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'Template_Vitabu_Maktaba.csv';
    a.click();
  }

  function uploadBooksCsv() {
    const file = document.getElementById('bkCsvFile').files[0];
    if (!file) { alert('⚠️ Chagua faili la CSV kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const lines = ev.target.result.split(/\r?\n/).slice(1);
      let added = 0;
      lines.forEach(line => {
        const cols = line.split(',');
        if (cols.length >= 2 && cols[0].trim()) {
          const qty = Number(cols[5] || 1);
          SGB.insert('library_books', { barcode: cols[0].trim(), title: cols[1].trim(), author: (cols[2] || '-').trim(), category: (cols[3] || 'Jumla').trim(), shelf: (cols[4] || 'R-01').trim(), total_copies: qty, available_copies: qty });
          added++;
        }
      });
      alert(`✅ Vitabu ${added} vimepakiwa kikamilifu!`);
      openTab('catalog');
    };
    reader.readAsText(file);
  }

  function addSingleMember(e) {
    e.preventDefault();
    const role = document.getElementById('mRole').value;
    const autoId = generateNextMemberId(role);
    SGB.insert('library_members', {
      member_id: autoId,
      full_name: document.getElementById('mFull').value.trim(),
      role: role,
      class_dept: document.getElementById('mClassDept').value.trim()
    });
    openTab('members');
  }

  function downloadMembersTemplate() {
    const csv = "Jina Kamili,Nafasi (Student/Teacher),Darasa au Idara\nAmina Juma Ally,Student,Form 4A\nMwl. John Peter,Teacher,Sayansi";
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'Template_Wanafunzi_Walimu_Maktaba.csv';
    a.click();
  }

  function uploadMembersCsv() {
    const file = document.getElementById('memCsvFile').files[0];
    if (!file) { alert('⚠️ Chagua faili la CSV kwanza.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const lines = ev.target.result.split(/\r?\n/).slice(1);
      let added = 0;
      lines.forEach(line => {
        const cols = line.split(',');
        if (cols.length >= 2 && cols[0].trim()) {
          const role = (cols[1] || 'Student').trim().toLowerCase().includes('teach') ? 'Teacher' : 'Student';
          SGB.insert('library_members', { member_id: generateNextMemberId(role), full_name: cols[0].trim(), role, class_dept: (cols[2] || 'Form 1').trim() });
          added++;
        }
      });
      alert(`✅ Wanafunzi/Walimu ${added} wamepakiwa!`);
      openTab('members');
    };
    reader.readAsText(file);
  }
  function issueBookLoan(e) {
    e.preventDefault();
    const rawBook = document.getElementById('lnBook').value.trim();
    const rawMem = document.getElementById('lnMember').value.trim();
    const days = Number(document.getElementById('lnDays').value || 7);

    const cleanBookTitle = rawBook.replace(/\s*\[.*?\]\s*$/, '').trim();
    const cleanMemName = rawMem.replace(/\s*\(.*?\)\s*$/, '').trim();

    const books = SGB.select('library_books');
    const foundBk = books.find(b => b.title.toLowerCase() === cleanBookTitle.toLowerCase() || b.barcode.toLowerCase() === rawBook.toLowerCase());
    if (foundBk) {
      if (Number(foundBk.available_copies) <= 0) { alert('⚠️ Nakala zote za kitabu hiki zimeazimwa!'); return; }
      SGB.update('library_books', foundBk.id, { available_copies: Number(foundBk.available_copies) - 1 });
    }

    const due = new Date();
    due.setDate(due.getDate() + days);
    const txId = 'TR-' + Math.floor(1000 + Math.random() * 9000);

    SGB.insert('library_loans', {
      tx_id: txId,
      book: foundBk ? foundBk.title : cleanBookTitle,
      barcode: foundBk ? foundBk.barcode : '-',
      student_name: cleanMemName,
      due_date: due.toISOString().slice(0, 10),
      status: 'Ameazima (Kwa Wakati)'
    });
    openTab('issue_return');
  }

  function returnBookLoan(id, fine) {
    const loans = SGB.select('library_loans');
    const ln = loans.find(x => String(x.id) === String(id));
    if (ln) {
      const bk = SGB.select('library_books').find(b => b.title.toLowerCase() === (ln.book || '').toLowerCase());
      if (bk) SGB.update('library_books', bk.id, { available_copies: Number(bk.available_copies) + 1 });
    }
    SGB.update('library_loans', id, { status: 'Amerudisha', fine_paid: fine, returned_at: new Date().toLocaleDateString('sw-TZ') });
    alert('✅ Kitabu kimerejeshwa maktaba!');
    openTab('issue_return');
  }

  function scanQrPrompt() {
    const code = prompt('Mulika QR Code au andika Barcode ya Kitabu / ID ya Mwanafunzi:');
    if (!code) return;
    const bk = SGB.select('library_books').find(b => b.barcode.toLowerCase() === code.trim().toLowerCase());
    if (bk) { document.getElementById('lnBook').value = `${bk.title} [${bk.barcode}]`; return; }
    const mem = SGB.select('library_members').find(m => m.member_id.toLowerCase() === code.trim().toLowerCase());
    if (mem) { document.getElementById('lnMember').value = `${mem.full_name} (${mem.member_id})`; return; }
    alert('⚠️ QR / Barcode haijapatikana.');
  }

  function verifyLibraryClearance() {
    const rawName = (document.getElementById('libClrName').value || '').trim();
    const name = rawName.replace(/\s*\(.*?\)\s*$/, '').trim();
    if (!name) { alert('⚠️ Andika jina la mwanafunzi au mwalimu kwanza.'); return; }

    const unreturned = SGB.select('library_loans').filter(l => (l.student_name || '').toLowerCase() === name.toLowerCase() && !(l.status || '').includes('Amerudisha'));
    const mem = SGB.select('library_members').find(m => (m.full_name || '').toLowerCase() === name.toLowerCase());
    const isClear = unreturned.length === 0;
    const todayStr = new Date().toLocaleDateString('sw-TZ');
    const qr = SGB.qrImg(`LIB-CLEARANCE:${name}|STATUS:${isClear ? 'CLEARED' : 'HOLD'}`);

    document.getElementById('libClrResult').innerHTML = `
      <div id="libClrPrintBox" style="border:2px solid #0f172a; padding:20px; background:#fff; max-width:680px; line-height:1.7;">
        <div style="text-align:center; border-bottom:2px solid #0f172a; padding-bottom:8px; margin-bottom:10px;">
          <b>HALMASHAURI YA MANISPAA YA ILEMELA</b><br>
          <h3 style="margin:2px 0; color:#1d4ed8;">SHULE YA SEKONDARI SANGABUYE — MAKTABA</h3>
          <small>S.L.P 11898, Ilemela - Mwanza</small>
        </div>
        <h4 style="text-align:center; text-decoration:underline;">KIBALI CHA MAKTABA (LIBRARY CLEARANCE CERTIFICATE)</h4>
        <p><b>Jina Kamili:</b> ${name.toUpperCase()} &nbsp;|&nbsp; <b>ID:</b> ${mem ? mem.member_id : '-'} &nbsp;|&nbsp; <b>Darasa/Idara:</b> ${mem ? mem.class_dept : '-'}</p>
        <p><b>Hali ya Maktaba:</b> ${isClear ? '<span style="color:#059669; font-weight:bold;">✅ AMEKAMILISHA (CLEARED) — HANA KITABU WALA FAINI YA MAKTABA.</span>' : '<span style="color:#dc2626; font-weight:bold;">❌ HAJAKAMILISHA — ANADAIWA VITABU VIFUATAVYO:</span>'}</p>
        ${!isClear ? `<ul>${unreturned.map(u => `<li><b>${u.book}</b> (${u.tx_id || '-'}) — Ilitakiwa irudi: ${u.due_date}</li>`).join('')}</ul>` : ''}
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; font-size:12px;">
          <div><b>Mkutubi (Librarian):</b><br><br>____________________<br>Sahihi & Tarehe: ${todayStr}</div>
          <img src="${qr}" style="height:60px;">
          <div><b>Mkuu wa Shule:</b><br><br>____________________<br>Muhuri & Tarehe</div>
        </div>
      </div>`;
  }

  function printLibClearance(mode) {
    if (!document.getElementById('libClrPrintBox')) verifyLibraryClearance();
    const html = document.getElementById('libClrPrintBox')?.innerHTML;
    if (!html) return;
    const widthStyle = mode === '58MM' ? 'width:240px; font-family:monospace; font-size:11px;' : 'padding:15px; font-family:sans-serif;';
    const w = window.open('', '', 'width=800,height=600');
    w.document.write(`<html><head><title>Library Clearance (${mode})</title></head><body style="${widthStyle}">${html}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 300);
  }

  function addLibAttendance(e) { e.preventDefault(); SGB.insert('library_attendance', { name: document.getElementById('attName').value.trim(), purpose: document.getElementById('attPurpose').value.trim() }); openTab('attendance'); }
  function addEbook(e) { e.preventDefault(); SGB.insert('library_ebooks', { title: document.getElementById('ebTitle').value.trim(), subject: document.getElementById('ebSubj').value.trim(), link: document.getElementById('ebLink').value.trim() }); openTab('ebooks'); }
  function addIctDevice(e) { e.preventDefault(); SGB.insert('library_ict', { name: document.getElementById('icName').value.trim(), code: document.getElementById('icCode').value.trim(), status: document.getElementById('icStatus').value }); openTab('ict'); }

  function printDiv(id) {
    const html = document.getElementById(id).innerHTML;
    const w = window.open('', '', 'width=850,height=650');
    w.document.write('<html><head><title>Sangabuye Library Print</title><style>body{font-family:sans-serif;padding:15px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:6px;font-size:12px;}</style></head><body>' + html + '</body></html>');
    w.document.close(); w.focus(); setTimeout(() => { w.print(); w.close(); }, 300);
  }

  openTab('dash', document.querySelector('.menu-btn'));
</script>
</body>
</html>
